---
apiVersion: networking.istio.io/v1alpha3
kind: Gateway
metadata:
  name: magnolia-gateway-{{ .Release.Namespace }}
spec:
  selector:
    istio: ingressgateway # use istio default controller
  servers:
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - "magnolia-cms-{{ .Release.Namespace }}.dev.dice-tools.com"
    - "magnolia-publisher-{{ .Release.Namespace }}.dev.dice-tools.com"
    - "magnolia-public-{{ .Release.Namespace }}.dev.dice-tools.com"
    - "magnolia-api-{{ .Release.Namespace }}.dev.dice-tools.com"
    - "*-{{ .Release.Namespace }}.dev.dice-tools.com"
    tls:
      httpsRedirect: true
  - port:
      number: 443
      name: https
      protocol: HTTP
    hosts:
    - "magnolia-cms-{{ .Release.Namespace }}.dev.dice-tools.com"
    - "magnolia-publisher-{{ .Release.Namespace }}.dev.dice-tools.com"
    - "magnolia-public-{{ .Release.Namespace }}.dev.dice-tools.com"
    - "magnolia-api-{{ .Release.Namespace }}.dev.dice-tools.com"
    - "*-{{ .Release.Namespace }}.dev.dice-tools.com"
    tls:
      minProtocolVersion: TLSV1_2
      maxProtocolVersion: TLSV1_2