---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: magnolia-public
  labels:
    app: magnolia-public
spec:
  selector:
    matchLabels:
      app: magnolia-public
  serviceName: magnolia-public
  replicas: {{ .Values.replicaCount }}
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      name: magnolia-public
      labels:
        app: magnolia-public
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsUser: 5000
        runAsGroup: 5000
      initContainers:
      - name: wait-for-publisher
        image: {{ .Values.image.tools.repository}}:{{ .Values.image.tools.tag }}
        imagePullPolicy: {{ .Values.image.tools.pullPolicy }}
        command: ['sh', '-c', 'sleep 30; while ! curl -s http://magnolia-publisher:8080/.rest/monitoring/status | grep OK; do echo "Waiting for Publisher"; sleep 2; done']
        resources:
          limits:
            cpu: 100m
            memory: 100Mi
          requests:
            cpu: 100m
            memory: 50Mi
      containers:
      - name: apache
        securityContext:
          runAsUser: 0
          runAsGroup: 0
        image: {{ .Values.image.apache.repository }}:{{ .Values.image.apache.tag}}
        imagePullPolicy: {{ .Values.image.apache.pullPolicy }}
        env:
        - name: PUBLIC_DOMAIN
          value: "magnolia-public-{{ .Release.Namespace }}.dev.dice-tools.com"
        - name: KAGS_DOMAIN
          value: "dxp-kags-{{ .Release.Namespace }}.dev.dice-tools.com"
        - name: KAGS_ALIAS
          value: "internal-dxp-kags-{{ .Release.Namespace }}.dev.dice-tools.com keyaccount-dxp-kags-{{ .Release.Namespace }}.dev.dice-tools.com"
        - name: API_DOMAIN
          value: "magnolia-api-{{ .Release.Namespace }}.dev.dice-tools.com"
        - name: POC_DOMAIN
          value: "dxp-poc-{{ .Release.Namespace }}.dev.dice-tools.com"
        ports:
        - containerPort: {{ .Values.service.apache.port }}
        resources:
          limits:
            cpu: {{ .Values.resources.apache.limits.cpu }}
            memory: {{ .Values.resources.apache.limits.memory }}
          requests:
            cpu: {{ .Values.resources.apache.requests.cpu }}
            memory: {{ .Values.resources.apache.requests.memory }}
        volumeMounts:
        - name: include-d
          mountPath: /etc/httpd/include.d
      - name: magnolia-public
        image: {{ .Values.image.magnolia.repository }}:{{ .Values.image.magnolia.tag }}
        imagePullPolicy: {{ .Values.image.magnolia.pullPolicy }}
        env:
        - name: INSTANCE_TYPE
          value: "public"
        - name: ENVIRONMENT
          value: "dev"
        - name: FEATURE_ID
          value: {{ .Release.Namespace }}
        - name: CATALINA_OPTS
          value: >-
            -Xms{{ .Values.service.magnolia_public.java_heap }}
            -Xmx{{ .Values.service.magnolia_public.java_heap }}
            -Dmagnolia.poc.api.server=https://dxp-api-{{ .Release.Namespace }}.dev.dice-tools.com
            -Dmagnolia.kags.content.api.server=https://{{ .Release.Namespace }}-content.api.dev.dice-tools.com
            -Dmagnolia.kags.static.server=https://dxp-kags-static-{{ .Release.Namespace }}.dev.dice-tools.com
            -Dmagnolia.poc.static.server=https://dxp-poc-static-{{ .Release.Namespace }}.dev.dice-tools.com
        - name: DB_TYPE
          value: "postgres"
        - name: DB_USER
          value: "{{  .Values.db.magnolia_public.user }}"
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: magnolia-public
              key: db-password
        - name: JCR_CLOUDINARY_API_SECRET
          valueFrom:
            secretKeyRef:
              name: magnolia-cloudinary
              key: api-secret
        - name: JCR_MAGNOLIA_KAGS_OKTA_SECRET
          valueFrom:
            secretKeyRef:
              name: magnolia-kags
              key: okta-secret
        - name: JCR_MAGNOLIA_KAGS_SMARTEQUIP_SECRET
          valueFrom:
            secretKeyRef:
              name: magnolia-kags
              key: smartequip-secret
        - name: JCR_MAGNOLIA_KAGS_KEY_ACCOUNT_OKTA_SECRET
          valueFrom:
            secretKeyRef:
              name: magnolia-kags-key-account
              key: okta-secret
        - name: JCR_MAGNOLIA_LICENSE
          valueFrom:
            secretKeyRef:
              name: magnolia-license
              key: secret
        - name: DB_URL
          value: "{{ .Values.db.magnolia_public.url }}/magnolia-public-db-{{ .Release.Namespace }}"
        - name: DB_URL_RW
          value: "{{ .Values.db.magnolia_public.url }}/magnolia-public-db-{{ .Release.Namespace }}"
        - name: CUSTOM_JCR_CLUSTERIDS
          value: "true"
        - name: AWS_XRAY_DAEMON_ADDRESS
          value: "xray-service.default:2000"
        - name: AWS_XRAY_CONTEXT_MISSING
          value: "LOG_ERROR"
        - name: AWS_XRAY_TRACING_NAME
          value: "magnolia-public-{{ .Release.Namespace }}.dev.dice-tools.com"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
#        ports:
#        - containerPort: {{ .Values.service.magnolia_public.port }}
        livenessProbe:
          httpGet:
            path: /.rest/monitoring/status
            port: {{ .Values.service.magnolia_public.port }}
          initialDelaySeconds: 240
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /.rest/monitoring/status
            port: {{ .Values.service.magnolia_public.port }}
          initialDelaySeconds: 180
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        resources:
          limits:
            cpu: {{ .Values.resources.magnolia_public.limits.cpu }}
            memory: {{ .Values.resources.magnolia_public.limits.memory }}
          requests:
            cpu: {{ .Values.resources.magnolia_public.requests.cpu }}
            memory: {{ .Values.resources.magnolia_public.requests.memory }}
        volumeMounts:
        - mountPath: /var/magnolia
          name: magnolia-public
          subPathExpr: {{ .Release.Namespace }}-$(POD_NAME)
        - name: magnolia-public-backup
          mountPath: /mnt/backup
        - name: random
          mountPath: /dev/random
      volumes:
      - name: random
        hostPath:
          path: /dev/urandom
      - name: magnolia-public-backup
        nfs:
          server: {{ .Values.efs.backup.host }}
          path: "/public"
      - name: magnolia-src-data
        nfs:
          server: {{ .Values.efs.data.host }}
          path: {{ .Values.efs.data.dir }}
      - name: magnolia-public
        nfs:
          server: {{ .Values.efs.data.host }}
          path: /
      - name: include-d
        projected:
          sources:
          - configMap:
              name: maintenance
              optional: true
