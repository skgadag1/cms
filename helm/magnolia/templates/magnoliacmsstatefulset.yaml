---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: magnolia-author
  labels:
    app: magnolia-author
spec:
  selector:
    matchLabels:
      app: magnolia-author
  serviceName: magnolia-author
  replicas: 1
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      name: magnolia-author
      labels:
        app: magnolia-author
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsUser: 5000
        runAsGroup: 5000
      initContainers:
      - name: aurora-db-copy
        image: {{ .Values.image.aurora_db_copy.repository}}:{{ .Values.image.aurora_db_copy.tag }}
        imagePullPolicy: {{ .Values.image.aurora_db_copy.pullPolicy }}
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: SOURCE_DB
          value: "magnolia-author-db"
        - name: DEST_SUFFIX
          value: "{{ .Release.Namespace }}"
        - name: DB_HOST
          value: "{{ .Values.db.aurora_db_copy.host }}"
        - name: DB_POST
          value: "{{ .Values.db.aurora_db_copy.port }}"
        - name: DB_OWNER
          value: "{{ .Values.db.magnolia_author.user }}"
        - name: DB_USER
          value: "{{ .Values.db.aurora_db_copy.user }}"
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: backup
              key: password
        resources:
          limits:
            cpu: 2.0
            memory: 4Gi
          requests:
            cpu: 1.25
            memory: 3Gi
        volumeMounts:
          - name: magnolia-author
            mountPath: /tmp
            subPathExpr: {{ .Release.Namespace }}-$(POD_NAME)
      - name: fs-copy
        image: {{ .Values.image.tools.repository}}:{{ .Values.image.tools.tag }}
        imagePullPolicy: {{ .Values.image.tools.pullPolicy }}
        command: ['bash', '-c', 'if [ ! -d "/dst/repositories" ]; then ls -lah /dst && rsync -rtv /src/author/* /dst && ls -lah /dst; else echo "Data exist, skipping";fi']
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        volumeMounts:
        - name: magnolia-src-data
          mountPath: /src
        - name: magnolia-author
          mountPath: /dst
          subPathExpr: {{ .Release.Namespace }}-$(POD_NAME)
        resources:
          limits:
            cpu: 500m
            memory: 500Mi
          requests:
            cpu: 100m
            memory: 200Mi
      containers:
        - name: magnolia-author
          image: {{ .Values.image.magnolia.repository}}:{{ .Values.image.magnolia.tag }}
          imagePullPolicy: {{ .Values.image.magnolia.pullPolicy }}
          ports:
          - name: http
            containerPort: {{ .Values.service.magnolia_author.port }}
          - name: debug
            containerPort: {{ .Values.service.magnolia_author.debug_port }}
          resources:
            limits:
              cpu: {{ .Values.resources.magnolia_author.limits.cpu }}
              memory: {{ .Values.resources.magnolia_author.limits.memory }}
            requests:
              cpu: {{ .Values.resources.magnolia_author.requests.cpu }}
              memory: {{ .Values.resources.magnolia_author.requests.memory }}
          env:
          - name: INSTANCE_TYPE
            value: "author"
          - name: ENVIRONMENT
            value: "dev"
          - name: FEATURE_ID
            value: {{ .Release.Namespace }}
          - name: CATALINA_OPTS
            value: >-
              -Xss10M
              -Xms{{ .Values.service.magnolia_author.java_heap }}
              -Xmx{{ .Values.service.magnolia_author.java_heap }}
              -Dmagnolia.poc.api.server=https://dxp-api-preview-{{ .Release.Namespace }}.dev.dice-tools.com
              -Dmagnolia.kags.content.api.server=https://{{ .Release.Namespace }}-content-preview.api.dev.dice-tools.com
              -Dmagnolia.kags.static.server=https://dxp-kags-static-{{ .Release.Namespace }}.dev.dice-tools.com
              -Dmagnolia.poc.static.server=https://dxp-poc-static-{{ .Release.Namespace }}.dev.dice-tools.com
              -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=6666
          - name: DB_TYPE
            value: "postgres"
          - name: DB_USER
            value: "{{ .Values.db.magnolia_author.user }}"
          - name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: magnolia-author
                key: db-password
          - name: JCR_CLOUDINARY_API_SECRET
            valueFrom:
              secretKeyRef:
                name: magnolia-cloudinary
                key: api-secret
          - name: JCR_MAGNOLIA_AUTHOR_OKTA_SECRET
            valueFrom:
              secretKeyRef:
                name: magnolia-author
                key: okta-secret
          - name: JCR_MAGNOLIA_KAGS_OKTA_SECRET
            valueFrom:
              secretKeyRef:
                name: magnolia-kags
                key: okta-secret
          - name: JCR_MAGNOLIA_KAGS_SMARTEQUIP_SECRET
            valueFrom:
              secretKeyRef:
                name: magnolia-kags
                key: smartequip-secret
          - name: JCR_MAGNOLIA_KAGS_KEY_ACCOUNT_OKTA_SECRET
            valueFrom:
              secretKeyRef:
                name: magnolia-kags-key-account
                key: okta-secret
          - name: JCR_MAGNOLIA_LICENSE
            valueFrom:
              secretKeyRef:
                name: magnolia-license
                key: secret
          - name: JCR_MAGNOLIA_PMD_OKTA_SECRET
            valueFrom:
              secretKeyRef:
                name: magnolia-pmd
                key: okta-secret
          - name: JCR_MAGNOLIA_GPIM_SECRET
            valueFrom:
              secretKeyRef:
                name: widget-api
                key: api-key
          - name: JCR_MAGNOLIA_PIMPP_OCI_SECRET
            valueFrom:
              secretKeyRef:
                name: magnolia-pimpp
                key: oci-secret
          - name: DB_URL
            value: "{{ .Values.db.magnolia_author.url }}/magnolia-author-db-{{ .Release.Namespace }}"
          - name: AWS_XRAY_DAEMON_ADDRESS
            value: "xray-service.default:2000"
          - name: AWS_XRAY_CONTEXT_MISSING
            value: "LOG_ERROR"
          - name: AWS_XRAY_TRACING_NAME
            value: "magnolia-cms-{{ .Release.Namespace }}.dev.dice-tools.com"
          - name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          livenessProbe:
            tcpSocket:
              port: {{ .Values.service.magnolia_author.port }}
            initialDelaySeconds: 60
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: {{ .Values.service.magnolia_author.port }}
            initialDelaySeconds: 60
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
              - name: magnolia-author
                mountPath: /var/magnolia
                subPathExpr: {{ .Release.Namespace }}-$(POD_NAME)
              - name: random
                mountPath: /dev/random
      volumes:
       - name: random
         hostPath:
           path: /dev/urandom
       - name: magnolia-src-data
         nfs:
          server: {{ .Values.efs.data.host }}
          path: {{ .Values.efs.data.dir }}
       - name: magnolia-author
         nfs:
          server: {{ .Values.efs.data.host }}
          path: /
