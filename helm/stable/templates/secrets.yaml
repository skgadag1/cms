---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ssm-magnolia-public
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.secret_store_name }}
    kind: SecretStore
  target:
    name: magnolia-public
    creationPolicy: Owner
  data:
    - secretKey: db-password
      remoteRef:
        key: "/eks/{{ .Release.Namespace }}/magnolia-public/db-password"
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ssm-magnolia-author
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.secret_store_name }}
    kind: SecretStore
  target:
    name: magnolia-author
    creationPolicy: Owner
  data:
    - secretKey: db-password
      remoteRef:
        key: "/eks/{{ .Release.Namespace }}/magnolia-author/db-password"
    - secretKey: okta-secret
      remoteRef:
        key: "/eks/{{ .Release.Namespace }}/magnolia-author/okta-secret"
