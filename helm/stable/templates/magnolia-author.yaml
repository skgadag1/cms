---
apiVersion: v1
kind: Service
metadata:
  name: magnolia-author
  labels:
    app: magnolia-author
spec:
  selector:
    app: magnolia-author
  ports:
    - name: http
      port: {{ .Values.service.magnolia_author.port }}
      protocol: TCP
    - name: jmx
      port: {{ .Values.service.magnolia_author.jmx_port }}
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: magnolia-author
  labels:
    app: magnolia-author
spec:
  selector:
    matchLabels:
      app: magnolia-author
  serviceName: magnolia-author
  replicas: 1
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      name: magnolia-author
      labels:
        app: magnolia-author
        version: v1
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsUser: 5000
        runAsGroup: 5000
      containers:
        - name: magnolia-author
          image: {{ .Values.image.magnolia.repository}}:{{ .Values.image.magnolia.tag }}
          imagePullPolicy: {{ .Values.image.magnolia.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.magnolia_author.port }}
            - name: jmx
              containerPort: {{ .Values.service.magnolia_author.jmx_port }}
          resources:
            limits:
              cpu: {{ .Values.resources.magnolia_author.limits.cpu }}
              memory: {{ .Values.resources.magnolia_author.limits.memory }}
            requests:
              cpu: {{ .Values.resources.magnolia_author.requests.cpu }}
              memory: {{ .Values.resources.magnolia_author.requests.memory }}
          env:
            - name: INSTANCE_TYPE
              value: "author"
            - name: ENVIRONMENT
              value: "{{ .Values.env }}"
            - name: CATALINA_OPTS
              value: >-
                -Xss10M
                -Xms{{ .Values.service.magnolia_author.java_heap }}
                -Xmx{{ .Values.service.magnolia_author.java_heap }}
                -XX:+HeapDumpOnOutOfMemoryError
                -XX:HeapDumpPath=/var/magnolia/dumps
                {{ .Values.service.magnolia_author.catalina_extra_options }}
            - name: DB_TYPE
              value: "postgres"
            - name: DB_USER
              value: "{{ .Values.db.magnolia_author.user }}"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: magnolia-author
                  key: db-password
            - name: JCR_CLOUDINARY_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: magnolia-cloudinary
                  key: api-secret
            - name: JCR_MAGNOLIA_AUTHOR_OKTA_SECRET
              valueFrom:
                secretKeyRef:
                  name: magnolia-author
                  key: okta-secret
            - name: JCR_MAGNOLIA_KAGS_OKTA_SECRET
              valueFrom:
                secretKeyRef:
                  name: magnolia-kags
                  key: okta-secret
            - name: JCR_MAGNOLIA_KAGS_SMARTEQUIP_SECRET
              valueFrom:
                secretKeyRef:
                  name: magnolia-kags
                  key: smartequip-secret
            - name: JCR_MAGNOLIA_KAGS_KEY_ACCOUNT_OKTA_SECRET
              valueFrom:
                secretKeyRef:
                  name: magnolia-kags-key-account
                  key: okta-secret
            - name: JCR_MAGNOLIA_LICENSE
              valueFrom:
                secretKeyRef:
                  name: magnolia-license
                  key: secret
            - name: JCR_MAGNOLIA_PMD_OKTA_SECRET
              valueFrom:
                secretKeyRef:
                  name: magnolia-pmd
                  key: okta-secret
            - name: JCR_MAGNOLIA_GPIM_SECRET
              valueFrom:
                secretKeyRef:
                  name: widget-api
                  key: api-key
            - name: JCR_MAGNOLIA_PIMPP_OCI_SECRET
              valueFrom:
                secretKeyRef:
                  name: magnolia-pimpp
                  key: oci-secret
            - name: JCR_MAGNOLIA_ENIGMA_OKTA_SECRET
              valueFrom:
                secretKeyRef:
                  name: magnolia-enigma
                  key: okta-secret
            - name: JCR_GOOGLE_TRANSLATION_API_KEY
              valueFrom:
                secretKeyRef:
                  name: magnolia-google-translation
                  key: api-key
            - name: DB_URL
              value: "{{ .Values.db.magnolia_author.url }}/magnolia-author-db"
            - name: AWS_XRAY_DAEMON_ADDRESS
              value: "xray-service.default:2000"
            - name: AWS_XRAY_CONTEXT_MISSING
              value: "LOG_ERROR"
            - name: AWS_XRAY_TRACING_NAME
              value: "magnolia-cms.{{ .Values.domain_name }}"
          livenessProbe:
            httpGet:
              path: /.rest/monitoring/status
              port: {{ .Values.service.magnolia_author.port }}
            initialDelaySeconds: 400
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /.rest/monitoring/status
              port: {{ .Values.service.magnolia_author.port }}
            initialDelaySeconds: 240
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - name: magnolia-author-data
              mountPath: /var/magnolia
            - name: magnolia-author-backup
              mountPath: /mnt/backup
            - name: random
              mountPath: /dev/random
      volumes:
        - name: random
          hostPath:
            path: /dev/urandom
        - name: magnolia-author-data
          nfs:
            server: {{ .Values.efs.data.host }}
            path: "/author"
        - name: magnolia-author-backup
          nfs:
            server: {{ .Values.efs.backup.host }}
            path: "/author"
