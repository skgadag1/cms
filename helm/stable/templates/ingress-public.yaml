---
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: magnolia-gateway-public
spec:
  selector:
    istio: ingressgateway-public
  servers:
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - "magnolia-public.{{ .Values.domain_name }}"
    - "magnolia-api.{{ .Values.domain_name }}"
    - "new.{{ .Values.bobcat_public_domain_name }}"
{{ if eq .Values.env "prod" }}
    - "direct.{{ .Values.public_domain_name }}"
    - "internal.direct.{{ .Values.public_domain_name }}"
    - "keyaccount.direct.{{ .Values.public_domain_name }}"
{{ else }}
    - "dxp-kags.{{ .Values.public_domain_name }}"
    - "internal.dxp-kags.{{ .Values.public_domain_name }}"
    - "keyaccount.dxp-kags.{{ .Values.public_domain_name }}"
{{ end }}
    tls:
      httpsRedirect: true
  - port:
      number: 443
      name: https
      protocol: HTTP
    hosts:
    - "magnolia-public.{{ .Values.domain_name }}"
    - "magnolia-api.{{ .Values.domain_name }}"
    - "new.{{ .Values.bobcat_public_domain_name }}"
{{ if eq .Values.env "prod" }}
    - "direct.{{ .Values.public_domain_name }}"
    - "internal.direct.{{ .Values.public_domain_name }}"
    - "keyaccount.direct.{{ .Values.public_domain_name }}"
{{ else }}
    - "dxp-kags.{{ .Values.public_domain_name }}"
    - "internal.dxp-kags.{{ .Values.public_domain_name }}"
    - "keyaccount.dxp-kags.{{ .Values.public_domain_name }}"
{{ end }}
    tls:
      minProtocolVersion: TLSV1_2
      maxProtocolVersion: TLSV1_2
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: magnolia-public
spec:
  hosts:
    - "magnolia-public.{{ .Values.domain_name }}"
    - "magnolia-api.{{ .Values.domain_name }}"
    - "dxp-poc.{{ .Values.domain_name }}"
    - "new.{{ .Values.bobcat_public_domain_name }}"
{{ if eq .Values.env "prod" }}
    - "direct.{{ .Values.public_domain_name }}"
    - "internal.direct.{{ .Values.public_domain_name }}"
    - "keyaccount.direct.{{ .Values.public_domain_name }}"
{{ else }}
    - "dxp-kags.{{ .Values.public_domain_name }}"
    - "internal.dxp-kags.{{ .Values.public_domain_name }}"
    - "keyaccount.dxp-kags.{{ .Values.public_domain_name }}"
{{ end }}
  gateways:
    - magnolia-gateway-public
  http:
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: magnolia-public
            port:
              number: {{ .Values.service.apache.port }}

---
apiVersion: networking.istio.io/v1alpha3
kind: DestinationRule
metadata:
  name: magnolia-public
spec:
  host: magnolia-public
  trafficPolicy:
    loadBalancer:
      consistentHash:
        httpCookie:
          name: CUSTOM_SESSION
          ttl: 0s
          path: /
