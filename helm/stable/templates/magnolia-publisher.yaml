---
apiVersion: v1
kind: Service
metadata:
  name: magnolia-publisher
  labels:
    app: magnolia-publisher
spec:
  selector:
    app: magnolia-publisher
  ports:
    - name: http
      port: {{ .Values.service.magnolia_publisher.port }}
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: magnolia-publisher
  labels:
    app: magnolia-publisher
spec:
  selector:
    matchLabels:
      app: magnolia-publisher
  serviceName: magnolia-publisher
  replicas: 1
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      name: magnolia-publisher
      labels:
        app: magnolia-publisher
        version: v1
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsUser: 5000
        runAsGroup: 5000
      containers:
        - name: magnolia-publisher
          image: {{ .Values.image.magnolia.repository }}:{{ .Values.image.magnolia.tag }}
          imagePullPolicy: {{ .Values.image.magnolia.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.magnolia_publisher.port }}
          resources:
            limits:
              cpu: {{ .Values.resources.magnolia_publisher.limits.cpu }}
              memory: {{ .Values.resources.magnolia_publisher.limits.memory }}
            requests:
              cpu: {{ .Values.resources.magnolia_publisher.requests.cpu }}
              memory: {{ .Values.resources.magnolia_publisher.requests.memory }}
          env:
            - name: INSTANCE_TYPE
              value: "publisher"
            - name: ENVIRONMENT
              value: "{{ .Values.env }}"
            - name: CATALINA_OPTS
              value: >-
                -Xms{{ .Values.service.magnolia_publisher.java_heap }}
                -Xmx{{ .Values.service.magnolia_publisher.java_heap }}
            - name: DB_TYPE
              value: "postgres"
            - name: DB_USER
              value: "{{  .Values.db.magnolia_publisher.user }}"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: magnolia-public
                  key: db-password
            - name: JCR_CLOUDINARY_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: magnolia-cloudinary
                  key: api-secret
            - name: JCR_MAGNOLIA_KAGS_OKTA_SECRET
              valueFrom:
                secretKeyRef:
                  name: magnolia-kags
                  key: okta-secret
            - name: JCR_MAGNOLIA_KAGS_SMARTEQUIP_SECRET
              valueFrom:
                secretKeyRef:
                  name: magnolia-kags
                  key: smartequip-secret
            - name: JCR_MAGNOLIA_KAGS_KEY_ACCOUNT_OKTA_SECRET
              valueFrom:
                secretKeyRef:
                  name: magnolia-kags-key-account
                  key: okta-secret
            - name: JCR_MAGNOLIA_LICENSE
              valueFrom:
                secretKeyRef:
                  name: magnolia-license
                  key: secret
            - name: DB_URL
              value: "{{ .Values.db.magnolia_publisher.url }}/magnolia-public-db"
            - name: AWS_XRAY_DAEMON_ADDRESS
              value: "xray-service.default:2000"
            - name: AWS_XRAY_CONTEXT_MISSING
              value: "LOG_ERROR"
            - name: AWS_XRAY_TRACING_NAME
              value: "magnolia-publisher.{{ .Values.domain_name }}"
            - name: JCR_GOOGLE_TRANSLATION_API_KEY
              value: google_translate_is_not_used_on_public
          livenessProbe:
            httpGet:
              path: /.rest/monitoring/status
              port: {{ .Values.service.magnolia_publisher.port }}
            initialDelaySeconds: 400
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /.rest/monitoring/status
              port: {{ .Values.service.magnolia_publisher.port }}
            initialDelaySeconds: 200
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 15
          volumeMounts:
            - name: magnolia-publisher-data
              mountPath: /var/magnolia
            - name: magnolia-publisher-backup
              mountPath: /mnt/backup
            - name: random
              mountPath: /dev/random
      volumes:
        - name: random
          hostPath:
            path: /dev/urandom
        - name: magnolia-publisher-data
          nfs:
            server: {{ .Values.efs.data.host }}
            path: "/publisher"
        - name: magnolia-publisher-backup
          nfs:
            server: {{ .Values.efs.backup.host }}
            path: "/publisher"
