---
apiVersion: v1
kind: Service
metadata:
  creationTimestamp: null
  labels:
    app: magnolia-public
  name: magnolia-public
spec:
  ports:
    - name: http
      port: {{ .Values.service.apache.port }}
  selector:
    app: magnolia-public
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: magnolia-public
  labels:
    app: magnolia-public
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: magnolia-public
  template:
    metadata:
      labels:
        app: magnolia-public
        version: v1
    spec:
      containers:
        - name: apache
          image: {{ .Values.image.apache.repository }}:{{ .Values.image.apache.tag}}
          imagePullPolicy: {{ .Values.image.apache.pullPolicy }}
          env:
            - name: PUBLIC_DOMAIN
              value: "magnolia-public.{{ .Values.domain_name }}"
            - name: KAGS_DOMAIN
              value: "dxp-kags.{{ .Values.domain_name }}"
            - name: KAGS_ALIAS
              value: "*.dxp-kags.{{ .Values.public_domain_name }} direct.{{ .Values.public_domain_name }} internal.direct.{{ .Values.public_domain_name }} keyaccount.direct.{{ .Values.public_domain_name }}"
            - name: API_DOMAIN
              value: "magnolia-api.{{ .Values.domain_name }}"
            - name: POC_DOMAIN
              value: "dxp-poc.{{ .Values.domain_name }}"
            - name: BOBCAT_DOMAIN
              value: "{{ .Values.bobcat_public_domain_name }}"
            - name: BOBCAT_ALIAS
              value: "new.{{ .Values.bobcat_public_domain_name }}"
          ports:
            - containerPort: 80
          resources:
            limits:
              cpu: {{ .Values.resources.apache.limits.cpu }}
              memory: {{ .Values.resources.apache.limits.memory }}
            requests:
              cpu: {{ .Values.resources.apache.requests.cpu }}
              memory: {{ .Values.resources.apache.requests.memory }}
          volumeMounts:
            - name: include-d
              mountPath: /etc/httpd/include.d
        - name: magnolia-public
          image: {{ .Values.image.magnolia.repository }}:{{ .Values.image.magnolia.tag }}
          imagePullPolicy: {{ .Values.image.magnolia.pullPolicy }}
          env:
            - name: INSTANCE_TYPE
              value: "public"
            - name: ENVIRONMENT
              value: "{{ .Values.env }}"
            - name: CATALINA_OPTS
              value: >-
                -Xms{{ .Values.service.magnolia_public.java_heap }}
                -Xmx{{ .Values.service.magnolia_public.java_heap }}
                -XX:+HeapDumpOnOutOfMemoryError
                -XX:HeapDumpPath=/var/magnolia/dumps
            - name: DB_TYPE
              value: "postgres"
            - name: DB_USER
              value: "{{  .Values.db.magnolia_public.user }}"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: magnolia-public
                  key: db-password
            - name: JCR_CLOUDINARY_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: magnolia-cloudinary
                  key: api-secret
            - name: JCR_MAGNOLIA_KAGS_OKTA_SECRET
              valueFrom:
                secretKeyRef:
                  name: magnolia-kags
                  key: okta-secret
            - name: JCR_MAGNOLIA_KAGS_SMARTEQUIP_SECRET
              valueFrom:
                secretKeyRef:
                  name: magnolia-kags
                  key: smartequip-secret
            - name: JCR_MAGNOLIA_KAGS_KEY_ACCOUNT_OKTA_SECRET
              valueFrom:
                secretKeyRef:
                  name: magnolia-kags-key-account
                  key: okta-secret
            - name: JCR_MAGNOLIA_LICENSE
              valueFrom:
                secretKeyRef:
                  name: magnolia-license
                  key: secret
            - name: JCR_MAGNOLIA_GPIM_SECRET
              valueFrom:
                secretKeyRef:
                  name: widget-api
                  key: api-key
            - name: DB_URL
              value: "{{ .Values.db.magnolia_public.url }}/magnolia-public-db"
            - name: DB_URL_RW
              value: "{{ .Values.db.magnolia_author.url }}/magnolia-public-db"
            - name: CUSTOM_JCR_CLUSTERIDS
              value: "true"
            - name: AWS_XRAY_DAEMON_ADDRESS
              value: "xray-service.default:2000"
            - name: AWS_XRAY_CONTEXT_MISSING
              value: "LOG_ERROR"
            - name: AWS_XRAY_TRACING_NAME
              value: "magnolia-public.{{ .Values.domain_name }}"
            - name: JCR_GOOGLE_TRANSLATION_API_KEY
              value: google_translate_is_not_used_on_public
          startupProbe:
            httpGet:
              path: /.rest/monitoring/status
              port: {{ .Values.service.magnolia_public.port }}
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 600
          livenessProbe:
            httpGet:
              path: /.rest/monitoring/status
              port: {{ .Values.service.magnolia_public.port }}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /.rest/monitoring/status
              port: {{ .Values.service.magnolia_public.port }}
            initialDelaySeconds: 180
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          ports:
            - containerPort: {{ .Values.service.magnolia_public.port }}
          resources:
            limits:
              cpu: {{ .Values.resources.magnolia_public.limits.cpu }}
              memory: {{ .Values.resources.magnolia_public.limits.memory }}
            requests:
              cpu: {{ .Values.resources.magnolia_public.requests.cpu }}
              memory: {{ .Values.resources.magnolia_public.requests.memory }}
          volumeMounts:
            - name: random
              mountPath: /dev/random
            - name: magnolia-public-backup
              mountPath: /mnt/backup
            - name: magnolia-external-logs
              mountPath: /var/magnolia/logs/external-logs
      volumes:
        - name: random
          hostPath:
            path: /dev/urandom
        - name: magnolia-public-backup
          nfs:
            server: {{ .Values.efs.backup.host }}
            path: "/public"
        - name: magnolia-external-logs
          nfs:
            server: {{ .Values.efs.data.host }}
            path: "/external-logs"
        - name: magnolia-public
          emptyDir: {}
        - name: include-d
          projected:
            sources:
              - configMap:
                  name: maintenance
                  optional: true
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: magnolia-public
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: magnolia-public
  minReplicas: {{ .Values.replicaCount }}
  maxReplicas: {{ .Values.replicaCountMax }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
