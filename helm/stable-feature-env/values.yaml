---
# Do NOT change the value above 4 as we need to create folders for each magnolia instance inside EFS folder via feature-fscreate chart
replicaCount: 2
env: dev
cloneData: true # allow or skip aurora_db_copy step

db:
  aurora_db_copy:
    host: dibh-dev-magnolia.cluster-cfzrzmzspb3b.us-east-1.rds.amazonaws.com
    port: 5432
    user: backup
    password: backup
  magnolia_author:
    url: jdbc:postgresql://dibh-dev-magnolia.cluster-cfzrzmzspb3b.us-east-1.rds.amazonaws.com:5432
    user: magnolia-author
    password: magnolia-author
  magnolia_public:
    url: jdbc:postgresql://dibh-dev-magnolia.cluster-cfzrzmzspb3b.us-east-1.rds.amazonaws.com:5432
    user: magnolia-public
    password: magnolia-public
  magnolia_publisher:
    url: jdbc:postgresql://dibh-dev-magnolia.cluster-cfzrzmzspb3b.us-east-1.rds.amazonaws.com:5432
    user: magnolia-public
    password: magnolia-public

efs:
  data:
    host: fs-05ad6d2c074b69a7f.efs.us-east-1.amazonaws.com
    dir: /
  backup:
    host: fs-0ba2cd7154c37330b.efs.us-east-1.amazonaws.com
    dir: /

image:
  aurora_db_copy:
    repository: 129363003223.dkr.ecr.us-east-1.amazonaws.com/dxp/aurora-db-copy
    tag: latest
    pullPolicy: Always
  tools:
    repository: 129363003223.dkr.ecr.us-east-1.amazonaws.com/dxp/tools-base
    tag: latest
    pullPolicy: Always
  magnolia:
    repository: 129363003223.dkr.ecr.us-east-1.amazonaws.com/dxp/magnolia-feature-env
    tag: nonexistent
    pullPolicy: Always
  apache:
    repository: 452295442916.dkr.ecr.us-east-1.amazonaws.com/dxp/apache
    tag: latest
    pullPolicy: Always

service:
  apache:
    type: ClusterIP
    port: 80
  magnolia_author:
    type: ClusterIP
    port: 8080
    debug_port: 6666
    java_heap: 4500M
  magnolia_publisher:
    type: ClusterIP
    port: 8080
    java_heap: 4096M
  magnolia_public:
    type: ClusterIP
    port: 8080
    java_heap: 3072M

resources:
  apache:
    limits:
      cpu: 500m
      memory: 500Mi
    requests:
      cpu: 100m
      memory: 200Mi
  magnolia_author:
    limits:
      cpu: 2.0
      memory: 6Gi
    requests:
      cpu: 1.25
      memory: 6Gi
  magnolia_publisher:
    limits:
      cpu: 2.0
      memory: 5.5Gi
    requests:
      cpu: 500m
      memory: 5.5Gi
  magnolia_public:
    limits:
      cpu: 2.0
      memory: 4.5Gi
    requests:
      cpu: 500m
      memory: 3Gi


nameOverride: ""
fullnameOverride: ""

nodeSelector: {}

tolerations: []

affinity: {}
