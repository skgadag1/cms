---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: magnolia-publisher
  labels:
    app: magnolia-publisher
spec:
  selector:
    matchLabels:
      app: magnolia-publisher
  serviceName: magnolia-publisher
  replicas: 1
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      name: magnolia-publisher
      labels:
        app: magnolia-publisher
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsUser: 5000
        runAsGroup: 5000
      {{- if eq (toString .Values.cloneData) "true" }}
      initContainers:
      - name: aurora-db-copy
        image: {{ .Values.image.aurora_db_copy.repository}}:{{ .Values.image.aurora_db_copy.tag }}
        imagePullPolicy: {{ .Values.image.aurora_db_copy.pullPolicy }}
        env:
        - name: SOURCE_DB
          value: "magnolia-public-db"
        - name: DEST_SUFFIX
          value: "{{ .Release.Namespace }}"
        - name: DB_HOST
          value: "{{ .Values.db.aurora_db_copy.host }}"
        - name: DB_POST
          value: "{{ .Values.db.aurora_db_copy.port }}"
        - name: DB_OWNER
          value: "{{ .Values.db.magnolia_publisher.user }}"
        - name: DB_USER
          value: "{{ .Values.db.aurora_db_copy.user }}"
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: backup
              key: password
        # resources:
        #   limits:
        #     cpu: 1Gi
        #     memory: 1G
        #   requests:
        #     cpu: 500m
        #     memory: 1G
      - name: fs-copy
        image: {{ .Values.image.tools.repository}}:{{ .Values.image.tools.tag }}
        imagePullPolicy: {{ .Values.image.tools.pullPolicy }}
        command: ['sh', '-c', 'if [ ! -d "/dst/repositories" ]; then ls -lah /dst && rsync -rtv /src/publisher/* /dst && ls -lah /dst; else echo "Data exist, skipping";fi']
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        volumeMounts:
        - name: magnolia-src-data
          mountPath: /src
        - name: magnolia-publisher
          mountPath: /dst
          subPathExpr: {{ .Release.Namespace }}-$(POD_NAME)
        # resources:
        #   limits:
        #     cpu: 500m
        #     memory: 500Mi
        #   requests:
        #     cpu: 100m
        #     memory: 200Mi
      {{- end }}
      containers:
        - name: magnolia-publisher
          image: {{ .Values.image.magnolia.repository }}:{{ .Values.image.magnolia.tag }}
          imagePullPolicy: {{ .Values.image.magnolia.pullPolicy }}
          ports:
          - name: http
            containerPort: {{ .Values.service.magnolia_publisher.port }}
          resources:
            limits:
              cpu: {{ .Values.resources.magnolia_publisher.limits.cpu }}
              memory: {{ .Values.resources.magnolia_publisher.limits.memory }}
            requests:
              cpu: {{ .Values.resources.magnolia_publisher.requests.cpu }}
              memory: {{ .Values.resources.magnolia_publisher.requests.memory }}
          env:
          - name: INSTANCE_TYPE
            value: "publisher"
          - name: ENVIRONMENT
            value: "feature"
          - name: FEATURE_ID
            value: {{ .Release.Namespace }}
          - name: CATALINA_OPTS
            value: >-
              -Xms{{ .Values.service.magnolia_publisher.java_heap }}
              -Xmx{{ .Values.service.magnolia_publisher.java_heap }}
              -Dmagnolia.poc.api.server=https://dxp-api-{{ .Release.Namespace }}.dev.dice-tools.com
              -Dmagnolia.kags.content.api.server=https://content-{{ .Release.Namespace }}.api.dev.dice-tools.com
          - name: DB_TYPE
            value: "postgres"
          - name: DB_USER
            value: "{{  .Values.db.magnolia_publisher.user }}"
          - name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: magnolia-public
                key: db-password
          - name: JCR_CLOUDINARY_API_SECRET
            valueFrom:
              secretKeyRef:
                name: magnolia-cloudinary
                key: api-secret
          - name: JCR_MAGNOLIA_KAGS_OKTA_SECRET
            valueFrom:
              secretKeyRef:
                name: magnolia-kags
                key: okta-secret
          - name: JCR_MAGNOLIA_KAGS_SMARTEQUIP_SECRET
            valueFrom:
              secretKeyRef:
                name: magnolia-kags
                key: smartequip-secret
          - name: JCR_MAGNOLIA_KAGS_KEY_ACCOUNT_OKTA_SECRET
            valueFrom:
              secretKeyRef:
                name: magnolia-kags-key-account
                key: okta-secret
          - name: JCR_MAGNOLIA_LICENSE
            valueFrom:
              secretKeyRef:
                name: magnolia-license
                key: secret
          - name: DB_URL
            value: "{{ .Values.db.magnolia_publisher.url }}/magnolia-public-db{{ if ne (toString .Values.cloneData) "false" }}{{ .Release.Namespace }}{{ end }}"
          - name: AWS_XRAY_DAEMON_ADDRESS
            value: "xray-service.default:2000"
          - name: AWS_XRAY_CONTEXT_MISSING
            value: "LOG_ERROR"
          - name: AWS_XRAY_TRACING_NAME
            value: "magnolia-publisher-{{ .Release.Namespace }}.dev.dice-tools.com"
          - name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          livenessProbe:
            tcpSocket:
              port: {{ .Values.service.magnolia_publisher.port }}
            initialDelaySeconds: 60
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: {{ .Values.service.magnolia_publisher.port }}
            initialDelaySeconds: 60
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
              - name: magnolia-publisher
                mountPath: /var/magnolia
                subPathExpr: {{ .Release.Namespace }}-$(POD_NAME)
              - name: random
                mountPath: /dev/random
      volumes:
      - name: random
        hostPath:
          path: /dev/urandom
      - name: magnolia-src-data
        nfs:
          server: {{ .Values.efs.data.host }}
          path: {{ .Values.efs.data.dir }}
      - name: magnolia-publisher
        nfs:
          server: {{ .Values.efs.data.host }}
          path: /
