 ---
apiVersion: batch/v1
kind: Job
metadata:
  name: fscreate
spec:
  template:
    metadata:
      name: fscreate
    spec:
      securityContext:
        runAsUser: 5000
        runAsGroup: 5000
      containers:
        - name: fscreate
          image: {{ .Values.image.tools.repository}}:{{ .Values.image.tools.tag }}
          imagePullPolicy: {{ .Values.image.tools.pullPolicy }}
          command: ['sh', '-c', 'if [ ! -d "/data/{{ .Release.Namespace }}-magnolia-author-0" ] || [ ! -d "/data/{{ .Release.Namespace }}-magnolia-public-0" ] || [ ! -d "/data/{{ .Release.Namespace }}-magnolia-public-1" ] || [ ! -d "/data/{{ .Release.Namespace }}-magnolia-public-2" ] || [ ! -d "/data/{{ .Release.Namespace }}-magnolia-public-3" ] || [ ! -d "/data/{{ .Release.Namespace }}-magnolia-publisher-0" ]; then mkdir /data/{{ .Release.Namespace }}-magnolia-author-0 /data/{{ .Release.Namespace }}-magnolia-public-0 /data/{{ .Release.Namespace }}-magnolia-public-1 /data/{{ .Release.Namespace }}-magnolia-public-2 /data/{{ .Release.Namespace }}-magnolia-public-3 /data/{{ .Release.Namespace }}-magnolia-publisher-0;fi']
          volumeMounts:
            - name: magnolia-data
              mountPath: /data
      volumes:
      - name: magnolia-data
        nfs:
          server: {{ .Values.efs.data.host }}
          path: {{ .Values.efs.data.dir }}
      restartPolicy: Never
  backoffLimit: 0
