apiVersion: apps/v1
kind: Deployment
metadata:
  name: bobcat-maintenance-deployment
  namespace: bamboo
  labels:
    app: bobcat-maintenance
spec:
  selector:
    matchLabels:
      app: bobcat-maintenance
  replicas: 1
  template:
    metadata:
      labels:
        app: bobcat-maintenance
    spec:
      containers:
      - name: bobcat-maintenance-enabled
        image: {{ .Values.image.runner.repository }}:{{ .Values.image.runner.tag}}
        imagePullPolicy: {{ .Values.image.runner.pullPolicy }}
        command: [ "/root/scripts/maintenance.sh" ]
        env:
        - name: BRANCH_NAME
          value: {{ .Values.environment.branch | quote }}
        - name: ENV
          value: {{ .Values.environment.env | quote }}
        - name: ENABLE
          value: {{ .Values.environment.enable | quote }}
        - name: DISABLE
          value: {{ .Values.environment.disable | quote }}
        - name: HOSTS
          value: {{.Values.environment.hosts | quote }}
        - name: PATHS
          value: {{ .Values.environment.paths | quote }}
        - name: DEBUG
          value: {{ .Values.environment.debug | quote }}
        resources:
          limits:
            cpu: "{{ .Values.resources.runner.limits.cpu }}"
            memory: "{{ .Values.resources.runner.limits.memory }}"
          requests:
            cpu: "{{ .Values.resources.runner.requests.cpu }}"
            memory: "{{ .Values.resources.runner.requests.memory }}"
        volumeMounts:
        - name: aws-config
          mountPath: /root/.aws
      volumes:
      - name: aws-config
        configMap:
          name: aws-creds
          items:
            - key: config
              path: config
            - key: credentials
              path: credentials
