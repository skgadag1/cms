<VirtualHost *:80>
  ServerName ${BOBCAT_DOMAIN}
  ServerAlias ${BOBCAT_ALIAS}

  <Directory ~ "\.svn">
    Order allow,deny
    Deny from all
  </Directory>

  <Directory ~ "\.git">
    Order allow,deny
    Deny from all
  </Directory>

  LogLevel info
  CustomLog /proc/self/fd/1 custom
  ErrorLog /proc/self/fd/2
  FileETag none

  #Ensure that CDN caching is disabled
  Header set Cache-Control "private, no-cache, no-store, no-transform, must-revalidate, max-age=0"
  Header set Pragma "no-cache"

  RewriteEngine On
  SSLProxyEngine on
  #Monitor for AWS container - DO NOT REMOVE!!!
  RewriteRule ^/monitor.html$ /var/www/html/monitor.html [L]

  IncludeOptional include.d/*.conf

  ProxyPreserveHost On
  ProxyRequests Off
  ProxyTimeout 30

  ProxyPass         /.rest/     !
  ProxyPass         /           ${MAGNOLIA_PUBLIC_HOST} disablereuse=On
  ProxyPassReverse  /           ${MAGNOLIA_PUBLIC_HOST}

</VirtualHost>
