<VirtualHost *:80>
  ServerName ${PUBLISHER_DOMAIN}
  ServerAlias magnolia-publisher
  DocumentRoot /srv/www/magnolia-publisher

  <Directory /srv/www/magnolia-publisher>
    Options FollowSymLinks
    AllowOverride All
    Require all denied
  </Directory>

  <Directory ~ "\.svn">
    Require all denied
  </Directory>

  <Directory ~ "\.git">
    Require all denied
  </Directory>

  LogLevel error
  CustomLog /proc/self/fd/1 custom
  ErrorLog /proc/self/fd/2

  FileETag none

  RewriteEngine On
  SSLProxyEngine on
  #Monitor for AWS container - DO NOT REMOVE!!!
  RewriteRule ^/monitor.html$ /var/www/html/monitor.html [L]

  #RewriteRule ^/$ https://%{HTTP_HOST}/ [R=301,L]

  # Redirect to https
 RewriteCond %{HTTP:X-Forwarded-Proto} =http
 RewriteRule .* https://%{HTTP:Host}%{REQUEST_URI} [L,R=permanent]

  ProxyPass / ${MAGNOLIA_PUBLISHER_HOST} disablereuse=On
  ProxyPassReverse / ${MAGNOLIA_PUBLISHER_HOST}

</VirtualHost>
