<VirtualHost *:80>
  ServerName ${POC_DOMAIN}

  <Directory ~ "\.svn">
    Order allow,deny
    Deny from all
  </Directory>

  <Directory ~ "\.git">
    Order allow,deny
    Deny from all
  </Directory>

  LogLevel info
  CustomLog /proc/self/fd/1 custom
  ErrorLog /proc/self/fd/2
  FileETag none

  RewriteEngine On
  SSLProxyEngine on
  #Monitor for AWS container - DO NOT REMOVE!!!
  RewriteRule ^/monitor.html$ /var/www/html/monitor.html [L]

  ProxyPreserveHost On
  ProxyRequests Off
  ProxyTimeout 10

  ProxyPass         /.rest/     !
  ProxyPass         /           ${MAGNOLIA_PUBLIC_HOST} disablereuse=On
  ProxyPassReverse  /           ${MAGNOLIA_PUBLIC_HOST}

</VirtualHost>
