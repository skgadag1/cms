<VirtualHost *:80>
  ServerName ${API_DOMAIN}

  <Directory ~ "\.svn">
    Order allow,deny
    Deny from all
  </Directory>

  <Directory ~ "\.git">
    Order allow,deny
    Deny from all
  </Directory>

  LogLevel info
  CustomLog /proc/self/fd/1 custom
  ErrorLog /proc/self/fd/2

  FileETag none

  #Monitor for AWS container - DO NOT REMOVE!!!
  RewriteRule ^/monitor.html$ /var/www/html/monitor.html [L]

  RewriteEngine On
  SSLProxyEngine on
  ProxyPreserveHost On
  ProxyRequests Off
  ProxyTimeout 10

  ProxyPass / ${MAGNOLIA_PUBLIC_HOST}.rest/ disablereuse=On
  ProxyPassReverse / ${MAGNOLIA_PUBLIC_HOST}.rest/

</VirtualHost>
