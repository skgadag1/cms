<VirtualHost *:80>
  ServerName ${PUBLIC_DOMAIN}
  ServerAlias magnolia-public
  DocumentRoot /srv/www/magnolia-public

  <Directory /srv/www/magnolia-public>
    Options FollowSymLinks
    AllowOverride All
    Order allow,deny
    Deny from all
  </Directory>

  <Directory ~ "\.svn">
    Order allow,deny
    Deny from all
  </Directory>

  <Directory ~ "\.git">
    Order allow,deny
    Deny from all
  </Directory>

  LogLevel info
  CustomLog /proc/self/fd/1 custom
  ErrorLog /proc/self/fd/2

  FileETag none

  RewriteEngine On
  SSLProxyEngine on
  #Monitor for AWS container - DO NOT REMOVE!!!
  RewriteRule ^/monitor.html$ /var/www/html/monitor.html [L]

  #RewriteRule ^/$ https://%{HTTP_HOST}/ [R=301,L]

  # Redirect to https
  #RewriteCond "%{HTTP:X-Forwarded-Proto}" "^http$" [NC]
  #RewriteRule "^/?(.*)" "https://%{HTTP_HOST}/$1" [R=302,NE,L]

  ProxyPass / ${MAGNOLIA_PUBLIC_HOST} disablereuse=On
  ProxyPassReverse / ${MAGNOLIA_PUBLIC_HOST}

</VirtualHost>
