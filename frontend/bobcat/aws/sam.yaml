Transform: AWS::Serverless-2016-10-31

Parameters:
  EnvironmentSetting:
    Description: An environment name that will be prefixed to resource names
    Type: String
    AllowedValues: [ feature, dev, qa, prod ]
    Default: dev
  Environment:
    Description: An environment name that will be prefixed to resource names
    Type: String
    AllowedValues: [ dev, qa, prod ]
    Default: dev
  FeatureId:
    Description: Feature Id
    Type: String
    Default: ''
  IsAuthorStack:
    Description: Is this stack for author environment?
    Type: String
    AllowedValues: [ 'true', 'false' ]
    Default: 'false'

Conditions:
  IsFeatureEnv: !Not [ !Equals [ '', !Ref FeatureId ] ]
  IsNotFeatureEnv: !Equals [ '', !Ref FeatureId ]
  IsDevOrFeatureEnv: !Or
      - !Equals [ 'dev', !Ref Environment ]
      - !Not [ !Equals [ '', !Ref FeatureId ] ]
  IsAuthor: !Equals [ 'true', !Ref IsAuthorStack ]
  IsNotAuthor: !Equals [ 'false', !Ref IsAuthorStack ]


Mappings:
  EnvironmentSettings:
    feature:
      HostedPublicZoneName: dev.bobcat.com
      BobcatSubdomainPublic: '{PLACEHOLDER_TO_REPLACE_WITH_FEATURE_NAME}-ssr'
      BobcatSubdomainAuthor: '{PLACEHOLDER_TO_REPLACE_WITH_FEATURE_NAME}-author'
      HostedZoneId: Z36OO12AHYXK71
      CloudFrontStatic: 'https://{PLACEHOLDER_TO_REPLACE_WITH_FEATURE_NAME}-dxp-static.dev.bobcat.com/'
      ProvisionedConcurrency: 0
      SsrHtmlCacheTtl: '300'
      SsrHtmlStaleIfErrorTtl: '3600'
    dev:
      HostedPublicZoneName: dev.bobcat.com
      BobcatSubdomainPublic: ssr
      BobcatSubdomainAuthor: ssr-author
      HostedZoneId: Z36OO12AHYXK71
      CloudFrontStatic: 'https://dxp-static.dev.bobcat.com/'
      ProvisionedConcurrency: 0
      SsrHtmlCacheTtl: '300'
      SsrHtmlStaleIfErrorTtl: '3600'
    qa:
      HostedPublicZoneName: qa.bobcat.com
      BobcatSubdomainPublic: ssr
      BobcatSubdomainAuthor: ssr-author
      HostedZoneId: Z2IY25LYRGLWTW
      CloudFrontStatic: 'https://dxp-static.qa.bobcat.com/'
      ProvisionedConcurrency: 5
      SsrHtmlCacheTtl: '300'
      SsrHtmlStaleIfErrorTtl: '3600'
    prod:
      HostedPublicZoneName: bobcat.com
      BobcatSubdomainPublic: ssr
      BobcatSubdomainAuthor: ssr-author
      HostedZoneId: Z78SK5OHUTA0V
      CloudFrontStatic: 'https://dxp-static.bobcat.com/'
      ProvisionedConcurrency: 20
      SsrHtmlCacheTtl: '300'
      SsrHtmlStaleIfErrorTtl: '3600'

Resources:
  CloudFrontApiKey:
    Type: 'AWS::SecretsManager::Secret'
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub
        - 'api-gateway/db-dxp-cms/${FeaturePrefix}CloudFrontApiKey${Instance}'
        - Instance: !If [ IsAuthor, '-Author', '-Public' ]
          FeaturePrefix: !If [ IsFeatureEnv, !Sub '${FeatureId}-', '' ]
      Description: "CloudFront API Key"
      SecretString: !Sub
        - '{"ApiKey": "PLACEHOLDER_TO_BE_CHANGED${FeatureId}${Instance}"}'
        - Instance: !If [ IsAuthor, '-Author', '-Public' ]
      Tags:
        - Key: 'doosan:cloudformation:stack-name'
          Value: !Ref AWS::StackName
        - Key: 'doosan:cloudformation:stack-id'
          Value: !Ref AWS::StackId
        - Key: 'doosan:repo'
          Value: https://github.com/DoosanICA/db-dxp-cms
        - Key: 'doosan:owner'
          Value: CDA_OPS
        - Key: 'Project'
          Value: DXP-CMS

  SsrRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Tags:
        - Key: doosan:cloudformation:stack-name
          Value: !Ref AWS::StackName
        - Key: doosan:cloudformation:stack-id
          Value: !Ref AWS::StackId
        - Key: 'doosan:repo'
          Value: https://github.com/DoosanICA/db-dxp-cms
        - Key: 'doosan:owner'
          Value: CDA_OPS
        - Key: 'Project'
          Value: DXP-CMS

  SsrFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: './'
      Handler: 'src/handler.render'
      Role: !GetAtt SsrRole.Arn
      Runtime: 'nodejs24.x'
      MemorySize: 2048
      Timeout: 30
      AutoPublishAlias: live
      ProvisionedConcurrencyConfig:
        !If
        - IsDevOrFeatureEnv
        - !Ref "AWS::NoValue"
        - ProvisionedConcurrentExecutions: !FindInMap [ EnvironmentSettings, !Ref EnvironmentSetting, ProvisionedConcurrency ]
      Environment:
        Variables:
          DEBUG: 'nuxt:*'
          NODE_ENV: 'production'
          IS_AUTHOR: !If [ IsAuthor, 'true', 'false' ]
          CLOUDFRONT_STATIC: !FindInMap [ EnvironmentSettings, !Ref EnvironmentSetting, CloudFrontStatic ]
          TEXT_OUTPUT: false # only enable for local testing
          SSR_HTML_CACHE_TTL: !FindInMap [ EnvironmentSettings, !Ref EnvironmentSetting, SsrHtmlCacheTtl ]
          SSR_HTML_STALE_IF_ERROR_TTL: !FindInMap [ EnvironmentSettings, !Ref EnvironmentSetting, SsrHtmlStaleIfErrorTtl ]
          ENV_FILE: './.env-cmdrc'
          NUXT_ENV: !Ref EnvironmentSetting
      Events:
        RootPath:
          Type: Api
          Properties:
            Path: /
            Method: Any
            RestApiId:
              Ref: SsrApiGatewayApi
        ProxyPath:
          Type: Api
          Properties:
            Path: /{proxy+}
            Method: Any
            RestApiId:
              Ref: SsrApiGatewayApi

  SsrFunctionSSM:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub
        - '/cf/ngb/cms/${FeaturePrefix}SSRFunction${Author}'
        - Author: !If [ IsAuthor, '-author', '' ]
          FeaturePrefix: !If [ IsFeatureEnv, !Sub '${FeatureId}-', '' ]
      Value: !Ref SsrFunction
      Type: String
      Tags:
        Name: SsrFunctionName
        doosan:cloudformation:stack-name: !Ref AWS::StackName
        doosan:cloudformation:stack-id: !Ref AWS::StackId
        doosan:owner: CDA_OPS
        doosan:repo: https://github.com/DoosanICA/db-dxp-cms
        Project: DXP-CMS


  SsrApiGatewayApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub
        - '[DXP] Public ${FeaturePrefix}Bobcat${Author} Web Page Server Side Rendering'
        - Author: !If [ IsAuthor, '-author', '' ]
          FeaturePrefix: !If [ IsFeatureEnv, !Sub '${FeatureId}-', '' ]
      Description: !Sub
        - 'Server Side Rendering API for Public ${FeaturePrefix}Bobcat${Author} Web Page with Nuxt framework'
        - Author: !If [ IsAuthor, '-author', '' ]
          FeaturePrefix: !If [ IsFeatureEnv, !Sub '${FeatureId}-', '' ]
      StageName: !Ref Environment
      Domain:
        CertificateArn: !Ref SsrSslCertifcate
        DomainName:
          !Join [ '.',
            [!If [IsAuthor, !FindInMap [ EnvironmentSettings, !Ref EnvironmentSetting, BobcatSubdomainAuthor ], !FindInMap [ EnvironmentSettings, !Ref EnvironmentSetting, BobcatSubdomainPublic ]],
             !FindInMap [ EnvironmentSettings, !Ref EnvironmentSetting, HostedPublicZoneName ]]
          ]
        Route53:
          HostedZoneId: !FindInMap [ EnvironmentSettings, !Ref EnvironmentSetting, HostedZoneId ]
          IpV6: true
      EndpointConfiguration:
        Type: REGIONAL
      DefinitionBody:
        'Fn::Transform':
          Name: 'AWS::Include'
          Parameters:
            Location: './api.yaml'
      BinaryMediaTypes:
        - '*~1*'

  SsrApiGatewayApiSSM:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub
        - '/cf/ngb/cms/${FeaturePrefix}SSRApiFullName${Author}'
        - Author: !If [ IsAuthor, '-author', '' ]
          FeaturePrefix: !If [ IsFeatureEnv, !Sub '${FeatureId}-', '' ]
      Value: !Sub
        - '[DXP] Public ${FeaturePrefix}Bobcat${Author} Web Page Server Side Rendering'
        - Author: !If [ IsAuthor, '-author', '' ]
          FeaturePrefix: !If [ IsFeatureEnv, !Sub '${FeatureId}-', '' ]
      Type: String
      Tags:
        Name: SsrFunctionName
        doosan:cloudformation:stack-name: !Ref AWS::StackName
        doosan:cloudformation:stack-id: !Ref AWS::StackId
        doosan:owner: CDA_OPS
        doosan:repo: https://github.com/DoosanICA/db-dxp-cms
        Project: DXP-CMS

  ApiUsagePlan:
    Type: AWS::ApiGateway::UsagePlan
    DependsOn:
      - SsrApiGatewayApiStage
    Properties:
      Description: !Sub
        - ${FeaturePrefix}CloudFront usage only
        - FeaturePrefix: !If [ IsFeatureEnv, !Sub '${FeatureId}-', '' ]
      UsagePlanName: !Sub
                 - ${FeaturePrefix}NextGen-Bobcat-CloudFront-Only
                 - FeaturePrefix: !If [ IsFeatureEnv, !Sub '${FeatureId}-', '' ]
      ApiStages:
        - ApiId: !Ref SsrApiGatewayApi
          Stage: !Ref Environment

  ApiKeyV2:
    Type: "AWS::ApiGateway::ApiKey"
    Properties:
      Description: !Sub
        - "NextGen ${FeaturePrefix}Bobcat${Author} for CloudFront Api Key"
        - Author: !If [ IsAuthor, '-author', '' ]
          FeaturePrefix: !If [ IsFeatureEnv, !Sub '${FeatureId}-', '' ]
      Enabled: true
      Value: !Sub "{{resolve:secretsmanager:${CloudFrontApiKey}::ApiKey}}"

  ApiKeySsmParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub
        - "/cf/ngb/apigateway/ssr/${FeaturePrefix}apikey${Author}"
        - Author: !If [ IsAuthor, '-author', '' ]
          FeaturePrefix: !If [ IsFeatureEnv, !Sub '${FeatureId}-', '' ]
      Type: String
      Value: !Sub "{{resolve:secretsmanager:${CloudFrontApiKey}::ApiKey}}"
      Description: !Sub
        - "NextGen Bobcat${Author} SSR API Key"
        - Author: !If [ IsAuthor, '-author', '' ]
      Tags:
        doosan:cloudformation:stack-name: !Ref AWS::StackName
        doosan:owner: CDA_OPS
        doosan:repo: https://github.com/DoosanICA/db-dxp-aws
        Project: db-dxp-bobcat-front

  ApiKeyUsagePlan:
    Type: "AWS::ApiGateway::UsagePlanKey"
    Properties:
      KeyId: !Ref ApiKeyV2
      KeyType: API_KEY
      UsagePlanId: !Ref ApiUsagePlan

  SsrFunctionInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref SsrFunction
      Principal: apigateway.amazonaws.com

  SsrSslCertifcate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      CertificateTransparencyLoggingPreference: ENABLED
      DomainName:
        !Join [ '.',
          [!If [ IsAuthor, !FindInMap [ EnvironmentSettings, !Ref EnvironmentSetting, BobcatSubdomainAuthor ], !FindInMap [ EnvironmentSettings, !Ref EnvironmentSetting, BobcatSubdomainPublic ] ],
           !FindInMap [ EnvironmentSettings, !Ref EnvironmentSetting, HostedPublicZoneName ]]
        ]
      DomainValidationOptions:
        - DomainName:   !Join [ '.',
          [!If [ IsAuthor, !FindInMap [ EnvironmentSettings, !Ref EnvironmentSetting, BobcatSubdomainAuthor ], !FindInMap [ EnvironmentSettings, !Ref EnvironmentSetting, BobcatSubdomainPublic ] ],
           !FindInMap [ EnvironmentSettings, !Ref EnvironmentSetting, HostedPublicZoneName ]]
        ]
          HostedZoneId: !FindInMap [ EnvironmentSettings, !Ref EnvironmentSetting, HostedZoneId ]
      ValidationMethod: DNS
      Tags:
        - Key: Name
          Value: AcmDxpBobcatSsr

  CloudWatchAlarmsStack:
    Type: AWS::CloudFormation::Stack
    Condition: IsNotFeatureEnv
    Properties:
      TemplateURL: cloudformation/cloudwatch-alarms.yaml
      Parameters:
        SsrFunction: !Ref SsrFunction
        SsrApiGateway: !Ref SsrApiGatewayApi
        Environment: !Ref Environment
        IsAuthorStack: !Ref IsAuthorStack
      Tags:
        - Key: doosan:cloudformation:stack-name
          Value: !Ref AWS::StackName
        - Key: doosan:cloudformation:stack-id
          Value: !Ref AWS::StackId
        - Key: doosan:repo
          Value: https://github.com/DoosanICA/db-dxp-cms
        - Key: doosan:owner
          Value: CDA_OPS
        - Key: Project
          Value: DXP-CMS

  BobcatS3MagnoliaBuckup:
    Type: AWS::S3::Bucket
    Condition: IsNotAuthor
    Properties:
      BucketName: !Sub
        - 'db-dxp-magnolia-backup-product-${FeaturePrefix}${Environment}${Author}'
        - Author: !If [ IsAuthor, '-author', '' ]
          FeaturePrefix: !If [ IsFeatureEnv, !Sub '${FeatureId}-', '' ]
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: ExpirationRule
            Status: Enabled
            ExpirationInDays: 60
          - Id: delete-old-version
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 60
            ExpiredObjectDeleteMarker: true
      LoggingConfiguration:
        DestinationBucketName: !ImportValue common-S3LoggingTarget2
        LogFilePrefix: !Sub
          - 's3/db-dxp-magnolia-backup-product-${FeaturePrefix}${Environment}${Author}/'
          - Author: !If [ IsAuthor, '-author', '' ]
            FeaturePrefix: !If [ IsFeatureEnv, !Sub '${FeatureId}-', '' ]
      Tags:
        - Key: doosan:cloudformation:stack-name
          Value: !Ref AWS::StackName
        - Key: doosan:cloudformation:stack-id
          Value: !Ref AWS::StackId
        - Key: doosan:owner
          Value: CDA_OPS
        - Key: doosan:repo
          Value: https://github.com/DoosanICA/db-dxp-cms
        - Key: Project
          Value: DXP-CMS

  BobcatS3MagnoliaBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: IsNotAuthor
    Properties:
      Bucket: !Ref BobcatS3MagnoliaBuckup
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: 'EnforceTLSRequestsOnly'
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !Sub '${BobcatS3MagnoliaBuckup.Arn}/*'
              - !GetAtt BobcatS3MagnoliaBuckup.Arn
            Condition:
              Bool:
                'aws:SecureTransport': false
          - Sid: 'DenyOutdatedTLSVersions'
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !Sub '${BobcatS3MagnoliaBuckup.Arn}/*'
              - !GetAtt BobcatS3MagnoliaBuckup.Arn
            Condition:
              NumericLessThan:
                's3:TlsVersion': 1.2

  BobcatS3MagnoliaBuckupSSM:
    Type: AWS::SSM::Parameter
    Condition: IsNotAuthor
    Properties:
      Name: !Sub
        - "/cf/ngb/cms/backup/${FeaturePrefix}s3Bucket"
        - FeaturePrefix: !If [ IsFeatureEnv, !Sub '${FeatureId}-', '' ]
      Value: !Ref BobcatS3MagnoliaBuckup
      Type: String
      Tags:
        Name: SsrFunctionName
        doosan:cloudformation:stack-name: !Ref AWS::StackName
        doosan:cloudformation:stack-id: !Ref AWS::StackId
        doosan:owner: CDA_OPS
        doosan:repo: https://github.com/DoosanICA/db-dxp-cms
        Project: DXP-CMS
