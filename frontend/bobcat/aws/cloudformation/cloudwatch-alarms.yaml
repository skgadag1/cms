AWSTemplateFormatVersion: "2010-09-09"

Parameters:
  Environment:
    Description: Deployment environment
    Type: String
    AllowedValues: [ dev, qa, prod ]
  SsrFunction:
    Type: String
  SsrApiGateway:
    Type: String
  IsAuthorStack:
    Description: Is this stack for author environment?
    Type: String
    AllowedValues: [ 'true', 'false' ]
    Default: 'false'

Conditions:
  IsNotAuthor: !Equals [ 'false', !Ref IsAuthorStack ]

Resources:
  LambdaAlarmsStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: partials/lambda-alarms.yaml
      Parameters:
        SsrFunction: !Ref SsrFunction
        Environment: !Ref Environment
        IsAuthorStack: !Ref IsAuthorStack
      Tags:
        - Key: doosan:cloudformation:stack-name
          Value: !Ref AWS::StackName
        - Key: doosan:cloudformation:stack-id
          Value: !Ref AWS::StackId
        - Key: doosan:repo
          Value: https://github.com/DoosanICA/db-dxp-cms
        - Key: doosan:owner
          Value: CDA_OPS
        - Key: Project
          Value: DXP-CMS

  ApiGatewayAlarmsStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: partials/api-gateway-alarms.yaml
      Parameters:
        SsrApiGateway: !Ref SsrApiGateway
        Environment: !Ref Environment
        IsAuthorStack: !Ref IsAuthorStack
      Tags:
        - Key: doosan:cloudformation:stack-name
          Value: !Ref AWS::StackName
        - Key: doosan:cloudformation:stack-id
          Value: !Ref AWS::StackId
        - Key: doosan:repo
          Value: https://github.com/DoosanICA/db-dxp-cms
        - Key: doosan:owner
          Value: CDA_OPS
        - Key: Project
          Value: DXP-CMS

  CloudinaryResponseAlarmStack:
    Type: AWS::CloudFormation::Stack
    Condition: IsNotAuthor
    Properties:
      TemplateURL: partials/cloudinary-alarms.yaml
      Parameters:
        Environment: !Ref Environment
      Tags:
        - Key: doosan:cloudformation:stack-name
          Value: !Ref AWS::StackName
        - Key: doosan:cloudformation:stack-id
          Value: !Ref AWS::StackId
        - Key: doosan:repo
          Value: https://github.com/DoosanICA/db-dxp-cms
        - Key: doosan:owner
          Value: CDA_OPS
        - Key: Project
          Value: DXP-CMS
