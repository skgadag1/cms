AWSTemplateFormatVersion: "2010-09-09"

Parameters:
  Environment:
    Description: Deployment environment
    Type: String
    AllowedValues: [ dev, qa, prod ]
  SsrApiGateway:
    Type: String
  DXPBobcatNotificationsTopic:
    Description: ARN of SNS topic
    Type: AWS::SSM::Parameter::Value<String>
    Default: '/cf/ngb/messaging/sns/topic/DXPBobcatNotificationsTopic'
  IsAuthorStack:
    Description: Is this stack for author environment?
    Type: String
    AllowedValues: [ 'true', 'false' ]
    Default: 'false'

Conditions:
  IsDev: !Equals [ !Ref Environment, 'dev' ]
  IsAuthor: !Equals [ 'true', !Ref IsAuthorStack ]

Resources:
  SSRApiGatewayAlarmIntegrationLatency:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: !Sub 'SSR ApiGateway IntegrationLatency alarm for FN:${SsrApiGateway}'
      AlarmName: !Sub '${SsrApiGateway}-SSR-ApiGateway-IntegrationLatency'
      AlarmActions:
        - !Ref DXPBobcatNotificationsTopic
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Threshold: 2000
      Namespace: AWS/ApiGateway
      Statistic: Average
      MetricName: IntegrationLatency
      Dimensions:
        - Name: ApiName
          Value: !Sub '${SsrApiGateway}'
      Period: 60

  SSRApiGatewayAlarmIntegrationLatencySSM:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub
            - '/cf/ngb/cloudwatch/alarms/SSR/api-gateway/SSRApiGatewayAlarmIntegrationLatency${Author}'
            - Author: !If [ IsAuthor, '-author', '' ]
      Value: !GetAtt SSRApiGatewayAlarmIntegrationLatency.Arn
      Type: String
      Tags:
        Name: SSRApiGatewayAlarmIntegrationLatencySSM
        doosan:cloudformation:stack-name: !Ref AWS::StackName
        doosan:owner: CDA_OPS
        doosan:repo: https://github.com/DoosanICA/db-dxp-cms

  SSRApiGatewayAlarmLatency:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: !Sub 'SSR ApiGateway Latency alarm for FN:${SsrApiGateway}'
      AlarmName: !Sub '${SsrApiGateway}-SSR-ApiGateway-Latency'
      AlarmActions:
        - !Ref DXPBobcatNotificationsTopic
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Threshold: 2000
      Namespace: AWS/ApiGateway
      Statistic: Average
      MetricName: Latency
      Dimensions:
        - Name: ApiName
          Value: !Sub '${SsrApiGateway}'
      Period: 60

  SSRApiGatewayAlarmLatencySSM:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub
            - '/cf/ngb/cloudwatch/alarms/SSR/api-gateway/SSRApiGatewayAlarmLatency${Author}'
            - Author: !If [ IsAuthor, '-author', '' ]
      Value: !GetAtt SSRApiGatewayAlarmLatency.Arn
      Type: String
      Tags:
        Name: SSRApiGatewayAlarmLatencySSM
        doosan:cloudformation:stack-name: !Ref AWS::StackName
        doosan:owner: CDA_OPS
        doosan:repo: https://github.com/DoosanICA/db-dxp-cms

  SSRApiGatewayAlarm5xxErrors:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: !Sub 'SSR ApiGateway 5xxErrors alarm for FN:${SsrApiGateway}'
      AlarmName: !Sub '${SsrApiGateway}-SSR-ApiGateway-5xxErrors'
      AlarmActions:
        - !Ref DXPBobcatNotificationsTopic
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Threshold: 5
      Namespace: AWS/ApiGateway
      Statistic: Sum
      MetricName: 5xxError
      Dimensions:
        - Name: ApiName
          Value: !Sub '${SsrApiGateway}'
      Period: 60

  SSRApiGatewayAlarm5xxErrorsSSM:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub
            - '/cf/ngb/cloudwatch/alarms/SSR/api-gateway/SSRApiGatewayAlarm5xxErrors${Author}'
            - Author: !If [ IsAuthor, '-author', '' ]
      Value: !GetAtt SSRApiGatewayAlarm5xxErrors.Arn
      Type: String
      Tags:
        Name: SSRApiGatewayAlarm5xxErrorsSSM
        doosan:cloudformation:stack-name: !Ref AWS::StackName
        doosan:owner: CDA_OPS
        doosan:repo: https://github.com/DoosanICA/db-dxp-cms

  SSRApiGatewayAlarm4xxErrors:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: !Sub 'SSR ApiGateway 4xxErrors alarm for FN:${SsrApiGateway}'
      AlarmName: !Sub '${SsrApiGateway}-SSR-ApiGateway-4xxErrors'
      AlarmActions:
        - !Ref DXPBobcatNotificationsTopic
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Threshold: 200
      Namespace: AWS/ApiGateway
      Statistic: Sum
      MetricName: 4xxError
      Dimensions:
        - Name: ApiName
          Value: !Sub '${SsrApiGateway}'
      Period: 60

  SSRApiGatewayAlarm4xxErrorsSSM:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub
        - '/cf/ngb/cloudwatch/alarms/SSR/api-gateway/SSRApiGatewayAlarm4xxErrors${Author}'
        - Author: !If [ IsAuthor, '-author', '' ]
      Value: !GetAtt SSRApiGatewayAlarm5xxErrors.Arn
      Type: String
      Tags:
        Name: SSRApiGatewayAlarm4xxErrorsSSM
        doosan:cloudformation:stack-name: !Ref AWS::StackName
        doosan:owner: CDA_OPS
        doosan:repo: https://github.com/DoosanICA/db-dxp-cms

  CompositeSSRApiGatewayAlarms:
    Type: 'AWS::CloudWatch::CompositeAlarm'
    Properties:
      AlarmName: !Sub
        - 'CompositeSSRApiGatewayAlarm${Author}'
        - Author: !If [ IsAuthor, '-author', '' ]
      AlarmRule: !If [ "IsDev", "FALSE", !Sub 'ALARM(${SSRApiGatewayAlarmIntegrationLatency}) OR
        ALARM(${SSRApiGatewayAlarmLatency}) OR
        ALARM(${SSRApiGatewayAlarm4xxErrors}) OR
        ALARM(${SSRApiGatewayAlarm5xxErrors})' ]

  CompositeSSRApiGatewayAlarmsSSM:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub
            - '/cf/ngb/cloudwatch/alarms/SSR/api-gateway/CompositeSSRApiGatewayAlarm${Author}'
            - Author: !If [ IsAuthor, '-author', '' ]
      Value: !GetAtt CompositeSSRApiGatewayAlarms.Arn
      Type: String
      Tags:
        Name: CompositeSSRApiGatewayAlarmSSM
        doosan:cloudformation:stack-name: !Ref AWS::StackName
        doosan:owner: CDA_OPS
        doosan:repo: https://github.com/DoosanICA/db-dxp-cms
