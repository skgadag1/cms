<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bobcat - Not Found 404</title>
  <link rel="icon" sizes="128x128" href="../static/favicon.ico">
  <style>
    :root {
      --primary: #ff3600;
      --dark: #333333;
    }

    @font-face {
      font-family: 'BobcatMain-Roman';
      src: local('HelveticaNeueLT-Roman'),
        local('Helvetica Neue LT Pro 55 Roman'),
        local('Helvetica Neue LT Pro');
      src: url('https://dxp-static.bobcat.com/fonts/helvetica/HelveticaNeue.eot');
      src: url('https://dxp-static.bobcat.com/fonts/helvetica/HelveticaNeue.eot?#iefix') format('embedded-opentype'),
        url('https://dxp-static.bobcat.com/fonts/helvetica/HelveticaNeue.woff2') format('woff2'),
        url('https://dxp-static.bobcat.com/fonts/helvetica/HelveticaNeue.woff') format('woff'),
        url('https://dxp-static.bobcat.com/fonts/helvetica/HelveticaNeue.ttf') format('truetype');
      font-display: swap;
    }

    @font-face {
      font-family: 'BobcatMain-BoldCondensed';
      src: local('HelveticaNeueLTStd-BdCn'),
        local('Helvetica Neue LT Bold Condensed'),
        local('Helvetica Neue LT Pro 77 Bold Condensed');
      src: url('https://dxp-static.bobcat.com/fonts/helvetica/HelveticaNeue-CondensedBold.eot');
      src: url('https://dxp-static.bobcat.com/fonts/helvetica/HelveticaNeue-CondensedBold.eot?#iefix') format('embedded-opentype'),
        url('https://dxp-static.bobcat.com/fonts/helvetica/HelveticaNeue-CondensedBold.woff2') format('woff2'),
        url('https://dxp-static.bobcat.com/fonts/helvetica/HelveticaNeue-CondensedBold.woff') format('woff'),
        url('https://dxp-static.bobcat.com/fonts/helvetica/HelveticaNeue-CondensedBold.ttf') format('truetype');
      font-display: swap;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      height: 100%;
      color: var(--dark);
      font-family: "Helvetica Neue", sans-serif;
    }

    h1 {
      font-size: 3.5rem;
      margin: 2rem 0 1rem;
      width: 100%;
      text-align: center;
      font-family: 'BobcatMain-BoldCondensed', sans-serif;
    }

    p {
      margin: 1rem 0 1.5rem;
    }

    ul {
      margin-left: 1rem;
    }

    nav {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: .5rem;
      background: var(--primary);
    }

    main {
      width: 100%;
      height: calc(100% - 3.625rem);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0 1rem;
    }

    section {
      max-width: 43.25rem;
    }

    @media only screen and (max-width: 576px) {
      main {
        align-items: flex-start;
      }

      h1 {
        text-align: left;
      }
    }
  </style>
</head>
<body>
<nav>
  <img
    width="143"
    src="https://res.cloudinary.com/doosan-bobcat-dev/image/upload/v1680591106/bobcat-head-test-429x114_1.svg"
    alt="Bobcat logo" title="Bobcat logo">
</nav>
<main>
  <section>
    <h1>Page Not Found</h1>
    <div>
      <p>The page you’re looking for can’t be found or is currently unavailable. Possible causes include:</p>
      <ul>
        <li>A misspelled URL</li>
        <li>Temporary routine maintenance</li>
        <li>Page has moved to another part of the site</li>
      </ul>
      <p>Please check the URL or try again later.</p>
    </div>
  </section>
</main>
</body>
</html>
