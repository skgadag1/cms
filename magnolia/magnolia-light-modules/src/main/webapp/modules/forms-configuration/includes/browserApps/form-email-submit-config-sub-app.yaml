label: Form Email Configuration
icon: icon-mail-setting
class: info.magnolia.ui.contentapp.configuration.BrowserDescriptor
closable: false
datasource:
  $type: jcrDatasource
  workspace: formsEmailConfig
  includeProperties: false
  allowedNodeTypes:
    - mgnl:folder
    - dxp:formEmailConfiguration
workbench:
  contentViews:
    fields:
      $type: treeView
      multiSelect: true
      multiSelectByRowClick: false
      columns:
        jcrName:
          label: TemplateID
          $type: jcrTitleColumn
          nodeTypeToIcon:
            mgnl:folder: icon-language-app
            dxp:fieldMapping: icon-node-content
        type:
          label: Type
          valueProvider: com.tbscg.doosan.magnolia.bobcat.field.BobcatContentTypeValueProvider
        jcrPublishingStatus:
          $type: lockingStatusColumn
          label: Status
        jcr:lockOwner:
          name: jcr:lockOwner
          label: Locked by
        mgnl:lastModified:
          $type: dateColumn
actionbar:
  sections:
    defaultAction: editFormEmailConfiguration
    root:
      availability:
        root: true
      groups:
        addActions:
          name: addActions
          items:
            - name: addFormEmailConfiguration
        editActions:
          name: editActions
          items:
            - name: editFormEmailConfiguration
            - name: lock
            - name: unlock
        publishingActions:
          name: publishingActions
          items:
            - name: publishItem
            - name: publishRecursive
            - name: unpublishItem
        commonActions:
          name: commonActions
          items:
            - name: renameItem
            - name: deleteItem
            - name: duplicateItem
            - name: moveItem
            - name: copyItem
            - name: pasteItem
        exportImportActions:
          name: exportImportActions
          items:
            - name: export
            - name: import
actions:
  !include:/commons/includes/lock-unlock-action-definition.yaml
  addFormEmailConfiguration:
    label: Add Email Configuration
    icon: icon-documents-app
    $type: openDetailSubappAction
    appName: forms-configuration
    subAppName: detailFormsEmailConfig
    viewType: add
    availability:
      writePermissionRequired: true
      nodeTypes:
        - mgnl:folder
      rules:
        isNotLockedRule:
          $type: isNotLocked
  editFormEmailConfiguration:
    label: Edit Email Configuration
    icon: icon-edit
    $type: openDetailSubappAction
    appName: forms-configuration
    subAppName: detailFormsEmailConfig
    viewType: edit
    availability:
      writePermissionRequired: true
      nodeTypes:
        - dxp:formEmailConfiguration
      rules:
        isNotLockedRule:
          $type: isNotLocked
  publishItem:
    label: Publish
    icon: icon-publish
    $type: jcrCommandAction
    command: publish
    catalog: versioned
    availability:
      writePermissionRequired: true
      rules:
        isPublishable:
          $type: jcrPublishableRule
        isNotLockedRule:
          $type: isNotLocked
  publishRecursive:
    icon: icon-publish-incl-sub
    $type: jcrCommandAction
    command: publish
    label: Publish recursive
    asynchronous: true
    params:
      recursive: true
    availability:
      writePermissionRequired: true
      rules:
        isPublishable:
          $type: jcrPublishableRule
        isNotLockedRule:
          $type: isNotLocked
  unpublishItem:
    label: Unpublish
    icon: icon-unpublish
    $type: jcrCommandAction
    command: unpublish
    availability:
      writePermissionRequired: true
      rules:
        isPublished:
          $type: jcrPublishedRule
        isNotLockedRule:
          $type: isNotLocked
  renameItem:
    label: Rename Item
    icon: icon-edit
    $type: openDialogAction
    dialogId: ui-framework-jcr:rename
    availability:
      writePermissionRequired: true
      nodeTypes:
        - dxp:formEmailConfiguration
      rules:
        isNotLockedRule:
          $type: isNotLocked
  deleteItem:
    label: Delete Item
    icon: icon-delete
    $type: confirmationAction
    successActionName: delete
    dialogId: ui-framework-jcr:delete
    availability:
      multiple: true
      writePermissionRequired: true
      nodeTypes:
        - dxp:formEmailConfiguration
      rules:
        isNotLockedRule:
          $type: isNotLocked
  duplicateItem:
    label: Duplicate Item
    icon: icon-duplicate
    $type: duplicateNodeAction
    availability:
      multiple: true
      writePermissionRequired: true
      nodeTypes:
        - dxp:formEmailConfiguration
  moveItem:
    label: Move Item
    icon: icon-move
    $type: dxpMoveAction
    allowedRoles:
      - superuser
    availability:
      multiple: true
      writePermissionRequired: true
      nodeTypes:
        - dxp:formEmailConfiguration
      rules:
        isNotLockedRule:
          $type: isNotLocked
  copyItem:
    label: Copy Item
    icon: icon-copy
    $type: copyContentAction
    availability:
      multiple: true
      writePermissionRequired: true
      nodeTypes:
        - dxp:formEmailConfiguration
  pasteItem:
    label: Paste Item
    icon: icon-paste
    $type: dxpPasteContentAction
    allowedRoles:
      - superuser
    sendComponentAction: false
    availability:
      multiple: true
      writePermissionRequired: true
      nodeTypes:
        - mgnl:folder
        - dxp:formEmailConfiguration
  import:
    label: Import
    icon: icon-import
    $type: openDialogAction
    dialogId: ui-framework-jcr:import
    availability:
      root: true
      rules:
        isNotDeleted: &isNotDeleted
          $type: jcrIsDeletedRule
          negate: true
  export:
    label: Export
    icon: icon-export
    $type: exportAction
    format: xml
    dialogName: ui-admincentral:export
    availability:
      rules:
        isNotDeleted: *isNotDeleted
  delete:
    $type: jcrCommandAction
    asynchronous: true
    command: delete
    availability:
      writePermissionRequired: true
      nodeTypes:
        - dxp:formEmailConfiguration
      rules:
        isNotLockedRule:
          $type: isNotLocked
  lock:
    availability:
      nodeTypes: &lockableTypes
        - dxp:formEmailConfiguration
  unlock:
    availability:
      nodeTypes: *lockableTypes
