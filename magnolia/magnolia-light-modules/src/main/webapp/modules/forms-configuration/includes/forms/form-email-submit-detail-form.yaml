properties:
  jcrName:
    label: TemplateID
    $type: textField
    description: Logical ID of configuration
    required: true
  emailTemplate:
    label: AWS SES template name
    description: Name of AWS template
    $type: comboBoxField
    datasource:
      $type: optionListDatasource
      options:
        - name: pocTemplate
          label: POC Template
          value: DxpCmsFormEmailPocTemplate
    i18n: true
    required: true
  senderEmail:
    label: Sender Email
    description: "Email of sender. Couldn't find your email sender? - contact dev team"
    required: true
    $type: comboBoxField
    datasource:
      $type: optionListDatasource
      options:
        - name: NA
          label: Forms NA
          value: forms.na@bobcat.com
        - name: EMEA
          label: Forms EMEA
          value: forms.emea@bobcat.com
        - name: ALAO
          label: Forms ALAO
          value: forms.alao@bobcat.com
        - name: LA_ASIA
          label: Gmail ASIA LA
          value: bobcatasiala@gmail.com
  recipientEmail:
    label: Recipient Email
    description: Recipient email
    $type: textField
    validators:
      email:
        $type: emailValidator
        errorMessage: Enter a valid email address
    required: true
layout:
  $type: tabbedLayout
  tabs:
    basic:
      label: Basic Info
      fields:
        - name: jcrName
        - name: emailTemplate
        - name: senderEmail
        - name: recipientEmail
