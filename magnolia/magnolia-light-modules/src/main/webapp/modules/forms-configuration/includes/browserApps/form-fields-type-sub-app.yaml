label: Form Fields
icon: icon-message
class: info.magnolia.ui.contentapp.configuration.BrowserDescriptor
closable: false
datasource:
  $type: jcrDatasource
  workspace: formsType
  includeProperties: false
  allowedNodeTypes:
    - mgnl:folder
    - dxp:fieldGroup
    - dxp:fieldType
workbench:
  contentViews:
    fields:
      $type: treeView
      multiSelect: true
      multiSelectByRowClick: false
      columns:
        id:
          label: FieldTypeId
          $type: jcrTitleColumn
          nodeTypeToIcon:
            dxp:fieldType: icon-node-content
        type:
          label: Type
          valueProvider: com.tbscg.doosan.magnolia.bobcat.field.BobcatContentTypeValueProvider
        jcrPublishingStatus:
          $type: lockingStatusColumn
          label: Status
        jcr:lockOwner:
          name: jcr:lockOwner
          label: Locked by
        mgnl:lastModified:
          $type: dateColumn
actionbar:
  defaultAction: editFormFieldType
  sections:
    root:
      availability:
        root: true
      groups:
        addActions:
          name: addActions
          items:
            - name: addFormFieldGroup
            - name: addFormFieldType
        editActions:
          name: editActions
          items:
            - name: editFormFieldGroup
            - name: editFormFieldType
            - name : lock
            - name: unlock
        publishingActions:
          name: publishingActions
          items:
            - name: publishItem
            - name: publishRecursive
            - name: unpublishItem
        commonActions:
          name: commonActions
          items:
            - name: renameItem
            - name: deleteItem
            - name: duplicateItem
            - name: moveItem
            - name: copyItem
            - name: pasteItem
        exportImportActions:
          name: exportImportActions
          items:
            - name: export
            - name: import
            - name: addToTranslationBatch
actions:
  !include:/commons/includes/lock-unlock-action-definition.yaml
  addFormFieldGroup:
    label: Add field group
    icon: icon-documents-app
    $type: openDetailSubappAction
    appName: forms-configuration
    subAppName: detailFormsFieldGroup
    viewType: add
    availability:
      writePermissionRequired: true
      nodeTypes:
        - mgnl:folder
      rules:
        isNotLockedRule:
          $type: isNotLocked
  addFormFieldType:
    label: Add field
    icon: icon-documents-app
    $type: openDetailSubappAction
    appName: forms-configuration
    subAppName: detailFormsFieldType
    viewType: add
    availability:
      writePermissionRequired: true
      nodeTypes:
        - mgnl:folder
        - dxp:fieldGroup
      rules:
        isNotLockedRule:
          $type: isNotLocked
  editFormFieldGroup:
    label: Edit field group
    icon: icon-edit
    $type: openDetailSubappAction
    appName: forms-configuration
    subAppName: detailFormsFieldGroup
    viewType: edit
    availability:
      writePermissionRequired: true
      nodeTypes:
        - dxp:fieldGroup
  editFormFieldType:
    label: Edit field
    icon: icon-edit
    $type: openDetailSubappAction
    appName: forms-configuration
    subAppName: detailFormsFieldType
    viewType: edit
    availability:
      writePermissionRequired: true
      nodeTypes:
        - dxp:fieldType
      rules:
        isNotLockedRule:
          $type: isNotLocked
  publishItem:
    label: Publish
    icon: icon-publish
    $type: jcrCommandAction
    command: publish
    catalog: versioned
    availability:
      writePermissionRequired: true
      rules:
        isPublishable:
          $type: jcrPublishableRule
        isNotLockedRule:
          $type: isNotLocked
  publishRecursive:
    icon: icon-publish-incl-sub
    $type: jcrCommandAction
    command: publish
    label: Publish recursive
    asynchronous: true
    params:
      recursive: true
    availability:
      writePermissionRequired: true
      rules:
        isPublishable:
          $type: jcrPublishableRule
        isNotLockedRule:
          $type: isNotLocked
  unpublishItem:
    label: Unpublish
    icon: icon-unpublish
    $type: jcrCommandAction
    command: unpublish
    availability:
      writePermissionRequired: true
      rules:
        isPublished:
          $type: jcrPublishedRule
        isNotLockedRule:
          $type: isNotLocked
  renameItem:
    label: Rename Item
    icon: icon-edit
    $type: openDialogAction
    dialogId: ui-framework-jcr:rename
    availability:
      writePermissionRequired: true
      nodeTypes:
        - dxp:fieldGroup
        - dxp:fieldType
      rules:
        isNotLockedRule:
          $type: isNotLocked
  deleteItem:
    label: Delete Item
    icon: icon-delete
    $type: confirmationAction
    successActionName: delete
    dialogId: ui-framework-jcr:delete
    availability:
      multiple: true
      writePermissionRequired: true
      nodeTypes:
        - dxp:fieldGroup
        - dxp:fieldType
      rules:
        isNotLockedRule:
          $type: isNotLocked
  duplicateItem:
    label: Duplicate Item
    icon: icon-duplicate
    $type: duplicateNodeAction
    availability:
      multiple: true
      writePermissionRequired: true
      nodeTypes:
        - dxp:fieldGroup
        - dxp:fieldType
  moveItem:
    label: Move Item
    icon: icon-move
    $type: dxpMoveAction
    allowedRoles:
      - superuser
    availability:
      multiple: true
      writePermissionRequired: true
      nodeTypes:
        - dxp:fieldGroup
        - dxp:fieldType
      rules:
        isNotLockedRule:
          $type: isNotLocked
  copyItem:
    label: Copy Item
    icon: icon-copy
    $type: copyContentAction
    availability:
      multiple: true
      writePermissionRequired: true
      nodeTypes:
        - dxp:fieldGroup
        - dxp:fieldType
  pasteItem:
    label: Paste Item
    icon: icon-paste
    $type: dxpPasteContentAction
    allowedRoles:
      - superuser
    sendComponentAction: false
    availability:
      multiple: true
      writePermissionRequired: true
      nodeTypes:
        - mgnl:folder
        - dxp:fieldGroup
  import:
    label: Import
    icon: icon-import
    $type: openDialogAction
    dialogId: ui-framework-jcr:import
    availability:
      root: true
      rules:
        isNotDeleted: &isNotDeleted
          $type: jcrIsDeletedRule
          negate: true
  export:
    label: Export
    icon: icon-export
    $type: exportAction
    format: xml
    dialogName: ui-admincentral:export
    availability:
      rules:
        isNotDeleted: *isNotDeleted
  delete:
    $type: jcrCommandAction
    asynchronous: true
    command: delete
    availability:
      nodeTypes:
        - dxp:fieldGroup
        - dxp:fieldType
      rules:
        isNotLockedRule:
          $type: isNotLocked
  lock:
    availability:
      nodeTypes: &lockableTypes
        - dxp:fieldGroup
        - dxp:fieldType
  unlock:
    availability:
      nodeTypes: *lockableTypes
  addToTranslationBatch: 
    label: Add to translation batch
    dialogName: content-translation-support-ext-core:addToTranslationBatch
    icon: icon-add-folder
    class: info.magnolia.translation.ext.core.app.batch.action.OpenMultiEditDialogAction$Definition
    availability:
      writePermissionRequired: true
      access:
        roles: 
          - dxp-bobcat-admins
          - dxp-bobcat-admin-na
          - dxp-bobcat-publishers-na
      nodeTypes: 
        - dxp:fieldType
        - dxp:fieldGroup
        - mgnl:contentNode
        - mgnl:folder
      rules:
        - name: IsNotDeletedRule
          implementationClass: info.magnolia.ui.framework.availability.IsNotDeletedRule
      multiple: true
      root: false
