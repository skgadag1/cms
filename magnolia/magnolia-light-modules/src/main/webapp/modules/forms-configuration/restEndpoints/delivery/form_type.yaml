class: info.magnolia.rest.delivery.jcr.v2.JcrDeliveryEndpointDefinition
endpointPath: /api/content/forms/type
workspace: formsType
depth: 10
bypassWorkspaceAcls: true
systemProperties:
  - mgnl:lastModified
nodeTypes:
  - mgnl:folder
  - dxp:fieldGroup
  - dxp:fieldType
childNodeTypes:
  - mgnl:folder
  - dxp:fieldGroup
  - dxp:fieldType
references:
  - name: excludedCategoriesReference
    propertyName: excludedCategory
    referenceResolver:
      class: com.tbscg.doosan.magnolia.bobcat.rest.delivery.KeySelectionProviderDefinition
      targetWorkspace: products
      itemsToResolve:
        - title
      expand: false
      generateLink: false
  - name: excludedSubcategoriesReference
    propertyName: excludedSubcategory
    referenceResolver:
      class: com.tbscg.doosan.magnolia.bobcat.rest.delivery.KeySelectionProviderDefinition
      targetWorkspace: products
      itemsToResolve:
        - title
      expand: false
      generateLink: false
