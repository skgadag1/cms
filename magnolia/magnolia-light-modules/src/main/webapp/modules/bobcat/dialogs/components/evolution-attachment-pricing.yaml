!include:/bobcat/includes/inheritable-config.yaml
label: Evolution Attachment Pricing Configuration
form:
  properties:
    title:
      label: Title
      $type: textField
      i18n: true
      description: 'If used: %TITLE% and %ID% tags will be replaced by model title/id (from product catalog) and %NAME% will be replaced by @name (from product api)'
      required: true
    subtitle:
      label: Subtitle
      description: 'i.e. product line/category name. Will be combined with Title (in second line)'
      $type: textField
      i18n: true
    htag:
      !include:/bobcat/includes/htag-field.yaml
      defaultValue: h1
    cta:
      label: Buttons (max 2 items)
      description: Please define 0 - 2 buttons.
      $type: jcrMultiField
      i18n: true
      minItems: 0
      maxItems: 2
      itemCountErrorMessage: "Button''s count should be between 0-2"
      field:
        !include:/bobcat/includes/button-style-chooser.yaml
  layout:
    $type: tabbedLayout
    tabs: !override
      content:
        label: General
        fields:
          - name: title
          - name: subtitle
          - name: htag
          - name: htagSubtitle
          - name: pricingLink
          - name: cta
      inheritableSection:
      anchor:
      meta:
light: false