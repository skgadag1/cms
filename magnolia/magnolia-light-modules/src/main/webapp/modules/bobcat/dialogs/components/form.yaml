!include:/bobcat/includes/inheritable-config.yaml
label: Form Configuration
form:
  properties:
    title:
      $type: textField
      label: Title
      i18n: true
    htag:
      !include:/bobcat/includes/htag-field.yaml
    subtitle:
      $type: textField
      label: Subtitle
      i18n: true
    progressLabel:
      $type: textField
      label: Progress Label
      i18n: true
    submitLabel:
      $type: textField
      label: Submit button label
      i18n: true
      required: true
    formType:
      $type: textField
      label: Form Type (GA4)
      description: Event name for GA4
      i18n: true
    formSelectionsForGA4:
      $type: textField
      label: Form selections
      rows: 3
      description: Provide field names and separate by comma without white spaces
      i18n: true
    ctaLabel:
      $type: textField
      label: CTA button label
      i18n: true
      description: This field must be filled if you want to use CTA
    configuration:
      $type: linkField
      label: Form configuration
      required: true
      buttonSelectNewLabel: Select configuration
      i18n: true
      datasource:
        $type: jcrDatasource
        workspace: formsConfiguration
        rootPath: /bobcat
        allowedNodeTypes:
          - dxp:region
          - mgnl:folder
          - dxp:formConfiguration
    thankYouPage:
      label: Select "thank you page" or "thank you message"
      $type: switchableField
      field:
        $type: radioButtonGroupField
        layout: horizontal
        defaultValue: product
        datasource:
          $type: optionListDatasource
          options:
            - name: message
              label: Message
              value: message
            - name: page
              label: Page
              value: page
      itemProvider:
        $type: jcrChildNodeProvider
      forms:
        message:
          properties:
            successStateTitle:
              $type: textField
              label: Title
              i18n: true
            successStateSubtitle:
              $type: textField
              label: Subtitle
              i18n: true
            submitAnother:
              $type: textField
              label: After submit button label
              i18n: true
        page:
          properties:
            link:
              $type: switchableField
              field:
                $type: radioButtonGroupField
                layout: horizontal
                datasource:
                  $type: optionListDatasource
                  options:
                    - name: page
                      label: Magnolia page
                      value: page
                    - name: custom
                      label: Custom link URL
                      value: custom
                defaultValue: page
              itemProvider:
                $type: jcrChildNodeProvider
              forms:
                custom:
                  properties:
                    link:
                      label: ''
                      $type: compositeField
                      itemProvider:
                        $type: jcrChildNodeProvider
                      properties:
                        customUrl:
                          label: Custom link URL
                          description: 'Remember to add protocol (http://, https://) for external links'
                          $type: textField
                          required: true
                page:
                  properties:
                    link:
                      label: ''
                      $type: compositeField
                      itemProvider:
                        $type: jcrChildNodeProvider
                      properties:
                        pageUrl:
                          label: Magnolia page link
                          $type: pageLinkField
                          required: true
              requied: true
              label: Url
              i18n: true
    description:
      $type: cloudinaryRichText
      alignment: true
      images: true
      label: Form description
      i18n: true
    excludedCategories:
      $type: jcrMultiField
      label: Excluded Categories
      description: Select categories to exclude from the product selector
      buttonSelectAddLabel: Add excluded category
      itemProvider:
        $type: jcrChildNodeProvider
      field:
        $type: linkField
        label: Category
        name: excludedCategory
        chooserId: bobcat:chooser/product-chooser
        scrollToSelectedItem: true
        datasource:
          $type: jcrDatasource
          workspace: products
          rootPath: /bobcat
          allowedNodeTypes:
            - mgnl:folder
            - dxp:category
          describeByProperty: title
    excludedSubcategories:
      $type: jcrMultiField
      label: Excluded Subcategories
      description: Select subcategories to exclude from the product selector
      buttonSelectAddLabel: Add excluded subcategory
      itemProvider:
        $type: jcrChildNodeProvider
      field:
        $type: linkField
        label: Subcategory
        name: excludedSubcategory
        chooserId: bobcat:chooser/product-chooser
        scrollToSelectedItem: true
        datasource:
          $type: jcrDatasource
          workspace: products
          rootPath: /bobcat
          allowedNodeTypes:
            - mgnl:folder
            - dxp:category
            - dxp:subcategory
          describeByProperty: title
    excludedSubcategoriesSf:
      $type: twinColSelectField
      label: Excluded Subcategories (SF)
      description: Select subcategories to exclude
      leftColumnCaption: Available
      rightColumnCaption: Excluded
      datasource:
        class: com.tbscg.doosan.magnolia.forms.configuration.field.datasource.ContractCodesOptionListDefinition
    cancelLabel:
      $type: textField
      label: Cancel button label
      description: Cancel button appears only if form CTA is enabled
      i18n: true
    cta:
      $type: checkBoxField
      label: Form CTA
      buttonLabel: Makes form expanded or collapsed on CTA click
      type: java.lang.Boolean
    grayBackground:
      $type: checkBoxField
      label: Background color
      buttonLabel: Makes form's background gray
      type: java.lang.Boolean
    stickyProgressBar:
      $type: checkBoxField
      label: Progress Bar
      buttonLabel: Show progress bar over the Form component
      type: java.lang.Boolean
  layout:
    $type: tabbedLayout
    tabs: !override
      content:
        label: General
        fields:
          - name: title
          - name: htag
          - name: subtitle
          - name: configuration
          - name: description
          - name: excludedCategories
          - name: excludedSubcategories
          - name: excludedSubcategoriesSf
          - name: submitLabel
          - name: grayBackground
      ctaFields:
        label: CTA
        fields:
          - name: cta
          - name: ctaLabel
          - name: cancelLabel
      stickyBar:
        label: Progress Bar
        fields:
          - name: stickyProgressBar
          - name: progressLabel
      successState:
        label: Success Page or Message
        fields:
          - name: thankYouPage
      ga4:
        label: GA4
        fields:
          - name: formType
          - name: formSelectionsForGA4
      inheritableSection:
      anchor:
      meta:
light: false
