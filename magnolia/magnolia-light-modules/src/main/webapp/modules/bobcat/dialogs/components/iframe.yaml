!include:/bobcat/includes/inheritable-config.yaml
label: IFrame Configuration
form:
  properties:
    title:
      label: iFrame title
      description: 'Title is invisible attribute but important for SEO, please describe short content it contains.'
      requiredErrorMessage: 'Title is important attribute for SEO'
      $type: textField
      i18n: true
      required: true
    src:
      label: 'iFrame source'
      description: 'Remember to add protocol (http://, https://) for external links'
      $type: textField
      i18n: true
      required: true
    ratio:
      label: Aspect ratio
      $type: comboBoxField
      defaultValue: '1by1'
      i18n: true
      datasource:
        $type: optionListDatasource
        options:
          - name: '16by9'
            label: '16:9'
            value: '16by9'
          - name: '4by3'
            label: '4:3'
            value: '4by3'
          - name: '21by9'
            label: '21:9'
            value: '21by9'
          - name: '1by1'
            label: '1:1'
            value: '1by1'
          - name: 'custom'
            label: 'custom'
            value: 'custom'
    height:
      label: 'iFrame height (in px)'
      description: 'Will be only used when aspect ratio set to "custom"'
      $type: textField
      i18n: true
      validators:
        numberValidator:
          $type: regexpValidator
          pattern: ^$|^\d{1,5}$
          errorMessage: 'Enter valid number within range: 0-99999'
    allow:
      label: Allow Attribute
      $type: textField
      description: 'Iframe Allow attribute content'
      defaultValue: 'geolocation'
    inheritable:
      defaultValue: true
    preloaded:
      defaultValue: true
  layout:
    $type: tabbedLayout
    tabs: !override
      content:
        label: General
        fields:
          - name: title
          - name: src
          - name: allow
      lookandfeel:
        label: Look & Feel
        fields:
          - name: ratio
          - name: height
      inheritableSection:
      meta:
light: false
