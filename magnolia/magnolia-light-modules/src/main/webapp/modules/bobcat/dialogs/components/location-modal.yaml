!include:/bobcat/includes/inheritable-config.yaml
label: Location Modal
form:
  properties:
    inheritable:
      defaultValue: true
    title:
      $type: textField
      label: Title
      i18n: true
    description:
      $type: cloudinaryRichText
      alignment: false
      images: false
      label: Description
      i18n: true
    distanceLabel:
      $type: textField
      label: Distance Label
      i18n: true
      required: true
    locationLabel:
      $type: textField
      label: Location Label
      i18n: true
      required: true
    locationPlaceholder:
      $type: textField
      label: Location Placeholder
      i18n: true
      required: true
    autoDetectLabel:
      $type: textField
      label: Auto Detect label
      i18n: true
      required: true
    searchLabel:
      $type: textField
      label: Search Button Label
      i18n: true
      required: true
    cancelLabel:
      $type: textField
      label: Cancel Label
      i18n: true
      required: true
    min:
      $type: textField
      type: java.lang.Integer
      label: Distance minimum value
      defaultValue: 50
      description: (max - min) must be divisible by interval
      required: true
      converterClass: com.vaadin.data.converter.StringToIntegerConverter
      validators:
        number:
          $type: regexpValidator
          pattern: ^0*[1-9]\d*$
          errorMessage: Enter a valid number - the value must be greater than 0
    max:
      $type: textField
      type: java.lang.Integer
      label: Distance maximum value
      description: (max - min) must be divisible by interval
      defaultValue: 200
      required: true
      converterClass: com.vaadin.data.converter.StringToIntegerConverter
      validators:
        number:
          $type: regexpValidator
          pattern: ^(?:[2-9]|\d\d\d*)$
          errorMessage: Enter a valid number - the value must be greater than 1
    interval:
      $type: textField
      type: java.lang.Integer
      label: Distance interval value
      description: (max - min) must be divisible by interval
      defaultValue: 25
      required: true
      converterClass: com.vaadin.data.converter.StringToIntegerConverter
      validators:
        number:
          $type: regexpValidator
          pattern: ^0*[1-9]\d*$
          errorMessage: Enter a valid number - the value must be greater than 0
    apiKey:
      $type: textField
      label: Google API Key
      required: true
    validationMessage:
      $type: textField
      label: Location Validation Message
      i18n: true
    hideModalInMagnoliaPreview:
      $type: checkBoxField
      label: Hide modal in Magnolia
      defaultValue: false
      buttonLabel: Hide modal in Magnolia Preview & Edit
      type: java.lang.Boolean
  layout:
    $type: tabbedLayout
    tabs: !override
      content:
        label: General
        fields:
          - name: title
          - name: description
          - name: inheritable
          - name: hideModalInMagnoliaPreview
      inputs:
        label: Inputs
        fields:
          - name: locationLabel
          - name: locationPlaceholder
          - name: autoDetectLabel
          - name: distanceLabel
          - name: min
          - name: max
          - name: interval
          - name: searchLabel
          - name: validationMessage
          - name: cancelLabel
      configuration:
        label: Configuration
        fields:
          - name: apiKey
light: false
