!include:/bobcat/includes/inheritable-config.yaml
label: (New) Dealer Inventory Search Configuration
form:
  properties:
    title:
      $type: textField
      label: Title
      i18n: true
    htag:
      !include:/bobcat/includes/htag-field.yaml
    description:
      $type: cloudinaryRichText
      alignment: true
      images: true
      label: Description
      i18n: true
    productCategory:
      label: Product category
      $type: linkField
      buttonSelectNewLabel: Select...
      chooserId: bobcat:chooser/product-chooser
      required: true
      datasource:
        $type: jcrDatasource
        workspace: products
        allowedNodeTypes:
          - mgnl:folder
          - dxp:category
          - dxp:subcategory
    formTitle:
      $type: textField
      label: Form title
      i18n: true
    distanceLabel:
      $type: textField
      label: Distance Label
      i18n: true
      required: true
    locationLabel:
      $type: textField
      label: Location Label
      i18n: true
      required: true
    locationPlaceholder:
      $type: textField
      label: Location Placeholder
      i18n: true
      required: true
    autoDetectLabel:
      $type: textField
      label: Auto Detect label
      i18n: true
      required: true
    searchLabel:
      $type: textField
      label: Search Button Label
      i18n: true
      required: true
    modelFacetLabel:
      $type: textField
      label: Model Facet Label
      i18n: true
      required: true
    dealerFacetLabel:
      $type: textField
      label: Dealer Facet Label
      i18n: true
      required: true
    reservationFacetLabel:
      $type: textField
      label: Reservation Facet Label
      i18n: true
      required: true
    reservationFacetValueLabel:
      $type: textField
      label: Reservation Facet Value Label
      i18n: true
      required: true
    min:
      $type: textField
      type: java.lang.Integer
      label: Distance minimum value
      defaultValue: 25
      description: (max - min) must be divisible by interval
      required: true
      converterClass: com.vaadin.data.converter.StringToIntegerConverter
      validators:
        number:
          $type: regexpValidator
          pattern: ^0*[1-9]\d*$
          errorMessage: Enter a valid number - the value must be greater than 0
    max:
      $type: textField
      type: java.lang.Integer
      label: Distance maximum value
      description: (max - min) must be divisible by interval
      defaultValue: 100
      required: true
      converterClass: com.vaadin.data.converter.StringToIntegerConverter
      validators:
        number:
          $type: regexpValidator
          pattern: ^(?:[2-9]|\d\d\d*)$
          errorMessage: Enter a valid number - the value must be greater than 1
    interval:
      $type: textField
      type: java.lang.Integer
      label: Distance interval value
      description: (max - min) must be divisible by interval
      defaultValue: 25
      required: true
      converterClass: com.vaadin.data.converter.StringToIntegerConverter
      validators:
        number:
          $type: regexpValidator
          pattern: ^0*[1-9]\d*$
          errorMessage: Enter a valid number - the value must be greater than 0
    apiKey:
      $type: textField
      label: Google API Key
      required: true
    validationMessage:
      $type: textField
      label: Location Validation Message
      i18n: true
    noResultsMsg:
      $type: cloudinaryRichText
      alignment: true
      label: No Results Message (Search results)
      i18n: true
    facet:
      !include:/bobcat/dialogs/chooser/facet-chooser.yaml
      required: false
    limit:
      $type: textField
      type: java.lang.Integer
      label: Maximum results (limit parameter)
      description: Parameter sent to backend to limit results. Default 200
      placeholder: '200'
      defaultValue: 200
      converterClass: com.vaadin.data.converter.StringToIntegerConverter
      validators:
        number:
          $type: regexpValidator
          pattern: ^0*[1-9]\d*$
          errorMessage: Enter a valid number - the value must be greater than 0
    showCTA:
      $type: checkBoxField
      label: Show CTA
      defaultValue: false
      buttonLabel: ''
      type: java.lang.Boolean
    ctaLabel:
      label: CTA Label
      $type: textField
      i18n: true
  layout:
    $type: tabbedLayout
    tabs: !override
      content:
        label: General
        fields:
          - name: title
          - name: htag
          - name: description
          - name: formTitle
          - name: facet
          - name: productCategory
      inputs:
        label: Inputs
        fields:
          - name: locationLabel
          - name: locationPlaceholder
          - name: autoDetectLabel
          - name: distanceLabel
          - name: min
          - name: max
          - name: interval
          - name: modelFacetLabel
          - name: dealerFacetLabel
          - name: reservationFacetLabel
          - name: reservationFacetValueLabel
      configuration:
        label: Configuration
        fields:
          - name: apiKey
          - name: limit
      notifications:
        label: Notifications
        fields:
          - name: validationMessage
          - name: noResultsMsg
      buttons:
        label: Buttons
        fields:
          - name: searchLabel
          - name: ctaLabel
          - name: showCTA
      inheritableSection:
      meta:
light: false
