!include:/bobcat/includes/inheritable-config.yaml
label: Evolution Offers Banner Configuration
form:
  properties:
    slides:
      label: Slides (max 5 items)
      description: Please define 1 - 5 slides.
      $type: jcrMultiField
      i18n: true
      minItems: 0
      maxItems: 5
      itemCountErrorMessage: "Slide's number should be between 1-5"
      field:
        label: Slide
        name: compositeField
        $type: compositeField
        properties:
          text:
            $type: cloudinaryRichText
            label: Banner content
            i18n: true
    variant:
      $type: comboBoxField
      datasource:
        $type: optionListDatasource
        options:
          - name: black
            label: Black
            value: black
          - name: white
            label: White
            value: white
          - name: gray-lighter
            label: Gray lighter
            value: gray-lighter
          - name: gray-darker
            label: Gray darker
            value: gray-darker
          - name: light
            label: Light
            value: light
          - name: gray-dark-medium
            label: Gray dark medium
            value: gray-dark-medium
          - name: info
            label: Info (teal)
            value: info
          - name: primary
            label: Bobcat red
            value: primary
      defaultValue: black
      label: Background color
    interval:
      $type: textField
      type: java.lang.Integer
      label: Delay between slides (ms)
      defaultValue: 4000
      required: true
      converterClass: com.vaadin.data.converter.StringToIntegerConverter
      validators:
        number:
          $type: regexpValidator
          pattern: ^([0-9\W]*)$
          errorMessage: Enter a valid value in ms (number)
    autoPlay:
      $type: checkBoxField
      label: Auto play carousel
      defaultValue: true
      buttonLabel: ''
      type: java.lang.Boolean
  layout:
    $type: tabbedLayout
    tabs: !override
      content:
        label: General
        fields:
          - name: slides
          - name: interval
          - name: autoPlay
      look:
        label: Look & Feel
        fields:
          - name: variant
      inheritableSection:
      anchor:
      meta:
light: false


