!include:/bobcat/includes/inheritable-config.yaml
label: Evolution Section Text Configuration
form:
  properties:
    !include:/bobcat/includes/section-text-props.yaml
    cta:
      label: Buttons (max 3 items)
      description: Please define 0 - 3 buttons.
      $type: jcrMultiField
      i18n: false
      minItems: 0
      maxItems: 3
      itemCountErrorMessage: "Buttons's number should be between 0-3"
      field:
        !include:/bobcat/includes/button-style-chooser.yaml
        i18n: true
    useShowMore:
      $type: checkBoxField
      label: Use Show More button to expand section
      defaultValue: false
      buttonLabel: ''
      type: java.lang.Boolean
    variant:
      $type: comboBoxField
      label: Color Variant
      datasource:
        $type: optionListDatasource
        options: !override
          - name: white
            label: White
            value: white
          - name: light
            label: Gray Light
            value: light
          - name: darkMedium
            label: Gray Medium
            value: darkMedium
          - name: dark
            label: Gray Dark
            value: dark
          - name: black
            label: Black
            value: black
          - name: gradientBlack
            label: Black with gradient
            value: gradientBlack
      defaultValue: white
    id:
      label: ID of section text
      $type: textField
    animationEnabled:
      $type: checkBoxField
      label: Animate cards
      description: Animation will not work if show more button is enabled.
      buttonLabel: ''
      type: java.lang.Boolean
      defaultValue: false
    sectionAlignment:
      $type: comboBoxField
      label: Component alignment
      defaultValue: fullWidth
      datasource:
        $type: optionListDatasource
        options:
          - name: left
            label: Left Constrained
            value: left
          - name: center
            label: Center Constrained
            value: center
          - name: fullWidth
            label: Left Full Width
            value: fullWidth
  layout:
    $type: tabbedLayout
    tabs: !override
      content:
        label: General
        fields:
          - name: content
          - name: id
      buttons:
        label: Buttons
        fields:
          - name: cta
      lookAndFeel:
        label: Look & Feel
        fields:
          - name: variant
          - name: sectionAlignment
          - name: useShowMore
          - name: animationEnabled
      inheritableSection:
      anchor:
      meta:
light: false
