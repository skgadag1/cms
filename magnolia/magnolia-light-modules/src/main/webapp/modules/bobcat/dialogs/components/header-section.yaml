!include:/bobcat/includes/inheritable-config.yaml
label: Article Header Section Configuration
form:
  properties:
    title:
      label: Title
      $type: textField
      i18n: true
    htag:
      !include:/bobcat/includes/htag-field.yaml
      defaultValue: h1
    postDate:
      $type: dateField
      label: Post date
      type: java.util.Date
      i18n: true
      dateFormat: EEE, MMM d, yyyy
    beforePostDate:
      $type: textField
      label: Label before post date
      defaultValue: Published on
      i18n: true
    description:
      $type: cloudinaryRichText
      alignment: true
      images: true
      label: Description
      rows: 5
      i18n: true
    showFullWidth:
      $type: checkBoxField
      label: Show full width
      buttonLabel: ''
      defaultValue: false
      type: java.lang.Boolean
  layout:
    $type: tabbedLayout
    tabs: !override
      content:
        label: Content
        fields:
          - name: title
          - name: htag
          - name: postDate
          - name: beforePostDate
          - name: description
          - name: showFullWidth
      inheritableSection:
      meta:
light: false