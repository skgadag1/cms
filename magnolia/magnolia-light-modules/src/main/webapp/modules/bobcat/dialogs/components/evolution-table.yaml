!include:/bobcat/includes/inheritable-config.yaml
label: Evolution Table
form:
  implementationClass: info.magnolia.ui.javascript.form.FormViewWithChangeListener
  properties:
    title:
      $type: textField
      label: Title
      description: Main title shown above the table (e.g. "T680").
      i18n: true
    titleAccent:
      $type: textField
      label: Title accent
      description: Optional accent word rendered in brand colour next to the title (e.g. "PACKAGES").
      i18n: true
    htag:
      !include:/bobcat/includes/htag-field.yaml
      defaultValue: h2
    tableConfig:
      label: Table configuration
      description: Edit columns, sections, rows, cells and disclaimers in the visual editor below.
      $type: javascriptField
      fieldScript: /bobcat/webresources/evolutionTable/index.html
      height: 720
      i18n: false
      defaultValue: ""
  layout:
    $type: tabbedLayout
    tabs: !override
      content:
        label: General
        fields:
          - name: title
          - name: titleAccent
          - name: htag
      table:
        label: Table editor
        fields:
          - name: tableConfig
      inheritableSection:
      anchor:
      meta:
wide: true
width: wide
light: false
