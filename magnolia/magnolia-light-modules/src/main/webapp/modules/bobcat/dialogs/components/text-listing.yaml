label: Search Listing Configuration
form:
  properties:
    facet:
      !include:/bobcat/dialogs/chooser/facet-chooser.yaml
    useShowMore:
      $type: checkBoxField
      label: Use Show More button instead of pagination
      defaultValue: true
      buttonLabel: ''
      type: java.lang.Boolean
    hideFilters:
      $type: checkBoxField
      label: Hide Facet Filters
      defaultValue: false
      buttonLabel: ''
      type: java.lang.Boolean
    useCollapse:
      $type: checkBoxField
      label: Collapse facets
      description: 'If more than 5 facets it will use collapse with "Show more/less" option'
      defaultValue: true
      buttonLabel: ''
      type: java.lang.Boolean
    hideSorting:
      $type: checkBoxField
      label: Hide Sorting
      defaultValue: false
      buttonLabel: ''
      type: java.lang.Boolean
    ignoreExcludedPages:
      $type: checkBoxField
      label: Show all pages
      defaultValue: false
      description: Even if the page is excluded from search indexing, this option will ignore the excluding
      buttonLabel: ''
      type: java.lang.Boolean
  layout:
    $type: tabbedLayout
    tabs:
      content:
        label: General
        fields:
          - name: facet
          - name: hideFilters
          - name: hideSorting
          - name: useShowMore
          - name: useCollapse
          - name: ignoreExcludedPages
light: false
actions: !include:/bobcat/includes/use-dxp-actions.yaml
