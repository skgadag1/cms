!include:/bobcat/includes/inheritable-config.yaml
label: Flexible listing Configuration
form:
  properties:
    title:
      $type: textField
      label: Component title
      i18n: true
      readOnly: true
    htag:
      !include:/bobcat/includes/htag-field.yaml
      readOnly: true
    evolutionTitle:
      label: New Rich Text Title
      $type: cloudinaryRichText
      i18n: true
    runCampaign:
      $type: checkBoxField
      label: Run Promotional Campaign
    link:
      !include:/bobcat/includes/page-link-or-url-field.yaml
      defaultValue: none
      i18n: true
      field:
        datasource:
          options:
            - name: none
              label: No link
              value: none
      label: Link "view more"
    variant:
      !include:/bobcat/includes/variants/evolution-listing-color-variants.yaml
    cards:
      label: Cards (max 4)
      description: Add up to 4 cards.
      $type: jcrMultiField
      i18n: false
      buttonSelectAddLabel: Add new card
      field:
        $type: compositeField
        label: Card
        properties:
          image:
            !include:/bobcat/includes/image.yaml
            description: '3:2 aspect ratio, 1140x760 for best quality (1 item)'
          newIndicator:
            $type: checkBoxField
            label: ''
            buttonLabel: "Show 'NEW' indicator"
            type: java.lang.Boolean
          videoIndicator:
            $type: checkBoxField
            label: ''
            buttonLabel: "Show 'VIDEO' indicator"
            type: java.lang.Boolean
          title:
            i18n: true
            label: Title
            $type: textField
            readOnly: true
          htag:
            !include:/bobcat/includes/htag-field.yaml
            defaultValue: h5
            readOnly: true
          evolutionTitle:
            label: New Rich Text Title
            $type: cloudinaryRichText
            i18n: true
            rows: 1
          description:
            label: Description
            i18n: true
            $type: cloudinaryRichText
            alignment: true
            images: true
            rows: 5
          caption:
            label: Caption
            i18n: true
            $type: textField
          info:
            label: Extra info label
            i18n: true
            $type: textField
          link:
            !include:/bobcat/includes/page-link-or-url-field.yaml
            defaultValue: none
            i18n: true
            field:
              datasource:
                options:
                  - name: none
                    label: No link
                    value: none
            label: Link 1
          link2:
            !include:/bobcat/includes/page-link-or-url-field.yaml
            defaultValue: none
            i18n: true
            field:
              datasource:
                options:
                  - name: none
                    label: No link
                    value: none
            label: Link 2
          link3:
            !include:/bobcat/includes/page-link-or-url-field.yaml
            defaultValue: none
            i18n: true
            field:
              datasource:
                options:
                  - name: none
                    label: No link
                    value: none
            label: Link 3
          chips:
            label: Chips
            $type: jcrMultiField
            i18n: false
            buttonSelectAddLabel: Add chip
            field:
              $type: compositeField
              idPropertyName: name
              properties:
                title:
                  label: Pill title
                  $type: textField
                  i18n: true
    indicators:
      $type: checkBoxField
      label: Display indicators
      buttonLabel: ''
      type: java.lang.Boolean
      defaultValue: true

    showChips:
      $type: checkBoxField
      label: Display chips
      buttonLabel: ''
      type: java.lang.Boolean
      defaultValue: true
    showImages:
      $type: checkBoxField
      label: Display card images
      buttonLabel: ''
      type: java.lang.Boolean
      defaultValue: true
    eagerLoad:
      $type: checkBoxField
      label: Eager Load
      description: Flag this component for eager loading (above-the-fold content)
      defaultValue: false
      buttonLabel: ''
      type: java.lang.Boolean
    animationEnabled:
      $type: checkBoxField
      label: Animate cards
      buttonLabel: ''
      type: java.lang.Boolean
      defaultValue: false
    columns:
      $type: comboBoxField
      datasource:
        $type: optionListDatasource
        options:
          - name: 0
            label: Full Width
            value: 0
          - name: 1
            label: 1 column (horizontal)
            value: 1
          - name: 2
            label: 2 columns
            value: 2
          - name: 3
            label: 3 columns
            value: 3
          - name: 4
            label: 4 columns
            value: 4
      defaultValue: 0
      label: Columns
      required: true
  layout:
    $type: tabbedLayout
    tabs: !override
      general:
        label: General
        fields:
          - name: title
          - name: htag
          - name: evolutionTitle
          - name: link
          - name: runCampaign
      cardConfiguration:
        label: Cards
        fields:
          - name: cards
      lookandfeel:
        label: Look & Feel
        fields:
          - name: variant
          - name: animationEnabled
          - name: eagerLoad
          - name: indicators
          - name: showChips
          - name: showImages
          - name: columns
      inheritableSection:
      anchor:
      meta:
light: false
