class: info.magnolia.ui.chooser.definition.MultiItemWorkbenchChooserDefinition
label: Product Chooser
actions:
  choose:
    class: info.magnolia.ui.contentapp.action.ChooseMultipleActionDefinition
    componentClass: info.magnolia.ui.contentapp.action.ChooseMultipleActionDefinition$ChooseMultipleButton
    availability:
      multiple: true
      root: true
  cancel:
    $type: closeAction
  clear:
    label: Clear
    class: info.magnolia.ui.contentapp.action.ClearValueContextActionDefinition
    availability:
      multiple: true
footerLayout:
  $type: defaultEditorActionLayout
  primaryActions:
    - choose
    - cancel
  secondaryActions:
    - clear
workbenchChooser:
  workbench:
    extensionViews:
      - name: fullTextSearch
        class: info.magnolia.ui.chooser.definition.FullTextSearchExtensionViewDefinition
    contentViews:
      model:
        $type: treeView
        multiSelect: true
        multiSelectByRowClick: true
        columns:
          jcrName:
            label: Name
            $type: jcrTitleColumn
            expandRatio: 5
            nodeTypeToIcon:
              mgnl:folder: icon-language-app
              dxp:category: icon-node-content
              dxp:subcategory: icon-packager-app
              dxp:productGroup: icon-packager-app
              dxp:product: icon-documents-app
          regionInfo:
            label: Region
            valueProvider: com.tbscg.doosan.magnolia.product.catalog.field.RegionNameValueProvider
            expandRatio: 1
            sortable: false
          jcr:primaryType:
            label: Type
            valueProvider: com.tbscg.doosan.magnolia.product.catalog.field.ProductTypeValueProvider
            expandRatio: 3
            filterComponent:
              $type: textField
          jcrPublishingStatus:
            $type: jcrStatusColumn
            label: Status
          mgnl:lastModified:
            $type: dateColumn
            expandRatio: 3
wide: true
