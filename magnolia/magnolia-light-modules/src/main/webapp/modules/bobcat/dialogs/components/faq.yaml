!include:/bobcat/includes/inheritable-config.yaml
label: FAQ Configuration
form:
  properties:
    title:
      label: Title
      $type: textField
      i18n: true
      required: true
    htag:
      !include:/bobcat/includes/htag-field.yaml
      defaultValue: h1
    accordionHtag:
      !include:/bobcat/includes/htag-field.yaml
      label: Primary Accordion Tag
      defaultValue: 'h3'
    placeholder:
      label: Placeholder
      $type: textField
      description: 'Input placeholder, i.e. "Search" or "Enter keyword here"'
      i18n: true
    hint:
      label: Hint below input
      $type: textField
      description: Text placed below input to help understanding what should be put there
      i18n: true
    noResultsLabel:
      label: No Results Label
      $type: textField
      description: 'Label shown when search returns no results, i.e. "No results for"'
      i18n: true
    faqSections:
      label: FAQ sections
      $type: jcrMultiField
      i18n: true
      buttonSelectAddLabel: Add new section
      field:
        label: Section
        name: faqSection
        $type: linkField
        datasource:
          $type: jcrDatasource
          workspace: faq
          rootPath: /bobcat
          allowedNodeTypes:
            - dxp:faqSection
            - dxp:faq
            - mgnl:folder
  layout:
    $type: tabbedLayout
    tabs: !override
      content:
        label: General
        fields:
          - name: title
          - name: htag
          - name: placeholder
          - name: hint
          - name: noResultsLabel
          - name: faqSections
      tagStructure:
        label: Tag structure
        fields:
          - name: accordionHtag
      inheritableSection:
      anchor:
      meta:
light: false