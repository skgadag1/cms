!include:/bobcat/includes/inheritable-config.yaml
label: Evolution Compare Component
form:
  properties:
    title:
      label: Title
      $type: cloudinaryRichText
      alignment: true
      i18n: true
    subtitle:
      label: Subtitle
      $type: cloudinaryRichText
      alignment: true
      i18n: true
    description:
      label: Description
      $type: cloudinaryRichText
      alignment: true
      i18n: true
    sectionAlignment:
      $type: comboBoxField
      label: Header text width
      description: Constrains the header text (title, subtitle, description) width, matching the Evolution Section Text component.
      defaultValue: fullWidth
      datasource:
        $type: optionListDatasource
        options:
          - name: left
            label: Left Constrained
            value: left
          - name: fullWidth
            label: Left Full Width
            value: fullWidth
    dataSource:
      $type: switchableField
      label: Dropdown source
      field:
        $type: comboBoxField
        layout: horizontal
        defaultValue: subcategory
        datasource:
          $type: optionListDatasource
          options:
            - name: Subcategory
              label: Subcategory (models in this subcategory)
              value: subcategory
            - name: Category
              label: Category (models across subcategories)
              value: category
      itemProvider:
        $type: jcrChildNodeProvider
      forms:
        subcategory:
          properties:
            productSubcategory:
              label: Product subcategory
              $type: linkField
              buttonSelectNewLabel: Select...
              chooserId: bobcat:chooser/product-chooser
              required: true
              datasource:
                $type: jcrDatasource
                workspace: products
                rootPath: /
                allowedNodeTypes:
                  - mgnl:folder
                  - dxp:category
                  - dxp:subcategory
        category:
          properties:
            productCategory:
              label: Product category
              $type: linkField
              buttonSelectNewLabel: Select...
              chooserId: bobcat:chooser/product-chooser
              required: true
              datasource:
                $type: jcrDatasource
                workspace: products
                rootPath: /
                allowedNodeTypes:
                  - mgnl:folder
                  - dxp:category
                  - dxp:subcategory
    excludedModels:
      label: Exclude models
      description: 
        Pick models that should NOT appear in the dropdown for this comparison.
        Use the chooser modal to multi-select products at once.
      $type: jcrMultiLinkField
      chooserId: bobcat:chooser/product-multi-chooser
      buttonSelectAddLabel: Select products to exclude...
      field:
        label: ''
        name: excludedModel
        $type: linkField
        datasource:
          $type: jcrDatasource
          workspace: products
          allowedNodeTypes:
            - mgnl:folder
            - dxp:category
            - dxp:subcategory
            - dxp:productGroup
            - dxp:product
    defaultModel1:
      !include:/bobcat/includes/evolution-compare-default-model-field.yaml
      label: Default Model 1
      description: 
        Pre-selected model in the first compare slot when the page loads (unless overridden by URL).
        Select a product only — browse the tree under your chosen category/subcategory above.
    defaultModel2:
      !include:/bobcat/includes/evolution-compare-default-model-field.yaml
      label: Default Model 2
      description: 
        Pre-selected model in the second compare slot when the page loads (unless overridden by URL).
        Select a product only — browse the tree under your chosen category/subcategory above.
    defaultModel3:
      !include:/bobcat/includes/evolution-compare-default-model-field.yaml
      label: Default Model 3
      description: 
        Pre-selected model in the third compare slot when the page loads (unless overridden by URL).
        Select a product only — browse the tree under your chosen category/subcategory above.
    startingAtPriceLabel:
      label: Starting-at price label
      description: Caption shown under the price (e.g. "Starting at USD**").
      $type: textField
      i18n: true
    modelDetailsFallbackLink:
      !include:/bobcat/includes/page-link-or-url-field-with-none.yaml
      label: Model details fallback link (optional)
      description: 
        Per-tile "Model details" uses the product catalog link, associated page, page link,
        or page-related URL when available. Set this only if you need one shared link when
        the product has no model page URL. Choose "None" to hide the button when no product link exists.
      i18n: true
    primaryCtaButton:
      !include:/bobcat/includes/button-style-chooser-no-links.yaml
      label: Build & Price button style
    modelDetailsLabel:
      label: Model details button label
      description: Label on each product tile; URL comes from the product (or fallback link below).
      $type: textField
      i18n: true
    modelDetailsTarget:
      !include:/bobcat/includes/anchor-target.yaml
      label: Model details link target
      defaultValue: _self
    modelDetailsCtaButton:
      !include:/bobcat/includes/button-style-chooser-no-links.yaml
      label: Model details button style
    sectionCtaLink:
      !include:/bobcat/includes/page-link-or-url-field-with-none.yaml
      label: Section CTA link
      description:
        Optional header button. Link label, target, and URL come from this field (page or custom).
        Choose "None" to hide the button.
      required: false
      i18n: true
      forms:
        custom:
          properties:
            link:
              properties:
                customUrl:
                  required: false
        page:
          properties:
            link:
              properties:
                pageUrl:
                  required: false
    sectionCtaButton:
      !include:/bobcat/includes/button-style-chooser-no-links.yaml
      label: Section CTA button style
    showMoreSpecsLabel:
      label: Show more (specifications) button label
      description: Label on the button that reveals the specification comparison. Specification data is loaded in the background before the click.
      $type: textField
      i18n: true
    showLessSpecsLabel:
      label: Show less (specifications) button label
      description: Label on the button that reveals the specification comparison. Specification data is loaded in the background before the click.
      $type: textField
      i18n: true
    showOnlyDifferencesLabel:
      label: Show only differences checkbox label
      description: Label for the filter that hides specification rows where all compared models have the same value.
      $type: textField
      i18n: true
  layout:
    $type: tabbedLayout
    tabs: !override
      content:
        label: General
        fields:
          - name: title
          - name: subtitle
          - name: description
          - name: startingAtPriceLabel
          - name: dataSource
          - name: excludedModels
          - name: defaultModel1
          - name: defaultModel2
          - name: defaultModel3
      buttons:
        label: Buttons
        fields:
          - name: sectionCtaLink
          - name: sectionCtaButton
          - name: primaryCtaButton
          - name: modelDetailsLabel
          - name: modelDetailsFallbackLink
          - name: modelDetailsCtaButton
          - name: modelDetailsTarget
      specifications:
        label: Specifications
        fields:
          - name: showMoreSpecsLabel
          - name: showLessSpecsLabel
          - name: showOnlyDifferencesLabel
      lookAndFeel:
        label: Look & Feel
        fields:
          - name: sectionAlignment
      inheritableSection:
      anchor:
      meta:
light: false
actions: !include:/bobcat/includes/use-dxp-actions.yaml
