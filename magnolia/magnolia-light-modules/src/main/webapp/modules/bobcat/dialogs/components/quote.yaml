!include:/bobcat/includes/inheritable-config.yaml
label: Article Quote Configuration
form:
  properties:
    quote:
      label: Quote text
      $type: textField
      i18n: true
      rows: 5
    authorName:
      $type: textField
      label: Author name
      i18n: true
    authorSubtitle:
      $type: textField
      label: Author subtitle
      i18n: true
    avatar:
      !include:/bobcat/includes/image.yaml
      label: Select avatar
  layout:
    $type: tabbedLayout
    tabs: !override
      content:
        label: Content
        fields:
          - name: quote
          - name: authorName
          - name: authorSubtitle
          - name: avatar
      inheritableSection:
      anchor:
      meta:
light: false