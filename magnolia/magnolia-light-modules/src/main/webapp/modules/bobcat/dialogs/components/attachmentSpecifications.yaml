!include:/bobcat/includes/inheritable-config.yaml
label: Attachment Specifications Configuration
form:
  properties:
    title:
      label: Title
      $type: textField
      description: 'If used: %TITLE% and %ID% tags will be replaced by model title/id (from product catalog) and %NAME% will be replaced by @name (from product api)'
      i18n: true
      readOnly: true
    htag:
      !include:/bobcat/includes/htag-field.yaml
      readOnly: true
    evolutionTitle:
      label: New Rich Text Title
      $type: cloudinaryRichText
      description: 'If used: %TITLE% and %ID% tags will be replaced by model title/id (from product catalog) and %NAME% will be replaced by @name (from product api)'
      i18n: true
    buttonLabel:
      label: Button label
      $type: textField
      description: 'Download or print PDF label'
      i18n: true
    cta:
      !include:/bobcat/includes/page-link-or-url-field-with-none.yaml
    limitContent:
      $type: checkBoxField
      label: Limit content with overlay
      description: 'This require adding concepts showMore/showLess under "/bobcat/common/labels/functional"'
      buttonLabel: ''
      type: java.lang.Boolean
      defaultValue: false
    evolutionButton:
      $type: checkBoxField
      label: Show more / Show less button style - evolution
      description: Enable this if you want to use the evolution button style instead of the default one
      buttonLabel: ''
      type: java.lang.Boolean
      defaultValue: false
    showUnits:
      $type: checkBoxField
      label: Show unit switch
      buttonLabel: ''
      type: java.lang.Boolean
      defaultValue: true
    showCategoryNames:
      $type: checkBoxField
      label: Show group headers
      description: 'Always show group/category headers'
      buttonLabel: ''
      type: java.lang.Boolean
      defaultValue: false
    showExpandAll:
      $type: checkBoxField
      label: Show Expand All
      buttonLabel: ''
      type: java.lang.Boolean
      defaultValue: true
  layout:
    $type: tabbedLayout
    tabs: !override
      content:
        label: General
        fields:
          - name: title
          - name: htag
          - name: evolutionTitle
          - name: buttonLabel
          - name: cta
      lookandfeel:
        label: Look & Feel
        fields:
          - name: limitContent
          - name: evolutionButton
          - name: showUnits
          - name: showCategoryNames
          - name: showExpandAll
      inheritableSection:
      anchor:
      meta:
light: false
