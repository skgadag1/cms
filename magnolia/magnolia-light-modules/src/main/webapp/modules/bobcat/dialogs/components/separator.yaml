label: Separator Configuration
form:
  properties:
    size:
      $type: comboBoxField
      defaultValue: small
      datasource:
        $type: optionListDatasource
        options:
          - name: small
            value: 'py-3'
            label: 32px
          - name: big
            value: 'py-5'
            label: 64px
      label: Space size
    variant:
      $type: comboBoxField
      label: Background color
      datasource:
        $type: optionListDatasource
        options:
          - name: white
            label: White
            value: white
          - name: light
            label: Gray Lighter
            value: light
          - name: dark
            label: Gray Darker
            value: dark
          - name: black
            label: Black
            value: black
      defaultValue: white
  layout:
    $type: tabbedLayout
    tabs:
      general:
        label: Sizing
        fields:
          - name: size
      lookandfeel:
        label: Look & Feel
        fields:
          - name: variant
light: false
actions: !include:/bobcat/includes/use-dxp-actions.yaml
