!include:/bobcat/includes/inheritable-config.yaml
label: Model Selector Configuration
form:
  properties:
    heading:
      label: Header
      $type: cloudinaryRichText
      alignment: true
      i18n: true
    productCategory:
      label: Product categories
      description: Select one or more categories/subcategories. When more than one is selected, results and facets are merged across all of them.
      $type: jcrMultiLinkField
      chooserId: bobcat:chooser/product-multi-chooser
      buttonSelectAddLabel: Select categories...
      minItems: 1
      field:
        label: ''
        name: productCategoryItem
        $type: linkField
        datasource:
          $type: jcrDatasource
          workspace: products
          allowedNodeTypes:
            - mgnl:folder
            - dxp:category
            - dxp:subcategory
    facet:
      !include:/bobcat/dialogs/chooser/facet-chooser.yaml
    facetConfiguration:
      label: Facet configuration (subset, order, defaults, icons)
      description: Pick individual facets to expose on this component instance. Item order here is the display order. Facets not listed here are hidden.
      $type: jcrMultiField
      i18n: false
      buttonSelectAddLabel: Add facet
      field:
        label: Facet override
        name: facetOverride
        $type: compositeField
        properties:
          facet:
            label: Facet
            $type: linkField
            required: true
            buttonSelectNewLabel: Select...
            datasource:
              $type: jcrDatasource
              describeByProperty: label
              workspace: facets
              rootPath: /
              allowedNodeTypes:
                - mgnl:folder
                - dxp:facetGroup
                - dxp:facetCategory
                - dxp:facet
          enabled:
            label: Enabled
            $type: checkBoxField
            defaultValue: true
            buttonLabel: ''
            type: java.lang.Boolean
          questionText:
            label: Question text
            description: 'Optional heading shown above this facet''s options (e.g. "What type of loader are you looking for?"). Leave blank to use the facet''s own label.'
            $type: textField
            i18n: true
            required: false
          values:
            label: Tag value overrides (icon / default / description)
            description: Only applies to tag-type facet values. Numeric facets have no per-value content to reference, so leave this empty for them.
            $type: jcrMultiField
            i18n: false
            buttonSelectAddLabel: Add value override
            field:
              label: Value override
              name: facetValueOverride
              $type: compositeField
              properties:
                iconTag:
                  label: Tag value
                  $type: linkField
                  required: true
                  buttonSelectNewLabel: Select...
                  chooserId: facet-configuration:tag-chooser
                  datasource:
                    $type: jcrDatasource
                    workspace: dxpTags
                    rootPath: /bobcat
                    allowedNodeTypes:
                      - mgnl:folder
                      - dxp:tagGroup
                      - dxp:tag
                icon:
                  !include:/bobcat/includes/dam-image.yaml
                  label: Icon
                  description: 'Cloudinary icon shown for this option (1:1 aspect recommended).'
                defaultSelected:
                  label: Selected by default
                  $type: checkBoxField
                  defaultValue: false
                  buttonLabel: ''
                  type: java.lang.Boolean
                description:
                  label: Description
                  $type: textField
                  i18n: true
                  description: 'Optional short caption shown under the icon and label.'
    showModelDetailsButton:
      $type: checkBoxField
      label: Show Model Details Button
      defaultValue: true
      buttonLabel: ''
      type: java.lang.Boolean
    modelDetailsLabel:
      label: Model Details Button Label
      $type: textField
      i18n: true
      default: Model Details
    modelDetailsVariant:
      !include:/bobcat/includes/button-style-chooser-no-links.yaml
      label: Model Details button style
    showBuildAndQuoteButton:
      $type: checkBoxField
      label: Show Build & Price Button
      defaultValue: true
      buttonLabel: ''
      type: java.lang.Boolean
    bqVariant:
      !include:/bobcat/includes/button-style-chooser-no-links.yaml
      label: Build & Price style
    showCompareLink:
      $type: checkBoxField
      label: Show Compare Link
      defaultValue: true
      buttonLabel: ''
      type: java.lang.Boolean
    compareLabel:
      label: Compare Link Label
      $type: textField
      i18n: true
      default: Compare
    comparePageLink:
      !include:/bobcat/includes/page-link-or-url-field-with-none.yaml
      label: Compare Page Link
      required: false
      i18n: true
  layout:
    $type: tabbedLayout
    tabs: !override
      content:
        label: General
        fields:
          - name: heading
          - name: productCategory
          - name: facet
      facetConfiguration:
        label: Facets
        fields:
          - name: facetConfiguration
      buttons:
        label: Buttons
        fields:
          - name: showModelDetailsButton
          - name: modelDetailsLabel
          - name: modelDetailsVariant
          - name: showBuildAndQuoteButton
          - name: bqVariant
          - name: showCompareLink
          - name: compareLabel
          - name: comparePageLink
      inheritableSection:
      anchor:
      meta:
meta:
light: false
actions: !include:/bobcat/includes/use-dxp-actions.yaml
