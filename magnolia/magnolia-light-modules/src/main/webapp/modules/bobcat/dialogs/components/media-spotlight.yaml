!include:/bobcat/includes/inheritable-config.yaml
label: Media Spotlight Configuration
form:
  properties:
    title:
      label: Title
      $type: textField
      i18n: true
      readOnly: true
    htag:
      !include:/bobcat/includes/htag-field.yaml
      defaultValue: 'h2'
      readOnly: true
    subtitle:
      label: Subtitle
      $type: textField
      i18n: true
      readOnly: true
    evolutionTitle:
      label: New Rich Text Title
      $type: cloudinaryRichText
      i18n: true
    evolutionSubtitle:
      label: New Rich Text Subtitle
      $type: cloudinaryRichText
      i18n: true
    description:
      label: Description
      $type: cloudinaryRichText
      alignment: true
      images: true
      i18n: true
      rows: 5
    link:
      !include:/bobcat/includes/page-link-or-url-or-brochure-field.yaml
      i18n: true
      readOnly: true
    cta:
      label: Buttons (max 3 items)
      description: Please define 0 - 3 buttons.
      $type: jcrMultiField
      i18n: false
      minItems: 0
      maxItems: 3
      itemCountErrorMessage: "Buttons's number should be between 0-3"
      field:
        !include:/bobcat/includes/button-style-chooser.yaml
        i18n: true
    variant:
      $type: comboBoxField
      datasource:
        $type: optionListDatasource
        options:
          - name: left
            label: Left asset/Right Text
            value: left
          - name: right
            label: Right asset/Left Text
            value: right
      defaultValue: right
      label: Content alignment
      required: true
    colorVariant:
      $type: comboBoxField
      label: Color Variant
      datasource:
        $type: optionListDatasource
        options:
          - name: white
            label: White
            value: white
          - name: light
            label: Light
            value: light
          - name: dark
            label: Dark
            value: dark
          - name: black
            label: Black
            value: black
      defaultValue: white
    asset:
      label: Asset source
      $type: switchableField
      field:
        $type: radioButtonGroupField
        layout: horizontal
        datasource:
          $type: optionListDatasource
          options:
            - name: video
              label: Video
              value: video
            - name: img
              label: Image
              value: img
            - name: youtube
              label: YouTube
              value: youtube
      itemProvider:
        $type: jcrChildNodeProvider
      forms:
        video:
          properties:
            video:
              !include:/bobcat/includes/dam-video.yaml
              description: '3:2 aspect ratio'
              label: Select video
              properties:
                src:
                  !include:/bobcat/includes/dam-asset.yaml
                  label: Video
                  filters:
                    resource_type:
                      class: com.tbscg.doosan.magnolia.cloudinary.contentapp.filter.AssetPropertyFilter
                      value: video
        img:
          properties:
            img:
              !include:/bobcat/includes/image.yaml
              description: '3:2 aspect ratio'
        youtube:
          properties:
            youtube:
              $type: textField
              label: YouTube link source
              description: '16:9 aspect ratio'
  layout:
    $type: tabbedLayout
    tabs: !override
      content:
        label: General
        fields:
          - name: title
          - name: htag
          - name: subtitle
          - name: evolutionTitle
          - name: evolutionSubtitle
          - name: description
          - name: link
          - name: asset
      buttons:
        label: Buttons
        fields:
          - name: cta
      lookAndFeel:
        label: Look & Feel
        fields:
          - name: variant
          - name: colorVariant
      inheritableSection:
      anchor:
      meta:
light: false



