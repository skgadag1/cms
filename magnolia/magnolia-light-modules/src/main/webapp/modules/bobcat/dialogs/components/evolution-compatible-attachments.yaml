!include:/bobcat/includes/inheritable-config.yaml
label: Evolution Compatible Attachments Configuration
form:
  properties:
    title:
      label: Title
      $type: cloudinaryRichText
      alignment: true
      i18n: true
    variant:
      !include:/bobcat/includes/variants/evolution-compatible-attachments-color-variants.yaml
    headline:
      label: Upper-title
      $type: cloudinaryRichText
      alignment: true
      i18n: true
    mainCTA:
      !include:/bobcat/includes/page-link-or-url-field-with-none.yaml
      label: Main CTA
      i18n: true
    viewAllCTA:
      !include:/bobcat/includes/page-link-or-url-field-with-none.yaml
      label: View all button
      i18n: true
    facet:
      label: Sorting facet
      required: true
      $type: linkField
      buttonSelectNewLabel: Select...
      datasource:
        $type: jcrDatasource
        describeByProperty: label
        workspace: facets
        rootPath: /
        allowedNodeTypes:
          - mgnl:folder
          - dxp:facetGroup
          - dxp:facet
          - dxp:facetCategory
    sortingDirection:
      $type: switchableField
      label: Sorting Direction
      field:
        $type: comboBoxField
        layout: horizontal
        required: true
        defaultValue: asc
        datasource:
          $type: optionListDatasource
          options:
            - name: ascending
              label: Ascending
              value: asc
            - name: descending
              label: Descending
              value: desc
      itemProvider:
        $type: jcrChildNodeProvider
    resultsPerPage:
      label: Results per page
      $type: textField
      required: true
      defaultValue: '8'
      validators:
        numberValidator:
          $type: regexpValidator
          pattern: ^$|^(1[012]|[3-9])$
          errorMessage: 'Enter valid number within range: 3-12'
    showMoreVariant:
      !include:/bobcat/includes/button-style-chooser-no-links.yaml
      label: Show More button style
    showCTA:
      $type: checkBoxField
      label: Show Card listing CTA
      defaultValue: false
      buttonLabel: ''
      type: java.lang.Boolean
    ctaLabel:
      label: Card listing CTA Label
      $type: textField
      i18n: true
    ctaLabelUrlTarget:
      !include:/bobcat/includes/anchor-target.yaml
      label: Card listing CTA link target
      defaultValue: _parent
      required: false
    attachmentDisplayMode:
      $type: comboBoxField
      label: Attachment Display Mode
      required: true
      defaultValue: showRelatedAttachments
      datasource:
        $type: optionListDatasource
        options:
          - name: showRelatedAttachments
            label: 'from API - Relations'
            value: showRelatedAttachments
          - name: showCategoryChildren
            label: 'from API - Attachments hierarchy'
            value: showCategoryChildren
          - name: fromApiRegionHierarchy
            label: 'from API - Region hierarchy'
            value: fromApiRegionHierarchy
          - name: manualTilesPerChoice
            label: 'Manual - tiles per choice'
            value: manualTilesPerChoice
    manualAttachments:
      $type: jcrMultiValueField
      label: Attachments (onlyfor manual select mode)
      field:
        label: Attachment
        $type: linkField
        buttonSelectNewLabel: Select...
        chooserId: bobcat:chooser/attachment-chooser
        datasource:
          $type: jcrDatasource
          workspace: attachments
          rootPath: /
          allowedNodeTypes:
            - mgnl:folder
            - dxp:attachmentCategory
            - dxp:attachment
            - dxp:attachmentGroup
    displayAtGroupLevel:
      $type: checkBoxField
      label: Display at group level
      defaultValue: false
      buttonLabel: ''
      description: This option works only when the source of tiles is BY Hierarchy.
      type: java.lang.Boolean
    ctaLinksType:
      $type: comboBoxField
      label: Link destination
      required: true
      defaultValue: modelDetailsPage
      datasource:
        $type: optionListDatasource
        options:
          - name: modelDetailsPage
            label: Current Level (item's own page)
            value: modelDetailsPage
          - name: subcategoryPage
            label: Parent Level (item's parent page)
            value: subcategoryPage
  layout:
    $type: tabbedLayout
    tabs: !override
      content:
        label: General
        fields:
          - name: headline
          - name: title
          - name: facet
          - name: sortingDirection
          - name: displayAtGroupLevel
      buttons:
        label: Buttons
        fields:
          - name: mainCTA
          - name: viewAllCTA
          - name: showCTA
          - name: ctaLabel
          - name: ctaLabelUrlTarget
          - name: showMoreVariant
      cards:
        label: Cards
        fields:
          - name: attachmentDisplayMode
          - name: manualAttachments
          - name: ctaLinksType
      settings:
        label: Look & Feel
        fields:
          - name: resultsPerPage
          - name: variant
      inheritableSection:
      anchor:
      meta:
light: false
actions: !include:/bobcat/includes/use-dxp-actions.yaml

