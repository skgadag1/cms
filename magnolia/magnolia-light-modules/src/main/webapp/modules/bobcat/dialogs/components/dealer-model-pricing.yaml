!include:/bobcat/includes/inheritable-config.yaml
label: Dealer Inventory Model Pricing Configuration
form:
  properties:
    htag:
      !include:/bobcat/includes/htag-field.yaml
      label: Title heading style
      defaultValue: h1
    disclaimerId:
      $type: textField
      label: Disclaimer element id
      description: If entered, clicking asterisk (*) will scroll to disclaimer area 
    formId:
      $type: textField
      label: Form element id
      description: This id is needed for the scroll button to redirects to the DINV form
    displayScrollBtn:
      $type: checkBoxField
      label: Scroll Button Visible
      description: Enable/Disable scroll button which redirects to the form
      defaultValue: false
      buttonLabel: ''
      type: java.lang.Boolean
    disableDownloadButton:
      $type: checkBoxField
      label: Disable Download Button
      defaultValue: false
      buttonLabel: ''
      type: java.lang.Boolean
    disableShareButton:
      $type: checkBoxField
      label: Disable Share Button
      defaultValue: false
      buttonLabel: ''
      type: java.lang.Boolean
    priceDisclaimer:
      $type: checkBoxField
      label: Price disclaimer
      description: 'Disclaimer text under the gallery. The text is being taken from the concept app under path: "/common/labels/dealerinventory/priceDisclaimer"'
      defaultValue: true
      buttonLabel: ''
      type: java.lang.Boolean
  layout:
    $type: tabbedLayout
    tabs: !override
      content:
        label: General
        fields:
          - name: htag
          - name: disclaimerId
          - name: formId
          - name: displayScrollBtn
          - name: priceDisclaimer
      buttons:
        label: Buttons
        fields:
          - name: disableDownloadButton
          - name: disableShareButton
      inheritableSection:
      meta:
light: false
