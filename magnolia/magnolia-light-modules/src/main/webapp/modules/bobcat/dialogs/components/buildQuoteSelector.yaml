!include:/bobcat/includes/inheritable-config.yaml
label: B&P Selector Configuration
form:
  properties:
    title:
      label: Title
      $type: textField
      i18n: true
      description: 'If used: %TITLE% and %ID% tags will be replaced by model title/id (from product catalog) and %NAME% will be replaced by @name (from product api)'
    htag:
      !include:/bobcat/includes/htag-field.yaml
    switchable:
      $type: switchableField
      label: 'Use common Build&Price url with B&P id'
      defaultValue: automatic
      i18n: true
      field:
        $type: radioButtonGroupField
        layout: horizontal
        datasource:
          $type: optionListDatasource
          options:
            - name: manual
              label: No, use manual urls
              value: manual
            - name: automatic
              label: Yes, one common url
              value: automatic
      itemProvider:
        $type: jcrChildNodeProvider
      forms:
        automatic:
          properties:
            automaticUrl:
              label: 'Build&Price portal url'
              description: 'Use placeholder %ID% to replace it with B&P category id. This may be override by setting individual urls per subcategory item.'
              $type: textField
              required: true
        manual:
          properties:
            manualUrl:
              label: Additional info
              $type: hiddenField
    categories:
      label: Categories
      $type: jcrMultiField
      i18n: true
      buttonSelectAddLabel: Add new category
      field:
        label: Category
        name: productCategory
        $type: linkField
        datasource:
          $type: jcrDatasource
          workspace: products
          allowedNodeTypes:
            - dxp:region
            - mgnl:folder
            - dxp:category
  layout:
    $type: tabbedLayout
    tabs: !override
      content:
        label: General
        fields:
          - name: title
          - name: htag
          - name: switchable
          - name: categories
      inheritableSection:
      meta:
light: false