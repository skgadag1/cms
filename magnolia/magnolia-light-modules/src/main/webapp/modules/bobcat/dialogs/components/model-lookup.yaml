!include:/bobcat/includes/inheritable-config.yaml
label: Model Lookup Configuration
form:
  properties:
    title:
      label: Title
      $type: textField
      i18n: true
    htag:
      !include:/bobcat/includes/htag-field.yaml
      defaultValue: h4
    lifecycle:
      $type: switchableField
      label: Lifecycle
      field:
        $type: comboBoxField
        layout: horizontal
        defaultValue: historical
        datasource:
          $type: optionListDatasource
          options:
            - name: historical
              label: Historical
              value: historical
            - name: current
              label: Current
              value: current
      itemProvider:
        $type: jcrChildNodeProvider
    productCategory:
      label: Category
      $type: linkField
      buttonSelectNewLabel: Select...
      chooserId: bobcat:chooser/product-chooser
      required: true
      datasource:
        $type: jcrDatasource
        workspace: products
        allowedNodeTypes:
          - mgnl:folder
          - dxp:category
    productSubcategory:
      label: Default subcategory (optional)
      $type: linkField
      buttonSelectNewLabel: Select...
      chooserId: bobcat:chooser/product-chooser
      datasource:
        $type: jcrDatasource
        workspace: products
        allowedNodeTypes:
          - mgnl:folder
          - dxp:category
          - dxp:subcategory
  layout:
    $type: tabbedLayout
    tabs:
      content:
        label: General
        fields:
          - name: title
          - name: htag
          - name: lifecycle
          - name: productCategory
          - name: productSubcategory
      inheritableSection:
      meta:
light: false
actions: !include:/bobcat/includes/use-dxp-actions.yaml

