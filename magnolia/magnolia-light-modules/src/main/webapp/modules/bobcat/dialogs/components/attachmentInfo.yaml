!include:/bobcat/includes/inheritable-config.yaml
label: Attachment Information Configuration
form:
  properties:
    topTasksToggle:
      $type: checkBoxField
      label: Hide Top Tasks
      buttonLabel: Hide the Top Tasks field from the page
      type: java.lang.Boolean
    howItWorksToggle:
      $type: checkBoxField
      label: Hide How It Works
      buttonLabel: Hide the How It Works field from the page
      type: java.lang.Boolean
    requiredComponentsToggle:
      $type: checkBoxField
      label: Hide Required Components
      buttonLabel: Hide the Required Components field from the page
      type: java.lang.Boolean
    optionsAccessoriesToggle:
      $type: checkBoxField
      label: Options & Accessories
      buttonLabel: Hide the Options & Accessories field from the page
      type: java.lang.Boolean
    htag:
      !include:/bobcat/includes/htag-field.yaml
  layout:
    $type: tabbedLayout
    tabs: !override
      content:
        label: General
        fields:
          - name: htag
          - name: topTasksToggle
          - name: howItWorksToggle
          - name: requiredComponentsToggle
          - name: optionsAccessoriesToggle
      inheritableSection:
      anchor:
      meta:
light: false