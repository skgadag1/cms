!include:/bobcat/includes/inheritable-config.yaml
label: Dealer Inventory Search Configuration
form:
  properties:
    title:
      $type: textField
      label: Title
      i18n: true
    htag:
      !include:/bobcat/includes/htag-field.yaml
    description:
      $type: cloudinaryRichText
      alignment: true
      images: true
      label: Description
      i18n: true
    distanceLabel:
      $type: textField
      label: Distance Label
      i18n: true
      required: true
    zipCodeLabel:
      $type: textField
      label: ZipCode Label
      i18n: true
      required: true
    zipCodePlaceholder:
      $type: textField
      label: ZipCode Placeholder
      i18n: true
      required: true   
    autoDetect:
      $type: textField
      label: ZipCode Auto Detect label
      i18n: true
      required: true
    productTypeLabel:
      $type: textField
      label: Product Type Label
      i18n: true 
      required: true
    productTypePlaceholder:
      $type: textField
      label: Product Type Placeholder
      i18n: true
    productModelLabel:
      $type: textField
      label: Product Model Label
      i18n: true 
      required: true
    productModelPlaceholder:
      $type: textField
      label: Product Model Placeholder
      i18n: true
    searchLabel:
      $type: textField
      label: Search Button Label
      i18n: true
      required: true
    resetLabel:
      $type: textField
      label: Reset Button Label
      i18n: true
      required: true
    min:
      $type: textField
      type: java.lang.Integer
      label: Distance minimum value
      defaultValue: 25
      description: (max - min) must be divisible by interval
      required: true
      converterClass: com.vaadin.data.converter.StringToIntegerConverter
      validators:
        number:
          $type: regexpValidator
          pattern: ^0*[1-9]\d*$
          errorMessage: Enter a valid number - the value must be greater than 0
    max:
      $type: textField
      type: java.lang.Integer
      label: Distance maximum value
      description: (max - min) must be divisible by interval
      defaultValue: 100
      required: true
      converterClass: com.vaadin.data.converter.StringToIntegerConverter
      validators:
        number:
          $type: regexpValidator
          pattern: ^(?:[2-9]|\d\d\d*)$
          errorMessage: Enter a valid number - the value must be greater than 1
    interval:
      $type: textField
      type: java.lang.Integer
      label: Distance interval value
      description: (max - min) must be divisible by interval
      defaultValue: 25
      required: true
      converterClass: com.vaadin.data.converter.StringToIntegerConverter
      validators:
        number:
          $type: regexpValidator
          pattern: ^0*[1-9]\d*$
          errorMessage: Enter a valid number - the value must be greater than 0
    apiKey:
      $type: textField
      label: Google API Key
      required: true
    validationMessage:
      $type: textField
      label: Location Validation Message
      i18n: true
    productTypeValidationMessage:
      $type: textField
      label: Product Type Validation Message
      i18n: true
    modelValidationMessage:
      $type: textField
      label: Model Validation Message
      i18n: true
    noResultsMsg:
      $type: cloudinaryRichText
      alignment: true
      label: No Results Message (Search results)
      i18n: true
    facet:
      !include:/bobcat/dialogs/chooser/facet-chooser.yaml
      required: false
    limit:
      $type: textField
      type: java.lang.Integer
      label: Maximum results (limit parameter)
      description: Parameter sent to backend to limit results. Default 200
      placeholder: '200'
      defaultValue: 200
      converterClass: com.vaadin.data.converter.StringToIntegerConverter
      validators:
        number:
          $type: regexpValidator
          pattern: ^0*[1-9]\d*$
          errorMessage: Enter a valid number - the value must be greater than 0
    showCTA:
      $type: checkBoxField
      label: Show CTA
      defaultValue: false
      buttonLabel: ''
      type: java.lang.Boolean
    ctaLabel:
      label: CTA Label
      $type: textField
      i18n: true
    hideFilters:
      $type: checkBoxField
      label: Hide filters
      defaultValue: false
      buttonLabel: ''
      type: java.lang.Boolean
  layout:
    $type: tabbedLayout
    tabs: !override
      content:
        label: General
        fields:
          - name: title
          - name: htag
          - name: description
          - name: facet
      inputs:
        label: Inputs
        fields:
          - name: distanceLabel
          - name: zipCodeLabel
          - name: zipCodePlaceholder
          - name: autoDetect
          - name: productTypeLabel
          - name: productTypePlaceholder
          - name: productModelLabel
          - name: productModelPlaceholder
          - name: min
          - name: max
          - name: interval
      configuration:
        label: Configuration 
        fields:
          - name: apiKey
          - name: limit
          - name: hideFilters
      notifications:
        label: Notifications 
        fields:
          - name: validationMessage
          - name: productTypeValidationMessage
          - name: modelValidationMessage
          - name: noResultsMsg
      buttons:
        label: Buttons
        fields:
          - name: searchLabel
          - name: resetLabel
          - name: ctaLabel
          - name: showCTA
      inheritableSection:
      anchor:
      meta:
light: false
