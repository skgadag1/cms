!include:/bobcat/includes/inheritable-config.yaml
label: Progressive Form
form:
  properties:
    subtitle:
      $type: cloudinaryRichText
      label: Subtitle (model name + category)
      alignment: false
      images: false
      i18n: true
    title:
      $type: cloudinaryRichText
      label: Title
      alignment: false
      images: false
      i18n: true
    description:
      $type: cloudinaryRichText
      alignment: true
      images: true
      label: Description
      i18n: true
    overrideImage:
      !include:/bobcat/includes/image.yaml
      label: Override image
    submitLabel:
      $type: textField
      label: Submit button label
      i18n: true
      required: true
    formType:
      $type: textField
      label: Form Type (GA4)
      description: Event name for GA4
      i18n: true
    formSelectionsForGA4:
      $type: textField
      label: Form selections
      rows: 3
      description: Provide field names and separate by comma without white spaces
      i18n: true
    configuration:
      $type: linkField
      label: Form configuration
      required: true
      buttonSelectNewLabel: Select configuration
      i18n: true
      datasource:
        $type: jcrDatasource
        workspace: formsConfiguration
        rootPath: /bobcat
        allowedNodeTypes:
          - dxp:region
          - mgnl:folder
          - dxp:formConfiguration
    thankYouPage:
      label: Select "thank you page" or "thank you message"
      $type: switchableField
      field:
        $type: radioButtonGroupField
        layout: horizontal
        defaultValue: message
        datasource:
          $type: optionListDatasource
          options:
            - name: message
              label: Message
              value: message
            - name: page
              label: Page
              value: page
      itemProvider:
        $type: jcrChildNodeProvider
      forms:
        message:
          properties:
            successStateTitle:
              $type: textField
              label: Title
              i18n: true
            successStateSubtitle:
              $type: textField
              label: Subtitle
              i18n: true
            submitAnother:
              $type: textField
              label: After submit button label
              i18n: true
        page:
          properties:
            link:
              $type: switchableField
              field:
                $type: radioButtonGroupField
                layout: horizontal
                datasource:
                  $type: optionListDatasource
                  options:
                    - name: page
                      label: Magnolia page
                      value: page
                    - name: custom
                      label: Custom link URL
                      value: custom
                defaultValue: page
              itemProvider:
                $type: jcrChildNodeProvider
              forms:
                custom:
                  properties:
                    link:
                      label: ''
                      $type: compositeField
                      itemProvider:
                        $type: jcrChildNodeProvider
                      properties:
                        customUrl:
                          label: Custom link URL
                          description: 'Remember to add protocol (http://, https://) for external links'
                          $type: textField
                          required: true
                page:
                  properties:
                    link:
                      label: ''
                      $type: compositeField
                      itemProvider:
                        $type: jcrChildNodeProvider
                      properties:
                        pageUrl:
                          label: Magnolia page link
                          $type: pageLinkField
                          required: true
  layout:
    $type: tabbedLayout
    tabs: !override
      content:
        label: General
        fields:
          - name: subtitle
          - name: title
          - name: description
          - name: overrideImage
          - name: configuration
          - name: submitLabel
      successState:
        label: Success Page or Message
        fields:
          - name: thankYouPage
      ga4:
        label: GA4
        fields:
          - name: formType
          - name: formSelectionsForGA4
      inheritableSection:
      anchor:
      meta:
light: false