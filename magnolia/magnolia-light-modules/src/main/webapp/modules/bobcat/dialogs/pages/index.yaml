!include:/bobcat/includes/common-seo.yaml
label: Page properties
form:
  properties:
    title:
      label: Title
      description: 'Title will be injected in page <head> section'
      $type: textField
      i18n: true
    overrideTitleAffix:
      label: Override title affix
      description: 'Affixes defined in concepts will be ignored'
      $type: checkBoxField
      buttonLabel: Don't use affixes from concepts
      defaultValue: false
      type: java.lang.Boolean
      i18n: false
    facetTitle:
      label: Facet Title
      description: 'Facet Title will be injected in page <head> section'
      $type: textField
      i18n: true
    navigationLabel:
      label: Navigation label
      description: Field will be used in navigation and breadcrumb component
      $type: textField
      i18n: true
    dxpTags:
      !include:/product-catalog/includes/tag-chooser.yaml
    customNodeName:
      label: Page URL
      description: Page's URL address.
      $type: textField
      i18n: true
      validators:
        customNameValidator:
          $type: regexpValidator
          pattern: ^[a-z0-9-]*$
          errorMessage: Only lowercase alphanumeric characters and '-' allowed.
    sortRating:
      label: Sort Rating
      $type: textField
      placeholder: Higher numbers put results on top of the list. Default is 0.
      validators:
        sortValidator:
          $type: regexpValidator
          pattern: ^$|^\d{1,4}$
          errorMessage: 'Enter valid number within range: 0-9999'
    description:
      $type: textField
      label: Description
      rows: 3
      i18n: true
    keywords:
      $type: textField
      label: Keywords
      i18n: true
    excludeFromSearch:
      label: ''
      $type: checkBoxField
      buttonLabel: Do not show page in the site search results
      description: 'USE WITH CAUTION! If selected, page will be excluded from search results.'
      defaultValue: false
      type: java.lang.Boolean
    completelyHidden:
      label: ''
      $type: checkBoxField
      buttonLabel: Do not show page in public
      description: 'USE WITH CAUTION! If selected, page will NOT have any url and will NOT be visible on public instance.'
      defaultValue: false
      type: java.lang.Boolean
    removeFromUrl:
      label: ''
      $type: checkBoxField
      buttonLabel: Remove page node from child urls
      description: 'Will remove page node from child urls, i.e. selected for /equipment will transform child url from /equipment/loaders to /loaders'
      defaultValue: false
      type: java.lang.Boolean
    hideInNav:
      label: ''
      $type: checkBoxField
      buttonLabel: Exclude page from navigation
      defaultValue: false
      type: java.lang.Boolean
    largeMenu:
      label: ''
      $type: checkBoxField
      buttonLabel: Use mega menu style
      defaultValue: false
      type: java.lang.Boolean
    primaryPageImage:
      !include:/bobcat/includes/image.yaml
      label: Primary page image
      properties:
        src:
          label: ''
    pageLink:
      !include:/bobcat/includes/page-link-or-url-field.yaml
      field:
        defaultValue: none
        datasource:
          options:
            - name: none
              label: No link
              value: none
      forms:
        none:
          properties:
            link:
              $type: hiddenField
              type: java.lang.Boolean
              defaultValue: true
        custom:
          properties:
            link:
              properties:
                customLabel:
                  i18n: true
        page:
          properties:
            link:
              properties:
                pageLabel:
                  i18n: true
      label: Link to page
      description: "Category link used when clicking on category name in subnavigation or 'View all'"
    removeFromBreadcrumb:
         label: ''
         $type: checkBoxField
         buttonLabel: Remove page from breadcrumb
         defaultValue: false
         type: java.lang.Boolean
  layout:
    $type: tabbedLayout
    tabs: !override
      general:
        label: General
        fields:
          - name: navigationLabel
          - name: categories
          - name: dxpTags
          - name: customNodeName
      meta:
        label: Meta tags/SEO
        fields: !override
          - name: title
          - name: overrideTitleAffix
          - name: facetTitle
          - name: sortRating
          - name: description
          - name: keywords
          - name: primaryPageImage
          - name: robots
      visibility:
        label: Visibility
        fields:
          - name: excludeFromSearch
          - name: completelyHidden
          - name: removeFromUrl
          - name: hideInNav
          - name: removeFromBreadcrumb
          - name: largeMenu
          - name: pageLink
light: false
actions:
  cancel:
    $type: closeAction
  commit:
    class: com.tbscg.doosan.magnolia.dxp.workflow.action.ui.DxpCommitActionDefinition
