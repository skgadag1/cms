!include:/bobcat/dialogs/pages/index.yaml
label: Page properties (product)
form:
  properties:
    model:
      label: Product model
      $type: linkField
      buttonSelectNewLabel: Select new...
      chooserId: bobcat:chooser/product-chooser
      required: true
      datasource:
        $type: filterableJcrDatasource
        workspace: products
        allowedNodeTypes:
          - mgnl:folder
          - dxp:category
          - dxp:subcategory
          - dxp:product
          - dxp:productGroup
        nodeFilter:
          propertyName: lifecycle
          propertyValue: Current
          propertyDefaultValue: Current
          nodeType: dxp:product

  layout:
    $type: tabbedLayout
    tabs:
      general:
        label: General
        fields:
          - name: model
light: false
