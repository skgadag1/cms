!include:/bobcat/includes/inheritable-config.yaml
label: Notification Bar Configuration
form:
  properties:
    paragraph:
      $type: textField
      label: Paragraph
      description: Component won't be visible if this filed will be empty
      rows: 5
      i18n: true
    link:
      !include:/bobcat/includes/page-link-or-url-field.yaml
      i18n: true
      field:
        datasource:
          options:
            - name: none
              label: No link
              value: none
    icon:
      !include:/bobcat/includes/icons.yaml
      required: false
  layout:
    $type: tabbedLayout
    tabs: !override
      content:
        label: Content
        fields:
          - name: paragraph
          - name: link
          - name: icon
      inheritableSection:
      meta:
light: false