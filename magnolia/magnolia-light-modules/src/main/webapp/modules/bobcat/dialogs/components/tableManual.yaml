          column24:
            !include:/bobcat/includes/table/table-column.yaml
            label: 'Column 24'
          column25:
            !include:/bobcat/includes/table/table-column.yaml
            label: 'Column 25'

  layout:
    $type: tabbedLayout
    tabs: !override
      content:
        label: General
        fields:
          - name: title
          - name: htag
          - name: showHeaders
      table:
        label: Manual table
        fields:
          - name: manualTableHeaders
          - name: manualTable
      inheritableSection:
      anchor:
      meta:
wide: true
width: wide
light: false
