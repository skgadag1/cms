!include:/bobcat/includes/inheritable-config.yaml
label: Product Navigation Configuration
form:
  properties:
    title:
      $type: textField
      label: Title
      i18n: true
    tabs:
      label: Tabs
      $type: jcrMultiField
      addButtonLabel: productnav.tabs.add
      field:
        label: Product Navigation Tab
        name: compositeField
        $type: compositeField
        properties:
          title:
            $type: textField
            label: Tab label
            i18n: true
          items:
            label: Navigation items
            $type: jcrMultiField
            addButtonLabel: productnav.tabs.items.add
            field:
              label: Tile
              name: compositeField
              $type: compositeField
              properties:
                link:
                  !include:/bobcat/includes/page-link-or-url-field.yaml
                  defaultValue: custom
                  label: Link
                  required: true
                htag:
                  !include:/bobcat/includes/htag-field.yaml
                asset:
                  label: Option selection
                  $type: switchableField
                  field:
                    $type: radioButtonGroupField
                    layout: horizontal
                    defaultValue: icon
                    datasource:
                      $type: optionListDatasource
                      options:
                        - name: icon
                          label: Icon
                          value: icon
                        - name: img
                          label: Image
                          value: img
                  itemProvider:
                    $type: jcrChildNodeProvider
                  forms:
                    icon:
                      properties:
                        icon:
                          !include:/bobcat/includes/icons.yaml
                    img:
                      properties:
                        src:
                          !include:/bobcat/includes/dam-image.yaml
                          label: Select image
                          required: true
                        alt:
                          $type: textField
                          label: Image alt
                        title:
                          $type: textField
                          label: Image title
    items: #old items to keep backward compatibility
      label: Product Navigation
      $type: jcrMultiField
      i18n: false
      field:
        label: Product Navigation
        name: compositeField
        $type: compositeField
        properties:
          link:
            !include:/bobcat/includes/page-link-or-url-field.yaml
            defaultValue: custom
            label: Link
            required: true
            i18n: true
          htag:
            !include:/bobcat/includes/htag-field.yaml
            i18n: false
          asset:
            label: Option selection
            $type: switchableField
            i18n: false
            field:
              $type: radioButtonGroupField
              layout: horizontal
              defaultValue: icon
              datasource:
                $type: optionListDatasource
                options:
                  - name: icon
                    label: Icon
                    value: icon
                  - name: img
                    label: Image
                    value: img
            itemProvider:
              $type: jcrChildNodeProvider
            forms:
              icon:
                properties:
                  icon:
                    !include:/bobcat/includes/icons.yaml
              img:
                properties:
                  src:
                    !include:/bobcat/includes/dam-image.yaml
                    label: Select image
                    required: true
                  alt:
                    $type: textField
                    label: Image alt
                    i18n: true
                  title:
                    $type: textField
                    label: Image title
                    i18n: true
    variant:
      !include:/bobcat/includes/variants/product-navigation-variants.yaml
  layout:
    $type: tabbedLayout
    tabs: !override
      content:
        label: General
        fields:
          - name: title
          - name: htag
      items:
        label: Navigation items (single)
        fields:
          - name: items
      multiple:
        label: Navigation tabs (multiple)
        fields:
          - name: tabs
      lookandfeel:
        label: Look & Feel
        fields:
          - name: variant
      inheritableSection:
      anchor:
      meta:
light: false
