!include:/bobcat/includes/inheritable-config.yaml
label: Section Text Configuration
form:
  properties:
    sections:
      label: Sections
      description: Please define at least one section
      $type: jcrMultiField
      i18n: true
      minItems: 1
      itemCountErrorMessage: "You have to define at least one section"
      buttonSelectAddLabel: Add new regionalized section
      field:
        label: Section
        name: compositeField
        $type: compositeField
        properties:
          !include:/bobcat/includes/section-text-props.yaml
          region:
            label: Region
            description: Define region in which section will be displayed (only first match for region will be displayed)
            $type: comboBoxField
            required: true
            datasource:
              $type: jcrDatasource
              describeByProperty: title
              workspace: regions
              rootPath: /bobcat
              allowedNodeTypes:
                - dxp:region
          links:
            label: Links (max 3 items)
            description: Please define 0 - 3 links.
            $type: jcrMultiField
            i18n: true
            minItems: 0
            maxItems: 3
            itemCountErrorMessage: "Links's number should be between 0-3"
            field:
              label: Links
              name: compositeField
              $type: compositeField
              properties:
                link:
                  !include:/bobcat/includes/page-link-or-url-field.yaml
                  label: Link
                  required: true
                  defaultValue: none
                  i18n: true
                  field:
                    datasource:
                      options:
                        - name: none
                          label: None
                          value: none
                icon:
                  !include:/bobcat/includes/icons.yaml
                  required: false
  layout:
    $type: tabbedLayout
    tabs: !override
      content:
        label: General
        fields:
          - name: sections
      inheritableSection:
      anchor:
      meta:
light: false
wide: true
