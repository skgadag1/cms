!include:/bobcat/includes/inheritable-config.yaml
label: Features Configuration
form:
  properties:
    title:
      label: Title
      $type: textField
      i18n: true
      description: 'If used: %TITLE% and %ID% tags will be replaced by model title/id (from product catalog) and %NAME% will be replaced by @name (from product api)'
      readOnly: true
    htag:
      !include:/bobcat/includes/htag-field.yaml
      readOnly: true
    evolutionTitle:
      label: Rich Text Title
      $type: cloudinaryRichText
      i18n: true
      alignment: true
      description: 'If used: %TITLE% and %ID% tags will be replaced by model title/id (from product catalog) and %NAME% will be replaced by @name (from product api)'
    expandLabel:
      label: Expand button label
      $type: textField
      i18n: true
    collapseLabel:
      label: Collapse button label
      $type: textField
      i18n: true
    primaryAccordionHtag:
      !include:/bobcat/includes/htag-field.yaml
      label: Primary Accordion Tag
      defaultValue: 'h3'
    secondaryAccordionHtag:
      !include:/bobcat/includes/htag-field.yaml
      label: Secondary Accordion Tag
      defaultValue: 'h4'
    variant:
      !include:/bobcat/includes/variants/evolution-accordion-color-variants.yaml
    animationEnabled:
      $type: checkBoxField
      label: Animate cards
      buttonLabel: ''
      type: java.lang.Boolean
      defaultValue: false
  layout:
    $type: tabbedLayout
    tabs: !override
      content:
        label: General
        fields:
          - name: title
          - name: htag
          - name: evolutionTitle
          - name: expandLabel
          - name: collapseLabel
      lookandfeel:
        label: Look & Feel
        fields:
          - name: variant
          - name: animationEnabled
      tagStructure:
        label: Tag structure
        fields:
          - name: primaryAccordionHtag
          - name: secondaryAccordionHtag
      inheritableSection:
      anchor:
      meta:
light: false