!include:/bobcat/includes/inheritable-config.yaml
label: Back to top button Configuration
form:
  properties:
    label:
      $type: textField
      label: Button label
      required: true
      i18n: true
    icon:
      !include:/bobcat/includes/icons.yaml
      required: false
    type:
      !include:/bobcat/includes/back-to-top-types.yaml
      required: true
  layout:
    $type: tabbedLayout
    tabs: !override
      content:
        label: General
        fields:
          - name: label
          - name: icon
          - name: type
      inheritableSection:
      meta:
light: false
