<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Evolution table</title>
    <link rel="stylesheet" href="./dist/evolution-table.css" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: auto;
        background: #fff;
      }
    </style>
  </head>
  <body>
    <mgnl-evolution-table id="mgnl-evolution-table-field"></mgnl-evolution-table>
    <script src="./dist/evolution-table.js"></script>
    <script>
      (function () {
        var correlationId = null;
        var el = document.getElementById("mgnl-evolution-table-field");

        function postValue(json) {
          if (!correlationId) return;
          parent.window.postMessage(
            {
              action: "changeValue",
              correlationId: correlationId,
              value: json,
            },
            "*",
          );
        }

        function postHeight(px) {
          if (!correlationId) return;
          var n = Math.round(px);
          if (n < 80) n = 80;
          parent.window.postMessage(
            {
              action: "changeHeight",
              correlationId: correlationId,
              value: n,
            },
            "*",
          );
        }

        el.addEventListener("change", function (e) {
          var d = e.detail && e.detail[0];
          if (typeof d === "string") postValue(d);
        });

        window.addEventListener(
          "message",
          function (event) {
            var data = event.data;
            if (!data || data.action !== "init") return;
            correlationId = data.correlationId;
            var state = data.state || {};
            var raw =
              state.value != null && state.value !== ""
                ? state.value
                : state.defaultValue;
            if (raw == null || raw === "") {
              el.setAttribute("value", "");
              return;
            }
            el.setAttribute(
              "value",
              typeof raw === "string" ? raw : JSON.stringify(raw),
            );
          },
          false,
        );

        if (typeof ResizeObserver !== "undefined") {
          var ro = new ResizeObserver(function (entries) {
            for (var i = 0; i < entries.length; i++) {
              postHeight(entries[i].contentRect.height + 24);
            }
          });
          ro.observe(document.body);
        }
      })();
    </script>
  </body>
</html>
