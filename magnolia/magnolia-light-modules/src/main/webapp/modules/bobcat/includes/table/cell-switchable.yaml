label: Column value
$type: switchableField
layout:
  $type: horizontal
field:
  $type: comboBoxField
  defaultValue: txt
  datasource:
    $type: optionListDatasource
    options:
      - name: Text
        label: Text
        value: txt
      - name: Assets
        label: Assets
        value: assets
      - name: Urls
        label: Urls
        value: urls
forms:
  txt:
    properties:
      field:
        label: ''
        $type: compositeField
        layout:
          $type: horizontal
        itemProvider:
          $type: currentItemProvider
        properties:
          key:
            label: Property name
            i18n: true
            $type: textField
            description: Please enter this carefully. Values will match in table with other columns by this key.
          txt:
            label: Property value
            i18n: true
            $type: textField
  assets:
    properties:
      field:
        label: ''
        $type: compositeField
        layout:
          $type: horizontal
        itemProvider:
          $type: currentItemProvider
        properties:
          key:
            label: Property name
            i18n: true
            $type: textField
            description: Please enter this carefully. Values will match in table with other columns by this key.
          assets:
            !include:/bobcat/includes/dam-pdf.yaml
            i18n: true
            label: Cloudinary file
          linkLabel:
            label: Link label
            i18n: true
            $type: textField
  urls:
    properties:
      field:
        label: ''
        $type: compositeField
        layout:
          $type: horizontal
        itemProvider:
          $type: currentItemProvider
        properties:
          key:
            label: Property name
            i18n: true
            $type: textField
            description: Please enter this carefully. Values will match in table with other columns by this key.
          urls:
            !include:/bobcat/includes/page-link-or-url-field.yaml
            forms:
              custom:
                properties:
                  link:
                    properties:
                      customUrl:
                        i18n: true
                      customLabel:
                        i18n: true
              page:
                properties:
                  link:
                    properties:
                      pageUrl:
                        i18n: true
                      pageLabel:
                        i18n: true
            label: Urls