label: Accordions
$type: jcrMultiField
i18n: false
field:
  $type: compositeField
  label: Accordion
  properties:
    title:
      label: Title
      $type: textField
      required: true
      i18n: true
    icon:
      !include:/bobcat/includes/icons.yaml
      required: false
      i18n: false
    description:
      label: Description
      $type: cloudinaryRichText
      alignment: true
      rows: 5
      i18n: true
    assets:
      !include:/bobcat/includes/image-or-video-or-youtube.yaml
      label: Assets
    link:
      !include:/bobcat/includes/button-style-chooser.yaml
      i18n: true
    chips:
      label: Chips
      $type: jcrMultiField
      i18n: false
      buttonSelectAddLabel: Add chip
      field:
        $type: compositeField
        label: Single chip
        idPropertyName: name
        properties:
          title:
            label: Pill title
            $type: textField
            i18n: true
    brochure:
      !include:/product-catalog/includes/brochure.yaml
    colors:
      !include:/bobcat/includes/colors.yaml
      i18n: false