!include:/bobcat/includes/forms/shared/form-field.yaml
label: Input
properties:
  label:
    label: Input label text
    i18n: true
  name:
    label: Input name
    i18n: true
    required: true
  icon:
    !include:/bobcat/includes/icons.yaml
    required: false
  validation:
    !include:/bobcat/includes/input-validators.yaml
  placeholder:
    $type: textField
    label: Placeholder
    i18n: true
  validationMessage:
    $type: textField
    label: Validation message
    i18n: true
  minLength:
    $type: textField
    type: java.lang.Long
    label: Min length
    description: Use 0 to not validate the length of the input   
    converterClass: com.vaadin.data.converter.StringToLongConverter
    defaultValue: 0
    validators:
      numberValidator:
        $type: regexpValidator
        pattern: ^[0-9]+$
        errorMessage: Enter a valid number
  maxLength:
    $type: textField
    type: java.lang.Long
    label: Max length
    description: Use 0 to not validate the length of the input
    converterClass: com.vaadin.data.converter.StringToLongConverter
    defaultValue: 100
    validators:
      numberValidator:
        $type: regexpValidator
        pattern: ^[0-9]+$
        errorMessage: Enter a valid number