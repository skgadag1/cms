form:
  properties:
    inheritable:
      $type: checkBoxField
      label: Inherit
      buttonLabel: Show on subpages
      defaultValue: false
      type: java.lang.Boolean
    onTheEnd:
      $type: checkBoxField
      label: Position
      buttonLabel: Inherit after page's own components
      description: By default inherited components are added at the beginning, before page's own components. This option moves them to the end.
      type: java.lang.Boolean
    preloaded:
      $type: checkBoxField
      label: SSR preload
      buttonLabel: Always preload component on server
      type: java.lang.Boolean
      defaultValue: false
    anchorID:
      label: ID for anchor links
      $type: textField
    noIndex:
      $type: checkBoxField
      label: Exclude from indexing
      buttonLabel: Exclude component's content from indexing for search
      type: java.lang.Boolean
      defaultValue: false
      description: |
        If checked, this component's content will not be indexed by the page indexer. This is useful for components that contain content that is not relevant for search, or the ones that have the same contents on each page.
  layout:
    $type: tabbedLayout
    tabs:
      inheritableSection:
        label: Inheritance
        fields:
          - name: inheritable
          - name: onTheEnd
      meta:
        label: SEO
        fields:
          - name: preloaded
          - name: noIndex
      anchor:
        label: Anchor link ID
        fields:
          - name: anchorID
actions: !include:/bobcat/includes/use-dxp-actions.yaml