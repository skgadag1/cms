$type: switchableField
label: Background Color Variant
required: true
field:
  $type: comboBoxField
  layout: horizontal
  defaultValue: BLACK_GRADIENT
  datasource:
    $type: optionListDatasource
    options:
      - name: WHITE
        label: White
        value: WHITE
      - name: LIGHT_GRAY
        label: Light gray
        value: LIGHT_GRAY
      - name: DARK_GRAY
        label: Dark gray
        value: DARK_GRAY
      - name: DARK_GRAY_GRADIENT
        label: Dark gray with gradient (hyperspace)
        value: DARK_GRAY_GRADIENT
      - name: BLACK
        label: Black
        value: BLACK
        selected: true
      - name: BLACK_GRADIENT
        label: Black with gradient (hyperspace)
        value: BLACK_GRADIENT
        selected: true
itemProvider:
  $type: jcrChildNodeProvider
