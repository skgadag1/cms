label: Colors
$type: switchableField
i18n: true
field:
  $type: radioButtonGroupField
  layout: horizontal
  i18n: true
  defaultValue: white
  datasource:
    $type: optionListDatasource
    options:
      - name: black
        label: Black
        value: black
      - name: dark
        label: Dark
        value: dark
      - name: white
        label: White
        value: white
itemProvider:
  $type: jcrChildNodeProvider