$type: compositeField
layout:
  $type: form
label: Dynamic Dropdown (primary)
itemProvider:
  $type: jcrChildNodeProvider
properties:
  label:
    $type: textField
    label: Primary dropdown label
    i18n: true
    required: true
  placeholder:
    $type: textField
    label: Primary dropdown placeholder
    i18n: true
  name:
    $type: textField
    label: Primary dropdown name
    description: Name needs to be unique
    i18n: true
    required: true
  id:
    $type: textField
    label: Primary mapping field ID
    description: Primary mapping field ID from 3rd party application/system, e.g. Salesforce, MailChimp.
  childLabel:
    $type: textField
    label: Dependent dropdown label
    i18n: true
    required: true
  childPlaceholder:
    $type: textField
    label: Dependent dropdown placeholder
    i18n: true
  childId:
    $type: textField
    label: Dependent dropdown mapping field ID
    description: Dependent dropdown mapping field ID from 3rd party application/system, e.g. Salesforce, MailChimp.
  childName:
    $type: textField
    label: Dependent dropdown name
    description: Name needs to be unique
    i18n: true
    required: true
  bold:
    $type: checkBoxField
    label: Label bolded
    buttonLabel: Active
    defaultValue: false
    type: java.lang.Boolean
  required:
    $type: checkBoxField
    label: Is required
    buttonLabel: Required
    defaultValue: false
    type: java.lang.Boolean
  width:
    !include:/bobcat/includes/forms/shared/width-option.yaml
  dropdownValues:
    label: Dropdown values
    description: Every value has it's own related form field
    $type: jcrMultiField
    i18n: true
    required: true
    buttonSelectAddLabel: Add new value
    itemProvider:
      $type: jcrChildNodeProvider
    field:
      label: Dropdown value and related field
      name: compositeField
      $type: compositeField
      properties:
        text:
          $type: textField
          label: Option text
          i18n: true
          required: true
        value:
          $type: textField
          label: Mapping field ID
          description: The ID should be unique, otherwise, the component will not work.
          required: true
        selected:
          $type: checkBoxField
          label: Is selected
          buttonLabel: Selected
          description: Only one value can be selected
          defaultValue: false
          type: java.lang.Boolean
        component:
          !include:/forms-configuration/includes/forms/configuration-element-selector.yaml
          label: Form element when selected