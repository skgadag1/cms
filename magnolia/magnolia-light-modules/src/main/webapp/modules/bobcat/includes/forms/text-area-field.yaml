!include:/bobcat/includes/forms/shared/form-field.yaml
label: Text area
properties:
  label:
    label: Text area label text
  name:
    label: Text area name
  placeholder:
    $type: textField
    label: Placeholder
    i18n: true
  frontValidationRegex:
    $type: textField
    label: Front validation regex
    i18n: true
  validationMessage:
    $type: textField
    label: Validation message
    i18n: true
  icon:
    !include:/bobcat/includes/icons.yaml
    required: false
  minLength:
    $type: textField
    type: java.lang.Long
    label: Min length
    description: Use 0 to not validate the length of the input
    converterClass: com.vaadin.data.converter.StringToLongConverter
    defaultValue: 0
    validators:
      numberValidator:
        $type: regexpValidator
        pattern: ^[0-9]+$
        errorMessage: Enter a valid number
  maxLength:
    $type: textField
    type: java.lang.Long
    label: Max length
    description: Use 0 to not validate the length of the input
    converterClass: com.vaadin.data.converter.StringToLongConverter
    defaultValue: 300
    validators:
      numberValidator:
        $type: regexpValidator
        pattern: ^[0-9]+$
        errorMessage: Enter a valid number
  rows:
    $type: textField
    type: java.lang.Long
    label: Default rows
    converterClass: com.vaadin.data.converter.StringToLongConverter
    defaultValue: 3
    validators:
      numberValidator:
        $type: regexpValidator
        pattern: ^[0-9]+$
        errorMessage: Enter a valid number