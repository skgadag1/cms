$type: compositeField
layout:
  $type: form
label: Product Interest Selector
itemProvider:
  $type: jcrChildNodeProvider
properties:
  label:
    $type: textField
    label: Field label
    i18n: true
  name:
    $type: textField
    label: Field name
    description: Name needs to be unique
    i18n: true
    required: true
  id:
    $type: textField
    label: Mapping field ID
    description: Mapping field ID from 3rd party application/system, e.g. Salesforce, MailChimp.
  required:
    $type: checkBoxField
    label: Is required
    buttonLabel: Required
    defaultValue: false
    type: java.lang.Boolean
  bold:
    $type: checkBoxField
    label: Label bolded
    buttonLabel: active
    defaultValue: false
    type: java.lang.Boolean
  placeholder:
    $type: textField
    label: Placeholder
    i18n: true
    defaultValue: 'Search for products or categories...'
  noResultsMessage:
    $type: textField
    label: No results message
    i18n: true
    defaultValue: 'No products found matching your search'
  limitMessage:
    $type: textField
    label: Limit message
    i18n: true
    defaultValue: 'You can select up to %LIMIT% products'
    description: 'Use %LIMIT% placeholder to show the limit number'
  limit:
    $type: textField
    type: java.lang.Long
    label: Product selection limit
    description: Maximum number of products that can be selected
    converterClass: com.vaadin.data.converter.StringToLongConverter
    defaultValue: 5
    validators:
      numberValidator:
        $type: regexpValidator
        pattern: ^[0-9]+$
        errorMessage: Enter a valid number
  useMapping:
    $type: checkBoxField
    label: Use mapping
    buttonLabel: Use mapping
    defaultValue: false
    type: java.lang.Boolean
  width:
    !include:/bobcat/includes/forms/shared/width-option.yaml
  excludedCategories:
    $type: jcrMultiField
    label: Excluded Categories
    description: Select categories to exclude from the product selector
    buttonSelectAddLabel: Add excluded category
    itemProvider:
      $type: jcrChildNodeProvider
    field:
      $type: linkField
      label: Category
      name: excludedCategory
      chooserId: bobcat:chooser/product-chooser
      scrollToSelectedItem: true
      datasource:
        $type: jcrDatasource
        workspace: products
        rootPath: /bobcat
        allowedNodeTypes:
          - mgnl:folder
          - dxp:category
        describeByProperty: title
  excludedSubcategories:
    $type: jcrMultiField
    label: Excluded Subcategories
    description: Select subcategories to exclude from the product selector
    buttonSelectAddLabel: Add excluded subcategory
    itemProvider:
      $type: jcrChildNodeProvider
    field:
      $type: linkField
      label: Subcategory
      name: excludedSubcategory
      chooserId: bobcat:chooser/product-chooser
      scrollToSelectedItem: true
      datasource:
        $type: jcrDatasource
        workspace: products
        rootPath: /bobcat
        allowedNodeTypes:
          - mgnl:folder
          - dxp:category
          - dxp:subcategory
        describeByProperty: title
