$type: compositeField
layout:
  $type: form
label: Related fields
itemProvider:
  $type: jcrChildNodeProvider
properties:
  checkboxLabel:
    $type: textField
    label: Field label
    i18n: true
    required: true
  name:
    $type: textField
    label: Field name
    description: Name needs to be unique
    i18n: true
    required: true
  id:
    $type: textField
    label: Mapping field ID
    description: Mapping field ID from 3rd party application/system, e.g. Salesforce, MailChimp.
  bold:
    $type: checkBoxField
    label: Label bolded
    buttonLabel: active
    defaultValue: false
    type: java.lang.Boolean
  width:
    !include:/bobcat/includes/forms/shared/width-option.yaml
  inputs:
    $type: jcrMultiField
    required: true
    label: Related inputs
    itemProvider:
      $type: jcrChildNodeProvider
    buttonSelectAddLabel: Add input
    field:
      !include:/bobcat/includes/forms/input-field.yaml