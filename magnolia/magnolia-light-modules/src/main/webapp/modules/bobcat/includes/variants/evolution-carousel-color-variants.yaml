$type: switchableField
label: Color Variant
required: true
field:
  $type: comboBoxField
  layout: horizontal
  defaultValue: evolutionWhite
  datasource:
    $type: optionListDatasource
    options:
      - name: evolutionWhite
        label: White
        selected: true
        value: evolutionWhite
      - name: light
        label: Gray Light
        value: light
      - name: black
        label: Black
        value: black
itemProvider:
  $type: jcrChildNodeProvider
forms:
  - name: evolutionWhite
    properties:
      tiles:
        $type: comboBoxField
        datasource:
          $type: optionListDatasource
          options:
            - name: evolutionLight
              label: Gray Light
              selected: true
              value: evolutionLight
            - name: black
              label: Black
              value: black
        defaultValue: evolutionLight
        required: true
        label: Card color
  - name: light
    properties:
      tiles:
        $type: comboBoxField
        datasource:
          $type: optionListDatasource
          options:
            - name: evolutionWhite
              label: White
              selected: true
              value: evolutionWhite
            - name: evolutionBlack
              label: Black
              value: evolutionBlack
        defaultValue: evolutionWhite
        required: true
        label: Card color
  - name: black
    properties:
      tiles:
        $type: comboBoxField
        datasource:
          $type: optionListDatasource
          options:
            - name: evolutionWhite
              label: White
              selected: true
              value: evolutionWhite
            - name: evolutionDark
              label: Gray Dark
              value: evolutionDark
        defaultValue: evolutionWhite
        required: true
        label: Card color
