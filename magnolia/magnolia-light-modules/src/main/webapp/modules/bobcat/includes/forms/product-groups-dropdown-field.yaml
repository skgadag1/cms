$type: compositeField
layout:
  $type: form
label: Product Groups Dropdown
itemProvider:
  $type: jcrChildNodeProvider
properties:
  label:
    $type: textField
    label: Field label
    i18n: true
  name:
    $type: textField
    label: Field Name
    required: true
  fieldValue:
    $type: textField
    label: Field Value or Mapping field ID (values separated by semicolons)
    required: true
  noResultsMessage:
    label: No results message
    $type: textField
    required: true
    i18n: true
  limit:
    $type: textField
    type: java.lang.Integer
    label: Limit
    description: Maximum number of products the user can select
    defaultValue: 5
    required: true
    converterClass: com.vaadin.data.converter.StringToIntegerConverter
    validators:
      number:
        $type: regexpValidator
        pattern: ^(?:[2-9]|\d\d\d*)$
        errorMessage: Enter a valid number - the value must be greater than 1
  limitMessage:
    label: Limit message
    description: 'Put %LIMIT% to replace variable with a limit value'
    $type: textField
    defaultValue: 'You can choose up to %LIMIT% items.'
    i18n: true
  placeholder:
    label: Placeholder
    $type: textField
    i18n: true
  required:
    $type: checkBoxField
    label: Is required
    buttonLabel: Required
    defaultValue: false
    type: java.lang.Boolean
  bold:
    $type: checkBoxField
    label: Label bolded
    buttonLabel: active
    defaultValue: false
    type: java.lang.Boolean
  groups:
    label: Categories
    $type: jcrMultiField
    i18n: true
    required: true
    buttonSelectAddLabel: Add a category
    itemProvider:
      $type: jcrChildNodeProvider
    field:
      label: ''
      name: compositeField
      $type: compositeField
      properties:
        label: 
          $type: textField
          label: Category label
          required: true
        products:
          label: Subcategories
          $type: jcrMultiField
          required: true
          buttonSelectAddLabel: Add a subcategory
          itemProvider:
            $type: jcrChildNodeProvider
          field:
            label: ''
            name: compositeField
            $type: compositeField
            properties:
              label:
                $type: textField
                label: Subcategory label
                required: true
              value:
                $type: textField
                label: Value or Mapping field ID
                description: Mapping field ID from 3rd party application/system, e.g. Salesforce, MailChimp.
                required: true
              selected:
                $type: checkBoxField
                label: Is selected
                buttonLabel: Selected
                defaultValue: false
                type: java.lang.Boolean