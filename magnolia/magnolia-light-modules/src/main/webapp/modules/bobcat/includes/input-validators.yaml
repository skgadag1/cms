$type: comboBoxField
datasource:
  $type: optionListDatasource
  options:
    - name: none
      label: None
      value: none
    - name: number
      label: Number only
      value: '^[0-9]*$'
    - name: email
      label: Email
      value: '^(([^<>()\[\]\\.,;:\s@"]+(\.[^<>()\[\]\\.,;:\s@"]+)*)|(".+"))@((\[[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}])|(([a-zA-Z\-0-9]+\.)+[a-zA-Z]{2,}))$'
    - name: name
      label: First Name or Surname
      value: '^\w[^0-9]+$'
    - name: unitedStatesZipCode
      label: Zip/Postal Code (United States)
      value: '^\d{5}(?:[-\s]\d{4})?$'
    - name: canadianPostalCode
      label: Zip/Postal Code (Canada)
      value: '^[ABCEGHJKLMNPRSTVXY][0-9][ABCEGHJKLMNPRSTVWXYZ] ?[0-9][ABCEGHJKLMNPRSTVWXYZ][0-9]$'
    - name: usAndCanadianPostalCode
      label: Zip/Postal Code (United States & Canada)
      value: '((^|, )(^[ABCEGHJ-NPRSTVXY]\d[ABCEGHJ-NPRSTV-Z][ -]?\d[ABCEGHJ-NPRSTV-Z]\d$|(^\d{5}$)|(^\d{9}$)|(^\d{5}-\d{4}$)))+$'
    - name: street
      label: Street
      value: '.([a-z ]{2,}\s{0,1})(\d{0,3})(\s{0,1}\S{2,})?'
    - name: country
      label: Country
      value: '^\w[^0-9,]+$'
    - name: states
      label: States (US)
      value: '^(Alabama)|(Alaska)|(Arizona)|(Arkansas)|(California)|(Colorado)|(Connecticut)|(Delaware)|(Florida)|(Georgia)|(Hawaii)|(Idaho)|(Illinois)|(Indiana)|(Iowa)|(Kansas)|(Kentucky)|(Louisiana)|(Maine)|(Maryland)|(Massachusetts)|(Michigan)|(Minnesota)|(Mississippi)|(Missouri)|(Montana)|(Nebraska)|(Nevada)|(New\sHampshire)|(New\sJersey)|(New\sMexico)|(New\sYork)|(North\sCarolina)|(North\sDakota)|(Ohio)|(Oklahoma)|(Oregon)|(Pennsylvania)|(Rhode\sIsland)|(South\sCarolina)|(South\sDakota)|(Tennessee)|(Texas)|(Utah)|(Vermont)|(Virginia)|(Washington)|(West\sVirginia)|(Wisconsin)|(Wyoming)[^0-9]+$'
    - name: phoneWithPlusPrefix
      label: Phone with prefix (no spaces)
      value: '^[\+]?[(]?[0-9]{3}[)]?[-\s\.]?[0-9]{3}[-\s\.]?[0-9]{4,6}$'
    - name: phone
      label: Phone (generic)
      value: '^(?:\+?[0-9]{1,3}[ \.-]?)?(?:\(?[0-9]{1,4}\)?[ \.-]?)(?:[0-9]{1,4}[ \.-]?){1,2}[0-9]{3,4}$'
    - name: phoneUSPattern
      label: Phone for the US pattern
      value: '^[\+][0-9]{2} [(][0-9]{3}[)] [0-9]{3}[-][0-9]{4}$'
    - name: city
      label: City
      value: "^[a-zA-Z\u0080-\u024F]+(?:. |-| |')*([1-9a-zA-Z\u0080-\u024F]+(?:. |-| |'))*[a-zA-Z\u0080-\u024F]*$"
label: Input validation
defaultValue: none
