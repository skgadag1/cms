$type: compositeField
label: Radio button
layout:
  $type: form
itemProvider:
  $type: jcrChildNodeProvider
properties:
  label:
    $type: textField
    label: Radio button label text
    i18n: true
  name:
    $type: textField
    label: Radio button name
    description: Name needs to be unique
    required: true
    i18n: true
  id:
    $type: textField
    label: Form field ID
    description: If ID will match with mapping id from FormApp this will be replaced by appropriate value
  bold:
    $type: checkBoxField
    label: Label bolded
    buttonLabel: active
    defaultValue: false
    type: java.lang.Boolean
  width:
    !include:/bobcat/includes/forms/shared/width-option.yaml
  options:
    $type: jcrMultiField
    required: true
    label: Options
    itemProvider:
      $type: jcrChildNodeProvider
    buttonSelectAddLabel: Add option
    field:
      !include:/bobcat/includes/forms/shared/list-option.yaml