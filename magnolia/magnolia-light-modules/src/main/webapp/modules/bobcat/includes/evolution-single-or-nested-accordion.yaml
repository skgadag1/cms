label: Root Accordions
$type: jcrMultiField
i18n: false
min: 1
max: 10
field:
  $type: compositeField
  label: Accordion
  properties:
    title:
      label: Title
      $type: textField
      required: true
      i18n: true
    icon:
      !include:/bobcat/includes/icons.yaml
      required: false
      i18n: false
    details:
      label: ''
      $type: switchableField
      i18n: false
      field:
        $type: radioButtonGroupField
        layout: horizontal
        datasource:
          $type: optionListDatasource
          options:
            - name: single
              label: Single Accordion
              value: single
            - name: nested
              label: Nested Accordion
              value: nested
      itemProvider:
        $type: jcrChildNodeProvider
      forms:
        single:
          properties:
            isExpanded:
              $type: checkBoxField
              label: Options
              buttonLabel: Expand the accordion on init
              type: java.lang.Boolean
            description:
              label: Description
              $type: cloudinaryRichText
              alignment: true
              rows: 5
              i18n: true
            assets:
              !include:/bobcat/includes/image-or-video-or-youtube.yaml
              label: Assets
            link:
              !include:/bobcat/includes/button-style-chooser.yaml
              i18n: true
            chips:
              label: Chips
              $type: jcrMultiField
              i18n: false
              buttonSelectAddLabel: Add chip
              field:
                $type: compositeField
                label: Single chip
                idPropertyName: name
                properties:
                  title:
                    label: Pill title
                    $type: textField
                    i18n: true
            brochure:
              !include:/product-catalog/includes/brochure.yaml
        nested:
          properties:
            nested:
              !include:/bobcat/includes/evolution-accordion.yaml
              label: Children Accordions
