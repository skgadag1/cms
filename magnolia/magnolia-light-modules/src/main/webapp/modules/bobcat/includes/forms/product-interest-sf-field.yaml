$type: compositeField
layout:
  $type: form
label: Product Interest from SF
itemProvider:
  $type: jcrChildNodeProvider
properties:
  label:
    $type: textField
    label: Field label
    i18n: true
  name:
    $type: textField
    label: Field name
    description: Name needs to be unique
    i18n: true
    required: true
  id:
    $type: textField
    label: Mapping field ID
    description: Mapping field ID from 3rd party application/system, e.g. Salesforce, MailChimp.
  required:
    $type: checkBoxField
    label: Is required
    buttonLabel: Required
    defaultValue: false
    type: java.lang.Boolean
  bold:
    $type: checkBoxField
    label: Label bolded
    buttonLabel: active
    defaultValue: false
    type: java.lang.Boolean
  placeholder:
    $type: textField
    label: Placeholder
    i18n: true
    defaultValue: 'Search for products or categories...'
  noResultsMessage:
    $type: textField
    label: No results message
    i18n: true
    defaultValue: 'No products found matching your search'
  limitMessage:
    $type: textField
    label: Limit message
    i18n: true
    defaultValue: 'You can select up to %LIMIT% products'
    description: 'Use %LIMIT% placeholder to show the limit number'
  limit:
    $type: textField
    type: java.lang.Long
    label: Product selection limit
    description: Maximum number of products that can be selected
    converterClass: com.vaadin.data.converter.StringToLongConverter
    defaultValue: 5
    validators:
      numberValidator:
        $type: regexpValidator
        pattern: ^[0-9]+$
        errorMessage: Enter a valid number
  useMapping:
    $type: checkBoxField
    label: Use mapping
    buttonLabel: Use mapping
    defaultValue: false
    type: java.lang.Boolean
  width:
    !include:/bobcat/includes/forms/shared/width-option.yaml
  excludedSubcategories:
    $type: twinColSelectField
    label: Excluded Subcategories
    description: Select subcategories to exclude
    leftColumnCaption: Available
    rightColumnCaption: Excluded
    datasource:
      class: com.tbscg.doosan.magnolia.forms.configuration.field.datasource.ContractCodesOptionListDefinition
