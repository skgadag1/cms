!include:/bobcat/includes/forms/shared/form-field.yaml
label: Address Autocomplete
properties:
  name:
    $type: textField
    label: Address name
    description: Name needs to be unique
    i18n: true
    required: true
  id:
    $type: textField
    label: Mapping field ID for address
    description: Mapping field ID from 3rd party application/system, e.g. Salesforce, MailChimp.
  bold:
    $type: checkBoxField
    label: Label bolded
    buttonLabel: active
    defaultValue: false
    type: java.lang.Boolean
  label:
    label: Label
    $type: textField
    i18n: true
  manualAddressLabel:
    label: Manual Button Label
    description: Label for button to switch from Google Search to manual entry
    $type: textField
    i18n: true
    required: true
  placeholder:
    label: Placeholder
    $type: textField
    i18n: true
  validationMessage:
    label: Required validation message
    $type: textField
    i18n: true
  required:
    $type: checkBoxField
    label: Is required
    buttonLabel: Required
    defaultValue: false
    type: java.lang.Boolean
  apiKey:
    label: Required Google API Key
    $type: textField
  cityName:
    $type: textField
    label: City name
    description: Name needs to be unique
    i18n: true
    required: true
  cityId:
    $type: textField
    label: Mapping field ID for city
    description: Mapping field ID from 3rd party application/system, e.g. Salesforce, MailChimp.
  cityLabel:
    $type: textField
    label: Label for city
    i18n: true
    required: true
  cityPlaceholder:
    $type: textField
    label: Placeholder
    i18n: true
  cityRequired:
    $type: checkBoxField
    label: Is required
    buttonLabel: Required
    defaultValue: false
    type: java.lang.Boolean
  cityValidation:
    !include:/bobcat/includes/input-validators.yaml
  cityValidationMessage:
    label: Validation message
    $type: textField
    i18n: true
  cityBold:
    $type: checkBoxField
    label: Label bolded
    buttonLabel: active
    defaultValue: false
    type: java.lang.Boolean
  stateName:
    $type: textField
    label: State name
    description: Name needs to be unique
    i18n: true
    required: true
  stateId:
    $type: textField
    label: Mapping field ID for state
    description: Mapping field ID from 3rd party application/system, e.g. Salesforce, MailChimp.
  stateLabel:
    $type: textField
    label: Label for state
    i18n: true
    required: true
  statePlaceholder:
    $type: textField
    label: Placeholder
    i18n: true
  stateHidden:
    $type: checkBoxField
    label: Is hidden
    description: Leave required unchecked if state is hidden
    buttonLabel: Hidden
    defaultValue: false
    type: java.lang.Boolean
  stateRequired:
    $type: checkBoxField
    label: Is required
    buttonLabel: Required
    defaultValue: false
    type: java.lang.Boolean
  stateValidation:
    !include:/bobcat/includes/input-validators.yaml
  stateValidationMessage:
    label: Validation message
    $type: textField
    i18n: true
  stateBold:
    $type: checkBoxField
    label: Label bolded
    buttonLabel: active
    defaultValue: false
    type: java.lang.Boolean
  countryName:
    $type: textField
    label: Country name
    description: Name needs to be unique
    i18n: true
    required: true
  countryId:
    $type: textField
    label: Mapping field ID for country
    description: Mapping field ID from 3rd party application/system, e.g. Salesforce, MailChimp.
  countryLabel:
    $type: textField
    label: Label for country
    i18n: true
    required: true
  countryPlaceholder:
    $type: textField
    label: Placeholder
    i18n: true
  countryRequired:
    $type: checkBoxField
    label: Is required
    buttonLabel: Required
    defaultValue: false
    type: java.lang.Boolean
  countryValidation:
    !include:/bobcat/includes/input-validators.yaml
  countryValidationMessage:
    label: Validation message
    $type: textField
    i18n: true
  countryBold:
    $type: checkBoxField
    label: Label bolded
    buttonLabel: active
    defaultValue: false
    type: java.lang.Boolean
  zipName:
    $type: textField
    label: Zip-code name
    description: Name needs to be unique
    i18n: true
    required: true
  zipId:
    $type: textField
    label: Mapping field ID for zip-code
    description: Mapping field ID from 3rd party application/system, e.g. Salesforce, MailChimp.
  zipLabel:
    $type: textField
    label: Label for zip-code
    i18n: true
    required: true
  zipPlaceholder:
    $type: textField
    label: Placeholder
    i18n: true
  zipRequired:
    $type: checkBoxField
    label: Is required
    buttonLabel: Required
    defaultValue: false
    type: java.lang.Boolean
  zipValidation:
    !include:/bobcat/includes/input-validators.yaml
  zipValidationMessage:
    label: Validation message
    $type: textField
    i18n: true
  zipBold:
