  countryWidth:
    !include:/bobcat/includes/forms/shared/width-option.yaml
  zipWidth:
    !include:/bobcat/includes/forms/shared/width-option.yaml
layout:
  $type: tabbedLayout
  tabs: !override
    autocomplete:
      label: Autocomplete
      fields:
        - name: name
        - name: id
        - name: label
        - name: placeholder
        - name: manualAddressLabel
        - name: validationMessage
        - name: required
        - name: apiKey
        - name: addressWidth
        - name: bold
    city:
      label: City
      fields:
        - name: cityName
        - name: cityId
        - name: cityLabel
        - name: cityPlaceholder
        - name: cityRequired
        - name: cityValidation
        - name: cityValidationMessage
        - name: cityWidth
        - name: cityBold
    state:
      label: State
      fields:
        - name: stateName
        - name: stateId
        - name: stateLabel
        - name: statePlaceholder
        - name: stateHidden
        - name: stateRequired
        - name: stateValidation
        - name: stateValidationMessage
        - name: stateWidth
        - name: stateBold
    country:
      label: Country
      fields:
        - name: countryName
        - name: countryId
        - name: countryLabel
        - name: countryPlaceholder
        - name: countryRequired
        - name: countryValidation
        - name: countryValidationMessage
        - name: countryWidth
        - name: countryBold
    zip:
      label: Zip
      fields:
        - name: zipName
        - name: zipId
        - name: zipLabel
        - name: zipPlaceholder
        - name: zipRequired
        - name: zipValidation
        - name: zipValidationMessage
        - name: zipWidth
        - name: zipBold
