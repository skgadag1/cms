label: Button

description: Button is hidden by default. Select a button style to display it.
$type: switchableField
field:
  $type: comboBoxField
  defaultValue: none
  placeholder: Select button type
  datasource:
    $type: optionListDatasource
    options:
      - name: hexagonal
        label: Hexagonal (new)
        value: hexagonal
      - name: classic
        label: Classic (old)
        value: classic
      - name: linear
        label: Linear (text button)
        value: linear
itemProvider:
  $type: jcrChildNodeProvider
forms:
  none:
    properties: {}
  hexagonal:
    properties:
      color:
        $type: comboBoxField
        label: Hexagonal Button Color
        datasource:
          $type: optionListDatasource
          options:
            - name: red
              label: Primary Red
              value: red
            - name: black
              label: Black
              value: black
            - name: white
              label: White
              value: white
            - name: yellow
              label: Yellow
              value: yellow
            - name: grey
              label: Grey
              value: grey
            - name: whiteRed
              label: White with red frame
              value: white-red
            - name: whiteBlack
              label: White with black frame
              value: white-black
      link:
        !include:/bobcat/includes/page-link-or-url-field.yaml
        label: Button link
  classic:
    properties:
      color:
        $type: comboBoxField
        label: Hexagonal Button Color
        datasource:
          $type: optionListDatasource
          options:
            - name: red
              label: Primary Red
              value: red
            - name: white
              label: White
              value: white
            - name: black
              label: Black
              value: black
            - name: yellow
              label: Warning Yellow
              value: yellow
            - name: grey
              label: Tertiary Gray
              value: grey
      link:
        !include:/bobcat/includes/page-link-or-url-field-with-none.yaml
        label: Button link
  linear:
    properties:
      color:
        $type: comboBoxField
        label: Hexagonal Button Color
        datasource:
          $type: optionListDatasource
          options:
            - name: red
              label: Primary Red
              value: red
            - name: white
              label: White
              value: white
            - name: black
              label: Black
              value: black
      link:
        !include:/bobcat/includes/page-link-or-url-field.yaml
        label: Button link