label: Upload field
$type: compositeField
layout:
  $type: form
itemProvider:
  $type: jcrChildNodeProvider
properties:
  name:
    $type: textField
    label: Field name
    required: true
  label:
    $type: textField
    label: Field label
    i18n: true 
  selectedLabel:
    $type: textField
    label: Selected label
    i18n: true
    required: true
    description: This label will appear after selecting files instead of a placeholder.
  placeholder:
    label: Placeholder
    $type: textField
    i18n: true
  required:
    $type: checkBoxField
    label: Is required
    buttonLabel: Required
    defaultValue: false
    type: java.lang.Boolean
  bold:
    $type: checkBoxField
    label: Label bolded
    buttonLabel: active
    defaultValue: false
    type: java.lang.Boolean
  width:
    !include:/bobcat/includes/forms/shared/width-option.yaml
  validationMessage:
    label: Validation message
    $type: textField
    i18n: true
  allowedMimeTypePattern:
    $type: textField
    label: Allowed Mime Type Pattern
    description: Comma-separated list of allowed MIME types. Examples include image/*, application/pdf, audio/* and video/*.
    validators:
      mimeValidator:
        $type: mimeValidator
        errorMessage: Enter a valid file pattern
  maxUploadSize:
    $type: textField
    type: java.lang.Long
    label: Max upload size
    description: Maximum files size in bytes
    converterClass: com.vaadin.data.converter.StringToLongConverter
