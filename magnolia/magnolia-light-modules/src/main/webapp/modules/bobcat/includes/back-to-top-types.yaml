label: Button types
$type: switchableField
i18n: true
field:
  $type: radioButtonGroupField
  layout: horizontal
  i18n: true
  defaultValue: small
  datasource:
    $type: optionListDatasource
    options:
      - name: small
        label: Small version
        value: small
      - name: full
        label: Full width version
        value: full
itemProvider:
  $type: jcrChildNodeProvider