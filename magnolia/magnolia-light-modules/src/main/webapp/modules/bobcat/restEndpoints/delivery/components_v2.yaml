class: info.magnolia.rest.delivery.jcr.v2.JcrDeliveryEndpointDefinition
endpointPath: /api/content/pages/components
workspace: website
depth: 10
bypassWorkspaceAcls: true
systemProperties:
  - mgnl:template
  - mgnl:lastModified

nodeTypes:
  - mgnl:component
childNodeTypes:
  - mgnl:contentNode

references:
  - name: assetReference
    propertyName: image
    referenceResolver:
      class: info.magnolia.rest.reference.dam.AssetReferenceResolverDefinition
  - name: assetFieldReference
    propertyName: field
    referenceResolver:
      class: info.magnolia.rest.reference.dam.AssetReferenceResolverDefinition
  - name: pageReference
    propertyName: pageUrl
    referenceResolver:
      class: com.tbscg.doosan.magnolia.bobcat.rest.delivery.CustomUrlReferenceResolverDefinition
      targetWorkspace: website
      expand: false
      generateLink: true
  - name: productReference
    propertyName: model
    referenceResolver:
      class: info.magnolia.rest.reference.jcr.JcrReferenceResolverDefinition
      targetWorkspace: products
      expand: true
      generateLink: false
  - name: excludedModelReference
    propertyName: excludedModel
    referenceResolver:
      class: info.magnolia.rest.reference.jcr.JcrReferenceResolverDefinition
      targetWorkspace: products
      expand: true
      generateLink: false
  - name: productSubcategoryReference
    propertyName: productSubcategory
    referenceResolver:
      class: info.magnolia.rest.reference.jcr.JcrReferenceResolverDefinition
      targetWorkspace: products
      expand: true
      generateLink: false
  - name: facetReference
    propertyName: facet
    referenceResolver:
      class: info.magnolia.rest.reference.jcr.JcrReferenceResolverDefinition
      targetWorkspace: facets
      expand: true
      generateLink: false
  - name: iconTagReference
    propertyName: iconTag
    referenceResolver:
      class: info.magnolia.rest.reference.jcr.JcrReferenceResolverDefinition
      targetWorkspace: dxpTags
      expand: true
      generateLink: false
  - name: attachmentReference
    propertyName: attachmentModel
    referenceResolver:
      class: info.magnolia.rest.reference.jcr.JcrReferenceResolverDefinition
      targetWorkspace: attachments
      expand: true
      generateLink: false
  - name: attachmentCategoryReference
    propertyName: attachmentCategory
    referenceResolver:
      class: info.magnolia.rest.reference.jcr.JcrReferenceResolverDefinition
      targetWorkspace: attachments
      expand: true
      generateLink: false
  - name: linkReferenceWithRichTextBQ
    propertyName: manualInfo
    referenceResolver:
      class: com.tbscg.doosan.magnolia.bobcat.richtext.DxpRichTextLinkResolverDefinition
  - name: linkReferenceWithRichTextContent
    propertyName: content
    referenceResolver:
      class: com.tbscg.doosan.magnolia.bobcat.richtext.DxpRichTextLinkResolverDefinition
  - name: linkReferenceWithRichTextContentProductOverview
    propertyName: overview
    referenceResolver:
      class: com.tbscg.doosan.magnolia.bobcat.richtext.DxpRichTextLinkResolverDefinition
  - name: linkReferenceWithRichTextCaptionedImage
    propertyName: paragraph
    referenceResolver:
      class: com.tbscg.doosan.magnolia.bobcat.richtext.DxpRichTextLinkResolverDefinition
  - name: linkReferenceWithRichTextFaqAnswer
    propertyName: answer
    referenceResolver:
      class: com.tbscg.doosan.magnolia.bobcat.richtext.DxpRichTextLinkResolverDefinition
  - name: linkReferenceWithRichTextArticle
    propertyName: text
    referenceResolver:
      class: com.tbscg.doosan.magnolia.bobcat.richtext.DxpRichTextLinkResolverDefinition
  - name: linkReferenceWithRichTextFormDescription
    propertyName: description
    referenceResolver:
      class: com.tbscg.doosan.magnolia.bobcat.richtext.DxpRichTextLinkResolverDefinition
  - name: linkReferenceWithRichTextDealerPartnerNote
    propertyName: partnerNote
    referenceResolver:
      class: com.tbscg.doosan.magnolia.bobcat.richtext.DxpRichTextLinkResolverDefinition
  - name: featureReference
    propertyName: features
    referenceResolver:
      class: info.magnolia.rest.reference.jcr.JcrReferenceResolverDefinition
      targetWorkspace: features
      expand: true
      generateLink: false
  - name: formsTypeReference
    propertyName: predefined
    referenceResolver:
      class: info.magnolia.rest.reference.jcr.JcrReferenceResolverDefinition
      targetWorkspace: formsType
      expand: true
      generateLink: false
  - name: dxpFaqReference
    propertyName: faqSection
    referenceResolver:
      class: info.magnolia.rest.reference.jcr.JcrReferenceResolverDefinition
      targetWorkspace: faq
      expand: true
      generateLink: false
  - name: formsEmailReference
    propertyName: email
    referenceResolver:
      class: info.magnolia.rest.reference.jcr.JcrReferenceResolverDefinition
      targetWorkspace: formsEmailConfig
      expand: true
      generateLink: false
  - name: formsTypesRefence
    propertyName: dxpFormConfigurationElement
    referenceResolver:
      class: info.magnolia.rest.reference.jcr.JcrReferenceResolverDefinition
      targetWorkspace: formsType
      expand: true
      generateLink: false
  - name: formsConfigurationRefence
    propertyName: configuration
    referenceResolver:
      class: info.magnolia.rest.reference.jcr.JcrReferenceResolverDefinition
      targetWorkspace: formsConfiguration
      expand: true
      generateLink: false
  - name: marketingCampaignsConfigurationRefence
    propertyName: marketingCampaigns
    referenceResolver:
      class: info.magnolia.rest.reference.jcr.JcrReferenceResolverDefinition
      targetWorkspace: marketingCampaigns
      expand: true
      generateLink: false
  - name: conceptRefence
    propertyName: disclaimerConcept
    referenceResolver:
      class: info.magnolia.rest.reference.jcr.JcrReferenceResolverDefinition
      targetWorkspace: concepts
      expand: true
      generateLink: false
  - name: productGroupReference
    propertyName: defaultProductType
    referenceResolver:
      class: info.magnolia.rest.reference.jcr.JcrReferenceResolverDefinition
      targetWorkspace: products
      expand: true
      generateLink: false
  - name: mgnlPageReference
    propertyName: mgnlPage
    referenceResolver:
      class: com.tbscg.doosan.magnolia.bobcat.rest.delivery.KeySelectionProviderDefinition
      targetWorkspace: website
      itemsToResolve:
        - description
        - title
        - primaryPageImage
        - pageLink
  - name: subtitleReferenceWithRichText
    propertyName: subtitle
    referenceResolver:
      class: com.tbscg.doosan.magnolia.bobcat.richtext.DxpRichTextLinkResolverDefinition
  - name: titleReferenceWithRichText
    propertyName: title
    referenceResolver:
      class: com.tbscg.doosan.magnolia.bobcat.richtext.DxpRichTextLinkResolverDefinition
  - name: evolutionSubtitleReferenceWithRichText
    propertyName: evolutionSubtitle
    referenceResolver:
      class: com.tbscg.doosan.magnolia.bobcat.richtext.DxpRichTextLinkResolverDefinition
  - name: evolutionTitleReferenceWithRichText
    propertyName: evolutionTitle
    referenceResolver:
      class: com.tbscg.doosan.magnolia.bobcat.richtext.DxpRichTextLinkResolverDefinition
  - name: excludedCategoriesReference
    propertyName: excludedCategory
    referenceResolver:
      class: com.tbscg.doosan.magnolia.bobcat.rest.delivery.KeySelectionProviderDefinition
      targetWorkspace: products
      itemsToResolve:
        - title
      expand: false
      generateLink: false
  - name: excludedSubcategoriesReference
    propertyName: excludedSubcategory
    referenceResolver:
      class: com.tbscg.doosan.magnolia.bobcat.rest.delivery.KeySelectionProviderDefinition
      targetWorkspace: products
      itemsToResolve:
        - title
      expand: false
      generateLink: false
referenceRepeat: true
referenceDepth: 10
