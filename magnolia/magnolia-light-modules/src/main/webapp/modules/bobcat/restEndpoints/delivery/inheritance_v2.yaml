class: info.magnolia.rest.delivery.jcr.v2.JcrDeliveryEndpointDefinition
endpointPath: /api/content/pages/inheritance/
workspace: website
depth: 7
bypassWorkspaceAcls: true
rootPath: /bobcat

systemProperties:
  - mgnl:template

nodeTypes:
  - mgnl:page

childNodeTypes:
  - mgnl:area
  - mgnl:component
  - mgnl:contentNode

references:
  - name: pageReference
    propertyName: pageUrl
    referenceResolver:
      class: com.tbscg.doosan.magnolia.bobcat.rest.delivery.CustomUrlReferenceResolverDefinition
      targetWorkspace: website
      expand: false
      generateLink: true
  - name: linkReferenceWithRichTextFooter
    propertyName: disclaimer
    referenceResolver:
      class: com.tbscg.doosan.magnolia.bobcat.richtext.DxpRichTextLinkResolverDefinition
referenceRepeat: true
referenceDepth: 10
