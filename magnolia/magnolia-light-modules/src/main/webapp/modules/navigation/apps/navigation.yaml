label: Navigation App
class: info.magnolia.ui.contentapp.configuration.ContentAppDescriptor
appClass: info.magnolia.ui.framework.app.BaseApp
name: navigation
icon: icon-sitemaps-app
datasource:
  $type: jcrDatasource
  workspace: navigation
subApps:
  navigation:
    label: Navigation Editor
    class: info.magnolia.ui.contentapp.configuration.BrowserDescriptor
    closable: false
    datasource:
      $type: jcrDatasource
      workspace: navigation
      includeProperties: false
      allowedNodeTypes:
        - mgnl:folder
        - dxp:navigationMegaMenu
        - dxp:navigationRow
        - dxp:navigationColumn
        - dxp:navigationMegaList
        - dxp:navigationMegaListColumn
        - dxp:navigationList
        - dxp:navigationLink
        - dxp:navigationItem
    workbench:
      dragAndDrop: true
      contentViews:
        facets:
          $type: treeView
          multiSelect: true
          multiSelectByRowClick: false
          columns:
            jcrName:
              label: Name
              $type: jcrTitleColumn
              nodeTypeToIcon:
                mgnl:folder: icon-language-app
                dxp:marketingCampaign: icon-node-content
            type:
              label: Type
              valueProvider: com.tbscg.doosan.magnolia.bobcat.field.BobcatContentTypeValueProvider
            jcrPublishingStatus:
              $type: lockingStatusColumn
              label: Status
            jcr:lockOwner:
              name: jcr:lockOwner
              label: Locked by
            mgnl:lastModified:
              $type: dateColumn
    actionbar:
      defaultAction: editMenuItem
      sections:
        root:
          availability:
            root: true
          groups:
            addActions:
              name: addActions
              items:
                - name: addMegaMenu
                - name: addMegaList
                - name: addListMenu
                - name: addLinkMenu
                - name: addMegaMenuRow
                - name: addMegaMenuColumn
                - name: addMegaListColumn
                - name: addMenuItem
            editActions:
              name: editActions
              items:
                - name: editMegaMenu
                - name: editMegaList
                - name: editListMenu
                - name: editLinkMenu
                - name: editMegaMenuRow
                - name: editMegaMenuColumn
                - name: editMegaListColumn
                - name: editMenuItem
                - name: lock
                - name: unlock
            publishingActions:
              name: publishingActions
              items:
                - name: publishItem
                - name: publishRecursive
                - name: unpublishItem
            commonActions:
              name: commonActions
              items:
                - name: renameItem
                - name: deleteItem
                - name: duplicateItem
                - name: moveItem
                - name: copyItem
                - name: pasteItem
            translationActions:
              name: translationActions
              items:
                - name: addToTranslationBatch
            exportImportActions:
              name: exportImportActions
              items:
                - name: export
                - name: import
    actions:
      !include:/commons/includes/lock-unlock-action-definition.yaml
      addMegaMenu:
        icon: icon-add-item
        $type: openDetailSubappAction
        appName: navigation
        subAppName: detailsMegaMenu
        label: Add mega menu
        viewType: add
        availability:
          writePermissionRequired: true
          nodeTypes:
            - mgnl:folder
          rules:
            isNotLockedRule:
              $type: isNotLocked
      addMegaMenuRow:
        icon: icon-add-item
        $type: openDetailSubappAction
        appName: navigation
        subAppName: detailsMegaMenuRow
        label: Add row to mega menu
        viewType: add
        availability:
          writePermissionRequired: true
          nodeTypes:
            - dxp:navigationMegaMenu
          rules:
            isNotLockedRule:
              $type: isNotLocked
      addMegaMenuColumn:
        icon: icon-add-item
        $type: openDetailSubappAction
        appName: navigation
        subAppName: detailsMegaMenuColumn
        label: Add column to mega menu
        viewType: add
        availability:
          writePermissionRequired: true
          nodeTypes:
            - dxp:navigationRow
          rules:
            isNotLockedRule:
              $type: isNotLocked
      addMegaList:
        icon: icon-add-item
        $type: openDetailSubappAction
        appName: navigation
        subAppName: detailsMegaList
        label: Add mega list
        viewType: add
        availability:
          writePermissionRequired: true
          nodeTypes:
            - mgnl:folder
          rules:
            isNotLockedRule:
              $type: isNotLocked
      addMegaListColumn:
        icon: icon-add-item
        $type: openDetailSubappAction
        appName: navigation
        subAppName: detailsMegaListColumn
        label: Add column to mega list
        viewType: add
        availability:
          writePermissionRequired: true
          nodeTypes:
            - dxp:navigationMegaList
            - dxp:navigationMegaListColumn
          rules:
            isNotLockedRule:
              $type: isNotLocked
      addListMenu:
        icon: icon-add-item
        $type: openDetailSubappAction
        appName: navigation
        subAppName: detailsListMenu
        label: Add list menu
        viewType: add
        availability:
          writePermissionRequired: true
          nodeTypes:
            - mgnl:folder
          rules:
            isNotLockedRule:
              $type: isNotLocked
      addLinkMenu:
        icon: icon-add-item
        $type: openDetailSubappAction
        appName: navigation
        subAppName: detailsLinkMenu
        label: Add link menu
        viewType: add
        availability:
          writePermissionRequired: true
          nodeTypes:
            - mgnl:folder
          rules:
            isNotLockedRule:
              $type: isNotLocked
      addMenuItem:
        icon: icon-add-item
        $type: openDetailSubappAction
        appName: navigation
        subAppName: detailsMenuItem
        label: Add menu item
        viewType: add
        availability:
          writePermissionRequired: true
          nodeTypes:
            - dxp:navigationColumn
            - dxp:navigationMegaListColumn
            - dxp:navigationList
          rules:
            isNotLockedRule:
              $type: isNotLocked
      editMegaMenu:
        icon: icon-edit
        $type: openDetailSubappAction
        appName: navigation
        subAppName: detailsMegaMenu
        viewType: edit
        label: Edit mega menu
        availability:
          writePermissionRequired: true
          nodeTypes:
            - dxp:navigationMegaMenu
          rules:
            isNotLockedRule:
              $type: isNotLocked
      editMegaList:
        icon: icon-edit
        $type: openDetailSubappAction
        appName: navigation
        subAppName: detailsMegaList
        viewType: edit
        label: Edit mega list
        availability:
          writePermissionRequired: true
          nodeTypes:
            - dxp:navigationMegaList
          rules:
            isNotLockedRule:
              $type: isNotLocked
      editListMenu:
        icon: icon-edit
        $type: openDetailSubappAction
        appName: navigation
        subAppName: detailsListMenu
        viewType: edit
        label: Edit list menu
        availability:
          writePermissionRequired: true
          nodeTypes:
            - dxp:navigationList
          rules:
            isNotLockedRule:
              $type: isNotLocked
      editLinkMenu:
        icon: icon-edit
        $type: openDetailSubappAction
        appName: navigation
        subAppName: detailsLinkMenu
        viewType: edit
        label: Edit link menu
        availability:
          writePermissionRequired: true
          nodeTypes:
            - dxp:navigationLink
          rules:
            isNotLockedRule:
              $type: isNotLocked
      editMegaMenuRow:
        icon: icon-edit
        $type: openDetailSubappAction
        appName: navigation
        subAppName: detailsMegaMenuRow
        viewType: edit
        label: Edit mega menu row
        availability:
          writePermissionRequired: true
          nodeTypes:
            - dxp:navigationRow
          rules:
            isNotLockedRule:
              $type: isNotLocked
      editMegaMenuColumn:
        icon: icon-edit
        $type: openDetailSubappAction
        appName: navigation
        subAppName: detailsMegaMenuColumn
        viewType: edit
        label: Edit mega menu column
        availability:
          writePermissionRequired: true
          nodeTypes:
            - dxp:navigationColumn
          rules:
            isNotLockedRule:
              $type: isNotLocked
      editMegaListColumn:
        icon: icon-edit
        $type: openDetailSubappAction
        appName: navigation
        subAppName: detailsMegaListColumn
        viewType: edit
        label: Edit mega list column
        availability:
          writePermissionRequired: true
          nodeTypes:
            - dxp:navigationMegaListColumn
          rules:
            isNotLockedRule:
              $type: isNotLocked
      editMenuItem:
        icon: icon-edit
        $type: openDetailSubappAction
        appName: navigation
        subAppName: detailsMenuItem
        viewType: edit
        label: Edit menu item
        availability:
          writePermissionRequired: true
          nodeTypes:
            - dxp:navigationItem
          rules:
            isNotLockedRule:
              $type: isNotLocked
      addToTranslationBatch:
        label: Add to translation batch
        dialogName: content-translation-support-ext-core:addToTranslationBatch
        icon: icon-add-folder
        class: info.magnolia.translation.ext.core.app.batch.action.OpenMultiEditDialogAction$Definition
        availability:
          writePermissionRequired: true
          nodeTypes: 
            navigationItem: dxp:navigationItem
            navigationLink: dxp:navigationLink
            navigationList: dxp:navigationList
            navigationMegaListColumn: dxp:navigationMegaListColumn
            navigationMegaList: dxp:navigationMegaList
            navigationColumn: dxp:navigationColumn
            navigationMegaMenu: dxp:navigationMegaMenu
            navigationRow: dxp:navigationRow
          rules:
            - name: IsNotDeletedRule
              implementationClass: info.magnolia.ui.framework.availability.IsNotDeletedRule
          multiple: true
          root: false
      publishItem:
        label: Publish
        icon: icon-publish
        $type: jcrCommandAction
        command: publish
        catalog: versioned
        availability:
          writePermissionRequired: true
          rules:
            isPublishable:
              $type: jcrPublishableRule
            isNotLockedRule:
              $type: isNotLocked
      publishRecursive:
        icon: icon-publish-incl-sub
        $type: jcrCommandAction
        command: publish
        label: Publish recursive
        asynchronous: true
        params:
          recursive: true
        availability:
          writePermissionRequired: true
          rules:
            isPublishable:
              $type: jcrPublishableRule
            isNotLockedRule:
              $type: isNotLocked
      unpublishItem:
        label: Unpublish
        icon: icon-unpublish
        $type: jcrCommandAction
        command: unpublish
        availability:
          writePermissionRequired: true
          rules:
            isPublished:
              $type: jcrPublishedRule
            isNotLockedRule:
              $type: isNotLocked
      renameItem:
        label: Rename Item
        icon: icon-edit
        $type: openDialogAction
        dialogId: navigation:rename
        availability:
          writePermissionRequired: true
          nodeTypes:
            - dxp:navigationMegaMenu
            - dxp:navigationMegaList
            - dxp:navigationMegaListColumn
            - dxp:navigationList
            - dxp:navigationLink
            - dxp:navigationRow
            - dxp:navigationColumn
            - dxp:navigationItem
          rules:
            isNotLockedRule:
              $type: isNotLocked
      deleteItem:
        label: Delete Item
        icon: icon-delete
        $type: confirmationAction
        successActionName: delete
        dialogId: ui-framework-jcr:delete
        availability:
          multiple: true
          writePermissionRequired: true
          nodeTypes:
            - dxp:navigationMegaMenu
            - dxp:navigationMegaList
            - dxp:navigationMegaListColumn
            - dxp:navigationList
            - dxp:navigationLink
            - dxp:navigationRow
            - dxp:navigationColumn
            - dxp:navigationItem
          rules:
            isNotLockedRule:
              $type: isNotLocked
      duplicateItem:
        label: Duplicate Item
        icon: icon-duplicate
        $type: dxpDuplicateNodeAction
        availability:
          multiple: true
          writePermissionRequired: true
          nodeTypes:
            - dxp:navigationMegaMenu
            - dxp:navigationMegaList
            - dxp:navigationMegaListColumn
            - dxp:navigationList
            - dxp:navigationLink
            - dxp:navigationRow
            - dxp:navigationColumn
            - dxp:navigationItem
      moveItem:
        label: Move Item
        icon: icon-move
        $type: dxpMoveAction
        allowedRoles:
          - superuser
        dialogId: bobcat:move
        availability:
          multiple: true
          writePermissionRequired: true
          nodeTypes:
            - dxp:navigationMegaMenu
            - dxp:navigationMegaList
            - dxp:navigationMegaListColumn
            - dxp:navigationList
            - dxp:navigationLink
            - dxp:navigationRow
            - dxp:navigationColumn
            - dxp:navigationItem
          rules:
            isNotLockedRule:
              $type: isNotLocked
      copyItem:
        label: Copy Item
        icon: icon-copy
        $type: copyContentAction
        availability:
          multiple: true
          writePermissionRequired: true
          nodeTypes:
            - dxp:navigationMegaMenu
            - dxp:navigationMegaList
            - dxp:navigationMegaListColumn
            - dxp:navigationList
            - dxp:navigationLink
            - dxp:navigationRow
            - dxp:navigationColumn
            - dxp:navigationItem
      pasteItem:
        label: Paste Item
        icon: icon-paste
        $type: dxpPasteContentAction
        allowedRoles:
          - superuser
        availability:
          multiple: true
          writePermissionRequired: true
          nodeTypes:
            - mgnl:folder
            - dxp:navigationMegaMenu
            - dxp:navigationMegaList
            - dxp:navigationMegaListColumn
            - dxp:navigationList
            - dxp:navigationLink
            - dxp:navigationRow
            - dxp:navigationColumn
      import:
        label: Import
        icon: icon-import
        $type: openDialogAction
        dialogId: ui-framework-jcr:import
        availability:
          writePermissionRequired: true
          root: true
          rules:
            isNotDeleted: &isNotDeleted
              $type: jcrIsDeletedRule
              negate: true
      export:
        label: Export
        icon: icon-export
        $type: exportAction
        format: xml
        dialogName: ui-admincentral:export
        availability:
          rules:
            isNotDeleted: *isNotDeleted
      delete:
        $type: jcrCommandAction
        asynchronous: true
        command: delete
        availability:
          writePermissionRequired: true
          nodeTypes:
            - dxp:navigationMegaMenu
            - dxp:navigationMegaList
            - dxp:navigationMegaListColumn
            - dxp:navigationList
            - dxp:navigationLink
            - dxp:navigationRow
            - dxp:navigationColumn
            - dxp:navigationItem
          rules:
            isNotLockedRule:
              $type: isNotLocked
      lock:
        availability:
          nodeTypes: &lockableTypes
            - dxp:navigationMegaMenu
            - dxp:navigationMegaList
            - dxp:navigationMegaListColumn
            - dxp:navigationList
            - dxp:navigationLink
            - dxp:navigationRow
            - dxp:navigationColumn
            - dxp:navigationItem
      unlock:
        availability:
          nodeTypes: *lockableTypes
  detailsMegaMenu:
    class: info.magnolia.ui.contentapp.detail.DetailDescriptor
    label: Edit Mega Menu
    itemProvider:
      $type: jcrNodeFromLocationProvider
      workspace: navigation
      nodeType: dxp:navigationMegaMenu
    form:
      properties:
        jcrName:
          $type: textField
          label: Name
        label:
          $type: textField
          label: Label
          i18n: true
        hideFromNavigation:
          $type: checkBoxField
          i18n: true
          label: Hide from navigation
          buttonLabel: active
          defaultValue: false
          type: java.lang.Boolean
    actions:
      commit:
        $type: commitAction
        label: Save
      cancel:
        $type: closeAction
        label: Cancel
  detailsMegaMenuRow:
    class: info.magnolia.ui.contentapp.detail.DetailDescriptor
    label: Edit Mega Menu Row
    itemProvider:
      $type: jcrNodeFromLocationProvider
      workspace: navigation
      nodeType: dxp:navigationRow
    form:
      properties:
        jcrName:
          $type: textField
          label: Name
        hideFromNavigation:
          $type: checkBoxField
          i18n: true
          label: Hide from navigation
          buttonLabel: active
          defaultValue: false
          type: java.lang.Boolean
    actions:
      commit:
        $type: commitAction
        label: Save
      cancel:
        $type: closeAction
        label: Cancel
  detailsListMenu:
    class: info.magnolia.ui.contentapp.detail.DetailDescriptor
    label: Edit List Menu
    itemProvider:
      $type: jcrNodeFromLocationProvider
      workspace: navigation
      nodeType: dxp:navigationList
    form:
      properties:
        jcrName:
          $type: textField
          label: Name
        label:
          $type: textField
          label: Label
          i18n: true
        hideFromNavigation:
          $type: checkBoxField
          i18n: true
          label: Hide from navigation
          buttonLabel: active
          defaultValue: false
          type: java.lang.Boolean
    actions:
      commit:
        $type: commitAction
        label: Save
      cancel:
        $type: closeAction
        label: Cancel
  detailsLinkMenu:
    class: info.magnolia.ui.contentapp.detail.DetailDescriptor
    label: Edit Link Menu
    itemProvider:
      $type: jcrNodeFromLocationProvider
      workspace: navigation
      nodeType: dxp:navigationLink
    form:
      properties:
        jcrName:
          $type: textField
          label: Name
        label:
          $type: textField
          label: Label
          i18n: true
        hideFromNavigation:
          $type: checkBoxField
          i18n: true
          label: Hide from navigation
          buttonLabel: active
          defaultValue: false
          type: java.lang.Boolean
        link:
          !include:/navigation/includes/custom-url-or-page.yaml
        badge:
          $type: textField
          label: Badge text
          i18n: true
          description: Optional badge text to display next to the navigation item
    actions:
      commit:
        $type: commitAction
        label: Save
      cancel:
        $type: closeAction
        label: Cancel
  detailsMegaMenuColumn:
    class: info.magnolia.ui.contentapp.detail.DetailDescriptor
    label: Edit Mega Menu Column
    itemProvider:
      $type: jcrNodeFromLocationProvider
      workspace: navigation
      nodeType: dxp:navigationColumn
    form:
      properties:
        jcrName:
          $type: textField
          label: Name
        label:
          $type: textField
          label: Label
          i18n: true
        hideFromNavigation:
          $type: checkBoxField
          i18n: true
          label: Hide from navigation
          buttonLabel: active
          defaultValue: false
          type: java.lang.Boolean
        position:
          $type: comboBoxField
          label: Column position
          datasource:
            $type: optionListDatasource
            options:
              - name: column1
                label: Column 1
                value: column1
              - name: column2
                label: Column 2
                value: column2
              - name: column3
                label: Column 3
                value: column3
        badge:
          $type: textField
          label: Badge text
          i18n: true
          description: Optional badge text to display next to the navigation item
    actions:
      commit:
        $type: commitAction
        label: Save
      cancel:
        $type: closeAction
        label: Cancel
  detailsMegaListColumn:
    class: info.magnolia.ui.contentapp.detail.DetailDescriptor
    label: Edit Mega List Column
    itemProvider:
      $type: jcrNodeFromLocationProvider
      workspace: navigation
      nodeType: dxp:navigationMegaListColumn
    form:
      properties:
        jcrName:
          $type: textField
          label: Name
        label:
          $type: textField
          label: Label
          i18n: true
        hideFromNavigation:
          $type: checkBoxField
          i18n: true
          label: Hide from navigation
          buttonLabel: active
          defaultValue: false
          type: java.lang.Boolean
        link:
          !include:/bobcat/includes/page-link-or-url-field.yaml
          description: This will be highlighted top link in column
          field:
            datasource:
              options:
                - name: none
                  label: No link
                  value: none
            defaultValue: none
          forms:
            page:
              properties:
                link:
                  properties:
                    pageLabel:
                      placeholder: Link label
        badge:
          $type: textField
          label: Badge text
          i18n: true
          description: Optional badge text to display next to the navigation item
    actions:
      commit:
        $type: commitAction
        label: Save
      cancel:
        $type: closeAction
        label: Cancel
  detailsMegaList:
    class: info.magnolia.ui.contentapp.detail.DetailDescriptor
    label: Edit Mega List
    itemProvider:
      $type: jcrNodeFromLocationProvider
      workspace: navigation
      nodeType: dxp:navigationMegaList
    form:
      properties:
        jcrName:
          $type: textField
          label: Name
        label:
          $type: textField
          label: Navigation label
          i18n: true
        hideFromNavigation:
          $type: checkBoxField
          i18n: true
          label: Hide from navigation
          buttonLabel: active
          defaultValue: false
          type: java.lang.Boolean
    actions:
      commit:
        $type: commitAction
        label: Save
      cancel:
        $type: closeAction
        label: Cancel
  detailsMenuItem:
    class: info.magnolia.ui.contentapp.detail.DetailDescriptor
    label: Edit Menu Item
    itemProvider:
      $type: jcrNodeFromLocationProvider
      workspace: navigation
      nodeType: dxp:navigationItem
    form:
      properties:
        jcrName:
          $type: textField
          label: Name
        label:
          $type: textField
          label: Label
          i18n: true
        hideFromNavigation:
          $type: checkBoxField
          i18n: true
          label: Hide from navigation
          buttonLabel: active
          defaultValue: false
          type: java.lang.Boolean
        link:
          !include:/navigation/includes/custom-url-or-page.yaml
        badge:
          $type: textField
          label: Badge text
          i18n: true
          description: Optional badge text to display next to the navigation item
    actions:
      commit:
        $type: commitAction
        label: Save
      cancel:
        $type: closeAction
        label: Cancel
