label: DXP Tags
class: info.magnolia.ui.contentapp.configuration.ContentAppDescriptor
appClass: info.magnolia.ui.framework.app.BaseApp
name: dxp-tags
icon: icon-tag-2-app
datasource:
  $type: jcrDatasource
  workspace: dxpTags
  includeProperties: false
  allowedNodeTypes:
    - mgnl:folder
    - dxp:tagGroup
    - dxp:tag
subApps:
  browser:
    class: info.magnolia.ui.contentapp.configuration.BrowserDescriptor
    label: Tag Hierarchy
    workbench:
      contentViews:
        facets:
          $type: treeView
          columns:
            jcrName:
              label: Name
              $type: jcrTitleColumn
              nodeTypeToIcon:
                mgnl:folder: icon-language-app
                dxp:tagGroup: icon-node-content
                dxp:tag: icon-documents-app
            type:
              label: Type
              valueProvider: com.tbscg.doosan.magnolia.bobcat.field.BobcatContentTypeValueProvider
            jcrPublishingStatus:
              $type: lockingStatusColumn
              label: Status
            jcr:lockOwner:
              name: jcr:lockOwner
              label: Locked by
            mgnl:lastModified:
              name: mgnl:lastModified
              $type: dateColumn
              width: 200
              label: Last change
            mgnl:lastModifiedBy:
              name: mgnl:lastModifiedBy
              width: 200
              label: Last change by
    actionbar:
      defaultAction: editTag
      sections:
        root:
          availability:
            root: true
          groups:
            addActions:
              name: addActions
              items:
                - name: addTagGroup
                - name: addTag
            editActions:
              name: editActions
              items:
                - name: editTagGroup
                - name: editTag
                - name: lock
                - name: unlock
            publishingActions:
              name: publishingActions
              items:
                - name: publishItem
                - name: publishRecursive
                - name: unpublishItem
            commonActions:
              name: commonActions
              items:
                - name: renameItem
                - name: deleteItem
                - name: duplicateItem
                - name: moveItem
                - name: copyItem
                - name: pasteItem
            translationActions:
              name: translationActions
              items:
                - name: addToTranslationBatch
            exportImportActions:
              name: exportImportActions
              items:
                - name: export
                - name: import
    actions:
      !include:/commons/includes/lock-unlock-action-definition.yaml
      addToTranslationBatch:
        label: Add to translation batch
        dialogName: content-translation-support-ext-core:addToTranslationBatch
        icon: icon-add-folder
        class: info.magnolia.translation.ext.core.app.batch.action.OpenMultiEditDialogAction$Definition
        availability:
          writePermissionRequired: true
          access:
            roles: 
              - dxp-bobcat-admins
              - dxp-bobcat-admin-na
              - dxp-bobcat-publishers-na
          nodeTypes: 
            - dxp:tagGroup
            - dxp:tag
          rules:
            - name: IsNotDeletedRule
              implementationClass: info.magnolia.ui.framework.availability.IsNotDeletedRule
          multiple: true
          root: false
      addTagGroup:
        label: Add Tag Group
        icon: icon-add-folder        
        $type: openDetailSubappAction
        subAppName: detailTagGroup
        appName: dxp-tags
        viewType: add
        availability:
          writePermissionRequired: true
          nodeTypes:
            - mgnl:folder
          rules:
            isNotLockedRule:
              $type: isNotLocked
      editTagGroup:
        label: Edit Tag Group
        icon: icon-edit        
        $type: openDetailSubappAction
        subAppName: detailTagGroup
        appName: dxp-tags
        viewType: edit
        availability:
          writePermissionRequired: true
          nodeTypes:
            - dxp:tagGroup
          rules:
            isNotLockedRule:
              $type: isNotLocked
      addTag:
        label: Add Tag
        icon: icon-node-content
        $type: openDetailSubappAction
        subAppName: detailTag
        appName: dxp-tags
        viewType: add
        availability:
          writePermissionRequired: true
          nodeTypes:
            - dxp:tagGroup
          rules:
            isNotLockedRule:
              $type: isNotLocked
      editTag:
        label: Edit Tag
        icon: icon-edit
        $type: openDetailSubappAction
        subAppName: detailTag
        appName: dxp-tags
        viewType: edit
        availability:
          writePermissionRequired: true
          nodeTypes:
            - dxp:tag
          rules:
            isNotLockedRule:
              $type: isNotLocked
      publishItem:
        label: Publish
        icon: icon-publish
        dialogId: workflow-pages:publish
        $type: openDialogAction
        params:
          catalog: versioned
        availability:
          writePermissionRequired: true
          rules:
            isPublishable:
              $type: jcrPublishableRule
            isNotLockedRule:
              $type: isNotLocked
      publishRecursive:
        icon: icon-publish-incl-sub
        $type: jcrCommandAction
        command: publish
        label: Publish recursive
        asynchronous: true
        params:
          recursive: true
        availability:
          writePermissionRequired: true
          rules:
            isPublishable:
              $type: jcrPublishableRule
            isNotLockedRule:
              $type: isNotLocked
      unpublishItem:
        label: Unpublish
        icon: icon-unpublish
        dialogId: workflow-pages:unPublish
        $type: openDialogAction
        availability:
          writePermissionRequired: true
          rules:
            isPublished:
              $type: jcrPublishedRule
            isNotLockedRule:
              $type: isNotLocked
      renameItem:
        label: Rename Item
        icon: icon-edit
        $type: openDialogAction
        dialogId: ui-framework-jcr:rename
        availability:
          nodeTypes:
            - dxp:tagGroup
            - dxp:tag
          rules:
            isNotLockedRule:
              $type: isNotLocked
      deleteItem:
        label: Delete Item
        icon: icon-delete
        $type: confirmationAction
        successActionName: delete
        dialogId: ui-framework-jcr:delete
        availability:
          nodeTypes:
            - dxp:tagGroup
            - dxp:tag
          rules:
            isNotLockedRule:
              $type: isNotLocked
      duplicateItem:
        label: Duplicate Item
        icon: icon-duplicate
        $type: duplicateNodeAction
        availability:
          nodeTypes:
            - dxp:tagGroup
            - dxp:tag
      moveItem:
        label: Move Item
        icon: icon-move
        #    $type: moveAction
        $type: dxpMoveAction
        allowedRoles:
          - superuser
        availability:
          nodeTypes:
            - dxp:tagGroup
            - dxp:tag
        rules:
          isNotLockedRule:
            $type: isNotLocked
      copyItem:
        label: Copy Item
        icon: icon-copy
        $type: copyContentAction
        availability:
          writePermissionRequired: true
          nodeTypes:
            - dxp:tagGroup
            - dxp:tag
      pasteItem:
        label: Paste Item
        icon: icon-paste
        #    $type: pasteContentAction
        $type: dxpPasteContentAction
        allowedRoles:
          - superuser
        sendComponentAction: false
        availability:
          rules:
            canPasteRule:
              $type: canPasteContentRule
          nodeTypes:
            - mgnl:folder
            - dxp:tagGroup
            - dxp:tag
      import:
        label: Import
        icon: icon-import
        $type: openDialogAction
        dialogId: ui-framework-jcr:import
        availability:
          root: true
          writePermissionRequired: true
          rules:
            isNotDeleted: &isNotDeleted
              $type: jcrIsDeletedRule
              negate: true
      export:
        label: Export
        icon: icon-export
        $type: exportAction
        format: xml
        dialogName: ui-admincentral:export
        availability:
          rules:
            isNotDeleted: *isNotDeleted
      delete:
        $type: jcrCommandAction
        asynchronous: true
        command: delete
        availability:
          nodeTypes:
            - dxp:tagGroup
            - dxp:tag
        rules:
          isNotLockedRule:
            $type: isNotLocked
      lock:
        availability:
          nodeTypes: &lockableTypes
            - dxp:tagGroup
            - dxp:tag
      unlock:
        availability:
          nodeTypes: *lockableTypes
  detailTagGroup:
    class: info.magnolia.ui.contentapp.detail.DetailDescriptor
    label: Tag Group
    itemProvider:
      $type: jcrNodeFromLocationProvider
      workspace: dxpTags
      nodeType: dxp:tagGroup
    form:
      properties:
        jcrName:
          label: Tag Group Name
          $type: textField
          required: true
  detailTag:
    class: info.magnolia.ui.contentapp.detail.DetailDescriptor
    label: Tag
    itemProvider:
      $type: jcrNodeFromLocationProvider
      workspace: dxpTags
      nodeType: dxp:tag
    form:
      properties:
        jcrName:
          label: Tag Name
          $type: textField
          required: true
        label:
          label: Tag Label
          $type: textField
          i18n: true
          required: true
              