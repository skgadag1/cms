findBar:
  suggestionCountPerSupplier: 3
  defaultCountPerSupplier: 10
appLauncherLayout:
  defaultGroup: edit
  hiddenApps:
    notifications: notifications
  groups:
    - name: edit
    - name: translations
      permissions:
        roles:
          - dxp-bobcat-admin
          - dxp-bobcat-admin-na
          - dxp-bobcat-publishers-na
          - dxp-bobcat-content-uploaders-na
          - superuser
      label: Translations
      apps:
        - name: extendContentTranslation
        - name: pages-translation
favouriteAppConfiguration:
  maxApps: 12
  favouriteApps:
    - pages-app

compatibilityLayout:
  rows:
    - groups:
        - edit
        - target
      cssClass: editor
    - groups:
        - manage
        - media
      cssClass: editor
    - groups:
        - translations
      cssClass: editor
    - groups:
        - tools
        - dev
        - stk
      cssClass: developer