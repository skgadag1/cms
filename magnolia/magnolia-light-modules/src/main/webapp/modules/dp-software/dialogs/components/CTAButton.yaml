label: CTA Button
form:
  properties:
    titleField:
      $type: textField
      label: Title
      i18n: true
      required: true
    subtitleField:
      $type: cloudinaryRichText
      label: Subtitle
      i18n: true
      rows: 5
    description:
      $type: textField
      label: Description Text
      i18n: true
      rows: 3
    alignment:
      label: Button Alignment
      $type: comboBoxField
      datasource:
        $type: optionListDatasource
        options:
          - name: left
            value: left
            label: Left
          - name: center
            value: center
            label: Center
          - name: right
            value: right
            label: Right
      defaultValue: left
    verticalAlignment:
      label: Vertical Button Alignment
      $type: comboBoxField
      datasource:
        $type: optionListDatasource
        options:
          - name: top
            value: top
            label: top
          - name: bottom
            value: bottom
            label: bottom
      defaultValue: top
    ctaLinks:
      label: CTA Button
      $type: jcrMultiField
      maxItems: 3
      field:
        name: ctaItem
        label: CTA Button
        $type: compositeField
        properties:
          label:
            $type: textField
            label: Button Label
            i18n: true
            required: true
          linkType:
            label: Link Type
            $type: switchableField
            field:
              $type: radioButtonGroupField
              layout: horizontal
              datasource:
                $type: optionListDatasource
                options:
                  - name: page
                    label: Magnolia page
                    value: page
                  - name: custom
                    label: Custom link URL
                    value: custom
              defaultValue: page
            itemProvider:
              $type: jcrChildNodeProvider
            forms:
              custom:
                properties:
                  customUrl:
                    label: Custom link URL
                    description: 'Include protocol (http:// or https://)'
                    $type: textField
                    required: true
                  customTarget:
                    !include:/bobcat/includes/anchor-target.yaml

              page:
                properties:
                  pageUrl:
                    label: Magnolia page link
                    $type: pageLinkField
                    required: true
                  pageLabel:
                    label: Link label
                    placeholder: << target page title >>
                    $type: textField
                    i18n: true
                  pageTarget:
                    !include:/bobcat/includes/anchor-target.yaml

  layout:
    $type: tabbedLayout
    tabs:
      main:
        label: Main
        fields:
          - name: titleField
          - name: subtitleField
          - name: description
          - name: ctaLinks
          - name: alignment
          - name: verticalAlignment

light: false
