label: Page Properties
form:
  properties:
    title:
      label: Title
      $type: textField
      i18n: true
    heading:
      $type: textField
      label: Heading text
      rows: 3
      i18n: true
      maxLength: 2000
    description:
      $type: textField
      label: Description
      rows: 3
      i18n: true
      maxLength: 150
    keywords:
      $type: textField
      label: Keywords
      i18n: true
      maxLength: 100
    contractCodes:
      $type: twinColSelectField
      label: "Contract codes"
      leftColumnCaption: "Available codes"
      rightColumnCaption: "Page visible only to dealers with contract codes: (leave empty to filter only by contract type or allow for all)"
      datasource:
        $type: jcrDatasource
        workspace: category
        rootPath: /dealer-portal/dealer-contract-codes
        describeByProperty: displayName
        allowedNodeTypes:
          - mgnl:category
    partsContractCodes:
      $type: twinColSelectField
      label: "Parts contract codes"
      leftColumnCaption: "Available codes"
      rightColumnCaption: "Page visible only to dealers with parts contract codes: (leave empty to filter only by contract type or allow for all)"
      datasource:
        $type: jcrDatasource
        workspace: category
        rootPath: /dealer-portal/dealer-parts-contract-codes
        describeByProperty: displayName
        allowedNodeTypes:
          - mgnl:category
    contractTypes:
      $type: twinColSelectField
      label: "Contract types"
      leftColumnCaption: "Available types"
      rightColumnCaption: "Page visible only to dealers with contract types: (leave empty to filter only by contract codes or allow for all)"
      datasource:
        $type: jcrDatasource
        workspace: category
        rootPath: /dealer-portal/dealer-contract-types
        describeByProperty: displayName
        allowedNodeTypes:
          - mgnl:category

  layout:
    $type: tabbedLayout
    tabs:
      general:
        label: General
        fields:
          - name: title
          - name: heading
      meta:
        label: Meta tags
        fields:
          - name: description
          - name: keywords
      contractCodes:
        label: Contract codes
        fields:
          - name: contractCodes
      partsContractCodes:
        label: Parts contract codes
        fields:
          - name: partsContractCodes
      contractTypes:
        label: Contract types
        fields:
          - name: contractTypes

light: false
