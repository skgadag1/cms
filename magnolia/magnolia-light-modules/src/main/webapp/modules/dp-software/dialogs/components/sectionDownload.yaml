label: Software Downloads
form:
  properties:
    titleField:
      $type: textField
      label: Title
      i18n: true
      required: true
    subtitleField:
      $type: textField
      label: Subtitle
      i18n: true
      rows: 5
    separator:
      $type: staticField
      label: ''
      value: ''
    softwareLinks:
      label: Software items
      $type: jcrMultiField
      required: true
      field:
        label: Software
        name: compositeField
        $type: compositeField
        properties:
          softwareLabel:
            label: Software label
            $type: textField
            i18n: true
            required: true
          content:
            $type: cloudinaryRichText
            images: true
            label: Content
            i18n: true
          softwareDownloadFile:
            !include:/dp-software/includes/s3-file.yaml
            label: Software Download File
            required: true
            i18n: true
          softwareIcon:
            !include:/dp-software/includes/concept-chooser.yaml
    documentDownloads:
      label: Documents Download Links (max 2 items)
      description: Please define max 2 download links.
      $type: jcrMultiField
#      min and maxItems properties do not work in Magnolia 6.2.8, added in 6.2.11
#      minItems: 1
#      maxItems: 2
      field:
        name: documentDownload
        label: Document Download Link
        $type: compositeField
        properties:
          icon:
            !include:/dp-software/includes/icons.yaml
          label:
            $type: textField
            label: 'Label'
            i18n: true
          softwareDownloadDocument:
            !include:/bobcat/includes/dam-asset.yaml
            label: Software Download Document
            i18n: true
            required: true

  layout:
    $type: tabbedLayout
    tabs:
      main:
        label: Main
        fields:
          - name: titleField
          - name: subtitleField
          - name: separator
          - name: softwareLinks
          - name: separator
          - name: documentDownloads

light: false
