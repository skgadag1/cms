limit: 50
strict: true
nodeTypes:
  - mgnl:page
childNodeTypes:
  - mgnl:page
  - mgnl:contentNode
references:
  pageReference:
    propertyName: pageUrl
    referenceResolver:
      class: info.magnolia.rest.reference.jcr.JcrReferenceResolverDefinition
      targetWorkspace: website
      expand: false
      generateLink: true
  contractCodes:
    propertyName: contractCodes
    referenceResolver:
      class: info.magnolia.rest.reference.jcr.JcrReferenceResolverDefinition
      targetWorkspace: category
      expand: true
      generateLink: false
  partsContractCodes:
    propertyName: partsContractCodes
    referenceResolver:
      class: info.magnolia.rest.reference.jcr.JcrReferenceResolverDefinition
      targetWorkspace: category
      expand: true
      generateLink: false
  contractTypes:
    propertyName: contractTypes
    referenceResolver:
      class: info.magnolia.rest.reference.jcr.JcrReferenceResolverDefinition
      targetWorkspace: category
      expand: true
      generateLink: false
referenceRepeat: true
referenceDepth: 10
