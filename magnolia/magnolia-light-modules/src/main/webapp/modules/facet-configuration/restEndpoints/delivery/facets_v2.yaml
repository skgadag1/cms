class: info.magnolia.rest.delivery.jcr.v2.JcrDeliveryEndpointDefinition
endpointPath: /api/content/facets
workspace: facets
depth: 10
referenceDepth: 10
bypassWorkspaceAcls: true
systemProperties:
  - mgnl:lastModified
nodeTypes:
  - mgnl:folder
  - dxp:facetGroup
  - dxp:facetCategory
  - dxp:facet
childNodeTypes:
  - dxp:facetGroup
  - dxp:facetCategory
  - dxp:facet
  - mgnl:contentNode

references:
  - name: facetTypeReferences
    propertyName: tagId
    referenceResolver:
      class: info.magnolia.rest.reference.jcr.JcrReferenceResolverDefinition
      targetWorkspace: dxpTags

  - name: switchOffSortAlphanumericReference
    propertyName: switchOffSortAlphanumeric
    referenceResolver:
      class: info.magnolia.rest.reference.jcr.JcrReferenceResolverDefinition
      targetWorkspace: facets

