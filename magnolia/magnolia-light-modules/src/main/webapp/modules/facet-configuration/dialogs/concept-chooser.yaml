class: info.magnolia.ui.chooser.definition.MultiItemWorkbenchChooserDefinition
label: Facet Chooser
actions:
  choose:
    class: info.magnolia.ui.contentapp.action.ChooseMultipleActionDefinition
    componentClass: info.magnolia.ui.contentapp.action.ChooseMultipleActionDefinition$ChooseMultipleButton
    availability:
      multiple: true
      root: true
  cancel:
    $type: closeAction
  clear:
    label: Clear
    class: info.magnolia.ui.contentapp.action.ClearValueContextActionDefinition
    availability:
      multiple: true
footerLayout:
  $type: defaultEditorActionLayout
  primaryActions:
    - choose
    - cancel
  secondaryActions:
    - clear
workbenchChooser:
  workbench:
    extensionViews:
      - name: fullTextSearch
        class: info.magnolia.ui.chooser.definition.FullTextSearchExtensionViewDefinition
    contentViews:
      features:
        $type: treeView
        multiSelect: true
        multiSelectByRowClick: true
        columns:
          jcrName:
            label: Name
            $type: jcrTitleColumn
            expandRatio: 5
            nodeTypeToIcon:
              mgnl:folder: icon-language-app
              dxp:featureCategory: icon-packager-app
              dxp:feature: icon-tags
wide: true
