class: info.magnolia.ui.chooser.definition.SingleItemWorkbenchChooserDefinition
label: Tag Chooser
actions:
  choose:
    $type: chooseAction
  cancel:
    $type: closeAction
workbenchChooser:
  workbench:
    extensionViews:
      - name: fullTextSearch
        class: info.magnolia.ui.chooser.definition.FullTextSearchExtensionViewDefinition
    contentViews:
      features:
        $type: treeView
        columns:
          jcrName:
            label: Name
            $type: jcrTitleColumn
            expandRatio: 5
            nodeTypeToIcon:
              mgnl:folder: icon-language-app
              dxp:featureCategory: icon-packager-app
              dxp:feature: icon-tags
light: false
