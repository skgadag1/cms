$type: switchableField
description: If you are creating a new facet, you can choose to manually enter the facet ID or select it from the list of existing facets.
field:
  label: Tag Facet Chooser
  $type: comboBoxField
  emptySelectionCaption: Manual
  datasource:
    $type: optionListDatasource
    options:
      - name: manual
        label: Manual
        value: manual
      - name: fromList
        label: From List
        value: fromList
itemProvider:
  $type: jcrChildNodeProvider
forms:
  manual:
    properties:
      tagId:
        $type: hiddenField
        type: java.lang.Boolean
        defaultValue: false
  fromList:
    properties:
      tagId:
        label: Facet ID
        required: true
        $type: linkField
        textInputAllowed: true
        chooserId: facet-configuration:tag-chooser
        datasource:
          $type: jcrDatasource
          workspace: dxpTags
          rootPath: /bobcat
          allowedNodeTypes:
            - mgnl:folder
            - dxp:tagGroup
label: Tag Facet ID Provider