label: Facet Hierarchy
class: info.magnolia.ui.contentapp.configuration.BrowserDescriptor
closable: false
datasource:
  $type: jcrDatasource
  workspace: facets
  includeProperties: false
  allowedNodeTypes:
    - mgnl:folder
    - dxp:facetGroup
    - dxp:facetCategory
    - dxp:facet
workbench:
  contentViews:
    facets:
      $type: treeView
      multiSelect: true
      multiSelectByRowClick: false
      columns:
        jcrName:
          label: Name
          $type: jcrTitleColumn
          nodeTypeToIcon:
            mgnl:folder: icon-language-app
            dxp:facetCategory: icon-node-content
            dxp:facetGroup: icon-view-thumbnails
            dxp:facet: icon-documents-app
        type:
          label: Type
          valueProvider: com.tbscg.doosan.magnolia.bobcat.field.BobcatContentTypeValueProvider
        jcrPublishingStatus:
          $type: lockingStatusColumn
          label: Status
        jcr:lockOwner:
          name: jcr:lockOwner
          label: Locked by
        mgnl:lastModified:
          name: mgnl:lastModified
          $type: dateColumn
          width: 200
          label: Last change
        mgnl:lastModifiedBy:
          name: mgnl:lastModifiedBy
          width: 200
          label: Last change by
actionbar:
  sections:
    root:
      availability:
        root: true
      groups:
        addActions:
          name: addActions
          items:
            - name: addFacetGroup
            - name: addFacetCategory
            - name: addFacet
        editActions:
          name: editActions
          items:
            - name: editFacetGroup
            - name: editFacetCategory
            - name: editFacet
            - name: lock
            - name: unlock
        publishingActions:
          name: publishingActions
          items:
            - name: publishItem
            - name: publishRecursive
            - name: unpublishItem
        commonActions:
          name: commonActions
          items:
            - name: renameItem
            - name: deleteItem
            - name: duplicateItem
            - name: moveItem
            - name: copyItem
            - name: pasteItem
        exportImportActions:
          name: exportImportActions
          items:
            - name: export
            - name: import
            - name: addToTranslationBatch
actions:
  !include:/commons/includes/lock-unlock-action-definition.yaml
  addFacetGroup:
    label: Add Facet Group
    icon: icon-view-thumbnails
    $type: chainedAction
    actions:
      createItem:
        $type: addNodeAction
        nodeType: dxp:facetGroup
      openDialog:
        $type: openDialogAction
        dialogId: facet-configuration:facet-group-details
        populate: false
    availability:
      writePermissionRequired: true
      nodeTypes:
        - mgnl:folder
      rules:
        isNotLockedRule:
          $type: isNotLocked
  addFacetCategory:
    label: Add Facet Category
    icon: icon-node-content
    $type: chainedAction
    actions:
      createItem:
        $type: addNodeAction
        nodeType: dxp:facetCategory
      openDialog:
        $type: openDialogAction
        dialogId: facet-configuration:facet-category-details
        populate: false
    availability:
      writePermissionRequired: true
      nodeTypes:
        - dxp:facetGroup
      rules:
        isNotLockedRule:
          $type: isNotLocked
  addFacet:
    label: Add Facet
    icon: icon-documents-app
    $type: chainedAction
    actions:
      createItem:
        $type: addNodeAction
        nodeType: dxp:facet
      openDialog:
        $type: openDialogAction
        dialogId: facet-configuration:facet-details
        populate: false
    availability:
      writePermissionRequired: true
      nodeTypes:
        - dxp:facetCategory
      rules:
        isNotLockedRule:
          $type: isNotLocked
  editFacetGroup:
    label: Edit Facet Group
    icon: icon-edit
    $type: openDialogAction
    dialogId: facet-configuration:facet-group-details
    availability:
      writePermissionRequired: true
      nodeTypes:
        - dxp:facetGroup
      rules:
        isNotLockedRule:
          $type: isNotLocked
  editFacetCategory:
    label: Edit Facet Category
    icon: icon-edit
    $type: openDialogAction
    dialogId: facet-configuration:facet-category-details
    availability:
      writePermissionRequired: true
      nodeTypes:
        - dxp:facetCategory
      rules:
        isNotLockedRule:
          $type: isNotLocked
  editFacet:
    label: Edit Facet
    icon: icon-edit
    $type: openDialogAction
    dialogId: facet-configuration:facet-details
    availability:
      writePermissionRequired: true
      nodeTypes:
        - dxp:facet
      rules:
        isNotLockedRule:
          $type: isNotLocked
  publishItem:
    label: Publish
    icon: icon-publish
    $type: jcrCommandAction
    command: publish
    catalog: versioned
    availability:
      writePermissionRequired: true
      rules:
        isPublishable:
          $type: jcrPublishableRule
        isNotLockedRule:
          $type: isNotLocked
  publishRecursive:
    icon: icon-publish-incl-sub
    $type: jcrCommandAction
    command: publish
    label: Publish recursive
    asynchronous: true
    params:
      recursive: true
    availability:
      writePermissionRequired: true
      rules:
        isPublishable:
          $type: jcrPublishableRule
        isNotLockedRule:
          $type: isNotLocked
  unpublishItem:
    label: Unpublish
    icon: icon-unpublish
    $type: jcrCommandAction
    command: unpublish
    availability:
      writePermissionRequired: true
      rules:
        isPublished:
          $type: jcrPublishedRule
        isNotLockedRule:
          $type: isNotLocked
  renameItem:
    label: Rename Item
    icon: icon-edit
    $type: openDialogAction
    dialogId: ui-framework-jcr:rename
    availability:
      writePermissionRequired: true
      nodeTypes:
        - dxp:facetGroup
        - dxp:facetCategory
        - dxp:facet
      rules:
        isNotLockedRule:
          $type: isNotLocked
  deleteItem:
    label: Delete Item
    icon: icon-delete
    $type: confirmationAction
    successActionName: delete
    dialogId: ui-framework-jcr:delete
    availability:
      multiple: true
      writePermissionRequired: true
      nodeTypes:
        - dxp:facetGroup
        - dxp:facetCategory
        - dxp:facet
      rules:
        isNotLockedRule:
          $type: isNotLocked
  duplicateItem:
    label: Duplicate Item
    icon: icon-duplicate
    $type: duplicateNodeAction
    availability:
      multiple: true
      writePermissionRequired: true
      nodeTypes:
        - dxp:facetGroup
        - dxp:facetCategory
        - dxp:facet
  moveItem:
    label: Move Item
    icon: icon-move
    $type: dxpMoveAction
    allowedRoles:
      - superuser
    availability:
      multiple: true
      writePermissionRequired: true
      nodeTypes:
        - dxp:facetGroup
        - dxp:facetCategory
        - dxp:facet
      rules:
        isNotLockedRule:
          $type: isNotLocked
  copyItem:
    label: Copy Item
    icon: icon-copy
    $type: copyContentAction
    availability:
      multiple: true
      writePermissionRequired: true
      nodeTypes:
        - dxp:facetGroup
        - dxp:facetCategory
        - dxp:facet
  pasteItem:
    label: Paste Item
    icon: icon-paste
    $type: dxpPasteContentAction
    allowedRoles:
      - superuser
    sendComponentAction: false
    availability:
      multiple: true
      writePermissionRequired: true
      nodeTypes:
        - mgnl:folder
        - dxp:facetGroup
        - dxp:facetCategory
        - dxp:facet
  import:
    label: Import
    icon: icon-import
    $type: openDialogAction
    dialogId: ui-framework-jcr:import
    availability:
      writePermissionRequired: true
      root: true
      rules:
        isNotDeleted: &isNotDeleted
          $type: jcrIsDeletedRule
          negate: true
  export:
    label: Export
    icon: icon-export
    $type: exportAction
    format: xml
    dialogName: ui-admincentral:export
    availability:
      rules:
        isNotDeleted: *isNotDeleted
  delete:
    $type: jcrCommandAction
    asynchronous: true
    command: delete
    availability:
      writePermissionRequired: true
      nodeTypes:
        - dxp:facetGroup
        - dxp:facetCategory
        - dxp:facet
      rules:
        isNotLockedRule:
          $type: isNotLocked
  lock:
    availability:
      nodeTypes: &lockableTypes
        - dxp:facetGroup
        - dxp:facetCategory
        - dxp:facet
  unlock:
    availability:
      nodeTypes: *lockableTypes
  addToTranslationBatch: 
    label: Add to translation batch
    dialogName: content-translation-support-ext-core:addToTranslationBatch
    icon: icon-add-folder
    class: info.magnolia.translation.ext.core.app.batch.action.OpenMultiEditDialogAction$Definition
    availability:
      writePermissionRequired: true
      access:
        roles: 
          - dxp-bobcat-admins
          - dxp-bobcat-admin-na
          - dxp-bobcat-publishers-na
      nodeTypes: 
        - dxp:facetGroup
        - dxp:facetCategory
        - dxp:facet
      rules:
        - name: IsNotDeletedRule
          implementationClass: info.magnolia.ui.framework.availability.IsNotDeletedRule
      multiple: true
      root: false
