appClass: info.magnolia.ui.framework.app.BaseApp
class: info.magnolia.ui.contentapp.configuration.ContentAppDescriptor
icon: icon-select
label: 'Concepts'
name: concepts-app
datasource:
  $type: jcrDatasource
  workspace: concepts
  includeProperties: false
  allowedNodeTypes:
    - mgnl:folder
    - mgnl:content
subApps:
  browser:
    class: info.magnolia.ui.contentapp.configuration.BrowserDescriptor
    label: Concepts
    workbench:
      contentViews:
        facets:
          $type: treeView
          multiSelect: true
          columns:
            jcrName:
              $type: jcrTitleColumn
              label: 'Concept name'
              sortable: true
              width: 500
              nodeTypeToIcon:
                mgnl:folder: icon-folder-l
                mgnl:content: icon-node-content
            valuePlainText:
              label: 'Value'
              propertyName: valuePlainText
              sortable: true
            status:
              $type: jcrStatusColumn
              displayInChooseDialog: false
              label: 'Status'
              sortable: true
              width: 100
            moddate:
              $type: dateColumn
              displayInChooseDialog: false
              label: 'Modification date'
              propertyName: mgnl:lastModified
              sortable: true
              width: 160
            localizationStatus:
              class: com.tbscg.doosan.magnolia.localizations.compatibility.app.column.LocalizationStatusColumnDefinition
              label: 'Package status'
              displayInChooseDialog: false
              width: 160
    actionbar:
      defaultAction: editConcept
      sections:
        root:
          label: 'Concepts'
          availability:
            nodes: false
            root: true
          groups:
            addActions:
              name: addActions
              items:
                - name: addConcept
                - name: addFolder
            editActions:
              name: editActions
              items:
                - name: paste
            exportImportActions:
              name: exportImportActions
              items:
                - name: import
        folder:
          label: 'Folder'
          availability:
            nodeTypes:
              - mgnl:folder
          groups:
            addActions:
              items:
                - name: addConcept
                - name: addFolder
            editActions:
              items:
                - name: editFolder
                - name: delete
                - name: copy
                - name: paste
                - name: move
                - name: duplicate
            publishingActions:
              items:
                - name: publish
                - name: publishRecursive
                - name: publishLocalizationsPackage
                - name: unpublish
            translationActions:
              name: translationActions
              items:
                - name: addToTranslationBatch
            eximActions:
              items:
                - name: export
                - name: import
                - name: importTranslation
                - name: exportTranslation
            versionsActions:
              items:
                - name: showVersions
                - name: restoreVersion
        content:
          label: 'Concept'
          availability:
            nodeTypes:
             - mgnl:content
          groups:
            editActions:
              items:
                - name: editConcept
                - name: renameConcept
                - name: editFolder
                - name: delete
                - name: copy
                - name: paste
                - name: move
                - name: duplicate
            publishingActions:
              items:
                - name: publish
                - name: publishRecursive
                - name: unpublish
            translationActions:
              name: translationActions
              items:
                - name: addToTranslationBatch
            eximActions:
              items:
                - name: export
                - name: import
                - name: importTranslation
                - name: exportTranslation
            versionsActions:
              items:
                - name: showVersions
                - name: restoreVersion
    actions:
      publishLocalizationsPackage:
        catalog: localizations
        class: info.magnolia.ui.framework.action.ActivationActionDefinition
        command: publishLocalizationsPackage
        icon: icon-publish
        successMessage: Publication request needs to be reviewed by an authorized person
        failureMessage: actions.activate.failureMessage
        label: Publish localizations package
        availability:
          writePermissionRequired: true
          rules:
            isPublishable:
              $type: jcrPublishableRule
            isLocalizedPackage:
              $type: isLocalizedPackage
      addToTranslationBatch:
        label: Add to translation batch
        dialogName: content-translation-support-ext-core:addToTranslationBatch
        icon: icon-add-folder
        class: info.magnolia.translation.ext.core.app.batch.action.OpenMultiEditDialogAction$Definition
        availability:
          writePermissionRequired: true
          nodeTypes: 
            - mgnl:content
            - mgnl:folder
          rules:
            - name: IsNotDeletedRule
              $type: jcrIsDeletedRule
              negate: true
          multiple: true
          root: true
      addFolder:
        $type: addNodeAction
        nodeType: mgnl:folder
        icon: icon-add-folder
        label: 'Add folder'
        availability:
          root: true
          writePermissionRequired: true
          nodeTypes:
            folder: mgnl:folder
          rules:
            isNotDeletedRule:
              $type: jcrIsDeletedRule
              negate: true
      editFolder:
        $type: openDialogAction
        dialogId: ui-framework-jcr:rename
        icon: icon-edit
        label: 'Rename folder'
        availability:
          root: true
          writePermissionRequired: true
          nodeTypes:
            folder: mgnl:folder
          rules:
            isNotDeletedRule:
              $type: jcrIsDeletedRule
              negate: true
      addConcept:
        $type: openDetailSubappAction
        subAppName: conceptDetail
        appName: concepts-app
        viewType: add
        icon: icon-add-item
        label: 'Add Concept'
        availability:
          root: true
          writePermissionRequired: true
          nodeTypes:
            folder: mgnl:folder
          rules:
            isNotDeletedRule:
              $type: jcrIsDeletedRule
              negate: true
      editConcept:
        $type: openDetailSubappAction
        subAppName: conceptDetail
        appName: concepts-app
        viewType: edit
        icon: icon-edit
        label: 'Edit Concept'
        availability:
          writePermissionRequired: true
          nodeTypes:
            content: mgnl:content
          rules:
            isNotDeletedRule:
              $type: jcrIsDeletedRule
              negate: true
      renameConcept:
        $type: openDialogAction
        dialogId: ui-framework-jcr:rename
        icon: icon-edit
        label: 'Rename Concept'
        availability:
          writePermissionRequired: true
          nodeTypes:
            content: mgnl:content
          rules:
            isNotBobcatRule:
              implementationClass: com.tbscg.doosan.magnolia.concepts.app.availability.ConceptNameAvailabilityRule
            isNotDeletedRule:
              $type: jcrIsDeletedRule
              negate: true
            isNotPublishedRule:
              $type: jcrPublishedRule
              negate: true
      copy:
        $type: copyContentAction
        icon: icon-copy
        label: 'Copy'
        availability:
          multiple: true
          writePermissionRequired: true
          rules:
            isNotDeletedRule:
              $type: jcrIsDeletedRule
              negate: true
      paste:
        $type: dxpPasteContentAction
        icon: icon-paste
        label: 'Paste'
        availability:
          root: true
          writePermissionRequired: true
          nodeTypes:
            folder: mgnl:folder
          rules:
            isNotDeletedRule:
              $type: jcrIsDeletedRule
              negate: true
            canPasteRule:
              $type: canPasteContentRule
      publish:
        icon: icon-publish
        $type: jcrCommandAction
        command: publish
        catalog: versioned
        label: Publish
        availability:
          writePermissionRequired: true
          rules:
            - name: IsPublishableRule
              $type: jcrPublishableRule
      delete:
        icon: icon-delete
        $type: markAsDeletedAction
        label: Delete
        availability:
          writePermissionRequired: true
          rules:
            - name: IsNotDeletedRule
              $type: jcrIsDeletedRule
              negate: true
            - name: IsNotPublishedRule
              $type: jcrPublishedRule
              negate: true
      publishRecursive:
        icon: icon-publish-incl-sub
        $type: jcrCommandAction
        command: publish
        label: Publish recursive
        asynchronous: true
        params:
          recursive: true
        availability:
          writePermissionRequired: true
          rules:
            - name: IsNotDeletedRule
              $type: jcrIsDeletedRule
              negate: true
            - name: IsPublishableRule
              $type: jcrPublishableRule
            - name: HasSubnodesRule
              $type: jcrHasChildrenRule
      unpublish:
        icon: icon-unpublish
        $type: jcrCommandAction
        command: unpublish
        label: Unpublish
        availability:
          rules:
            - name: IsPublishedRule
              $type: jcrPublishedRule
            - name: IsNotDeletedRule
              $type: jcrIsDeletedRule
              negate: true
      import:
        label: Import
        icon: icon-import
        $type: openDialogAction
        dialogId: ui-framework-jcr:import
        availability:
          writePermissionRequired: true
          root: true
          rules:
            isNotDeleted: &isNotDeleted
              $type: jcrIsDeletedRule
              negate: true
      export:
        label: Export
        icon: icon-export
        $type: exportAction
        format: xml
        dialogName: ui-admincentral:export
        availability:
          rules:
            isNotDeleted: *isNotDeleted
      exportTranslation:
        label: 'Export translation'
        dialogName: concepts:downloadTranslationFileConcepts
        class: info.magnolia.ui.framework.action.OpenCreateDialogActionDefinition
        icon: icon-export
        availability:
          rules:
            IsNotDeletedRule:
              $type: jcrIsDeletedRule
              negate: true
      importTranslation:
        label: 'Import translation'
        dialogName: concepts:uploadTranslationFileConcepts
        class: info.magnolia.translation.ui.action.OpenCreateTranslationFileUploadDialogActionDefinition
        icon: icon-import
        availability:
          multiple: true
          root: true
          writePermissionRequired: true
          rules:
            IsNotDeletedRule:
              $type: jcrIsDeletedRule
              negate: true
      showVersions:
        $type: showVersionAction
        icon: icon-show-versions
        availability:
          rules:
            hasVersionsRule:
              $type: jcrHasVersionsRule
      restoreVersion:
        $type: restoreJcrVersionAction
        icon: icon-retrieve-versions
        availability:
          rules:
            hasVersionsRule:
              $type: jcrHasVersionsRule
      move:
        $type: dxpMoveAction
        icon: icon-move
        availability:
          multiple: true
          rules:
            isNotDeletedRule:
              $type: jcrIsDeletedRule
              negate: true
      duplicate:
        $type: dxpDuplicateNodeAction
        icon: icon-duplicate
        availability:
          writePermissionRequired: true
          rules:
            isNotDeletedRule:
              $type: jcrIsDeletedRule
              negate: true

        
  conceptDetail:
    class: info.magnolia.ui.contentapp.detail.DetailDescriptor
    label: Concept
    itemProvider:
      $type: jcrNodeFromLocationProvider
      workspace: concepts
      nodeType: mgnl:content
    form:
      properties:
        jcrName:
          label: 'Concept name'
          $type: textField
          required: true
        value:
          $type: radioButtonGroupField
          layout: horizontal
          label: "Content type"
          required: true
          defaultValue: PlainText
          datasource:
            $type: optionListDatasource
            options:
              - name: PlainText
                label: Plain
                value: PlainText
              - name: RichText
                label: Rich
                value: RichText
        valuePlainText:
          $type: textField
          label: Plain text concept
          rows: 3
          i18n: true
        valueRichText:
          $type: cloudinaryRichText
          label: Rich text concept
          i18n: true
          source: true
          images: true
        chip:
          $type: radioButtonGroupField
          layout: horizontal
          label: "Is this a chip concept?"
          defaultValue: nocolor
          datasource:
            $type: optionListDatasource
            options:
              - name: true
                label: "Yes (Select a color)"
                value: color
              - name: false
                label: "No"
                selected: true
                value: nocolor
        chipcolor:
          $type: comboBoxField
          label: "Chip color"
          defaultValue: ""
          datasource:
            $type: optionListDatasource
            options:
              - name: gray
                label: Gray
                value: gray
              - name: black
                label: Black
                value: black
              - name: None
                label: None
                value: ""
