label: Downloads
form:
  properties:
    titleField:
      $type: textField
      label: Title
      required: true
    subtitleField:
      $type: textField
      label: Subtitle
      rows: 5
    separator:
      $type: staticField
      label: ''
      value: ''
    softwareDownloadlabel:
      $type: textField
      label: 'Software Download Link Label'
      required: true
    softwareDownloadfile:
      !include:/kags/includes/s3-file-v2.yaml
      label: Software Download File
      required: true
    softwareIcon:
      !include:/kags/includes/icons-software.yaml
      required: false
      readOnly: true
      description: 'Deprecated! Use concepts'
    softwareIconConcept:
      !include:/dp-software/includes/concept-chooser.yaml
    documentDownloads:
      $type: jcrMultiField
      label: Documents Download Links (max 1 item)
      field:
        $type: compositeField
        label: Documents Download Link
        properties:
          icon:
            !include:/kags/includes/icons-field-v2.yaml
            required: true
          label:
            $type: textField
            label: Label
          asset:
            !include:/kags/includes/dam-asset-v2.yaml
            label: Asset
            required: true
    forKeyAccounts:
      !include:/kags/includes/key-accounts-tags.yaml
    forSupertechs:
      !include:/kags/includes/expert-level.yaml
    forInternals:
      !include:/kags/includes/internal-access.yaml

  layout:
    $type: tabbedLayout
    tabs:
      tabMain:
        label: Main
        fields:
          - name: titleField
          - name: subtitleField
          - name: separator
          - name: softwareDownloadlabel
          - name: softwareDownloadfile
          - name: softwareIcon
          - name: softwareIconConcept
          - name: separator
          - name: documentDownloads
      visibilityTab:
        label: Component visibility
        fields:
          - name: forKeyAccounts
          - name: forSupertechs
          - name: forInternals
  light: false
