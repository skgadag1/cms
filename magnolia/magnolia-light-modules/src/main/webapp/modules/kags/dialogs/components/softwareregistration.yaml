label: Software Registration
form:
  properties:
    title:
      $type: textField
      label: Title
    content:
      $type: cloudinaryRichText
      images: true
      label: Content
    notice:
      $type: textField
      label: Notification
    footer:
      $type: cloudinaryRichText
      images: true
      label: Footer content
    choosenSoftware:
      !include:/kags/includes/software-registration-field.yaml
    forKeyAccounts:
      !include:/kags/includes/key-accounts-tags.yaml
    forSupertechs:
      !include:/kags/includes/expert-level.yaml
    forInternals:
      !include:/kags/includes/internal-access.yaml
  layout:
    $type: tabbedLayout
    tabs:
      config:
        label: Software Registration component configuration
        fields:
          - name: title
          - name: content
          - name: notice
          - name: footer
          - name: choosenSoftware
      visibilityTab:
        label: Component visibility
        fields:
          - name: forKeyAccounts
          - name: forSupertechs
          - name: forInternals
  light: false
