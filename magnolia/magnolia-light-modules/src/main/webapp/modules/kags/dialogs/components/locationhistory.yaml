form:
  tabs:
    - name: config
      label: Configuration
      fields:
        - name: title
          fieldType: text
          label: Title
          required: true
        - name: showBreadcrumb
          fieldType: checkbox
          label: Enable breadcrumb
          buttonLabel: Select to display breadcrumbs based on sitemap
          defaultValue: false
          type: Boolean
        - !include:/kags/includes/banner-field.yaml
        - name: startDateLabel
          fieldType: text
          label: Start date filter label
          required: true
        - name: endDateLabel
          fieldType: text
          label: End date filter label
          required: true
        - name: dateTimeLabel
          fieldType: text
          label: Date time column label
          required: true
        - name: locationLabel
          fieldType: text
          label: Location column label
          required: true
        - name: noLocationsFound
          fieldType: text
          label: No locations message
          required: true
        - name: googleMapsAPIKey
          fieldType: text
          label: Google Maps API Key
          required: true
actions: !include:/kags/includes/common-actions.yaml