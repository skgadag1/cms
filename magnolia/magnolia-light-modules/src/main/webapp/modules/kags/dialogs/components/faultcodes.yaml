form:
  tabs:
    - name: config
      label: Configuration
      fields:
        - name: title
          fieldType: text
          label: Title
          required: true
        - name: showBreadcrumb
          fieldType: checkbox
          label: Enable breadcrumb
          buttonLabel: Select to display breadcrumbs based on sitemap
          defaultValue: false
          type: Boolean
        - !include:/kags/includes/banner-field.yaml
        - name: activeCodesTitle
          fieldType: text
          label: Active fault codes title
          required: true
        - name: statusLabel
          fieldType: text
          label: Status column label
          required: true
        - name: severityLabel
          fieldType: text
          label: Severity column label
          required: true
        - name: faultCodeLabel
          fieldType: text
          label: Fault code column label
          required: true
        - name: descriptionLabel
          fieldType: text
          label: Description column label
          required: true
        - name: startTimeLabel
          fieldType: text
          label: Incident start column label
          required: true
        - name: filterStartDateLabel
          fieldType: text
          label: Incident start date filter label
          required: true
        - name: engineHoursLabel
          fieldType: text
          label: Engine hours column label
          required: true
        - name: filterEngineHoursLabel
          fieldType: text
          label: Engine hours range label
          required: true
        - name: filterEngineHoursMinLabel
          fieldType: text
          label: Engine hours filter MIN label
          required: true
        - name: filterEngineHoursMaxLabel
          fieldType: text
          label: Engine hours filter MAX label
          required: true
        - name: exportCodesLabel
          fieldType: text
          label: Export codes label
          required: true
        - name: resultsLabel
          fieldType: text
          label: Results counter label
          required: true
        - name: engineHoursNegativeError
          fieldType: text
          label: Engine hours filter zero or less value error text
          required: true
        - name: engineHoursStartGreaterError
          fieldType: text
          label: Engine hours filter start greater than end error text
          required: true
        - name: startDateGreaterError
          fieldType: text
          label: Start date greater than End date error text
          required: true
        - name: searchLabel
          fieldType: text
          label: Search label for item on hover
          required: true
        - name: descriptionSearchLabel
          fieldType: text
          label: Search label for description filter
          required: true
        - name: codeSearchLabel
          fieldType: text
          label: Search label for code filter
          required: true
        - name: showFilters
          fieldType: text
          label: Show filters label (mobile)
          required: true
        - name: hideFilters
          fieldType: text
          label: Hide filters label (mobile)
          required: true
        - name: ascendingLabel
          fieldType: text
          label: Ascending label
          required: true
        - name: descendingLabel
          fieldType: text
          label: Descending label
          required: true
        - name: troubleshootingPage
          label: Troubleshooting results page
          fieldType: link
          identifierToPathConverter:
            class: info.magnolia.ui.form.field.converter.BaseIdentifierToPathConverter
          appName: pages
          targetTreeRootPath: /kags
          targetWorkspace: website
          required: true
        - name: paginationLimit
          fieldType: text
          label: Pagination batch limit
          required: false
actions: !include:/kags/includes/common-actions.yaml