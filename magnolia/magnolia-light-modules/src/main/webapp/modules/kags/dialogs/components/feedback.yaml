form:
  tabs:
    - name: config
      label: Configuration
      fields:
        - name: surveyId
          label: Gizmo survey id
          fieldType: text
          required: true
        - name: latency
          label: Component visibility latency
          fieldType: text
          required: false
          validators:
            - name: email
              class: info.magnolia.ui.form.validator.definition.RegexpValidatorDefinition
              errorMessage: Only numbers allowed
              pattern: ^[0-9]*
        - name: feedbackButton
          label: Button label
          fieldType: text
          required: true
        - name: feedbackTitle
          label: Widget title
          fieldType: text
          required: true,
        - name: feedbackSubmit
          label: Submit button label
          fieldType: text
          required: true
        - name: feedbackThankyou
          label: Thank you message
          fieldType: text
          required: true
actions: !include:/kags/includes/common-actions.yaml