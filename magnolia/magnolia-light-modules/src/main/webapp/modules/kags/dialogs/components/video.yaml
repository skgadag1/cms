label: Configuration
form:
  properties:
    title:
      $type: textField
      label: Title
      required: true
    subtitle:
      $type: textField
      label: Subtitle
      required: true
    halfWidth:
      $type: checkBoxField
      label: Display half width
      buttonLabel: Select to display half width
      defaultValue: false
      type: java.lang.Boolean
    buttonLabel:
      $type: textField
      label: Button Label
      required: false
    videoUrl:
      !include:/kags/includes/dam-asset-v2.yaml
      label: Video file
      required: true
    videoImg:
      !include:/kags/includes/dam-asset-v2.yaml
      label: Video Image
      required: true
    videoError:
      $type: textField
      label: Error when video cannot be found
      required: true
    forKeyAccounts:
      !include:/kags/includes/key-accounts-tags.yaml
    forSupertechs:
      !include:/kags/includes/expert-level.yaml
  layout:
    $type: tabbedLayout
    tabs:
      config:
        label: Configuration
        fields:
          - name: title
          - name: subtitle
          - name: halfWidth
          - name: buttonLabel
          - name: videoUrl
          - name: videoImg
          - name: videoError
      visibilityTab:
        label: Component visibility
        fields:
          - name: forKeyAccounts
          - name: forSupertechs
  light: false
