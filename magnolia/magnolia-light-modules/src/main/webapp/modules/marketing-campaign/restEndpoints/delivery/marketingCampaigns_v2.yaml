class: info.magnolia.rest.delivery.jcr.v2.JcrDeliveryEndpointDefinition
endpointPath: /api/content/campaigns
workspace: marketingCampaigns
depth: 10
bypassWorkspaceAcls: true
systemProperties:
  - mgnl:lastModified
nodeTypes:
  - mgnl:folder
  - dxp:marketingCampaign
childNodeTypes:
  - mgnl:folder
  - dxp:marketingCampaign
  - mgnl:contentNode

references:
  - name: pageReference
    propertyName: pageUrl
    referenceResolver:
      class: com.tbscg.doosan.magnolia.bobcat.rest.delivery.CustomUrlReferenceResolverDefinition
      targetWorkspace: website
      expand: false
      generateLink: true
