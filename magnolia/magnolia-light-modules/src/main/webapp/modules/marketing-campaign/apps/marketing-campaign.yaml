label: Marketing Campaign
class: info.magnolia.ui.contentapp.configuration.ContentAppDescriptor
appClass: info.magnolia.ui.framework.app.BaseApp
name: marketing-campaign
icon: icon-target-app
datasource:
  $type: jcrDatasource
  workspace: marketingCampaigns
  includeProperties: false
  allowedNodeTypes:
    - mgnl:folder
    - dxp:marketingCampaign
subApps:
  browser:
    class: info.magnolia.ui.contentapp.configuration.BrowserDescriptor
    label: Marketing Campaign
    workbench:
      contentViews:
        facets:
          $type: treeView
          multiSelect: true
          multiSelectByRowClick: false
          columns:
            jcrName:
              label: Name
              $type: jcrTitleColumn
              nodeTypeToIcon:
                mgnl:folder: icon-language-app
                dxp:marketingCampaign: icon-node-content
            type:
              label: Type
              valueProvider: com.tbscg.doosan.magnolia.bobcat.field.BobcatContentTypeValueProvider
            jcrPublishingStatus:
              $type: lockingStatusColumn
              label: Status
            jcr:lockOwner:
              name: jcr:lockOwner
              label: Locked by
            mgnl:lastModified:
              $type: dateColumn
    actions:
      !include:/commons/includes/lock-unlock-action-definition.yaml
      addCampaign:
        icon: icon-view-thumbnails
        $type: openDetailSubappAction
        appName: marketing-campaign
        subAppName: detailMarketingCampaign
        label: Add campaign
        viewType: add
        availability:
          writePermissionRequired: true
          nodeTypes:
            - mgnl:folder
          rules:
            isNotLockedRule:
              $type: isNotLocked
      addToTranslationBatch: 
        label: Add to translation batch
        dialogName: content-translation-support-ext-core:addToTranslationBatch
        icon: icon-add-folder
        class: info.magnolia.translation.ext.core.app.batch.action.OpenMultiEditDialogAction$Definition
        availability:
          writePermissionRequired: true
          access:
            roles: 
              - dxp-bobcat-admins
              - dxp-bobcat-admin-na
              - dxp-bobcat-publishers-na
          nodeTypes: 
            - dxp:marketingCampaign
          rules:
            - name: IsNotDeletedRule
              implementationClass: info.magnolia.ui.framework.availability.IsNotDeletedRule
          multiple: true
          root: false
      editCampaign:
        icon: icon-edit
        $type: openDetailSubappAction
        appName: marketing-campaign
        subAppName: detailMarketingCampaign
        label: Edit campaign
        viewType: edit
        availability:
          writePermissionRequired: true
          nodeTypes:
            - dxp:marketingCampaign
          rules:
            isNotLockedRule:
              $type: isNotLocked
      publishItem:
        label: Publish
        icon: icon-publish
        dialogId: workflow-pages:publish
        $type: openDialogAction
        params:
          catalog: versioned
        availability:
          writePermissionRequired: true
          rules:
            isPublishable:
              $type: jcrPublishableRule
            isNotLockedRule:
              $type: isNotLocked
      publishRecursive:
        icon: icon-publish-incl-sub
        $type: jcrCommandAction
        command: publish
        label: Publish recursive
        asynchronous: true
        params:
          recursive: true
        availability:
          writePermissionRequired: true
          rules:
            isPublishable:
              $type: jcrPublishableRule
            isNotLockedRule:
              $type: isNotLocked
      unpublishItem:
        label: Unpublish
        icon: icon-unpublish
        dialogId: workflow-pages:unPublish
        $type: openDialogAction
        availability:
          writePermissionRequired: true
          rules:
            isPublished:
              $type: jcrPublishedRule
            isNotLockedRule:
              $type: isNotLocked
      renameItem:
        label: Rename Item
        icon: icon-edit
        $type: openDialogAction
        dialogId: ui-framework-jcr:rename
        availability:
          writePermissionRequired: true
          nodeTypes:
            - dxp:marketingCampaign
          rules:
            isNotLockedRule:
              $type: isNotLocked
      deleteItem:
        label: Delete Item
        icon: icon-delete
        $type: confirmationAction
        successActionName: delete
        dialogId: ui-framework-jcr:delete
        availability:
          multiple: true
          writePermissionRequired: true
          nodeTypes:
            - dxp:marketingCampaign
          rules:
            isNotLockedRule:
              $type: isNotLocked
      duplicateItem:
        label: Duplicate Item
        icon: icon-duplicate
        $type: duplicateNodeAction
        availability:
          multiple: true
          writePermissionRequired: true
          nodeTypes:
            - dxp:marketingCampaign
      moveItem:
        label: Move Item
        icon: icon-move
        $type: dxpMoveAction
        allowedRoles:
          - superuser
        availability:
          multiple: true
          writePermissionRequired: true
          nodeTypes:
            - dxp:marketingCampaign
          rules:
            isNotLockedRule:
              $type: isNotLocked
      copyItem:
        label: Copy Item
        icon: icon-copy
        $type: copyContentAction
        availability:
          multiple: true
          writePermissionRequired: true
          nodeTypes:
            - dxp:marketingCampaign
      pasteItem:
        label: Paste Item
        icon: icon-paste
        $type: dxpPasteContentAction
        allowedRoles:
          - superuser
        sendComponentAction: false
        availability:
          multiple: true
          writePermissionRequired: true
          nodeTypes:
            - mgnl:folder
      import:
        label: Import
        icon: icon-import
        $type: openDialogAction
        dialogId: ui-framework-jcr:import
        availability:
          writePermissionRequired: true
          root: true
          rules:
            isNotDeleted: &isNotDeleted
              $type: jcrIsDeletedRule
              negate: true
      export:
        label: Export
        icon: icon-export
        $type: exportAction
        format: xml
        dialogName: ui-admincentral:export
        availability:
          rules:
            isNotDeleted: *isNotDeleted
      delete:
        $type: jcrCommandAction
        asynchronous: true
        command: delete
        availability:
          writePermissionRequired: true
          nodeTypes:
            - dxp:marketingCampaign
          rules:
            isNotLockedRule:
              $type: isNotLocked
        lock:
          availability:
            nodeTypes: &lockableTypes
              - dxp:marketingCampaign
        unlock:
          availability:
            nodeTypes: *lockableTypes
    actionbar:
      defaultAction: editCampaign
      sections:
        root:
          availability:
            root: true
          groups:
            addActions:
              name: addActions
              items:
                - name: addCampaign
            editActions:
              name: editActions
              items:
                - name: editCampaign
                - name: lock
                - name: unlock
            publishingActions:
              name: publishingActions
              items:
                - name: publishItem
                - name: publishRecursive
                - name: unpublishItem
            commonActions:
              name: commonActions
              items:
                - name: renameItem
                - name: deleteItem
                - name: duplicateItem
                - name: moveItem
                - name: copyItem
                - name: pasteItem
            translationActions:
              name: translationActions
              items:
                - name: addToTranslationBatch
            exportImportActions:
              name: exportImportActions
              items:
                - name: export
                - name: import
  detailMarketingCampaign:
    class: info.magnolia.ui.contentapp.detail.DetailDescriptor
    label: Marketing Campaign
    itemProvider:
      $type: jcrNodeFromLocationProvider
      workspace: marketingCampaigns
      nodeType: dxp:marketingCampaign
    form:
      properties:
        jcrName:
          label: Campaign name
          $type: textField
          required: true
        title:
          label: Campaign title
          $type: textField
          i18n: true
          required: true
        description:
          label: Campaign description
          $type: textField
          i18n: true
          required: false
          rows: 3
          maxLength: 300
        label:
          label: Campaign label
          $type: textField
          i18n: true
          required: false
        positionIndex:
          label: Promo model index
          $type: textField
          required: true
          defaultValue: '0'
          validators:
            numberValidator:
              $type: regexpValidator
              pattern: ^$|^\d{1,5}$
              errorMessage: 'Enter a valid number'
        image:
          !include:/bobcat/includes/image.yaml
          description: '3:1 aspect ratio, 3840x1280 for best quality'
          label: Image
        link:
          !include:/bobcat/includes/page-link-or-url-field.yaml
          defaultValue: none
          field:
            datasource:
              options:
                - name: none
                  label: No link
                  value: none
          label: Link
        pagesField:
          label: Pages
          $type: jcrMultiValueField
          field:
            label: Page
            name: page
            $type: linkField
            chooserId: marketing-campaign:page-chooser
            datasource:
              $type: jcrDatasource
              workspace: website
              rootPath: /bobcat
              allowedNodeTypes:
                - mgnl:page
