label: Features
icon: icon-tags
class: info.magnolia.ui.contentapp.configuration.BrowserDescriptor
closable: false
datasource:
  $type: jcrDatasource
  workspace: features
  includeProperties: false
  allowedNodeTypes: &allowedNodeTypes
    - mgnl:folder
    - dxp:feature
    - dxp:featureGroup
    - dxp:featureCategory
workbench:
  contentViews:
    products:
      $type: treeView
      multiSelect: true
      multiSelectByRowClick: false
      columns:
        jcrName:
          label: Name
          $type: jcrTitleColumn
          expandRatio: 4
          nodeTypeToIcon:
            mgnl:folder: icon-language-app
            dxp:featureCategory: icon-packager-app
            dxp:feature: icon-tags
        regionInfo:
          label: Region
          valueProvider: com.tbscg.doosan.magnolia.product.catalog.field.RegionNameValueProvider
          expandRatio: 1
          sortable: false
        jcr:primaryType:
          label: Type
          expandRatio: 2
          valueProvider: com.tbscg.doosan.magnolia.product.catalog.field.ProductTypeValueProvider
          filterComponent:
            $type: textField
        jcrPublishingStatus:
          $type: lockingStatusColumn
          expandRatio: 1
          label: Status
        jcr:lockOwner:
          name: jcr:lockOwner
          label: Locked by
          expandRatio: 2
        mgnl:lastModified:
          $type: dateColumn
          expandRatio: 2
        mgnl:lastModifiedBy:
          label: Last change by
          $type: textField
          expandRatio: 2
actionbar:
  defaultAction: editFeature
  sections:
    root:
      availability:
        root: true
      groups:
        addActions:
          name: addActions
          items:
            - name: addGroup
            - name: addCategory
            - name: addFeature
        editActions:
          name: editActions
          items:
            - name: editGroup
            - name: editCategory
            - name: editFeature
            - name: lock
            - name: unlock
        publishingActions:
          name: publishingActions
          items:
            - name: publishItem
            - name: confirmPublishRecursive
            - name: unpublishItem
        commonActions:
          name: commonActions
          items:
            - name: renameItem
            - name: deleteItem
            - name: duplicateItem
            - name: moveItem
            - name: copyItem
            - name: pasteItem
        translationActions:
          name: translationActions
          items:
            - name: addToTranslationBatch
        exportImportActions:
          name: exportImportActions
          items:
            - name: export
            - name: import
            - name: exportFeatureHierarchyTranslation
            - name: importFeatureHierarchyTranslation
actions:
  !include:/commons/includes/lock-unlock-action-definition.yaml
  addToTranslationBatch:
    label: Add to translation batch
    dialogName: content-translation-support-ext-core:addToTranslationBatch
    icon: icon-add-folder
    class: info.magnolia.translation.ext.core.app.batch.action.OpenMultiEditDialogAction$Definition
    availability:
      writePermissionRequired: true
      access:
        roles: 
          - dxp-bobcat-admins
          - dxp-bobcat-admin-na
          - dxp-bobcat-publishers-na
      nodeTypes: *allowedNodeTypes
      rules:
        - name: IsNotDeletedRule
          implementationClass: info.magnolia.ui.framework.availability.IsNotDeletedRule
      multiple: true
      root: false
  addGroup:
    label: Add Feature Group
    icon: icon-node-content
    $type: openDetailSubappAction
    subAppName: featureGroupDetails
    appName: product-catalog
    viewType: add
    availability:
      writePermissionRequired: true
      nodeTypes:
        - mgnl:folder
        - dxp:featureGroup
      rules:
        - name: depthRule
          $type: jcrDepthRule
          minDepth: 0
          maxDepth: 2
        - name : isNotLockedRule
          $type: isNotLocked
  addCategory:
    label: Add Feature Category
    icon: icon-node-content
    $type: openDetailSubappAction
    subAppName: featureCategoryDetails
    appName: product-catalog
    viewType: add
    availability:
      writePermissionRequired: true
      nodeTypes:
        - mgnl:folder
        - dxp:featureCategory
        - dxp:featureGroup
      rules:
        - name: depthRule
          $type: jcrDepthRule
          minDepth: 0
          maxDepth: 3
        - name : isNotLockedRule
          $type: isNotLocked
  addFeature:
    label: Add Feature
    icon: icon-tags
    $type: openDetailSubappAction
    subAppName: featureDetails
    appName: product-catalog
    viewType: add
    availability:
      writePermissionRequired: true
      nodeTypes:
        - dxp:featureCategory
      rules:
        isNotLockedRule:
          $type: isNotLocked
  editGroup:
    label: Edit Feature Group
    icon: icon-edit
    $type: openDetailSubappAction
    subAppName: featureGroupDetails
    appName: product-catalog
    viewType: edit
    availability:
      writePermissionRequired: true
      nodeTypes:
        - dxp:featureGroup
      rules:
        isNotLockedRule:
          $type: isNotLocked
  editCategory:
    label: Edit Feature Category
    icon: icon-edit
    $type: openDetailSubappAction
    subAppName: featureCategoryDetails
    appName: product-catalog
    viewType: edit
    availability:
      writePermissionRequired: true
      nodeTypes:
        - dxp:featureCategory
      rules:
        isNotLockedRule:
          $type: isNotLocked
  editFeature:
    label: Edit Feature
    icon: icon-edit
    $type: openDetailSubappAction
    subAppName: featureDetails
    appName: product-catalog
    viewType: edit
    availability:
      writePermissionRequired: true
      nodeTypes:
        - dxp:feature
      rules:
        isNotLockedRule:
          $type: isNotLocked
  publishItem:
    label: Publish
    icon: icon-publish
    $type: jcrCommandAction
    command: publish
    catalog: versioned
    availability:
      access:
        roles:
          - dxp-bobcat-admins
          - dxp-bobcat-admin-na
          - dxp-bobcat-publishers-na
          - dxp-bobcat-admin-emea
          - dxp-bobcat-publishers-emea
          - dxp-bobcat-admin-alao
          - dxp-bobcat-publishers-alao
      writePermissionRequired: true
      rules:
        canBePublishedByUser:
          implementationClass: com.tbscg.doosan.magnolia.product.catalog.action.AccessToPublishDefinition
        isPublishable:
          $type: jcrPublishableRule
        isNotLockedRule:
          $type: isNotLocked
  confirmPublishRecursive:
    label: Publish recursive
    icon: icon-publish-incl-sub
    class: com.tbscg.doosan.magnolia.dxp.workflow.action.ui.field.PublishConfirmationActionDefinition
    successActionName: publishRecursive
    confirmationHeader: Publish recursive
    cancelLabel: Cancel
    proceedLabel: Publish
    availability:
      access:
        roles:
          - dxp-bobcat-admins
          - dxp-bobcat-admin-na
          - dxp-bobcat-publishers-na
          - dxp-bobcat-admin-emea
          - dxp-bobcat-publishers-emea
          - dxp-bobcat-admin-alao
          - dxp-bobcat-publishers-alao
      writePermissionRequired: true
      nodeTypes:
        - mgnl:folder
        - dxp:featureGroup
        - dxp:featureCategory
      rules:
        canBePublishedByUser:
          implementationClass: com.tbscg.doosan.magnolia.product.catalog.action.AccessToPublishDefinition
        isPublishable:
          $type: jcrPublishableRule
        isNotLockedRule:
          $type: isNotLocked
        hasSubPages:
          $type: jcrHasChildrenRule
          nodeTypes: *allowedNodeTypes
  publishRecursive:
    icon: icon-publish-incl-sub
    $type: jcrCommandAction
    command: publish
    label: Publish recursive
    asynchronous: true
    params:
      recursive: true
  unpublishItem:
    label: Unpublish
    icon: icon-unpublish
    $type: jcrCommandAction
    command: unpublish
    availability:
      access:
        roles:
          - dxp-bobcat-admins
          - dxp-bobcat-admin-na
          - dxp-bobcat-publishers-na
          - dxp-bobcat-admin-emea
          - dxp-bobcat-publishers-emea
          - dxp-bobcat-admin-alao
          - dxp-bobcat-publishers-alao
      writePermissionRequired: true
      rules:
        canBePublishedByUser:
          implementationClass: com.tbscg.doosan.magnolia.product.catalog.action.AccessToPublishDefinition
        isPublished:
          $type: jcrPublishedRule
        isNotLockedRule:
          $type: isNotLocked
  renameItem:
    label: Rename Item
    icon: icon-edit
    $type: openDialogAction
    dialogId: ui-framework-jcr:rename
    availability:
      writePermissionRequired: true
      nodeTypes:
        - dxp:feature
        - dxp:featureCategory
      rules:
        isNotLockedRule:
          $type: isNotLocked
  deleteItem:
    label: Delete Item
    icon: icon-delete
    $type: confirmationAction
    successActionName: delete
    dialogId: ui-framework-jcr:delete
    availability:
      multiple: true
      writePermissionRequired: true
      nodeTypes:
        - dxp:feature
        - dxp:featureGroup
        - dxp:featureCategory
      rules:
        isNotLockedRule:
          $type: isNotLocked
  duplicateItem:
    label: Duplicate Item
    icon: icon-duplicate
    $type: duplicateNodeAction
    availability:
      multiple: true
      writePermissionRequired: true
      nodeTypes:
        - dxp:feature
        - dxp:featureGroup
        - dxp:featureCategory
  moveItem:
    label: Move Item
    icon: icon-move
    $type: moveAction
    availability:
      multiple: true
      writePermissionRequired: true
      nodeTypes:
        - dxp:feature
        - dxp:featureGroup
        - dxp:featureCategory
      rules:
        isNotLockedRule:
          $type: isNotLocked
  copyItem:
    label: Copy Item
    icon: icon-copy
    $type: copyContentAction
    availability:
      writePermissionRequired: true
      multiple: true
      nodeTypes:
        - dxp:feature
        - dxp:featureGroup
        - dxp:featureCategory
  pasteItem:
    label: Paste Item
    icon: icon-paste
    $type: pasteContentAction
    availability:
      multiple: true
      writePermissionRequired: true
      nodeTypes:
        - mgnl:folder
        - dxp:featureCategory
        - dxp:featureGroup
  import:
    label: Import
    icon: icon-import
    $type: openDialogAction
    dialogId: ui-framework-jcr:import
    availability:
      writePermissionRequired: true
      root: true
      rules:
        isNotDeleted: &isNotDeleted
          $type: jcrIsDeletedRule
          negate: true
  export:
    label: Export
    icon: icon-export
    $type: exportAction
    format: xml
    dialogName: ui-admincentral:export
    availability:
      rules:
        isNotDeleted: *isNotDeleted
  delete:
    $type: jcrCommandAction
    asynchronous: true
    command: delete
    availability:
      writePermissionRequired: true
      nodeTypes:
        - dxp:feature
        - dxp:featureCategory
        - dxp:featureGroup
      rules:
        isNotLockedRule:
          $type: isNotLocked
  exportFeatureHierarchyTranslation:
    label: 'Export translations'
    dialogName: product-catalog:feature-translation-file-download
    class: info.magnolia.ui.framework.action.OpenCreateDialogActionDefinition
    icon: icon-export
    availability:
      nodeTypes:
        - dxp:feature
        - dxp:featureCategory
        - dxp:featureGroup
  importFeatureHierarchyTranslation:
    label: 'Import translations'
    dialogName: product-catalog:feature-translation-file-upload
    class: info.magnolia.translation.ui.action.OpenCreateTranslationFileUploadDialogActionDefinition
    icon: icon-import
    availability:
      multiple: true
      root: true
      writePermissionRequired: true
      nodeTypes:
        - dxp:feature
        - dxp:featureCategory
        - dxp:featureGroup
  lock:
    availability:
      nodeTypes: &lockableTypes
        - dxp:feature
        - dxp:featureCategory
        - dxp:featureGroup
  unlock:
    availability:
      nodeTypes: *lockableTypes