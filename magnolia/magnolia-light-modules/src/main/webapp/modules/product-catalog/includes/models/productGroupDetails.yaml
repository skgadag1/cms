class: info.magnolia.ui.contentapp.detail.DetailDescriptor
label: Product Group Details
datasource:
  $type: jcrDatasource
  workspace: products
  includeProperties: false
itemProvider:
  $type: jcrNodeFromLocationProvider
  workspace: products
  nodeType: dxp:productGroup
form:
  properties:
    jcrName:
      label: Product Group Name
      $type: textField
      required: true
    title:
      label: Title
      $type: textField
      i18n: true
    overview:
      label: Overview
      $type: cloudinaryRichText
      alignment: true
      i18n: true
    useNewOverview:
      $type: checkBoxField
      label: New Overview
      buttonLabel: Use new overview with images
      type: java.lang.Boolean
    overviewRows:
      label: Overview Rows
      $type: jcrMultiField
      i18n: true
      field:
        label: Overview Row
        name: compositeField
        $type: compositeField
        properties:
          description:
            label: Overview description
            $type: cloudinaryRichText
            alignment: true
            i18n: true
          img:
            !include:/bobcat/includes/image.yaml
    images:
      !include:/product-catalog/includes/model-images.yaml
    features:
      label: Features
      $type: jcrMultiLinkField
      chooserId: product-catalog:feature-chooser
      field:
        label: ''
        $type: linkField
        datasource:
          $type: jcrDatasource
          workspace: features
          allowedNodeTypes:
            - mgnl:folder
            - dxp:featureGroup
            - dxp:featureCategory
            - dxp:feature
            - dxp:region
    sfId:
      label: SF ID
      $type: textField
      description: 'Required field for Product Listing Field to map products with SF fields.'
    progressiveFormId:
      label: Product ID Progressive Form
      $type: textField
      description: 'If provided, this field will be used as the product ID sent to Salesforce.'
    isInheritanceDisabled:
      $type: checkBoxField
      label: Inheritance Disabled for Special Offer
      description: Disable inheritance - special offer details will not be inherited from the parent
      defaultValue: true
      buttonLabel: ''
      type: java.lang.Boolean
    isInheritanceDisabledForPricing:
      $type: checkBoxField
      label: Inheritance Disabled for Pricing
      description: Disable inheritance - pricing details will not be inherited from the parent
      defaultValue: true
      buttonLabel: ''
      type: java.lang.Boolean
    specialOfferDetails:
      label: Special Offer Details 1
      $type: textField
      i18n: true
    suggestedPrice:
      label: Suggested Price 1
      $type: textField
    specialOfferDetails2:
      label: Special Offer Details 2
      $type: textField
      i18n: true
    specialOffersDetailsAdditionalInfo:
      label: Special Offers Details Additional Info
      $type: textField
      i18n: true
    suggestedPrice2:
      label: Suggested Price 2
      $type: textField
    suggestedPriceAdditionalInfo:
      label: Suggested Price Additional Info
      $type: textField
      i18n: true
    offerDetailsLink:
      !include:/bobcat/includes/page-link-or-url-field.yaml
      label: Offer details link
      i18n: true
  layout:
    $type: tabbedLayout
    tabs:
      basic:
        label: Basic Info
        fields:
          - name: jcrName
          - name: title
          - name: overview
          - name: useNewOverview
          - name: overviewRows
          - name: sfId
          - name: progressiveFormId
      images:
        label: Images
        fields:
          - name: images
      features:
        label: Features
        fields:
          - name: features
      SPM:
        label: Sales Program
        fields:
          - name: specialOfferDetails
          - name: specialOfferDetails2
          - name: specialOffersDetailsAdditionalInfo
          - name: isInheritanceDisabled
          - name: suggestedPrice
          - name: suggestedPrice2
          - name: suggestedPriceAdditionalInfo
          - name: isInheritanceDisabledForPricing
          - name: offerDetailsLink
actions:
  commit:
    class: info.magnolia.ui.contentapp.detail.action.SaveDetailSubAppActionDefinition
    browserName: products
  cancel:
    $type: closeAction
light: false

