class: info.magnolia.ui.contentapp.detail.DetailDescriptor
label: Attachment Subcategory Details
datasource:
  $type: jcrDatasource
  workspace: attachments
  includeProperties: false
itemProvider:
  $type: jcrNodeFromLocationProvider
  workspace: attachments
  nodeType: dxp:attachmentGroup
form:
  properties:
    jcrName:
      label: Attachment Subcategory Name
      $type: textField
      required: true
    title:
      label: Title
      $type: textField
      i18n: true
    overview:
      label: Overview
      $type: cloudinaryRichText
      alignment: true
      i18n: true
    useNewOverview:
      $type: checkBoxField
      label: New Overview
      buttonLabel: Use new overview with images
      type: java.lang.Boolean
    overviewRows:
      label: Overview Rows
      $type: jcrMultiField
      i18n: true
      field:
        label: Overview Row
        name: compositeField
        $type: compositeField
        properties:
          description:
            label: Overview description
            $type: cloudinaryRichText
            alignment: true
            i18n: true
          img:
            !include:/bobcat/includes/image.yaml
    images:
      !include:/product-catalog/includes/model-images.yaml
    features:
      label: Features
      $type: jcrMultiLinkField
      chooserId: product-catalog:feature-chooser
      field:
        label: ''
        $type: linkField
        datasource:
          $type: jcrDatasource
          workspace: features
          allowedNodeTypes:
            - mgnl:folder
            - dxp:featureGroup
            - dxp:featureCategory
            - dxp:feature
            - dxp:region
    id:
      label: B&Q ID
      $type: textField
      description: 'Obligatory field for categories and subcategories to fetch data for sales options.'
    description:
      label: Description
      $type: textField
      rows: 5
      i18n: true
    pageLink:
      !include:/bobcat/includes/page-link-or-url-field.yaml
      label: Attachment Subcategory page link
      field:
        defaultValue: none
        datasource:
          options:
            - name: none
              label: No link
              value: none
      forms:
        none:
          properties:
            link:
              $type: hiddenField
              type: java.lang.Boolean
              defaultValue: true
        custom:
          properties:
            link:
              properties:
                customLabel:
                  $type: hiddenField
        page:
          properties:
            link:
              properties:
                pageLabel:
                  $type: hiddenField
    facet:
      !include:/product-catalog/includes/facet-category-chooser.yaml
      required: false
    image:
      !include:/bobcat/includes/image.yaml
      label: Attachment Subcategory image
      properties:
        src:
          buttonSelectAddLabel: Select image
    sfId:
      label: SF ID
      $type: textField
      description: 'Required field for Product Listing Field to map products with SF fields.'
    IRWProductName:
      label: IRW Product Name
      $type: textField
      description: 'Obligatory field for categories, subcategories and models to fetch dealers, pricing and product catalogue data.'
    IRWContractCode:
      label: IRW Contract Code
      $type: textField
    DINVSortRank:
      label: 'DINV Product Type Dropdown Rank'
      $type: textField
      defaultValue: '1'
      placeholder: 'Higher numbers put subcategory on top of the dropdown list. Default is 1.'
      validators:
        sortValidator:
          $type: regexpValidator
          pattern: ^$|^([1-9]|1[0-5])$
          errorMessage: 'Enter valid number within range: 1-15'
    isInheritanceDisabled:
      $type: checkBoxField
      label: Inheritance Disabled
      description: Disable inheritance - special offer details will not be inherited from the parent
      defaultValue: false
      buttonLabel: ''
      type: java.lang.Boolean
    specialOfferDetails:
      label: Special Offer Details
      $type: textField
      i18n: true
    topTasksField:
      label: Top Tasks
      $type: cloudinaryRichText
      alignment: true
      i18n: true
    howItWorksField:
      label: How It Works
      $type: cloudinaryRichText
      alignment: true
      i18n: true
    requiredComponentsField:
      label: Required Components
      $type: cloudinaryRichText
      alignment: true
      i18n: true
    optionsAccessoriesField:
      label: Options & Accessories
      $type: cloudinaryRichText
      alignment: true
      i18n: true
    attachmentType:
      label: Attachment Type
      $type: linkField
      i18n: true
      buttonSelectNewLabel: Select tag
      datasource:
        $type: filterableJcrDatasource
        describeByProperty: label
        workspace: dxpTags
        rootPath: /bobcat
        allowedNodeTypes:
          - dxp:tagGroup
          - dxp:tag
          - mgnl:folder
        nodeFilter:
          nodeName: Attachment-Type
          nodeType: dxp:tagGroup
    shortDescription:
      label: Short Description
      $type: cloudinaryRichText
      i18n: true
      maxLength: 150
    shortDescriptionNote:
      $type: staticField
      label: ''
      value: '<small><i>(for Listing Components Tiles)</i></small>'
    industry:
      !include:/product-catalog/includes/tag-chooser.yaml
      label: Industry
      field:
        datasource:
          $type: filterableJcrDatasource
          nodeFilter:
            nodeName: Industry
            nodeType: dxp:tagGroup
    sortRating:
      label: 'Sort Rating'
      $type: textField
      placeholder: 'Higher numbers put results on top of the list. Default is 0.'
      validators:
        sortValidator:
          $type: regexpValidator
          pattern: ^$|^\d{1,4}$
          errorMessage: 'Enter valid number within range: 0-9999'
    newIndicator:
      $type: checkBoxField
      label: New Indicator
      buttonLabel: Show 'NEW' indicator
      type: java.lang.Boolean
    customIndicator:
      label: Custom indicator
      $type: compositeField
      itemProvider:
        $type: jcrChildNodeProvider
      properties:
        showCustomIndicator:
          label: ''
          $type: checkBoxField
          buttonLabel: Show indicator
          type: java.lang.Boolean
        label:
          label: Indicator label
          $type: textField
          i18n: true
    listingIndicators:
      label: Listing indicators
      $type: jcrMultiField
      i18n: true
      field:
        label: Listing indicator
        name: compositeField
        $type: compositeField
        properties:
          showIndicator:
            label: ''
            $type: checkBoxField
            buttonLabel: Show indicator
            type: java.lang.Boolean
          label:
            label: Indicator label
            $type: textField
            i18n: true
    tags:
      label: Tags
      $type: jcrMultiLinkField
      chooserId: product-catalog:multi-tag-chooser
      field:
        label: ''
        $type: linkField
        datasource:
          $type: jcrDatasource
          workspace: dxpTags
          rootPath: /bobcat
          allowedNodeTypes:
            - dxp:tagGroup
            - dxp:tag
            - mgnl:folder
    page:
      $type: associatedPageField
      itemType: page
      storeProperty: attachmentModel
      i18n: true
      itemProvider:
        $type: currentItemProvider
      layout:
        $type: form
    relatedAttachments:
      !include:/product-catalog/includes/related-attachments.yaml
  layout:
    $type: tabbedLayout
    tabs:
      relatedAttachments:
        label: Related Attachments
        fields:
          - name: relatedAttachments
      basic:
        label: Basic Info
        fields:
          - name: jcrName
          - name: title
          - name: IRWProductName
          - name: IRWContractCode
          - name: DINVSortRank
          - name: id
          - name: description
          - name: pageLink
          - name: facet
          - name: sfId
          - name: sortRating
          - name: shortDescription
          - name: shortDescriptionNote
          - name: attachmentType
          - name: industry
          - name: newIndicator
          - name: customIndicator
          - name: listingIndicators
          - name: overview
          - name: useNewOverview
          - name: overviewRows
      images:
        label: Images
        fields:
          - name: image
          - name: images
      features:
        label: Features
        fields:
          - name: features
      additionalInfo:
        label: Additional Info
        fields:
          - name: topTasksField
          - name: howItWorksField
          - name: requiredComponentsField
          - name: optionsAccessoriesField
      tags:
        label: Tags
        fields:
          - name: tags
      page:
        label: Associated page
        fields:
          - name: page
      SPM:
        label: Sales Program
        fields:
          - name: specialOfferDetails
          - name: isInheritanceDisabled
actions:
  commit:
    class: info.magnolia.ui.contentapp.detail.action.SaveDetailSubAppActionDefinition
    browserName: attachments
  cancel:
    $type: closeAction
wide: true
light: false

