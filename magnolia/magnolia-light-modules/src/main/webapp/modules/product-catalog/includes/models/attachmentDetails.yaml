class: info.magnolia.ui.contentapp.detail.DetailDescriptor
label: Attachments Details
datasource:
  $type: jcrDatasource
  workspace: attachments
  includeProperties: false
itemProvider:
  $type: jcrNodeFromLocationProvider
  workspace: attachments
  nodeType: dxp:attachment
form:
  properties:
    jcrName:
      label: Attachment Name
      $type: textField
      required: true
    title:
      label: Title
      $type: textField
      i18n: true
      description: 'Used for Product Listing.'
    id:
      label: Attachment ID
      $type: textField
      description: 'One of the most important fields to fill about the model.'
    idDescription:
      $type: staticField
      label: ''
      value: Attachment ID for NA region should be M-code from GPIM and for other regions it should be PIM code.
    serialCode:
      label: Serial Code
      $type: textField
    category:
      label: 'B&Q Category'
      description: 'Category id used by Build&Quote API'
      $type: textField
    yearBuilt:
      label: Year Built
      $type: textField
      validators:
        yearValidator:
          $type: regexpValidator
          pattern: ^$|^\d{4}$
          errorMessage: Enter a valid year
    lifecycle:
      label: Lifecycle
      $type: comboBoxField
      required: true
      datasource:
        $type: optionListDatasource
        options:
          - name: current
            label: Current
            value: Current
          - name: historical
            label: Historical
            value: Historical
    yearEnd:
      label: Year End
      $type: textField
      validators:
        yearValidator:
          $type: regexpValidator
          pattern: ^$|^\d{4}$
          errorMessage: Enter a valid year
    overview:
      label: Overview
      $type: cloudinaryRichText
      alignment: true
      i18n: true
    useNewOverview:
      $type: checkBoxField
      label: New Overview
      buttonLabel: Use new overview with images
      type: java.lang.Boolean
    overviewRows:
      label: Overview Rows
      $type: jcrMultiField
      i18n: true
      field:
        label: Overview Row
        name: compositeField
        $type: compositeField
        properties:
          description:
            label: Overview description
            $type: cloudinaryRichText
            alignment: true
            i18n: true
          img:
            !include:/bobcat/includes/image.yaml
    shortDescription:
      label: Short Description
      $type: cloudinaryRichText
      i18n: true
      maxLength: 150
    shortDescriptionNote:
      $type: staticField
      label: ''
      value: '<small><i>(for Listing Components Tiles)</i></small>'
    newIndicator:
      $type: checkBoxField
      label: New Indicator
      buttonLabel: Show 'NEW' indicator
      type: java.lang.Boolean
    listingIndicators:
      label: Listing indicators
      $type: jcrMultiField
      i18n: true
      field:
        label: Listing indicator
        name: compositeField
        $type: compositeField
        properties:
          showIndicator:
            label: ''
            $type: checkBoxField
            buttonLabel: Show indicator
            type: java.lang.Boolean
          label:
            label: Indicator label
            $type: textField
            i18n: true
    customIndicator:
      label: Custom indicator
      $type: compositeField
      itemProvider:
        $type: jcrChildNodeProvider
      properties:
        showCustomIndicator:
          label: ''
          $type: checkBoxField
          buttonLabel: Show indicator
          type: java.lang.Boolean
        label:
          label: Indicator label
          $type: textField
          i18n: true
    hiddenFromSearch:
      $type: checkBoxField
      label: Hide
      buttonLabel: Hide from Product Listing
      type: java.lang.Boolean
    sortRating:
      label: 'Sort Rating'
      $type: textField
      placeholder: 'Higher numbers put results on top of the list. Default is 0.'
      validators:
        sortValidator:
          $type: regexpValidator
          pattern: ^$|^\d{1,4}$
          errorMessage: 'Enter valid number within range: 0-9999'
    attachmentType:
      label: Attachment Type
      $type: linkField
      i18n: true
      buttonSelectNewLabel: Select tag
      datasource:
        $type: filterableJcrDatasource
        describeByProperty: label
        workspace: dxpTags
        rootPath: /bobcat
        allowedNodeTypes:
          - dxp:tagGroup
          - dxp:tag
          - mgnl:folder
        nodeFilter:
          nodeName: Attachment-Type
          nodeType: dxp:tagGroup
    industry:
      !include:/product-catalog/includes/tag-chooser.yaml
      label: Industry
      field:
        datasource:
          $type: filterableJcrDatasource
          nodeFilter:
            nodeName: Industry
            nodeType: dxp:tagGroup
    images:
      !include:/product-catalog/includes/model-images.yaml
    sparrowImage:
      !include:/bobcat/includes/image.yaml
      properties:
        serialNumberPrefixes:
          $type: textField
          label: Serial Number Prefixes
    features:
      label: Features
      $type: jcrMultiLinkField
      chooserId: product-catalog:feature-chooser
      field:
        label: ''
        $type: linkField
        datasource:
          $type: jcrDatasource
          workspace: features
          allowedNodeTypes:
            - mgnl:folder
            - dxp:featureGroup
            - dxp:featureCategory
            - dxp:feature
            - dxp:region
    tags:
      label: Tags
      $type: jcrMultiLinkField
      chooserId: product-catalog:multi-tag-chooser
      field:
        label: ''
        $type: linkField
        datasource:
          $type: jcrDatasource
          workspace: dxpTags
          rootPath: /bobcat
          allowedNodeTypes:
            - dxp:tagGroup
            - dxp:tag
            - mgnl:folder
    brochure:
      !include:/product-catalog/includes/brochure.yaml
    fullSpecifications:
      label: GPIM / PIM++
      i18n: true
      $type: productCompositeField
      specLevel: 3
      layout:
        $type: form
      itemProvider:
        $type: currentItemProvider
    manualFullSpecifications:
      label: Full Specs
      $type: jcrMultiField
      buttonSelectAddLabel: Add section
      i18n: true
      field:
        label: Specification Section
        $type: compositeField
        properties:
          propertyName:
            label: Section name
            $type: textField
            required: true
            requiredErrorMessage: This field is required!
          propertyRows:
            label: Table rows
            $type: jcrMultiField
            buttonSelectAddLabel: Add row
            field:
              label: ''
              $type: compositeField
              layout:
                $type: horizontal
              properties:
                propertyName:
                  label: Name
                  $type: textField
                  placeholder: Field cannot be empty
                  validators: &fullSpecNameValidator
                    nameValidator:
                      $type: nodeNameValidator
                      errorMessage: Field cannot be empty
                propertValue:
                  label: Value
                  $type: textField
                  placeholder: Field cannot be empty
                  validators: *fullSpecNameValidator
                propertyUnit:
                  label: Unit
                  $type: textField
    products:
      label: Products
      $type: jcrMultiField
      field:
        label: Compatible product
        name: product
        $type: linkField
        chooserId: product-catalog:product-chooser
        datasource:
          $type: jcrDatasource
          workspace: products
          allowedNodeTypes:
            - mgnl:folder
            - dxp:category
            - dxp:subcategory
            - dxp:product
            - dxp:productGroup
            - dxp:region
    relatedAttachments:
      !include:/product-catalog/includes/related-attachments.yaml
    page:
      $type: associatedPageField
      itemType: page
      storeProperty: attachmentModel
      itemProvider:
        $type: currentItemProvider
      i18n: true
      layout:
        $type: form
    topTasksField:
      label: Top Tasks
      $type: cloudinaryRichText
      alignment: true
      i18n: true
    howItWorksField:
      label: How It Works
      $type: cloudinaryRichText
      alignment: true
      i18n: true
    requiredComponentsField:
      label: Required Components
      $type: cloudinaryRichText
      alignment: true
      i18n: true
    optionsAccessoriesField:
      label: Options & Accessories
      $type: cloudinaryRichText
      alignment: true
      i18n: true
    suggestedPrice:
      label: Suggested Price
      $type: textField
  layout:
    $type: tabbedLayout
    tabs:
      products:
        label: Products
        fields:
          - name: products
      relatedAttachments:
        label: Related Attachments
        fields:
          - name: relatedAttachments
      basic:
        label: Basic Info
        fields:
          - name: jcrName
          - name: title
          - name: id
          - name: idDescription
          - name: serialCode
          - name: category
          - name: yearBuilt
          - name: lifecycle
          - name: yearEnd
          - name: attachmentType
          - name: industry
          - name: overview
          - name: useNewOverview
          - name: overviewRows
          - name: shortDescription
          - name: shortDescriptionNote
          - name: newIndicator
          - name: customIndicator
          - name: listingIndicators
          - name: hiddenFromSearch
          - name: sortRating
          - name: suggestedPrice
      images:
        label: Images
        fields:
          - name: images
      sparrowImage:
        label: Sparrow Image
        fields:
          - name: sparrowImage
      tags:
        label: Tags
        fields:
          - name: tags
      features:
        label: Features
        fields:
          - name: features
      brochure:
        label: Brochure
        fields:
          - name: brochure
      fullSpecs:
        label: Full Specifications
        fields:
          - name: fullSpecifications
      manualFullSpecs:
        label: Manual Full Specifications
        fields:
          - name: manualFullSpecifications
      additionalInfo:
        label: Additional Info
        fields:
          - name: topTasksField
          - name: howItWorksField
          - name: requiredComponentsField
          - name: optionsAccessoriesField
      page:
        label: Associated page
        fields:
          - name: page
actions:
  commit:
    class: info.magnolia.ui.contentapp.detail.action.SaveDetailSubAppActionDefinition
    browserName: attachments
  cancel:
    $type: closeAction
wide: true
light: false

