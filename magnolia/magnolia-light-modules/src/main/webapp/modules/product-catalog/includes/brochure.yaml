label: Brochure source
$type: switchableField
i18n: true
field:
  $type: radioButtonGroupField
  layout: horizontal
  defaultValue: none
  i18n: true
  datasource:
    $type: optionListDatasource
    options:
      - name: doc
        label: Document
        value: doc
      - name: pdf
        label: PDF
        value: pdf
      - name: none
        label: None
        value: none
itemProvider:
  $type: jcrChildNodeProvider
forms:
  doc:
    properties:
      label:
          label: Brochure download label
          $type: textField
          required: true
          i18n: true
      filePath:
        !include:/bobcat/includes/dam-doc.yaml
        i18n: false
  pdf:
    properties:
      label:
        label: Brochure download label
        $type: textField
        required: true
        i18n: true
      filePath:
        !include:/bobcat/includes/dam-pdf.yaml
        i18n: false
