class: info.magnolia.ui.chooser.definition.SingleItemWorkbenchChooserDefinition
actions:
  choose:
    $type: chooseAction
  cancel:
    $type: closeAction
workbenchChooser:
  workbench:
    extensionViews:
      - name: fullTextSearch
        class: info.magnolia.ui.chooser.definition.FullTextSearchExtensionViewDefinition
    contentViews:
      features:
        $type: treeView
        readOnly: true
        columns:
          jcrName:
            label: Name
            $type: jcrTitleColumn
            expandRatio: 5
            nodeTypeToIcon:
              mgnl:folder: icon-language-app
              dxp:featureCategory: icon-packager-app
              dxp:feature: icon-tags
          regionInfo:
            label: Region
            valueProvider: com.tbscg.doosan.magnolia.product.catalog.field.RegionNameValueProvider
            expandRatio: 1
            sortable: false
          jcr:primaryType:
            label: Type
            valueProvider: com.tbscg.doosan.magnolia.product.catalog.field.ProductTypeValueProvider
            expandRatio: 3
            filterComponent:
              $type: textField
          jcrPublishingStatus:
            $type: lockingStatusColumn
            label: Status
          jcr:lockOwner:
            name: jcr:lockOwner
            label: Locked by
            expandRatio: 3
          mgnl:lastModified:
            $type: dateColumn
            expandRatio: 3
light: false
