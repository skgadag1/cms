class: info.magnolia.ui.contentapp.detail.DetailDescriptor
label: Feature Category Details
datasource:
  $type: jcrDatasource
  workspace: features
  includeProperties: false
itemProvider:
  $type: jcrNodeFromLocationProvider
  workspace: features
  nodeType: dxp:featureCategory
form: 
  properties:
    jcrName:
      label: Feature Category Name
      $type: textField
      required: true
    title:
      label: Title
      $type: textField
      i18n: true
    description:
      label: Description
      $type: textField
      rows: 5
      i18n: true
  layout:
    $type: tabbedLayout
    tabs:
      basic:
        label: Basic Info
        fields:
          - name: jcrName
          - name: title
          - name: description
actions:
  commit:
    class: info.magnolia.ui.contentapp.detail.action.SaveDetailSubAppActionDefinition
    browserName: features
  cancel:
    $type: closeAction
wide: true
light: false

