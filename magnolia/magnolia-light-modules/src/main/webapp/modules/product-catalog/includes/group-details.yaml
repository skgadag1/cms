label: Group Details
form:
  properties:
    jcrName:
      label: Group Name
      $type: textField
      required: true
    title:
      label: Title
      $type: textField
      i18n: true
    overview:
      label: Overview
      $type: cloudinaryRichText
      alignment: true
      i18n: true
    useNewOverview:
      $type: checkBoxField
      label: New Overview
      buttonLabel: Use new overview with images
      type: java.lang.Boolean
    overviewRows:
      label: Overview Rows
      $type: jcrMultiField
      field:
        label: Overview Row
        name: compositeField
        $type: compositeField
        properties:
          description:
            label: Overview description
            $type: cloudinaryRichText
            alignment: true
            i18n: true
          img:
            !include:/bobcat/includes/image.yaml
    images:
      !include:/product-catalog/includes/model-images.yaml
    features:
      label: Features
      $type: jcrMultiLinkField
      chooserId: product-catalog:feature-chooser
      field:
        label: ''
        $type: linkField
        datasource:
          $type: jcrDatasource
          workspace: features
          allowedNodeTypes:
            - mgnl:folder
            - dxp:featureGroup
            - dxp:featureCategory
            - dxp:feature
            - dxp:region
  layout:
    $type: tabbedLayout
    tabs:
      basic:
        label: Basic Info
        fields:
          - name: jcrName
          - name: title
          - name: overview
          - name: useNewOverview
          - name: overviewRows
      images:
        label: Images
        fields:
          - name: images
      features:
        label: Features
        fields:
          - name: features
light: false