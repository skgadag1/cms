label: Products
class: info.magnolia.ui.contentapp.configuration.BrowserDescriptor
closable: false
datasource:
  $type: jcrDatasource
  workspace: products
  includeProperties: false
  allowedNodeTypes: &allowedNodeTypes
    - mgnl:folder
    - dxp:product
    - dxp:category
    - dxp:subcategory
    - dxp:productGroup
workbench:
  contentViews:
    tree:
      $type: treeView
      multiSelect: true
      multiSelectByRowClick: false
      columns:
        jcrName:
          label: Name
          $type: jcrTitleColumn
          expandRatio: 4
          nodeTypeToIcon:
            mgnl:folder: icon-language-app
            dxp:category: icon-node-content
            dxp:subcategory: icon-packager-app
            dxp:product: icon-documents-app
            dxp:productGroup: icon-view-thumbnails
        regionInfo:
          label: Region
          valueProvider: com.tbscg.doosan.magnolia.product.catalog.field.RegionNameValueProvider
          expandRatio: 1
          sortable: false
        id:
          label: ID
          expandRatio: 1
          filterComponent:
            $type: textField
        serialCode:
          label: Serial Code
          expandRatio: 1
          filterComponent:
            $type: textField
        jcr:primaryType:
          label: Type
          expandRatio: 2
          valueProvider: com.tbscg.doosan.magnolia.product.catalog.field.ProductTypeLifecycleExtensionProvider
          filterComponent:
            $type: textField
        lifecycle:
          label: Lifecycle
          type: java.lang.String
          expandRatio: 1
          filterComponent:
            $type: textField
        yearEnd:
          label: Year End
          expandRatio: 1
          filterComponent:
            $type: textField
        jcrPublishingStatus:
          $type: lockingStatusColumn
          expandRatio: 1
          label: Status
        jcr:lockOwner:
          name: jcr:lockOwner
          label: Locked by
          expandRatio: 2
        mgnl:lastModified:
          $type: dateColumn
          expandRatio: 2
        mgnl:lastModifiedBy:
          label: Last change by
          $type: textField
          expandRatio: 2
actionbar:
  defaultAction: editModel
  sections:
    root:
      availability:
        root: true
      groups:
        addActions:
          name: addActions
          items:
            - name: addCategory
            - name: addSubcategory
            - name: addModel
            - name: addGroup
        editActions:
          name: editActions
          items:
            - name: editCategory
            - name: editSubcategory
            - name: editModel
            - name: editGroup
            - name: lock
            - name: unlock
        publishingActions:
          name: publishingActions
          items:
            - name: publishItem
            - name: confirmPublishRecursive
            - name: confirmPublishCurrentRecursive
            - name: confirmPublishHistoricalRecursive
            - name: unpublishItem
        commonActions:
          name: commonActions
          items:
            - name: renameItem
            - name: deleteItem
            - name: duplicateItem
            - name: moveItem
            - name: copyItem
            - name: pasteItem
        translationActions:
          name: translationActions
          items:
            - name: addToTranslationBatch
        exportImportActions:
          name: exportImportActions
          items:
            - name: export
            - name: import
            - name: exportProductHierarchyTranslation
            - name: importProductHierarchyTranslation
        externalImportActions:
          name: exportImportActions
          items:
            - name: importFromGPIM
            - name: importFromPIMPP
actions:
  !include:/commons/includes/lock-unlock-action-definition.yaml
  addToTranslationBatch:
    label: Add to translation batch
    dialogName: content-translation-support-ext-core:addToTranslationBatch
    icon: icon-add-folder
    class: info.magnolia.translation.ext.core.app.batch.action.OpenMultiEditDialogAction$Definition
    availability:
      writePermissionRequired: true
      access:
        roles: 
          - dxp-bobcat-admins
          - dxp-bobcat-admin-na
          - dxp-bobcat-publishers-na
      nodeTypes: *allowedNodeTypes
      rules:
        - name: IsNotDeletedRule
          implementationClass: info.magnolia.ui.framework.availability.IsNotDeletedRule
      multiple: true
      root: false
  addCategory:
    label: Add Category
    icon: icon-node-content
    $type: openDetailSubappAction
    subAppName: detailCategory
    appName: product-catalog
    viewType: add
    availability:
      writePermissionRequired: true
      nodeTypes:
        - mgnl:folder
      rules:
        isNotLockedRule:
          $type: isNotLocked
  addSubcategory:
    label: Add Subcategory
    icon: icon-packager-app
    $type: openDetailSubappAction
    subAppName: subcategoryDetails
    appName: product-catalog
    viewType: add
    availability:
      writePermissionRequired: true
      nodeTypes:
        - dxp:category
      rules:
        isNotLockedRule:
          $type: isNotLocked
  addModel:
    label: Add Model
    icon: icon-documents-app
    $type: openDetailSubappAction
    subAppName: productDetails
    appName: product-catalog
    viewType: add
    availability:
      writePermissionRequired: true
      nodeTypes:
        - dxp:category
        - dxp:subcategory
        - dxp:productGroup
      rules:
        isNotLockedRule:
          $type: isNotLocked
  addGroup:
    label: Add Product Group
    icon: icon-view-thumbnails
    $type: openDetailSubappAction
    subAppName: productGroupDetails
    appName: product-catalog
    viewType: add
    availability:
      writePermissionRequired: true
      nodeTypes:
        - dxp:category
        - dxp:subcategory
      rules:
        isNotLockedRule:
          $type: isNotLocked
  editCategory:
    label: Edit Category
    icon: icon-edit
    $type: openDetailSubappAction
    subAppName: detailCategory
    appName: product-catalog
    viewType: edit
    availability:
      writePermissionRequired: true
      nodeTypes:
        - dxp:category
      rules:
        isNotLockedRule:
          $type: isNotLocked
  editSubcategory:
    label: Edit Subcategory
    icon: icon-edit
    $type: openDetailSubappAction
    subAppName: subcategoryDetails
    appName: product-catalog
    viewType: edit
    availability:
      writePermissionRequired: true
      nodeTypes:
        - dxp:subcategory
      rules:
        isNotLockedRule:
          $type: isNotLocked
  editModel:
    label: Edit Model
    icon: icon-edit
    $type: openDetailSubappAction
    subAppName: productDetails
    appName: product-catalog
    viewType: edit
    availability:
      writePermissionRequired: true
      nodeTypes:
        - dxp:product
      rules:
        isNotLockedRule:
          $type: isNotLocked
  editGroup:
    label: Edit Group
    icon: icon-edit
    $type: openDetailSubappAction
    subAppName: productGroupDetails
    appName: product-catalog
    viewType: edit
    availability:
      writePermissionRequired: true
      nodeTypes:
        - dxp:productGroup
      rules:
        isNotLockedRule:
          $type: isNotLocked
  publishItem:
    label: Publish
    icon: icon-publish
    $type: jcrCommandAction
    command: publish
    availability:
      access:
        roles: &publishingRoles
          - dxp-bobcat-admins
          - dxp-bobcat-admin-na
          - dxp-bobcat-publishers-na
          - dxp-bobcat-admin-emea
          - dxp-bobcat-publishers-emea
          - dxp-bobcat-admin-alao
          - dxp-bobcat-publishers-alao
      writePermissionRequired: true
      rules:
        isPublishable:
          $type: jcrPublishableRule
        canBePublishedByUser:
          implementationClass: com.tbscg.doosan.magnolia.product.catalog.action.AccessToPublishDefinition
        isNotLockedRule:
          $type: isNotLocked
  confirmPublishCurrentRecursive:
    label: Publish recursive current only
    icon: icon-publish-incl-sub
    class: com.tbscg.doosan.magnolia.dxp.workflow.action.ui.field.PublishConfirmationActionDefinition
    successActionName: publishCurrentRecursive
    confirmationHeader: Publish recursive current only
    cancelLabel: Cancel
    proceedLabel: Publish
    params:
      lifecycle: Current
    availability:
      access:
        roles: *publishingRoles
      writePermissionRequired: true
      nodeTypes:
        - mgnl:folder
        - dxp:category
        - dxp:subcategory
        - dxp:productGroup
      rules:
        canBePublishedByUser:
          implementationClass: com.tbscg.doosan.magnolia.product.catalog.action.AccessToPublishDefinition
        isPublishable:
          $type: jcrPublishableRule
        isNotLockedRule:
          $type: isNotLocked
        hasSubPages:
          $type: jcrHasChildrenRule
          nodeTypes: *allowedNodeTypes
  publishCurrentRecursive:
    icon: icon-publish-incl-sub
    $type: jcrCommandAction
    command: publish
    label: Publish recursive current only
    asynchronous: true
    params:
      recursive: true
      lifecycle: Current
  confirmPublishHistoricalRecursive:
    label: Publish recursive historical only
    icon: icon-publish-incl-sub
    class: com.tbscg.doosan.magnolia.dxp.workflow.action.ui.field.PublishConfirmationActionDefinition
    successActionName: publishHistoricalRecursive
    confirmationHeader: Publish recursive historical only
    cancelLabel: Cancel
    proceedLabel: Publish
    params:
      lifecycle: Historical
    availability:
      access:
        roles: *publishingRoles
      writePermissionRequired: true
      nodeTypes:
        - mgnl:folder
        - dxp:category
        - dxp:subcategory
        - dxp:productGroup
      rules:
        canBePublishedByUser:
          implementationClass: com.tbscg.doosan.magnolia.product.catalog.action.AccessToPublishDefinition
        isPublishable:
          $type: jcrPublishableRule
        isNotLockedRule:
          $type: isNotLocked
        hasSubPages:
          $type: jcrHasChildrenRule
          nodeTypes: *allowedNodeTypes
  publishHistoricalRecursive:
    icon: icon-publish-incl-sub
    $type: jcrCommandAction
    command: publish
    label: Publish recursive historical only
    asynchronous: true
    params:
      recursive: true
      lifecycle: Historical
  confirmPublishRecursive:
    label: Publish recursive
    icon: icon-publish-incl-sub
    class: com.tbscg.doosan.magnolia.dxp.workflow.action.ui.field.PublishConfirmationActionDefinition
    successActionName: publishRecursive
    confirmationHeader: Publish recursive
    cancelLabel: Cancel
    proceedLabel: Publish
    availability:
      access:
        roles: *publishingRoles
      writePermissionRequired: true
      nodeTypes:
        - mgnl:folder
        - dxp:category
        - dxp:subcategory
        - dxp:productGroup
      rules:
        canBePublishedByUser:
          implementationClass: com.tbscg.doosan.magnolia.product.catalog.action.AccessToPublishDefinition
        isPublishable:
          $type: jcrPublishableRule
        isNotLockedRule:
          $type: isNotLocked
        hasSubPages:
          $type: jcrHasChildrenRule
          nodeTypes: *allowedNodeTypes
  publishRecursive:
    icon: icon-publish-incl-sub
    $type: jcrCommandAction
    command: publish
    label: Publish recursive all
    asynchronous: true
    params:
      recursive: true
  unpublishItem:
    label: Unpublish
    icon: icon-unpublish
    $type: jcrCommandAction
    command: unpublish
    availability:
      access:
        roles: *publishingRoles
      writePermissionRequired: true
      rules:
        canBePublishedByUser:
          implementationClass: com.tbscg.doosan.magnolia.product.catalog.action.AccessToPublishDefinition
        isPublished:
          $type: jcrPublishedRule
        isNotLockedRule:
          $type: isNotLocked
  renameItem:
    label: Rename Item
    icon: icon-edit
    $type: openDialogAction
    dialogId: ui-framework-jcr:rename
    availability:
      writePermissionRequired: true
      nodeTypes:
        - dxp:product
        - dxp:category
        - dxp:subcategory
        - dxp:productGroup
      rules:
        isNotLockedRule:
          $type: isNotLocked
  deleteItem:
    label: Delete Item
    icon: icon-delete
    $type: productDeletionConfirmationAction
    successActionName: delete
    dialogId: ui-framework-jcr:delete
    availability:
      multiple: true
      writePermissionRequired: true
      nodeTypes:
        - dxp:product
        - dxp:category
        - dxp:subcategory
        - dxp:productGroup
      rules:
        isNotLockedRule:
          $type: isNotLocked
  duplicateItem:
    label: Duplicate Item
    icon: icon-duplicate
    $type: duplicateNodeAction
    availability:
      multiple: true
      writePermissionRequired: true
      nodeTypes:
        - dxp:product
        - dxp:category
        - dxp:subcategory
        - dxp:productGroup
  moveItem:
    label: Move Item
    icon: icon-move
    $type: dxpMoveAction
    allowedRoles:
      - superuser
    availability:
      multiple: true
      writePermissionRequired: true
      nodeTypes:
        - dxp:product
        - dxp:category
        - dxp:subcategory
        - dxp:productGroup
      rules:
        isNotLockedRule:
          $type: isNotLocked
  copyItem:
    label: Copy Item
    icon: icon-copy
    $type: copyContentAction
    availability:
      multiple: true
      writePermissionRequired: true
      nodeTypes:
        - dxp:product
        - dxp:category
        - dxp:subcategory
        - dxp:productGroup
  pasteItem:
    label: Paste Item
    icon: icon-paste
    $type: dxpPasteContentAction
    allowedRoles:
      - superuser
    sendComponentAction: false
    availability:
      multiple: true
      writePermissionRequired: true
      nodeTypes:
        - mgnl:folder
        - dxp:category
        - dxp:subcategory
        - dxp:productGroup
  import:
    label: Import
    icon: icon-import
    $type: openDialogAction
    dialogId: ui-framework-jcr:import
    availability:
      writePermissionRequired: true
      root: true
      rules:
        isNotDeleted: &isNotDeleted
          $type: jcrIsDeletedRule
          negate: true
  export:
    label: Export
    icon: icon-export
    $type: exportAction
    format: xml
    dialogName: ui-admincentral:export
    availability:
      rules:
        isNotDeleted: *isNotDeleted
  importFromGPIM:
    label: Import data from GPIM
    icon: icon-import
    $type: importExternalAction
    targetPath: /bobcat
    source: GPIM_PRODUCTS
    workspace: products
    availability:
      root: true
      writePermissionRequired: true
      access:
        roles: [ dxp-bobcat-technical-admins ]
  importFromPIMPP:
    label: Import /eu data from PIM++
    icon: icon-import
    $type: importExternalAction
    targetPath: /bobcat/eu
    source: PIMPP_PRODUCTS
    workspace: products
    availability:
      root: true
      writePermissionRequired: true
      access:
        roles: [ dxp-bobcat-technical-admins ]
  delete:
    $type: chainedAction
    actions:
      updateAttachments:
        $type: removeDeletedProductsFromAttachmentsAction
        asynchronous: true
        command: updateAttachments
        availability:
          writePermissionRequired: true
          nodeTypes:
            - dxp:product
            - dxp:category
            - dxp:subcategory
            - dxp:productGroup
          rules:
            isNotLockedRule:
              $type: isNotLocked
      deleteJCR:
        $type: jcrCommandAction
        asynchronous: true
        command: delete
        availability:
          writePermissionRequired: true
          nodeTypes:
            - dxp:product
            - dxp:category
            - dxp:subcategory
            - dxp:productGroup
          rules:
            isNotLockedRule:
              $type: isNotLocked
  exportProductHierarchyTranslation:
    label: 'Export translations'
    dialogName: product-catalog:product-translation-file-download
    class: info.magnolia.ui.framework.action.OpenCreateDialogActionDefinition
    icon: icon-export
    availability:
      nodeTypes:
        - dxp:product
        - dxp:category
        - dxp:subcategory
        - dxp:productGroup
  importProductHierarchyTranslation:
    label: 'Import translations'
    dialogName: product-catalog:product-translation-file-upload
    class: info.magnolia.translation.ui.action.OpenCreateTranslationFileUploadDialogActionDefinition
    icon: icon-import
    availability:
      multiple: true
      root: true
      writePermissionRequired: true
      nodeTypes:
        - dxp:product
        - dxp:category
        - dxp:subcategory
        - dxp:productGroup
  lock:
    availability:
      nodeTypes: &lockableTypes
        - dxp:product
        - dxp:category
        - dxp:subcategory
        - dxp:productGroup
  unlock:
    availability:
      nodeTypes: *lockableTypes