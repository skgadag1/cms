label: Model Details
form:
  properties:
    jcrName:
      label: Model Name
      $type: textField
      required: true
    title:
      label: Title
      $type: textField
      i18n: true
      description: 'Used for Product Listing.'
    id:
      label: Model ID
      $type: textField
      description: 'One of the most important fields to fill about the model.'
    idDescription:
      $type: staticField
      label: ''
      value: Model ID for NA region should be M-code from GPIM and for other regions it should be PIM code.
    serialCode:
      label: Serial Code
      $type: textField
    category:
      label: 'B&Q Category'
      description: 'Category id used by Build&Quote API'
      $type: textField
    sortRating:
      label: 'Sort Rating'
      $type: textField
      placeholder: 'Higher numbers put results on top of the list. Default is 0.'
      validators:
        sortValidator:
          $type: regexpValidator
          pattern: ^$|^\d{1,4}$
          errorMessage: 'Enter valid number within range: 0-9999'
    yearBuilt:
      label: Year Built
      $type: textField
      validators:
        yearValidator:
          $type: regexpValidator
          pattern: ^$|^\d{4}$
          errorMessage: Enter a valid year
    lifecycle:
      label: Lifecycle
      $type: comboBoxField
      required: true
      datasource:
        $type: optionListDatasource
        options:
          - name: current
            label: Current
            value: Current
          - name: historical
            label: Historical
            value: Historical
    yearEnd:
      label: Year End
      $type: textField
      validators:
        yearValidator:
          $type: regexpValidator
          pattern: ^$|^\d{4}$
          errorMessage: Enter a valid year
    overview:
      label: Overview
      $type: cloudinaryRichText
      alignment: true
      i18n: true
    useNewOverview:
      $type: checkBoxField
      label: New Overview
      buttonLabel: Use new overview with images
      type: java.lang.Boolean
    overviewRows:
      label: Overview Rows
      $type: jcrMultiField
      i18n: true
      field:
        label: Overview Row
        name: compositeField
        $type: compositeField
        properties:
          description:
            label: Overview description
            $type: cloudinaryRichText
            alignment: true
            i18n: true
          img:
            !include:/bobcat/includes/image.yaml
    images:
      !include:/product-catalog/includes/model-images.yaml
    features:
      label: Features
      $type: jcrMultiLinkField
      chooserId: product-catalog:feature-chooser
      field:
        label: ''
        $type: linkField
        datasource:
          $type: jcrDatasource
          workspace: features
          allowedNodeTypes:
            - mgnl:folder
            - dxp:featureGroup
            - dxp:featureCategory
            - dxp:feature
            - dxp:region
    sparrowImage:
      !include:/bobcat/includes/image.yaml
      properties:
        serialNumberPrefixes:
          $type: textField
          label: Serial Number Prefixes
    fullSpecifications:
      label: GPIM / PIM++
      i18n: true
      $type: productCompositeField
      specLevel: 3
      layout:
        $type: form
      itemProvider:
        $type: currentItemProvider
    brochure:
      !include:/product-catalog/includes/brochure.yaml
    manualFullSpecifications:
      label: Full Specs
      $type: jcrMultiField
      buttonSelectAddLabel: Add section
      i18n: true
      field:
        label: Specification Section
        $type: compositeField
        properties:
          propertyName:
            label: Section name
            $type: textField
            required: true
            requiredErrorMessage: This field is required!
          propertyRows:
            label: Table rows
            $type: jcrMultiField
            buttonSelectAddLabel: Add row
            field:
              label: ''
              $type: compositeField
              layout:
                $type: horizontal
              properties:
                propertyName:
                  label: Name
                  $type: textField
                  placeholder: Field cannot be empty
                  validators: &nameValidator
                    nameValidator:
                      $type: nodeNameValidator
                      errorMessage: Field cannot be empty
                propertValue:
                  label: Value
                  $type: textField
                  placeholder: Field cannot be empty
                  validators: *nameValidator
                propertyUnit:
                  label: Unit
                  $type: textField
    shortDescription:
      label: Short Description
      $type: cloudinaryRichText
      i18n: true
      maxLength: 150
    shortDescriptionNote:
      $type: staticField
      label: ''
      value: '<small><i>(for Listing Components Tiles)</i></small>'
    newIndicator:
      $type: checkBoxField
      label: New Indicator
      buttonLabel: Show 'NEW' indicator
      type: java.lang.Boolean
    listingIndicators:
      label: Listing indicators
      $type: jcrMultiField
      i18n: true
      field:
        label: Listing indicator
        name: compositeField
        $type: compositeField
        properties:
          showIndicator:
            label: ''
            $type: checkBoxField
            buttonLabel: Show indicator
            type: java.lang.Boolean
          label:
            label: Indicator label
            $type: textField
            i18n: true
    customIndicator:
      label: Custom indicator
      $type: compositeField
      itemProvider:
        $type: jcrChildNodeProvider
      properties:
        showCustomIndicator:
          label: ''
          $type: checkBoxField
          buttonLabel: Show indicator
          type: java.lang.Boolean
        label:
          label: Indicator label
          $type: textField
          i18n: true
    hiddenFromSearch:
      $type: checkBoxField
      label: Hide
      buttonLabel: Hide from Product Listing
      type: java.lang.Boolean
    buildPriceEnabled:
      $type: checkBoxField
      label: Build & Price
      buttonLabel: Enable Build & Price link
      defaultValue: true
      type: java.lang.Boolean
    tags:
      label: Tags
      $type: jcrMultiLinkField
      chooserId: product-catalog:multi-tag-chooser
      field:
        label: ''
        $type: linkField
        datasource:
          $type: jcrDatasource
          workspace: dxpTags
          rootPath: /bobcat
          allowedNodeTypes:
            - dxp:tagGroup
            - dxp:tag
            - mgnl:folder
    page:
      $type: associatedPageField
      itemType: page
      storeProperty: model
      itemProvider:
        $type: currentItemProvider
      i18n: true
      layout:
        $type: form
  layout:
    $type: tabbedLayout
    tabs:
      basic:
        label: Basic Info
        fields:
          - name: jcrName
          - name: title
          - name: id
          - name: idDescription
          - name: serialCode
          - name: category
          - name: yearBuilt
          - name: lifecycle
          - name: yearEnd
          - name: sortRating
          - name: overview
          - name: useNewOverview
          - name: overviewRows
          - name: shortDescription
          - name: shortDescriptionNote
          - name: newIndicator
          - name: customIndicator
          - name: listingIndicators
          - name: hiddenFromSearch
          - name: buildPriceEnabled
          - name: routing
      images:
        label: Images
        fields:
          - name: images
      sparrowImage:
        label: Sparrow Image
        fields:
          - name: sparrowImage
      tags:
        label: Tags
        fields:
          - name: tags
      features:
        label: Features
        fields:
          - name: features
      brochure:
        label: Brochure
        fields:
          - name: brochure
      fullSpecs:
        label: Full Specifications
        fields:
          - name: fullSpecifications
      manualFullSpecs:
        label: Manual Full Specifications
        fields:
          - name: manualFullSpecifications
      page:
        label: Associated page
        fields:
          - name: page
wide: true
light: false