class: info.magnolia.rest.delivery.jcr.v2.JcrDeliveryEndpointDefinition
endpointPath: /api/products/models
workspace: products
depth: 10
bypassWorkspaceAcls: true
systemProperties:
  - mgnl:lastModified
  - mgnl:activationStatus

nodeTypes:
  - mgnl:folder
  - dxp:category
  - dxp:subcategory
  - dxp:product
  - dxp:productGroup
childNodeTypes:
  - dxp:category
  - dxp:subcategory
  - dxp:product
  - dxp:productGroup
  - mgnl:contentNode

references:
  - name: chip
    propertyName: chips
    referenceResolver:
      class: info.magnolia.rest.reference.jcr.JcrReferenceResolverDefinition
      targetWorkspace: concepts
      expand: true
      generateLink: false
  - name: featureReference
    propertyName: features
    referenceResolver:
      class: com.tbscg.doosan.magnolia.bobcat.rest.delivery.FeatureParentTitleProviderDefinition
      targetWorkspace: features
      expand: true
      generateLink: false
  - name: productParentReference
    referenceResolver:
      class: com.tbscg.doosan.magnolia.bobcat.rest.delivery.ProductParentResolverDefinition
  - name: dxpTags2Reference
    propertyName: dxpTag
    referenceResolver:
      class: info.magnolia.rest.reference.jcr.JcrReferenceResolverDefinition
      targetWorkspace: dxpTags
      expand: true
      generateLink: false
  - name: dxpTagsReference
    propertyName: tags
    referenceResolver:
      class: info.magnolia.rest.reference.jcr.JcrReferenceResolverDefinition
      targetWorkspace: dxpTags
      expand: true
      generateLink: false
  - name: pageReference
    propertyName: pageUrl
    referenceResolver:
      class: com.tbscg.doosan.magnolia.bobcat.rest.delivery.CustomUrlReferenceResolverDefinition
      targetWorkspace: website
      expand: false
      generateLink: true
  - name: linkReferenceWithRichTextFormDescription
    propertyName: description
    referenceResolver:
      class: com.tbscg.doosan.magnolia.bobcat.richtext.DxpRichTextLinkResolverDefinition
  - name: linkReferenceWithRichTextOverview
    propertyName: overview
    referenceResolver:
      class: com.tbscg.doosan.magnolia.bobcat.richtext.DxpRichTextLinkResolverDefinition
  - name: facetReference
    propertyName: facet
    referenceResolver:
      class: info.magnolia.rest.reference.jcr.JcrReferenceResolverDefinition
      targetWorkspace: facets
      expand: true
      generateLink: false
  - name: compatibleAttachmentsCountReference
    referenceResolver:
      class: com.tbscg.doosan.magnolia.bobcat.rest.delivery.CompatibleAttachmentsCountResolverDefinition
referenceDepth: 10
