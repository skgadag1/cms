class: info.magnolia.rest.delivery.jcr.v2.JcrDeliveryEndpointDefinition
endpointPath: /api/products/categories
workspace: products
rootPath: /bobcat
bypassWorkspaceAcls: true
limit: 20
depth: 2
systemProperties:
  - mgnl:lastModified
nodeTypes:
  - mgnl:folder
  - dxp:category
  - dxp:subcategory
childNodeTypes:
  - dxp:category
  - dxp:subcategory
  - dxp:product # needed for products without categories
  - dxp:productGroup # needed for products without categories
  - mgnl:contentNode # needed for images

references:
  - name: pageReference
    propertyName: pageUrl
    referenceResolver:
      class: com.tbscg.doosan.magnolia.bobcat.rest.delivery.CustomUrlReferenceResolverDefinition
      targetWorkspace: website
      expand: false
      generateLink: true