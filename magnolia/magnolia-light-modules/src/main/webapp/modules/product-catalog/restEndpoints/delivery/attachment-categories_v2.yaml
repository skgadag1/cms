class: info.magnolia.rest.delivery.jcr.v2.JcrDeliveryEndpointDefinition
endpointPath: /api/products/attachment/categories
workspace: attachments
rootPath: /bobcat
bypassWorkspaceAcls: true
limit: 20
depth: 2
systemProperties:
  - mgnl:lastModified
nodeTypes:
  - mgnl:folder
  - dxp:attachmentCategory
  - dxp:attachment
  - dxp:attachmentGroup
childNodeTypes:
  - dxp:attachmentCategory
  - dxp:attachment
  - dxp:attachmentGroup
  - mgnl:contentNode # needed for images

references:
  - name: pageReference
    propertyName: pageUrl
    referenceResolver:
      class: com.tbscg.doosan.magnolia.bobcat.rest.delivery.CustomUrlReferenceResolverDefinition
      targetWorkspace: website
      expand: false
      generateLink: true
  - name: featureReference
    propertyName: features
    referenceResolver:
      class: info.magnolia.rest.reference.jcr.JcrReferenceResolverDefinition
      targetWorkspace: features
      expand: true
      generateLink: false
  - name: attachmentTypeTagsReference
    propertyName: attachmentType
    referenceResolver:
      class: info.magnolia.rest.reference.jcr.JcrReferenceResolverDefinition
      targetWorkspace: dxpTags
      expand: true
      generateLink: false
  - name: dxpTagsReference
    propertyName: tags
    referenceResolver:
      class: info.magnolia.rest.reference.jcr.JcrReferenceResolverDefinition
      targetWorkspace: dxpTags
      expand: true
      generateLink: false

