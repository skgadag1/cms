label: Page Properties
form:
  properties:
    title:
      label: Title
      $type: textField
      i18n: true
    heading:
      $type: textField
      label: Heading text
      rows: 3
      i18n: true
      maxLength: 2000
    description:
      $type: textField
      label: Description
      rows: 3
      i18n: true
      maxLength: 2000
    keywords:
      $type: textField
      label: Keywords
      i18n: true
      maxLength: 100
    productFamilyNames:
      $type: twinColSelectField
      label: "Product family names"
      leftColumnCaption: "Available products"
      rightColumnCaption: "Page visible only to owners with products: (leave empty to allow for all)"
      datasource:
        $type: jcrDatasource
        workspace: category
        rootPath: /owner-portal/product-family-names
        describeByProperty: displayName
        allowedNodeTypes:
          - mgnl:category
    FilterGroup:
      label: Filter Group
      $type: jcrMultiField
      field:
        label: ""
        orderHandler: false
        name: compositeField
        $type: compositeField
        properties:
          productFamily:
            $type: comboBoxField
            label: Product Family
            emptySelectionAllowed: true
            emptySelectionCaption: Select
            required: true
            datasource:
              $type: jcrDatasource
              workspace: category
              rootPath: /owner-portal/product-family-names
              describeByProperty: displayName
              allowedNodeTypes:
                - mgnl:category
          package:
            $type: comboBoxField
            label: Package
            emptySelectionAllowed: true
            emptySelectionCaption: Select
            required: true
            datasource:
              $type: jcrDatasource
              workspace: category
              rootPath: /owner-portal/package
              describeByProperty: displayName
              allowedNodeTypes:
                - mgnl:category
  layout:
    $type: tabbedLayout
    tabs:
      general:
        label: General
        fields:
          - name: title
          - name: heading
      meta:
        label: Meta tags
        fields:
          - name: description
          - name: keywords
      productFamilyNames:
        label: Product family names
        fields:
          - name: productFamilyNames
      softwareFilters:
        label: Software Filters
        fields:
          - name: FilterGroup
light: false
