label: Thumbnail
$type: switchableField
i18n: true
field:
  $type: radioButtonGroupField
  layout: horizontal
  defaultValue: none
  i18n: true
  datasource:
    $type: optionListDatasource
    options:
      - name: thumbnailTimestamp
        label: Thumbnail Timestamp
        value: thumbnailTimestamp
      - name: thumbnailImage
        label: Thumbnail Image
        value: thumbnailImage
      - name: none
        label: None
        value: none
itemProvider:
  $type: jcrChildNodeProvider
forms:
  thumbnailTimestamp:
    properties:
      thumbnailTimestamp:
          label: Thumbnail Timestamp
          $type: textField
          required: true
          validators:
            number:
              $type: regexpValidator
              pattern: ^([0-9]+):([0-5][0-9])$
              errorMessage: Enter a valid time in mm:ss format
  thumbnailImage:
    properties:
      thumbnailImage:
        !include:/service-videos/includes/dam-image.yaml
        label: Thumbnail Image
        i18n: true
        required: false
