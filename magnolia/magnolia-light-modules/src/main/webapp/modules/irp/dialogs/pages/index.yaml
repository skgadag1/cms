label: Page Properties
form:
  properties:
    title:
      label: Title
      $type: textField
      i18n: true
    heading:
      $type: textField
      label: Heading text
      rows: 3
      i18n: true
      maxLength: 2000
    description:
      $type: textField
      label: Description
      rows: 3
      i18n: true
      maxLength: 2000
    keywords:
      $type: textField
      label: Keywords
      i18n: true
      maxLength: 100
    productFamilyNames:
      $type: twinColSelectField
      label: "Product family names"
      leftColumnCaption: "Available products"
      rightColumnCaption: "Page visible only to owners with products: (leave empty to allow for all)"
      datasource:
        $type: jcrDatasource
        workspace: category
        rootPath: /irp/product-family-names
        describeByProperty: displayName
        allowedNodeTypes:
          - mgnl:category
  layout:
    $type: tabbedLayout
    tabs:
      general:
        label: General
        fields:
          - name: title
          - name: heading
      meta:
        label: Meta tags
        fields:
          - name: description
          - name: keywords
      productFamilyNames:
        label: Product family names
        fields:
          - name: productFamilyNames
light: false
