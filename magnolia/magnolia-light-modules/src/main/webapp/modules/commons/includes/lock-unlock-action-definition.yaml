lock:
  class: info.magnolia.ui.framework.action.OpenEditDialogActionDefinition
  dialogName: content-locking:lockItem
  icon: icon-lock
  label: actions.lockItem
  availability:
    root: false
    writePermissionRequired: true
    rules:
      isNotLockedRule:
        $type: isNotLocked
unlock:
  class: com.tbscg.doosan.magnolia.bobcat.customs.lock.BobcatUnlockItemAction$Definition
  icon: icon-unlock
  label: actions.unlockItem
  availability:
    root: false
    rules:
      isLockedRule:
        $type: isLocked
      isLockOwnerRule:
        $type: unlockRule
        allowedRoles:
          - superuser
          - dxp-bobcat-admins