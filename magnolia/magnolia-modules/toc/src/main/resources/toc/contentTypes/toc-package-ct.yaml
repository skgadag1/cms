datasource:
  workspace: toc-packages
  rootPath: /
  namespaces:
    dxp: https://doosan.com/jcr/1.0/lib
  autoCreate: true

model:
  nodeType: dxp:tocPackage
  properties:
    - name: jcrName
      label: Name
      required: true
    - name: title
      label: Title
      required: true
    - name: brand
      label: Brand
      required: true
    - name: region
      label: Region
      required: true
    - name: channel
      label: Channel
      required: true
    - name: ToC Documents
      type: toc
      required: true
      multiple: true
  subModels:
    - name: toc
      nodeType: dxp:toc
      properties:
      - name: jcrName
        label: Name
      - name: title
        label: Title
      - name: tocVersion
        label: Version
      - name: toc
        label: Terms and Conditions