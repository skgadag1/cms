confirmDeleteAsset:
  class: info.magnolia.ui.framework.action.ConfirmationActionDefinition
  icon: icon-delete
  successActionName: deleteAsset
  availability:
    root: false
    rules:
      sitemapBucketRule:
        $type: sitemapBucketAssetActions
        blockAccessFilesList:
          - 'sitemap_images_index.xml'
          - 'sitemap_index.xml'
          - 'sitemap_videos_index.xml'
      isAsset:
        implementationClass: info.magnolia.amazon.s3.ui.action.availability.IsAssetRule