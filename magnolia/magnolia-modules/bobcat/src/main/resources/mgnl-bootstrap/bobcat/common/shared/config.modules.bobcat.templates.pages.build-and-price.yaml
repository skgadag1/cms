build-and-price:
  $type: spa
  renderType: spa
  extends: '/modules/bobcat/includes/pages/spa-page-prototype'
  title: 'Bobcat.com Build & Price Page'
  class: info.magnolia.rendering.spa.renderer.SpaRenderableDefinition
  dialog: bobcat:pages/build-and-price
  type: content

  areas:
    header:
      title: Header area
      inheritance:
        enabled: true
        components: filtered
      availableComponents:
        header:
          id: bobcat:components/header
        HTMLSlot:
          id: bobcat:components/HTMLSlot
        EvolutionOffersBanner:
          id: bobcat:components/evolution-offers-banner

    main:
      title: Main area
      availableComponents:
        extends: '/modules/bobcat/includes/main-area-components'
