backupWebsite:
  catalog: backup
  command: backupCommand
  'cron': '0 0 2 * * *'
  description: 'Backup website in s3Bucket, It runs everyday at 02:00 a.m. server time (UTC)'
  enabled: true
  params:
    workspacesToSave: "website"
    destination: "backup"
    backupOnlyLatest: false
    backupRoot: false
