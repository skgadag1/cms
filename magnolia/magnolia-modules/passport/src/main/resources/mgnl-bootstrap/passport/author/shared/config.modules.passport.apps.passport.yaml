passport:
  class: info.magnolia.ui.api.app.AppDescriptor
  appClass: com.tbscg.doosan.magnolia.passport.app.PassportApp
  name: passport
  icon: icon-documents-app
  label: Enigma Documents
  subApps:
    documentBrowser:
      class: info.magnolia.ui.api.app.SubAppDescriptor
      subAppClass: com.tbscg.doosan.magnolia.passport.app.documentBrowser.DocumentBrowserSubApp
      closable: false
      label: Documents
    documentView:
      class: info.magnolia.ui.api.app.SubAppDescriptor
      subAppClass: com.tbscg.doosan.magnolia.passport.app.documentView.DocumentViewSubApp
      closable: true
      label: Document settings
  permissions:
    roles:
      enigma-admin: enigma-admin
