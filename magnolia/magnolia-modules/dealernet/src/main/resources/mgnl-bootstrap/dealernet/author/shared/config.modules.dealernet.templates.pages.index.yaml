index:
  $type: spa
  extends: '/modules/dealernet/includes/pages/spa-page-prototype'
  title: 'DealerNet main SPA page'
  renderType: spa
  class: info.magnolia.rendering.spa.renderer.SpaRenderableDefinition
  dialog: dealernet:pages/index
  type: content

  areas:
    header:
      title: Header area
      inheritance:
        enabled: true
        components: filtered
      availableComponents:
        header:
          id: dealernet:components/header

    main:
      title: Main area
      availableComponents:
        extends: '/modules/dealernet/includes/pages/main-area-components'

    footer:
      title: Footer area
      inheritance:
        enabled: true
        components: filtered
      availableComponents:
        Footer:
          id: dealernet:components/footer
