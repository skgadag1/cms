class: info.magnolia.ui.contentapp.configuration.ContentAppDescriptor
appClass: info.magnolia.ui.framework.app.BaseApp
icon: icon-forums-app
label: FAQ
datasource:
  $type: jcrDatasource
  workspace: faq
  allowedNodeTypes:
    - dxp:faq
    - dxp:faqSection
    - mgnl:folder
subApps:
  browser:
    class: info.magnolia.ui.contentapp.configuration.BrowserDescriptor
    label: FAQ
    workbench:
      contentViews:
        tree:
          $type: treeView
          multiSelect: true
          columns:
            jcrName:
              $type: jcrTitleColumn
              nodeTypeToIcon:
                dxp:faq: icon-node-content
                dxp:faqSection: icon-node-folder-l
                mgnl:folder: icon-folder-l
            question:
              label: Question
              filterComponent:
                $type: textField
            answer:
              label: Answer
              filterComponent:
                $type: textField
            jcrPublishingStatus:
              $type: jcrStatusColumn
              label: Status
            mgnl:lastModified:
              $type: dateColumn
              editable: false
    actions:
      addFolder:
        icon: icon-add-folder
        $type: addNodeAction
        nodeType: mgnl:folder
        availability:
          root: true
          writePermissionRequired: true
          nodeTypes:
            folder: mgnl:folder
          rules:
            isNotDeleted: &isNotDeleted
              $type: jcrIsDeletedRule
              negate: true
      editFolder:
        icon: icon-edit
        $type: openDialogAction
        dialogId: ui-framework:folder
        label: Rename folder
        availability:
          writePermissionRequired: true
          nodeTypes:
            folder: mgnl:folder
          rules:
            isNotDeleted: *isNotDeleted
      addSection:
        icon: icon-add-item
        $type: openDetailSubappAction
        appName: faq-app
        subAppName: detailSection
        label: Add section
        viewType: add
        availability:
          root: true
          writePermissionRequired: true
          nodeTypes:
            folder: mgnl:folder
          rules:
            isNotDeleted: *isNotDeleted
      editSection:
        icon: icon-edit
        $type: openDetailSubappAction
        appName: faq-app
        subAppName: detailSection
        label: Edit section
        viewType: edit
        availability:
          root: true
          writePermissionRequired: true
          nodeTypes:
            section: dxp:faqSection
          rules:
            isNotDeleted: *isNotDeleted
      addFaq:
        icon: icon-add-item
        $type: openDetailSubappAction
        appName: faq-app
        subAppName: detailFaq
        label: Add FAQ
        viewType: add
        availability:
          writePermissionRequired: true
          nodeTypes:
            section: dxp:faqSection
          rules:
            isNotDeleted: *isNotDeleted
      editFaq:
        icon: icon-edit
        $type: openDetailSubappAction
        appName: faq-app
        subAppName: detailFaq
        viewType: edit
        label: Edit FAQ
        availability:
          writePermissionRequired: true
          nodeTypes:
            faq: dxp:faq
          rules:
            isNotDeleted: *isNotDeleted
      renameFaq:
        icon: icon-edit
        $type: openDialogAction
        dialogId: ui-framework-jcr:rename
        label: Rename FAQ
        availability:
          writePermissionRequired: true
          nodeTypes:
            faq: dxp:faq
          rules:
            isNotDeleted: *isNotDeleted
      renameSection:
        icon: icon-edit
        $type: openDialogAction
        dialogId: ui-framework-jcr:rename
        label: Rename section
        availability:
          writePermissionRequired: true
          nodeTypes:
            faq: dxp:faqSection
          rules:
            isNotDeleted: *isNotDeleted
      publish:
        icon: icon-publish
        $type: jcrCommandAction
        command: publish
        catalog: versioned
        label: Publish
        availability:
          writePermissionRequired: true
          rules:
            notDeleted: *isNotDeleted
            isPublishable: &isPublishable
              $type: jcrPublishableRule
      delete:
        icon: icon-delete
        $type: markAsDeletedAction
        label: Delete
        availability:
          writePermissionRequired: true
          rules:
            isNotDeleted: *isNotDeleted
      publishRecursive:
        icon: icon-publish-incl-sub
        $type: jcrCommandAction
        command: publish
        label: Publish recursive
        asynchronous: true
        params:
          recursive: true
        availability:
          writePermissionRequired: true
          rules:
            notDeleted: *isNotDeleted
            isPublishable: *isPublishable
      unpublish:
        icon: icon-unpublish
        $type: jcrCommandAction
        command: unpublish
        label: Unpublish
        availability:
          rules:
            notDeleted: *isNotDeleted
            isPublished:
              $type: jcrPublishedRule
      publishDeletion:
        icon: icon-publish
        $type: jcrCommandAction
        command: publish
        label: Publish deletion
        availability:
          writePermissionRequired: true
          multiple: true
          rules:
            isDeleted: &isDeleted
              $type: jcrIsDeletedRule
      import:
        icon: icon-import
        $type: openDialogAction
        dialogId: ui-framework-jcr:import
        label: Import
        availability:
          writePermissionRequired: true
          root: true
          rules:
            notDeleted: *isNotDeleted
      export:
        icon: icon-export
        $type: exportAction
        label: Export
        availability:
          rules:
            isNotDeleted: *isNotDeleted
      exportFaqTranslation:
        label: 'Export FAQ translations'
        dialogName: faq:downloadTranslationFileFaq
        class: info.magnolia.ui.framework.action.OpenCreateDialogActionDefinition
        icon: icon-export
        availability:
          rules:
            isNotDeleted: *isNotDeleted
      importTranslation:
        label: 'Import translations'
        dialogName: faq:uploadTranslationFileFaq
        class: info.magnolia.translation.ui.action.OpenCreateTranslationFileUploadDialogActionDefinition
        icon: icon-import
        availability:
          multiple: true
          root: true
          writePermissionRequired: true
          rules:
            isNotDeleted: *isNotDeleted
      showVersionsFaq:
        $type: openDialogAction
        icon: icon-show-versions
        dialogId: faq:versionsFaq
        label: Show versions
        availability:
          rules:
            hasVersionsRule: &hasVersionsRule
              $type: jcrHasVersionsRule
      showVersionsSection:
        $type: openDialogAction
        icon: icon-show-versions
        dialogId: faq:versionsFaqSection
        label: Show versions
        availability:
          rules:
            hasVersionsRule: *hasVersionsRule
      restoreVersion:
        icon: icon-retrieve-versions
        $type: openDialogAction
        dialogId: ui-framework-jcr:restoreVersion
        availability:
          writePermissionRequired: true
          rules:
            hasVersionsRule: *hasVersionsRule
            isDeleted: *isNotDeleted
      move:
        icon: icon-move
        $type: dxpMoveAction
        allowedRoles:
          - superuser
        label: Move
        availability:
          multiple: true
          rules:
            notDeleted: *isNotDeleted
      duplicate:
        icon: icon-duplicate
        $type: duplicateNodeAction
        label: Duplicate
        availability:
          writePermissionRequired: true
          rules:
            isNotDeleted: *isNotDeleted
      copy:
        icon: icon-copy
        $type: copyContentAction
        label: Copy
        availability:
          multiple: true
          writePermissionRequired: true
          rules:
            isNotDeleted: *isNotDeleted
      pasteFaq:
        icon: icon-paste
        $type: dxpPasteContentAction
        allowedRoles:
          - superuser
        sendComponentAction: false
        label: Paste
        availability:
          writePermissionRequired: true
          nodeTypes:
            section: dxp:faqSection
          rules:
            canPasteRule: &canPaste
              $type: canPasteContentRule
            isNotDeleted: *isNotDeleted
            clipboardContentIsFaq:
              $type: clipboardContentRule
              nodeTypes:
                faq: dxp:faq
      pasteFolder:
        icon: icon-paste
        $type: pasteContentAction
        label: Paste
        availability:
          root: true
          writePermissionRequired: true
          nodeTypes:
            folder: mgnl:folder
          rules:
            canPasteRule: *canPaste
            isNotDeleted: *isNotDeleted
            clipboardContentIsFolder:
              $type: clipboardContentRule
              nodeTypes:
                folder: mgnl:folder
                section: dxp:faqSection
      addToTranslationBatch: 
        label: Add to translation batch
        dialogName: content-translation-support-ext-core:addToTranslationBatch
        icon: icon-add-folder
        class: info.magnolia.translation.ext.core.app.batch.action.OpenMultiEditDialogAction$Definition
        availability:
          writePermissionRequired: true
          access:
            roles: 
              - dxp-bobcat-admins
              - dxp-bobcat-admin-na
              - dxp-bobcat-publishers-na
          nodeTypes: 
            - dxp:faq
            - dxp:faqSection
          rules:
            - name: IsNotDeletedRule
              implementationClass: info.magnolia.ui.framework.availability.IsNotDeletedRule
          multiple: true
          root: false
    actionbar:
      defaultAction: editFaq
      sections:
        root:
          label: FAQs
          availability:
            nodes: false
            root: true
            rules:
              isNotDeleted: *isNotDeleted
          groups:
            addActions:
              items:
                - name: addFolder
                - name: addSection
            editActions:
              items:
                - name: pasteFolder
            eximActions:
              items:
                - name: import
        section:
          label: Section
          availability:
            nodeTypes:
              section: dxp:faqSection
            rules:
              isNotDeleted: *isNotDeleted
          groups:
            addActions:
              items:
                - name: addFaq
            editActions:
              items:
                - name: editSection
                - name: renameSection
                - name: delete
                - name: copy
                - name: pasteFaq
                - name: move
                - name: duplicate
            publishingActions:
              items:
                - name: publish
                - name: publishRecursive
                - name: unpublish
            translationActions:
              name: translationActions
              items:
                - name: exportFaqTranslation
                - name: importTranslation
                - name: addToTranslationBatch
            eximActions:
              items:
                - name: export
                - name: import
            versionsActions:
              items:
                - name: showVersionsSection
                - name: restoreVersion
        faq:
          label: FAQ
          availability:
            nodeTypes:
              faq: dxp:faq
            rules:
              isNotDeleted: *isNotDeleted
          groups:
            editActions:
              items:
                - name: editFaq
                - name: renameFaq
                - name: delete
                - name: copy
                - name: pasteFaq
                - name: move
                - name: duplicate
            publishingActions:
              items:
                - name: publish
                - name: publishRecursive
                - name: unpublish
            eximActions:
              items:
                - name: export
                - name: import
                - name: exportFaqTranslation
                - name: importTranslation
                - name: addToTranslationBatch
            versionsActions:
              items:
                - name: showVersionsFaq
                - name: restoreVersion
        folder:
          label: Folder
          availability:
            nodeTypes:
              folder: mgnl:folder
            rules:
              isNotDeleted: *isNotDeleted
          groups:
            addActions:
              items:
                - name: addFolder
                - name: addSection
            editActions:
              items:
                - name: editFolder
                - name: delete
                - name: copy
                - name: pasteFolder
                - name: move
                - name: duplicate
            publishingActions:
              items:
                - name: publish
                - name: publishRecursive
                - name: unpublish
            eximActions:
              items:
                - name: export
                - name: import
                - name: exportFaqTranslation
                - name: importTranslation
        deletedFolder:
          label: Deleted folder
          availability:
            nodeTypes:
              folder: mgnl:folder
            rules:
              isDeleted: *isDeleted
          groups:
            publishingActions:
              items:
                - name: publishDeletion
        deletedSection:
          label: Deleted section
          availability:
            nodeTypes:
              section: dxp:faqSection
            rules:
              isDeleted: *isDeleted
          groups:
            publishingActions:
              items:
                - name: publishDeletion
        deletedFaq:
          label: Deleted FAQ
          availability:
            nodeTypes:
              faq: dxp:faq
            rules:
              isDeleted: *isDeleted
          groups:
            publishingActions:
              items:
                - name: publishDeletion
  detailSection:
    class: info.magnolia.ui.contentapp.detail.DetailDescriptor
    label: Edit Section
    itemProvider:
      $type: jcrNodeFromLocationProvider
      workspace: faq
      nodeType: dxp:faqSection
    form:
      properties:
        jcrName:
          $type: textField
          label: Name
        title:
          $type: textField
          label: Title
          i18n: true
        tags:
          $type: jcrMultiValueField
          label: Tags
          field:
            $type: linkField
            buttonSelectNewLabel: Select new ...
            buttonSelectOtherLabel: Select another ...
            chooser:
              workbenchChooser:
                appName: categories
    actions:
      commit:
        $type: commitAction
        label: Save
      cancel:
        $type: closeAction
        label: Cancel
  detailFaq:
    class: info.magnolia.ui.contentapp.detail.DetailDescriptor
    label: Edit FAQ
    itemProvider:
      $type: jcrNodeFromLocationProvider
      workspace: faq
      nodeType: dxp:faq
    form:
      properties:
        jcrName:
          $type: textField
          label: Name
        question:
          $type: textField
          label: Question
          i18n: true
        answer:
          $type: cloudinaryRichText
          label: Answer
          images: true
          i18n: true
          source: true
          tables: true
    actions:
      commit:
        $type: commitAction
        label: Save
      cancel:
        $type: closeAction
        label: Cancel
