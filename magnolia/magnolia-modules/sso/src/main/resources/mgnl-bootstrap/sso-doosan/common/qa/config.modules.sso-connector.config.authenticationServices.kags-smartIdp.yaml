'kags-smartIdp':
  'accessTokenEndpoint': 'https://idpqa.smartequip.net/smart_idp/oauth/token'
  'accessTokenExtractor': 'com.tbscg.doosan.magnolia.sso.extractors.CustomAccessTokenExtractor'
  'apiClass': 'info.magnolia.connector.sso.oic.service.GenericOICApi'
  'authorizationBaseUrl': 'https://idpqa.smartequip.net/smart_idp/oauth/authorize'
  'callbackURL': 'https://dxp-kags.qa.dice-tools.com/machine'
  'clientId': 'KGPPortalClient'
  'clientSecret': '${jcr.auth.magnolia.kags.smartequip.secret}'
  'endSessionEndpoint': 'https://dxp-kags.qa.dice-tools.com/logout'
  'externalGroupsManagement': 'false'
  'externalGroupsPropertyName': 'groups'
  'openIdAccessTokenAttributeName': 'openIdToken'
  'openIdEnabled': 'false'
  'openIdIssuer': 'https://idpqa.smartequip.net/oauth/token'
  'openIdLogoutEnabled': 'true'
  'openIdWebKeySet': ''
  'openIdWebKeyUrl': ''
  'scope': 'openid profile email iot:read equipment:read product:read content:read feedback:read national api:asset'
  'securityGroups': 'KeyAccount'
  'securityRoles': 'KeyAccount'
  'userInfoURL': 'https://idpqa.smartequip.net/smart_idp/user/userinfo'
  'fieldMappings':
    'email': 'email'
    'family_name': 'family_name'
    'given_name': 'given_name'
    'id': 'id'
    'name': 'name'
    'userid': 'user_name'
