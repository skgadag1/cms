'login':
  'class': com.tbscg.doosan.magnolia.sso.filter.SSOAuthenticationTokenLoginFilter
  'jcr:primaryType': mgnl:content
  'loginHandlers':
    'Basic':
      'class': info.magnolia.cms.security.auth.login.BasicLogin
    'SSOConnector':
      'class': com.tbscg.doosan.magnolia.sso.login.SSOLoginHandler
      'jaasChain': sso-authentication
    'Form':
      'class': info.magnolia.cms.security.auth.login.FormLogin
  'errorHandler':
    'class': com.tbscg.doosan.magnolia.dxp.core.handler.RedirectOnError
    'redirectUrl': /error
    'voter':
      'class': info.magnolia.voting.voters.PropertyVoter
      'property': magnolia.bootstrap.authorInstance
      'value': false
