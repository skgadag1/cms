name: website

datasource:
  workspace: regions
  rootPath: /
  namespaces:
    dxp: https://doosan.com/jcr/1.0/lib
  autoCreate: true

model:
  nodeType: dxp:website
  properties:
    - name: name
      label: Site Name
      required: true
    - name: title
      label: Site Title
    - name: domains
      label: Site Domains
      type: domain
      multiple: true
    - name: regions
      label: Site Regions
      type: region
      multiple: true
      required: true
  subModels:
    - name: domain
      properties:
        - name: name
          label: Domain Name
          required: true
    - name: region
      nodeType: dxp:region
      properties:
        - name: code
          label: Region Code
          required: true
        - name: name
          label: Region Name
          i18n: true
        - name: i18n
          label: Region Languages
          type: i18n
        - name: businessUnit
          label: Business Unit
        - name: xDefault
          label: x-default
          type: String
    - name: i18n
      properties:
        - name: enabled
          type: Boolean
          label: Is Enabled
        - name: locales
          type: locale
          label: Locales
          multiple: true
    - name: locale
      nodeType: dxp:language
      properties:
        - name: language
          label: Language
          required: true
        - name: enabled
          type: Boolean
          label: Is Enabled
        - name: isoCode
          label: Language ISO code
        - name: label
          label: Language label
        - name: hreflangLocale
          label: Hreflang Locale
          type: String
          multiple: true
