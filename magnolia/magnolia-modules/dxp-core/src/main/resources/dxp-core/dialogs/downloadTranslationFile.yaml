form:
  label: 'Export translation'
  tabs:
    - name: download
      label: 'Download translation'
      fields:
        - name: exporterName
          label: 'File format'
          export: true
          type: String
          required: true
          sortOptions: false
          class: info.magnolia.translation.ui.form.field.definition.TranslationFileFormatOptionGroupFieldDefinition
actions:
  commit:
    label: 'Export translation file'
    command: downloadTranslationFile
    catalog: translation
    class: info.magnolia.translation.ui.action.TranslationFileDownloadDialogActionDefinition
  cancel:
    class: info.magnolia.ui.dialog.action.CancelDialogActionDefinition