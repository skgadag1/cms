form:
  label: 'Import translation'
  tabs:
    - name: upload
      label: 'Import'
      fields:
        - name: name
          label: 'File to import'
          binaryNodeName: import
          required: true
          class: info.magnolia.ui.form.field.definition.BasicUploadFieldDefinition
        - name: importOptions
          label: 'Import options'
          multiselect: true
          sortOptions: false
          class: info.magnolia.ui.form.field.definition.OptionGroupFieldDefinition
          options:
            - name: overwriteExistingValues
              label: 'Overwrite already existing translations'
              value: overwriteExistingValues
            - name: importEmptyValues
              label: 'Also import empty translations'
              value: importEmptyValues
actions:
  commit:
    label: 'Yes, import'
    command: uploadTranslationFile
    catalog: translation
    class: info.magnolia.translation.ui.action.TranslationFileUploadDialogActionDefinition
    successMessage: concepts.uploadTranslationFile.executionSuccess
  cancel:
    class: info.magnolia.ui.dialog.action.CancelDialogActionDefinition