appClass: com.tbscg.doosan.magnolia.cloudinary.contentapp.CustomContentApp

subApps:
  browser:
    contentConnector: &contentConnector
      class: com.tbscg.doosan.magnolia.cloudinary.contentapp.FilteredAssetContentConnectorDefinition
      assetProviderId: cloudinary
    imageProvider: &browserImageProvider
      imageProviderClass: com.tbscg.doosan.magnolia.cloudinary.dam.CloudinaryImageProvider
    workbench: &browserWorkbench
      contentViews:
        thumbnail:
          class: info.magnolia.ui.workbench.thumbnail.ThumbnailPresenterDefinition
          implementationClass: com.tbscg.doosan.magnolia.cloudinary.contentview.thumbnail.AssetThumbnailPresenter
        list:
          class: info.magnolia.ui.workbench.list.ListPresenterDefinition
          implementationClass: com.tbscg.doosan.magnolia.cloudinary.contentview.list.AssetListPresenter
          columns: &listColumns
            name: &nameColumn
              class: info.magnolia.dam.external.app.contentview.column.AssetNameColumnDefinition
              expandRatio: 2
              formatterClass: info.magnolia.dam.external.app.contentview.column.AssetNameColumnFormatter
              sortable: false
            path:
              class: com.tbscg.doosan.magnolia.cloudinary.contentview.column.AssetPathColumnDefinition
              expandRatio: 4
              formatterClass: com.tbscg.doosan.magnolia.cloudinary.contentview.column.AssetPathColumnFormatter
              sortable: false
            type: &typeColumn
              class: com.tbscg.doosan.magnolia.cloudinary.column.CloudinaryAssetTypeColumnDefinition
              expandRatio: 1
              formatterClass: com.tbscg.doosan.magnolia.cloudinary.column.CloudinaryAssetTypeColumnFormatter
              sortable: false
        tree:
          class: info.magnolia.ui.workbench.tree.TreePresenterDefinition
          implementationClass: com.tbscg.doosan.magnolia.cloudinary.contentview.tree.AssetTreePresenter
          columns:
            name:
              <<: *nameColumn
            type:
              <<: *typeColumn
        search:
          class: info.magnolia.ui.workbench.search.SearchPresenterDefinition
          implementationClass: com.tbscg.doosan.magnolia.cloudinary.contentview.search.AssetSearchPresenter
          columns:
            <<: *listColumns
  detail:
    contentConnector:
      <<: *contentConnector

chooseDialog:
  class: info.magnolia.ui.dialog.definition.ConfiguredChooseDialogDefinition
  field:
    class: info.magnolia.dam.app.assets.field.DamWorkbenchFieldDefinition
    workbench:
      <<: *browserWorkbench
    imageProvider:
      <<: *browserImageProvider
  actions:
    commit:
      callSuccess: true
      class: info.magnolia.ui.dialog.choosedialog.action.ChooseDialogActionDefinition
      name: commit
      availability:
        rules:
          AssetChooserRule:
            $type: AssetChoserAvailabilityRule
    cancel:
      callSuccess: false
      class: info.magnolia.ui.dialog.choosedialog.action.ChooseDialogActionDefinition
      name: cancel

