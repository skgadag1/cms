form:
  tabs:
    - name: tabText
      fields:
        - name: headlineLevel
          class: info.magnolia.ui.form.field.definition.SelectFieldDefinition
          options:
            - name: big
              value: big
            - name: medium
              value: medium
            - name: small
              value: small
              selected: true
        - name: headline
          class: info.magnolia.ui.form.field.definition.TextFieldDefinition
          i18n: true
        - name: text
          class: com.tbscg.doosan.magnolia.cloudinary.field.compatibility.definition.CloudinaryRichTextFieldDefinition
          i18n: true
    - name: tabImage
      fields:
        - name: image
          fieldType: assetLinkField
          appName: dam-external-app
          buttonSelectNewLabel: Select asset
          buttonSelectOtherLabel: Change asset
          identifierToPathConverter:
            class: info.magnolia.dam.external.app.field.AssetCompositeIdKeyTranslator
          contentPreviewDefinition:
            contentPreviewClass: com.tbscg.doosan.magnolia.cloudinary.field.compatibility.CloudinaryAssetPreviewComponent
        - name: imagePosition
          class: info.magnolia.ui.form.field.definition.SelectFieldDefinition
          options:
            - name: above
              value: above
            - name: below
              selected: true
              value: below
        - name: imageAltText
          class: info.magnolia.ui.form.field.definition.TextFieldDefinition
          i18n: true
        - name: imageTitle
          class: info.magnolia.ui.form.field.definition.TextFieldDefinition
          i18n: true
        - name: imageCaption
          class: info.magnolia.ui.form.field.definition.TextFieldDefinition
          i18n: true
        - name: imageCredit
          class: info.magnolia.ui.form.field.definition.TextFieldDefinition
          i18n: true

actions:
  commit:
    class: info.magnolia.ui.admincentral.dialog.action.SaveDialogActionDefinition
  cancel:
    class: info.magnolia.ui.admincentral.dialog.action.CancelDialogActionDefinition
